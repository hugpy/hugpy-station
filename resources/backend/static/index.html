/* 📡 live — the C→B→A interaction stream for the active MCT session (GET /api/mct/live). */
function LiveView() {
  const [turns, setTurns] = useState(null);
  const [err, setErr] = useState(null);
  /* file -> "loading" | {content} | {error} — an mct event's exchange file,
     expanded in place. Keyed by file NAME (turn-NNNN-*.md), which is also the
     only thing /api/mct2/exchange accepts (shape-validated server-side). */
  const [open, setOpen] = useState({});
  const load = useCallback(() => {
    api("/api/mct/live").then(d => { setTurns(d.turns || []); setErr(null); }).catch(e => setErr(e.message || "load failed"));
  }, []);
  useEffect(() => { load(); const t = setInterval(load, 4000); return () => clearInterval(t); }, [load]);
  /* mct v2: a ledger event carries a POINTER (e.handle = mct://…) — its body is
     pulled on demand from the ledger (/api/mct/live/object), never inlined in
     the turn log. Legacy exchange-file events keep the mct2 file path. */
  const keyOf = (e) => e.handle || e.file;
  const toggle = (e) => {
    const k = keyOf(e); if (!k) return;
    if (open[k]) { setOpen(o => { const n = { ...o }; delete n[k]; return n; }); return; }
    setOpen(o => ({ ...o, [k]: "loading" }));
    const req = e.handle
      ? api("/api/mct/live/object?handle=" + encodeURIComponent(e.handle))
          .then(d => ({ content: d.textual ? (d.content || "") + (d.truncated ? "\n… (truncated)" : "") : "(binary " + (d.mime || "") + ", " + (d.size || 0) + " bytes — download via " + d.download + ")" }))
      : api("/api/mct2/exchange?file=" + encodeURIComponent(e.file)).then(d => ({ content: d.content || "" }));
    req.then(r => setOpen(o => (o[k] ? { ...o, [k]: r } : o)))
       .catch(err => setOpen(o => (o[k] ? { ...o, [k]: { error: err.message || "load failed" } } : o)));
  };
  const who = (a) => (a || "").split(".")[0];
  const color = (a) => { const w = who(a); return w === "A" ? "var(--warn)" : w === "C" ? "var(--ok)" : "var(--dim)"; };
  return html`<div style=${{ flex: 1, overflowY: "auto", padding: "8px 10px", fontSize: 12 }}>
    ${err && html`<div style=${{ color: "var(--bad)" }}>error: ${err}</div>`}
    ${turns === null && html`<div style=${{ color: "var(--dim)" }}>loading…</div>`}
    ${turns && turns.length === 0 && html`<div style=${{ color: "var(--dim)", lineHeight: 1.5 }}>No turns yet in the active session. As you use the frontier, each mct turn (pointer exchange — and the deprecated broker's C→B→A flow) streams here.</div>`}
    ${(turns || []).map(t => html`<div key=${(t.backend || "") + t.turn_id} style=${{ marginBottom: 10, borderLeft: "2px solid var(--edge)", paddingLeft: 8 }}>
      <div style=${{ fontWeight: 600 }}>${t.turn_id}<span style=${{ color: "var(--dim)", fontWeight: 400, fontSize: 10 }}>${t.backend ? " · " + t.backend : ""} · ${t.state} · ${(t.created_at || "").slice(11, 19)}</span></div>
      ${(t.events || []).map((e, i) => html`<div key=${i}>
        <div style=${{ display: "flex", gap: 6, lineHeight: 1.4, alignItems: "baseline", cursor: keyOf(e) ? "pointer" : "default" }}
             title=${keyOf(e) ? (open[keyOf(e)] ? "collapse" : (e.handle ? "click to pull this object from the ledger" : "click to show the file's contents")) : (e.note || "")}
             onClick=${keyOf(e) ? (() => toggle(e)) : undefined}>
          <span style=${{ color: color(e.actor), minWidth: 96, fontSize: 10, flex: "none" }}>${e.actor || "?"}</span>
          <span style=${{ flex: "none" }}>${e.type}${e.file && e.handle ? " · " + e.file : ""}${e.origin === "seat" ? " · pushed" : ""}</span>
          ${(e.path || e.handle) && html`<span style=${{ color: "var(--dim)", fontSize: 10, flex: "none" }}>${open[keyOf(e)] ? "▾" : "▸"}</span>
          <span style=${{ color: "var(--dim)", fontSize: 10, fontFamily: "ui-monospace,SFMono-Regular,monospace", minWidth: 0, flex: "1 1 auto", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", direction: "rtl", unicodeBidi: "plaintext", textAlign: "left" }}>${e.handle || e.path}${e.size != null ? " · " + e.size + " B" : ""}</span>`}
          ${e.note && !e.handle && html`<span style=${{ color: "var(--dim)", fontSize: 10, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${e.note}</span>`}
        </div>
        ${keyOf(e) && open[keyOf(e)] && html`<pre style=${{ margin: "2px 0 6px 102px", padding: "6px 8px", border: "1px solid var(--edge)", borderRadius: 5, background: "rgba(255,255,255,.02)", maxHeight: 260, overflow: "auto", whiteSpace: "pre-wrap", overflowWrap: "anywhere", fontSize: 11, lineHeight: 1.45 }}>${
            open[keyOf(e)] === "loading" ? "loading…"
            : open[keyOf(e)].error ? "error: " + open[keyOf(e)].error
            : open[keyOf(e)].content || "(empty)"}</pre>`}
      </div>`)}
    </div>`)}
  </div>`;
}

/* 📜 log — the console backend's own live log (board t1, operator 2026-09-10:
   "a live log feed something similar to journalctl -f but specific for the
   console"). Backlog from GET /api/steward/log, then SSE /api/steward/log/stream
   (EventSource reconnects on its own; `after` resumes from the last seq seen so
   a reconnect never duplicates or drops a line). Level + text filters are
   client-side over what is held; pause queues new lines and lands them on
   resume; follow pins the view to the newest line and releases when the
   operator scrolls up. */
const LOG_LEVEL_RANK = { DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50 };
function LogFeed() {
  const [rows, setRows] = useState([]);
  const [err, setErr] = useState(null);
  const [level, setLevel] = useState("INFO");
  const [q, setQ] = useState("");
  const [follow, setFollow] = useState(true);
  const [paused, setPaused] = useState(false);
  const boxRef = React.useRef(null);
  const lastSeq = React.useRef(0);
  const pausedRef = React.useRef(false);
  const pending = React.useRef([]);
  useEffect(() => {
    pausedRef.current = paused;
    if (!paused && pending.current.length) { const p = pending.current; pending.current = []; setRows(r => r.concat(p).slice(-3000)); }
  }, [paused]);
  useEffect(() => {
    let es = null, dead = false;
    api("/api/steward/log?tail=400").then(d => {
      if (dead) return;
      const rs = d.rows || [];
      setRows(rs); if (rs.length) lastSeq.current = rs[rs.length - 1].seq; setErr(null);
      es = new EventSource("/api/steward/log/stream?after=" + lastSeq.current);
      es.addEventListener("log", (ev) => {
        let doc; try { doc = JSON.parse(ev.data); } catch (_) { return; }
        if (!doc || !(doc.seq > lastSeq.current)) return;
        lastSeq.current = doc.seq;
        if (pausedRef.current) { pending.current.push(doc); return; }
        setRows(r => r.concat([doc]).slice(-3000));
      });
      es.onerror = () => setErr("stream reconnecting…");
      es.onopen = () => setErr(null);
    }).catch(e => setErr(e.message || "load failed"));
    return () => { dead = true; if (es) es.close(); };
  }, []);
  useEffect(() => { if (follow && boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [rows, follow]);
  const min = LOG_LEVEL_RANK[level] || 0;
  const needle = q.trim().toLowerCase();
  const shown = rows.filter(r => (LOG_LEVEL_RANK[r.level] || 0) >= min && (!needle || (r.name + " " + r.msg).toLowerCase().includes(needle)));
  const color = (l) => (l === "ERROR" || l === "CRITICAL") ? "var(--bad)" : l === "WARNING" ? "var(--warn)" : l === "DEBUG" ? "var(--dim)" : "var(--fg, #cde)";
  const hhmmss = (ts) => new Date(ts * 1000).toTimeString().slice(0, 8);
  const sel = { fontSize: 10, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3 };
  return html`<div style=${{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
    <div style=${{ display: "flex", gap: 6, alignItems: "center", padding: "4px 8px", borderBottom: "1px solid var(--edge)", flex: "none", fontSize: 11 }}>
      <select value=${level} onChange=${e => setLevel(e.target.value)} style=${sel}>
        <option value="DEBUG">debug+</option><option value="INFO">info+</option><option value="WARNING">warn+</option><option value="ERROR">error+</option></select>
      <input value=${q} onInput=${e => setQ(e.target.value)} placeholder="filter (logger name or text)" style=${{ ...sel, flex: 1, minWidth: 0, fontSize: 11, padding: "1px 5px" }} />
      <button className=${"btn" + (follow ? " on" : "")} title="pin the view to the newest line" onClick=${() => setFollow(f => !f)} style=${{ fontSize: 10 }}>follow</button>
      <button className=${"btn" + (paused ? " on" : "")} title="hold new lines (they queue and land on resume)" onClick=${() => setPaused(p => !p)} style=${{ fontSize: 10 }}>${paused ? "resume" : "pause"}</button>
      <button className="btn" title="clear the view (the server keeps its ring)" onClick=${() => setRows([])} style=${{ fontSize: 10 }}>clear</button>
      <span style=${{ color: "var(--dim)", fontSize: 10, flex: "none" }}>${shown.length}/${rows.length}</span>
    </div>
    ${err && html`<div style=${{ color: "var(--warn)", padding: "2px 8px", fontSize: 10 }}>${err}</div>`}
    <div ref=${boxRef}
         onScroll=${e => { const el = e.target; if (follow && el.scrollHeight - el.scrollTop - el.clientHeight > 8) setFollow(false); }}
         style=${{ flex: 1, minHeight: 0, overflowY: "auto", padding: "4px 8px", fontFamily: "ui-monospace,SFMono-Regular,monospace", fontSize: 11, lineHeight: 1.4 }}>
      ${rows.length === 0 && !err && html`<div style=${{ color: "var(--dim)" }}>no log lines yet — the backend's own records (station.* loggers, audit, library warnings) stream here as they happen.</div>`}
      ${shown.map(r => html`<div key=${r.seq} style=${{ whiteSpace: "pre-wrap", overflowWrap: "anywhere", color: color(r.level) }}><span style=${{ color: "var(--dim)" }}>${hhmmss(r.ts)}</span> <span style=${{ fontWeight: (r.level === "ERROR" || r.level === "CRITICAL") ? 700 : 400 }}>${(r.level || "").slice(0, 4)}</span> <span style=${{ color: "var(--accent)" }}>${r.name}</span> ${r.msg}</div>`)}
    </div>
  </div>`;
}

/* 🧭 provenance — durable agent/model/tool/edit records intersected with the
   live log scanner.  The investigator request is explicit: expected output is
   supplied by the operator, then the local keeper compares it to the observed
   execution chain. */
function ProvenancePanel() {
  const [doc, setDoc] = useState({ events: [], findings: [] });
  const [expected, setExpected] = useState("");
  const [reply, setReply] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const load = React.useCallback(() => api("/api/provenance?limit=500")
    .then(d => { setDoc(d || { events: [], findings: [] }); setErr(null); })
    .catch(e => setErr(e.message || "provenance unavailable")), []);
  useEffect(() => { load(); const id = setInterval(load, 1500); return () => clearInterval(id); }, [load]);
  const investigate = () => {
    if (!expected.trim() || busy) return;
    setBusy(true); setReply("");
    api("/api/provenance/investigate", { method: "POST", body: JSON.stringify({ expected }) })
      .then(d => { if (!d.ok) throw new Error(d.error || "investigation failed"); setReply(d.reply || "(no reply)"); load(); })
      .catch(e => setErr(e.message || String(e))).finally(() => setBusy(false));
  };
  const queryEditor = (f) => {
    const message = "Finding " + f.id + " intersects an edited item. Review the observed log and execution chain for " +
      (f.summary || f.signature || f.kind) + ". Identify the first divergent edit and report the smallest corrective test.";
    api("/api/provenance/query", { method: "POST", body: JSON.stringify({ finding_id: f.id, message }) })
      .then(() => load()).catch(e => setErr(e.message || "query failed"));
  };
  const when = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString() : "—";
  const kindColor = (k) => k === "log" ? "var(--warn)" : k === "tool_call" || k === "tool_result" ? "var(--accent)" : "var(--fg)";
  const depthOf = (e, all, seen = new Set()) => {
    if (!e.parent_id || seen.has(e.id)) return 0;
    seen.add(e.id); const p = all.find(x => x.id === e.parent_id);
    return p ? Math.min(8, 1 + depthOf(p, all, seen)) : 0;
  };
  return html`<div style=${{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
    <div style=${{ padding: "6px 8px", borderBottom: "1px solid var(--edge)", fontSize: 11 }}>
      <b>durable provenance</b> · model output, tool calls, edits, and intersecting logs are retained in the Station ledger
      <textarea value=${expected} onInput=${e => setExpected(e.target.value)} placeholder="Expected result / invariant for the local investigator…"
        style=${{ display: "block", width: "100%", minHeight: 46, marginTop: 5, boxSizing: "border-box", background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", font: "11px ui-monospace, monospace" }} />
      <button className="btn" disabled=${busy || !expected.trim()} onClick=${investigate} style=${{ marginTop: 5, fontSize: 10 }}>${busy ? "investigating…" : "compare expected vs observed"}</button>
      ${err && html`<span style=${{ color: "var(--bad)", marginLeft: 8 }}>${err}</span>`}
      ${reply && html`<pre style=${{ maxHeight: 220, overflow: "auto", whiteSpace: "pre-wrap", margin: "6px 0 0", color: "var(--fg)" }}>${reply}</pre>`}
    </div>
    <div style=${{ padding: "4px 8px", color: "var(--warn)", fontSize: 11, borderBottom: "1px solid var(--edge)" }}>
      ${((doc.findings || []).length)} open propagated finding(s)
      ${(doc.findings || []).slice(0, 8).map(f => html`<div key=${f.id} style=${{ marginTop: 3, display: "flex", gap: 6, alignItems: "baseline" }}><span><b>${f.severity || "warning"}</b> ${f.kind}: ${f.summary || f.signature}</span><button className="btn" onClick=${() => queryEditor(f)} style=${{ fontSize: 10, padding: "0 4px" }}>query editor</button></div>`)}
    </div>
    <div style=${{ flex: 1, minHeight: 0, overflow: "auto", padding: "4px 8px", font: "11px ui-monospace, monospace" }}>
      ${(doc.events || []).map(e => html`<div key=${e.id} style=${{ whiteSpace: "pre-wrap", overflowWrap: "anywhere", borderBottom: "1px solid rgba(128,128,128,.12)", padding: "3px 0", marginLeft: depthOf(e, doc.events || []) * 18 }}>
        <span style=${{ color: "var(--dim)" }}>${when(e.ts)}</span> <span style=${{ color: "var(--dim)" }}>${e.parent_id ? "↳" : "•"}</span> <span style=${{ color: kindColor(e.kind) }}>${e.kind}</span> <span style=${{ color: "var(--accent)" }}>${e.actor || e.source}</span> ${JSON.stringify(e.body).slice(0, 1000)}
        ${e.items && e.items.length ? html`<div style=${{ color: "var(--dim)" }}>↳ ${e.items.map(i => i.item + (i.line ? ":" + i.line : "")).join(", ")}</div>` : ""}
      </div>`)}
    </div>
  </div>`;
}

/* 📜 journal — a live `journalctl -f` of the LOCUS's STATION KEEPER USER
   (operator 2026-09-15: "the log, it should be a journalctl -f of the station's
   keeper user"). What it used to show — this console backend's OWN python log
   ring — is still one click away behind `console ring`, but the default source
   is now the locus home itself: the station unit, the seat scopes, everything
   that user's journal carries. ONE SSE per panel
   (/api/locus/journal/stream?vm=&after=SEQ): a `meta` event with the RESOLVED
   source (user, unit, user-vs-system, the exact command) then one `line` per
   journal line, the server's bounded ring backfilling a reconnect — `after` +
   the seq guard mean a resume never gaps or duplicates. A line the server
   marks kind="error" is journald's OWN refusal (e.g. "users in groups 'adm',
   'systemd-journal' can see all messages"): it is rendered IN the panel,
   because an empty view would not say why. */
const JRN_BAD = /\b(error|errors|fail|failed|failing|fatal|denied|refused|traceback|exception|429)\b/i;
const JRN_WARN = /\b(warn|warning|retry|retrying|timeout|timed out)\b/i;
function JournalFeed({ vm }) {
  const [rows, setRows] = useState([]);
  const [src, setSrc] = useState(null);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState("");
  const [follow, setFollow] = useState(true);
  const [paused, setPaused] = useState(false);
  const [mode, setMode] = useState("journal");
  const boxRef = React.useRef(null);
  const lastSeq = React.useRef(0);
  const pausedRef = React.useRef(false);
  const pending = React.useRef([]);
  useEffect(() => {
    pausedRef.current = paused;
    if (!paused && pending.current.length) { const p = pending.current; pending.current = []; setRows(r => r.concat(p).slice(-3000)); }
  }, [paused]);
  useEffect(() => {
    if (mode !== "journal") return undefined;
    setRows([]); setSrc(null); setErr(null); lastSeq.current = 0; pending.current = [];
    const es = new EventSource("/api/locus/journal/stream?vm=" + encodeURIComponent(vm || "") + "&after=0");
    es.addEventListener("meta", ev => { try { setSrc(JSON.parse(ev.data).source || null); } catch (_) { /* keep the last */ } });
    es.addEventListener("line", ev => {
      let d; try { d = JSON.parse(ev.data); } catch (_) { return; }
      // the browser's own reconnect replays the ring from after=0 — the seq
      // guard is what makes that idempotent.
      if (!d || !(d.seq > lastSeq.current)) return;
      lastSeq.current = d.seq;
      if (pausedRef.current) { pending.current.push(d); return; }
      setRows(r => r.concat([d]).slice(-3000));
    });
    es.onerror = () => setErr("stream reconnecting…");
    es.onopen = () => setErr(null);
    return () => es.close();
  }, [vm, mode]);
  useEffect(() => { if (follow && boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [rows, follow]);
  const needle = q.trim().toLowerCase();
  const shown = rows.filter(r => !needle || (r.line || "").toLowerCase().includes(needle));
  const color = (r) => r.kind === "error" ? "var(--bad)" : r.kind === "meta" ? "var(--dim)"
    : JRN_BAD.test(r.line) ? "var(--bad)" : JRN_WARN.test(r.line) ? "var(--warn)" : "var(--fg, #cde)";
  const sel = { fontSize: 10, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3 };
  return html`<div style=${{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
    <div style=${{ display: "flex", gap: 6, alignItems: "center", padding: "4px 8px", borderBottom: "1px solid var(--edge)", flex: "none", fontSize: 11 }}>
      <button className=${"btn" + (mode === "journal" ? " on" : "")} title="journalctl -f of this locus's station keeper user" onClick=${() => setMode("journal")} style=${{ fontSize: 10 }}>journal</button>
      <button className=${"btn" + (mode === "console" ? " on" : "")} title="this console backend's own log records (the old 📜 source)" onClick=${() => setMode("console")} style=${{ fontSize: 10 }}>console ring</button>
      ${mode === "journal" && html`
        <span title=${(src && src.cmd) || "resolving the station keeper user on this locus…"}
              style=${{ color: "var(--accent)", fontFamily: "ui-monospace,SFMono-Regular,monospace", fontSize: 10, flex: "none" }}>
          ${src ? src.label : "resolving…"}</span>
        <input value=${q} onInput=${e => setQ(e.target.value)} placeholder="filter" style=${{ ...sel, flex: 1, minWidth: 0, fontSize: 11, padding: "1px 5px" }} />
        <button className=${"btn" + (follow ? " on" : "")} title="pin the view to the newest line" onClick=${() => setFollow(f => !f)} style=${{ fontSize: 10 }}>follow</button>
        <button className=${"btn" + (paused ? " on" : "")} title="hold new lines (they queue and land on resume)" onClick=${() => setPaused(p => !p)} style=${{ fontSize: 10 }}>${paused ? "resume" : "pause"}</button>
        <span style=${{ color: "var(--dim)", fontSize: 10, flex: "none" }}>${shown.length}/${rows.length}</span>`}
    </div>
    ${mode === "console" ? html`<${LogFeed} />` : html`
      ${err && html`<div style=${{ color: "var(--warn)", padding: "2px 8px", fontSize: 10 }}>${err}</div>`}
      ${src && !src.ok && html`<div style=${{ color: "var(--bad)", padding: "4px 8px", fontSize: 10 }}>
        cannot resolve the station keeper user on ${src.locus || "this locus"}: ${src.error}</div>`}
      <div ref=${boxRef}
           onScroll=${e => { const el = e.target; if (follow && el.scrollHeight - el.scrollTop - el.clientHeight > 8) setFollow(false); }}
           style=${{ flex: 1, minHeight: 0, overflowY: "auto", padding: "4px 8px", fontFamily: "ui-monospace,SFMono-Regular,monospace", fontSize: 11, lineHeight: 1.4 }}>
        ${rows.length === 0 && html`<div style=${{ color: "var(--dim)" }}>waiting for the journal — the last ${"200"} lines arrive first, then every new one as it lands.</div>`}
        ${shown.map(r => html`<div key=${r.seq} style=${{ whiteSpace: "pre-wrap", overflowWrap: "anywhere", color: color(r) }}>${r.kind === "meta" ? "· " : ""}${r.line}</div>`)}
      </div>`}
  </div>`;
}

/* 🐞 bug scan — an INTERMITTENT LOCAL-AGENT REVIEW of the locus's logs
   (operator 2026-09-15: "the bug scan should be an intermittent local agent
   review of the logs, to identify any running problems within the locus
   home"). The station's own scheduler hands the last window of the SAME
   journal the 📜 tab follows — plus the console backend's warnings and the
   seat panes' error tails — to B (the LOCAL keeper seat, never the frontier)
   under a fixed review prompt, and persists the JSON findings. This panel is a
   read-mostly window on /api/bugscan plus the three controls the operator
   asked for: on/off, the interval, and "scan now" (which only QUEUES — a
   review takes as long as B takes, so the next 15 s poll shows it). Findings
   are deduped server-side by a subject hash, so a recurring problem is ONE row
   with a run count, and raw evidence stays collapsed until asked for. The
   VM-side sidecar scanner (bugreport.v1 — the "report a bug" flow) is
   unchanged and one click away as `sidecar`. */
const BUGSCAN_SEV = { high: "var(--bad)", medium: "var(--warn)", low: "var(--dim)" };
const BUGSCAN_EVERY = [[300, "5m"], [600, "10m"], [1800, "30m"], [3600, "1h"], [21600, "6h"]];
function BugScanPanel({ vm }) {
  const [st, setSt] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState({});
  const [view, setView] = useState("scan");
  const load = React.useCallback(() => api("/api/bugscan?vm=" + encodeURIComponent(vm || ""))
    .then(d => { setSt(d); setErr(null); })
    .catch(e => setErr(e.message || "load failed")), [vm]);
  useEffect(() => {
    if (view !== "scan") return undefined;
    load();
    // live, but never from a backgrounded tab — the review itself runs on the
    // server's clock; this poll only reads what it has already written.
    const id = setInterval(() => { if (document.visibilityState !== "hidden") load(); }, 15000);
    const onVis = () => { if (document.visibilityState === "visible") load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [load, view]);
  const post = (body) => {
    setBusy(true);
    return api("/api/bugscan", { method: "POST", body: JSON.stringify({ vm: vm || "", ...body }) })
      .then(d => { setSt(d); setErr(null); })
      .catch(e => setErr(e.message || "failed"))
      .finally(() => setBusy(false));
  };
  const findings = (st && st.findings) || [];
  const sel = { fontSize: 10, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3 };
  return html`<div style=${{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
    <div style=${{ display: "flex", gap: 6, alignItems: "center", padding: "4px 8px", borderBottom: "1px solid var(--edge)", flex: "none", fontSize: 11, flexWrap: "wrap" }}>
      <button className=${"btn" + (view === "scan" ? " on" : "")} title="the local keeper's intermittent review of this locus's logs" onClick=${() => setView("scan")} style=${{ fontSize: 10 }}>review</button>
      ${vm && html`<button className=${"btn" + (view === "sidecar" ? " on" : "")} title="the VM-side log/process scanner (bugreport.v1) — the report-a-bug flow" onClick=${() => setView("sidecar")} style=${{ fontSize: 10 }}>sidecar</button>`}
      ${view === "scan" && html`
        <button className=${"btn" + (st && st.on ? " on" : "")} disabled=${busy || !st}
                title="run the review on a timer for this locus" onClick=${() => post({ op: st && st.on ? "off" : "on" })}
                style=${{ fontSize: 10 }}>${st && st.on ? "on" : "off"}</button>
        <select value=${String((st && st.interval) || 600)} disabled=${busy || !st} style=${sel}
                onChange=${e => post({ op: "interval", interval: Number(e.target.value) })}>
          ${BUGSCAN_EVERY.map(([s, lbl]) => html`<option key=${s} value=${String(s)}>every ${lbl}</option>`)}
        </select>
        <button className="btn" disabled=${busy || !st || (st && st.running)}
                title="queue a review right now (it finishes when B finishes)" onClick=${() => post({ op: "now" })}
                style=${{ fontSize: 10 }}>${st && st.running ? "reviewing…" : "scan now"}</button>
        <span style=${{ color: "var(--dim)", fontSize: 10 }} title=${(st && st.source && st.source.cmd) || ""}>
          ${st ? (st.locus || "this station") + " · " + (st.last ? bugRel(st.last) : "never") : "…"}</span>
        ${st && !st.b && html`<span style=${{ color: "var(--warn)", fontSize: 10 }}>B unavailable — skipped</span>`}

          ${st && st.on ? "no running problems found yet — the local keeper reviews this locus's journal every " + Math.round(((st && st.interval) || 600) / 60) + " min."
                        : "the review is off for this locus — flip it on, or hit ‘scan now’ for a single pass."}</div>`}
        ${findings.map(f => html`<div key=${f.hash} style=${{ borderBottom: "1px solid var(--edge)", padding: "4px 0" }}>
          <div style=${{ display: "flex", gap: 6, alignItems: "baseline" }}>
            <span style=${{ color: BUGSCAN_SEV[f.severity] || "var(--dim)", fontWeight: f.severity === "high" ? 700 : 400, minWidth: 52, flex: "none", fontSize: 10 }}>${f.severity}</span>
            <span style=${{ flex: "1 1 auto", minWidth: 0, cursor: "pointer" }} title="click to show the evidence the keeper quoted"
                  onClick=${() => setOpen(o => ({ ...o, [f.hash]: !o[f.hash] }))}>${open[f.hash] ? "▾ " : "▸ "}${f.subject}</span>
            ${f.runs > 1 && html`<span style=${{ color: "var(--dim)", fontSize: 10, flex: "none" }} title=${"first seen " + bugRel(f.first_ts)}>×${f.runs}</span>`}
            ${f.board && html`<span style=${{ color: "var(--accent)", fontSize: 10, flex: "none" }} title="posted to the board once, by local-keeper">☑ ${f.board}</span>`}
            <span style=${{ color: "var(--dim)", fontSize: 10, flex: "none" }}>${bugRel(f.ts)}</span>
          </div>
          ${f.suggested_action && html`<div style=${{ color: "var(--dim)", fontSize: 10, margin: "1px 0 0 58px" }}>→ ${f.suggested_action}</div>`}
          ${open[f.hash] && html`<pre style=${{ margin: "3px 0 2px 58px", padding: "5px 7px", border: "1px solid var(--edge)", borderRadius: 5, background: "rgba(255,255,255,.02)", maxHeight: 200, overflow: "auto", whiteSpace: "pre-wrap", overflowWrap: "anywhere", fontSize: 10.5 }}>${f.evidence || "(no evidence quoted)"}</pre>`}
        </div>`)}
      </div>`}
  </div>`;
}

    window.stationBrowser.show({ x: 0, y: 0, width: 0, height: 0 }); place();
    window.addEventListener("resize", place);
    const ro = new ResizeObserver(place); ro.observe(surfaceRef.current);
    return () => { ro.disconnect(); window.removeEventListener("resize", place); window.stationBrowser.hide(); };

  useEffect(() => {

  return html`<div style=${{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>

    <div ref=${surfaceRef} style=${{ flex: 1, minHeight: 300, background: "white", position: "relative" }}>

/* 🖥 VMs — LXD stations as a tab: one sub-tab per station + a constant ＋VM. Per-VM
   GUI controls (start/stop/restart/delete/open) wired to /api/mct/vm + App power/select.
   Absorbs the old reset/reconnect (VM-terminal controls). Auto-selects the dropdown VM. */
/* Global terminal surface tabs (local · frontier · shell) driving the left pane
   via window.__fvSurface — replaces the per-VM keeper/shell terminal-mode toggle. */
function SurfaceTabs() {
  const [cur, setCur] = useState(() => (window.__fvSurface ? window.__fvSurface.get() : "frontier"));
  const [, setTick] = useState(0);
  useEffect(() => {
    const h = (e) => setCur((e && e.detail) || (window.__fvSurface && window.__fvSurface.get()) || "frontier");
    window.addEventListener("fv-surface", h);
    const t = setInterval(() => { if (window.__fvSurface) setCur(window.__fvSurface.get()); setTick(x => x + 1); }, 1500);
    return () => { window.removeEventListener("fv-surface", h); clearInterval(t); };
  }, []);
  const surfaces = (window.__fvSurface && window.__fvSurface.list()) || ["local", "frontier", "shell"];
  /* shells are multi-instance (t5): "shell", "shell#2", … each its own PTY;
     ＋ opens the next, × on an extra instance closes just that one. */
  const isExtraShell = (s) => /^shell#\d+$/.test(s);
  const isPull = (s) => /^pull:/.test(s);   // an attached pulled/jump-in seat (its tmux lives on when closed)
  return html`${surfaces.map(s => html`<span key=${s} style=${{ display: "inline-flex", alignItems: "stretch" }}>
    <button className=${"btn term-tab " + (cur === s ? "keeper" : "")}
      title=${isPull(s) ? "attached seat " + s.slice(5) + " (tmux -L console)" : "terminal surface: " + s} onClick=${() => { if (window.__fvSurface) window.__fvSurface.set(s); setCur(s); }}>${isPull(s) ? "⤵ " + s.slice(5) : s}</button>
    ${isExtraShell(s) && html`<button className="btn term-tab" title=${"close " + s + " (kills only its PTY)"} style=${{ padding: "0 4px", marginLeft: -2 }}
      onClick=${() => { if (window.__fvSurface && window.__fvSurface.closeShell) { window.__fvSurface.closeShell(s); setTick(x => x + 1); } }}>×</button>`}
    ${isPull(s) && html`<button className="btn term-tab" title=${"detach " + s.slice(5) + " (the seat keeps running in tmux)"} style=${{ padding: "0 4px", marginLeft: -2 }}
      onClick=${() => { if (window.__fvSurface && window.__fvSurface.detachPull) { window.__fvSurface.detachPull(s); setTick(x => x + 1); } }}>×</button>`}
  </span>`)}<button key="__recover" className="btn term-tab" title="⟳ recover this surface — repaint a frozen viewer and hard-reattach its session (scrollback survives; nothing is killed)"
    onClick=${() => { if (window.__fvSurface && window.__fvSurface.recover) { window.__fvSurface.recover(cur); setTick(x => x + 1); } }}>⟳</button><button key="__addshell" className="btn term-tab" title="＋ another shell on this locus (its own PTY)"
    onClick=${() => { if (window.__fvSurface && window.__fvSurface.addShell) { const n = window.__fvSurface.addShell(); setCur(n); setTick(x => x + 1); } }}>＋ shell</button>`;
}

/* ✍ prompt — collapsible, resizable composer docked BELOW the terminal (op
   2026-09-10; was in the right drawer column). The live terminal is rendered by
   fleetview-term.js as a position:fixed flex-column pane (#fv-term-pane), so a
   normal-flow composer would sit hidden behind it. Instead we append our own
   flex-none child at the bottom of that pane and PORTAL into it: the terminal
   host (flex:1) shrinks and the composer shows directly beneath it, full pane
   width, no geometry math.
   1.0.143 (operator 2026-10-01, "most of the time the prompt is never even
   sent"): the composer DELIVERS the prompt itself — POST /api/prompt/send puts
   the text (+ attachments) straight into the target session: the locus's serve
   console session (selected one, or the keeper head) or its Terminal tmux seat.
   Every send shows delivered / queued / NOT delivered + the reason, and a
   serve send is followed until its turn is done. The old prompt-inbox
   file-pointer (/api/mct/prompt + a typed "Handle the operator prompt at …"
   pointer) is gone from the normal path; it survives only as the explicit,
   labelled "save to inbox (file-pointer fallback)" button after a failed send.
   Clipboard images attach (MIME image/*); copied paths stay text. Speech
   (dictation + reply read-aloud) is opt-in, default OFF (prompt-tools.js). */
const PROMPT_TARGETS = [
  ["auto", "→ auto (locus keeper surface)", "serve when the locus's keeper surface is serve (the console's selected session, else the keeper head), else its terminal seat"],
  ["serve", "→ serve · selected session", "the serve console session selected in the /ac console (ac_selected)"],
  ["serve-head", "→ serve · keeper head", "the serve keeper session (roster → rollover head)"],
  ["seat", "→ terminal seat (tmux)", "type into the locus's terminal seat for the chosen frontier backend (text, then a separate Enter)"]];
const PROMPT_STATE_COLOR = { delivered: "var(--ok, #5fd08a)", done: "var(--ok, #5fd08a)", queued: "var(--warn, #e0b341)",
  running: "var(--warn, #e0b341)", sent: "var(--warn, #e0b341)", unconfirmed: "var(--warn, #e0b341)",
  stalled: "var(--warn, #e0b341)", held: "var(--bad, #e06c6c)", failed: "var(--bad, #e06c6c)", gone: "var(--bad, #e06c6c)" };
const promptLS = (k, dflt) => { try { const v = localStorage.getItem(k); return v == null ? dflt : v; } catch (_) { return dflt; } };
const promptLSset = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
/* the locus a send went to, pinned for its follow-up calls (vmScope would
   otherwise add whatever locus is selected NOW); "@keeper" = this host */
const promptVm = (d) => (!d || !d.locus || d.locus === "host") ? "@keeper" : d.locus;
function promptSendLabel(d) {
  if (!d) return "";
  const where = d.target === "serve" ? ("serve " + (d.session_id || "?")) : (d.target === "seat" ? ("seat " + (d.seat || "?")) : (d.target || "?"));
  if (d.state === "delivered") return "✓ delivered → " + where + (d.detail ? " · " + d.detail : "");
  if (d.state === "queued") return "⏳ queued → " + where + (d.detail ? " · " + d.detail : "");
  if (d.state === "unconfirmed") return "? sent, not confirmed → " + where + " · " + (d.reason || "");
  if (d.state === "saved") return "🗂 " + (d.note || "saved (file-pointer fallback) — NOT delivered");
  return "✗ NOT delivered → " + where + " · " + (d.reason || "unknown error");
}
function PromptPanel() {
  const PT = window.__fvPromptTools;
  const [open, setOpen] = useState(false);
  const [h, setH] = useState(() => { try { return parseInt(localStorage.getItem("prompt_h"), 10) || 50; } catch (_) { return 50; } });
  const [text, setText] = useState("");
  const [files, setFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const [rev, setRev] = useState(null);          // ✎ B revision preview {revised, corrections, ambiguities}
  const [revBusy, setRevBusy] = useState(false);
  const [dock, setDock] = useState(null);        // #fv-prompt-dock inside #fv-term-pane (portal target)
  const [target, setTarget] = useState(() => promptLS("fv-prompt-target", "auto"));
  const [sent, setSent] = useState(null);       // last /api/prompt/send result (+ .track from /api/prompt/status)
  const [stt, setStt] = useState(() => promptLS("fv-prompt-stt", "0") === "1");   // speech OFF by default
  const [tts, setTts] = useState(() => promptLS("fv-prompt-tts", "0") === "1");
  const [speech, setSpeech] = useState({ s: "idle", d: "" });
  const dictRef = React.useRef(null);
  const ttsRef = React.useRef(tts);
  /* todo mode (2026-09-18): a switch flips this composer between sending a prompt
     (OFF, default) and QUEUEING the text as a todo (ON). The type/priority picks
     ride the add; they're disabled while OFF. Reuses the host-native ☑ board's
     add mechanism — POST /api/mct/todo {op:"add", type, text, priority} — the same
     one SessionTodoDrawer.add() uses. */
  const [todoMode, setTodoMode] = useState(false);
  const [todoType, setTodoType] = useState("todo");
  const [todoPrio, setTodoPrio] = useState("low");
  const saveH = (v) => { const n = Math.min(100, Math.max(20, v)); setH(n); try { localStorage.setItem("prompt_h", String(Math.round(n))); } catch (_) {} };
  // Mount the dock at the bottom of the fixed terminal pane (after #fv-term-host).
  // The pane may not exist at first paint (fleetview-term.js builds it), so retry
  // via a MutationObserver until it does.
  useEffect(() => {
    let cancelled = false;
    const attach = () => {
      const pane = document.getElementById("fv-term-pane");
      if (!pane) return false;
      let d = document.getElementById("fv-prompt-dock");
      if (!d) {
        d = document.createElement("div");
        d.id = "fv-prompt-dock";
        d.style.display = "flex";
        d.style.flexDirection = "column";
        d.style.minHeight = "0";
        pane.appendChild(d);
      }
      if (!cancelled) setDock(d);
      return true;
    };
    if (attach()) return () => { cancelled = true; };
    const obs = new MutationObserver(() => { if (attach()) obs.disconnect(); });
    obs.observe(document.body, { childList: true, subtree: true });
    return () => { cancelled = true; obs.disconnect(); };
  }, []);
  // Size the dock as a flex item of the pane (open → h% of the pane, collapsed →
  // its natural bar height) and nudge the terminal to re-fit its xterm canvas.
  useEffect(() => {
    if (!dock) return;
    dock.style.flex = open ? ("0 0 " + h + "%") : "none";
    dock.style.minHeight = open ? "90px" : "";
    try { window.dispatchEvent(new Event("resize")); } catch (_) {}
  }, [dock, open, h]);
  /* 🔊 read-aloud: Esc stops speaking; switching it off stops at once */
  useEffect(() => {
    ttsRef.current = tts;
    if (!tts) { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {} return; }
    const onEsc = (e) => { if (e.key === "Escape" && window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel(); };
    window.addEventListener("keydown", onEsc);
    return () => window.removeEventListener("keydown", onEsc);
  }, [tts]);
  useEffect(() => () => { if (dictRef.current) dictRef.current.stop(); }, []);
  /* follow a serve-delivered prompt until its turn is done (GET /api/prompt/status
     — the serve queue + events of THAT locus's serve). held/stalled offer retry. */
  const trackKey = sent && sent.target === "serve" && sent.ok && sent.message_ids ? sent.session_id + "|" + sent.message_ids.join(",") + "|" + (sent.gen || 0) : "";
  useEffect(() => {
    if (!trackKey) return;
    let stop = false, cursor = sent.cursor || 0, sawRun = false, n = 0;
    const tick = () => {
      if (stop) return;
      n += 1;
      const q = "/api/prompt/status?session_id=" + encodeURIComponent(sent.session_id) + "&ids=" +
        encodeURIComponent(sent.message_ids.join(",")) + "&since=" + cursor + "&vm=" + encodeURIComponent(promptVm(sent));
      api(q, { timeout: 20000 }).then(d => {
        if (stop) return;
        cursor = d.cursor || cursor;
        if (d.state === "running") sawRun = true;
        const st = (d.state === "sent" && sawRun) ? "running" : d.state;
        setSent(x => (x && x.at === sent.at && (x.gen || 0) === (sent.gen || 0)) ? { ...x, track: { ...d, state: st } } : x);
        if (d.state === "done") {
          if (ttsRef.current && PT && d.reply) { const why = PT.speak(window, d.reply); if (why) setNote("🔊 " + why); }
          stop = true; return;
        }
        if (d.state === "failed" || d.state === "gone") { stop = true; return; }
        if (n < 600) setTimeout(tick, 3000);           // ≤30 min of following
      }).catch(() => { if (!stop && n < 600) setTimeout(tick, 6000); });
    };
    const t0 = setTimeout(tick, 1500);
    return () => { stop = true; clearTimeout(t0); };
  }, [trackKey]);
  /* ✎ B readability revision (Ctrl+E): local, free. B checks the wording
     against docs/NOMENCLATURE.md — corrects unambiguous mislabels, asks where
     a term is ambiguous. Preview only; apply replaces the text. */
  const revise = () => {
    const t = text.trim(); if (!t || revBusy) return;
    setRevBusy(true); setRev(null); setNote(null);
    api("/api/mct/prompt/revise", { method: "POST", timeout: 120000, body: JSON.stringify({ text: t }) })
      .then(d => { if (d.ok && d.revised) setRev(d); else setNote(d.error || "B returned nothing usable"); })
      .catch(e => setNote("revise: " + (e.message || e)))
      .finally(() => setRevBusy(false));
  };
  const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "e") { e.preventDefault(); revise(); } };
  const onDrag = (e) => {
    e.preventDefault();
    const pane = document.getElementById("fv-term-pane"); if (!pane) return;
    const rect = pane.getBoundingClientRect();
    const mv = (ev) => saveH(100 * (rect.bottom - ev.clientY) / rect.height);
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  };
  const addFiles = (fl) => Array.from(fl || []).forEach(f => {
    const rd = new FileReader();
    rd.onload = () => setFiles(fs => [...fs, { name: f.name, type: f.type, dataUrl: rd.result }]);
    rd.readAsDataURL(f);
  });
  const clipFile = (blob, type) => {
    const ty = type || blob.type || "image/png";
    const name = PT ? PT.clipName(ty) : "clipboard.png";
    try { return new File([blob], name, { type: ty }); } catch (_) { blob.name = name; return blob; }
  };
  /* Ctrl+V: an IMAGE on the clipboard (MIME image/*, no path type alongside)
     becomes an attachment; text, file paths and uri-lists paste as text. */
  const onPaste = (e) => {
    const cd = e.clipboardData; if (!cd || !PT) return;
    const cls = PT.classifyClipboard(cd.types, cd.items);
    if (cls.kind !== "image") return;
    const fl = cls.index.map(i => cd.items[i] && cd.items[i].getAsFile()).filter(Boolean);
    if (!fl.length) return;
    e.preventDefault();
    addFiles(fl.map(f => clipFile(f, f.type)));
    setNote("📋 clipboard image attached");
  };
  /* 📋 image: read the clipboard on demand (Electron preload stationClipboard
     when the shell exposes it, else the async Clipboard API). */
  const pasteImage = async () => {
    try {
      const sc = window.stationClipboard;
      if (sc && sc.readImage) {
        const im = await sc.readImage();
        if (im && !im.empty && im.png) {
          setFiles(fs => [...fs, { name: PT ? PT.clipName("image/png") : "clipboard.png", type: "image/png", dataUrl: im.png }]);
          setNote("📋 clipboard image attached"); return;
        }
      }
      if (!navigator.clipboard || !navigator.clipboard.read) throw new Error("this browser cannot read clipboard images here — press Ctrl+V in the box");
      const items = await navigator.clipboard.read();
      for (const it of items) {
        const ty = PT ? PT.pickImageType(it.types) : "";
        if (ty) { addFiles([clipFile(await it.getType(ty), ty)]); setNote("📋 clipboard image attached"); return; }
      }
      setNote("📋 no image on the clipboard (text and file paths paste as text)");
    } catch (e) { setNote("📋 " + (e.message || e)); }
  };
  /* 🎙 dictation — Web Speech where it works, the station's Whisper otherwise */
  const dictation = () => {
    if (!dictRef.current && PT) {
      dictRef.current = PT.Dictation({
        win: window, store: localStorage,
        transcribe: (blob) => {
          const fd = new FormData();
          fd.append("file", blob, "station-voice." + (String(blob.type).indexOf("ogg") >= 0 ? "ogg" : "webm"));
          const csrf = csrfToken();
          return fetch("/api/voice/transcribe", { method: "POST", body: fd, credentials: "same-origin",
              headers: { "X-Console": "1", ...(csrf ? { "X-Console-CSRF": csrf } : {}) } })
            .then(r => r.json().catch(() => ({})).then(d => { if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; }))
            .then(d => d.text || d.transcription || (d.result && d.result.text) || "");
        },
        onText: (t) => { if (t) setText(x => (x.trim() ? x.replace(/\s+$/, "") + " " : "") + t); },
        onState: (s, d) => setSpeech({ s, d }),
      });
    }
    if (dictRef.current) dictRef.current.toggle();
    else setSpeech({ s: "unavailable", d: "prompt-tools.js did not load" });
  };
  const toggleStt = () => { const v = !stt; setStt(v); promptLSset("fv-prompt-stt", v ? "1" : "0"); if (!v && dictRef.current) dictRef.current.stop(); setSpeech({ s: "idle", d: "" }); };
  const toggleTts = () => {
    const v = !tts;
    if (v && PT) { const sup = PT.ttsSupport(window); if (!sup.ok) { setNote("🔊 unavailable: " + sup.reason); return; } }
    setTts(v); promptLSset("fv-prompt-tts", v ? "1" : "0");
  };
  const pickTarget = (v) => { setTarget(v); promptLSset("fv-prompt-target", v); };
  /* send: the prompt goes to the target session itself. The text stays in the
     box unless the send was delivered/queued — a failure never loses it. */
  const send = (extra) => {
    const t = text; if ((!t.trim() && !files.length) || busy) return;
    setBusy(true); setNote(null);
    const backend = (window.__fvBackend && window.__fvBackend.get("frontier")) || "";
    const sel = promptLS("ac_selected", "");
    const body = { text: t, files, target: target === "serve-head" ? "serve" : target,
                   session_id: target === "serve-head" || target === "seat" ? "" : sel,
                   seat_backend: backend, force: !!(extra && extra.force) };
    api("/api/prompt/send", { method: "POST", timeout: 180000, body: JSON.stringify(body) })
      .then(d => d, e => ({ ok: false, state: "failed", target: body.target, reason: (e.body && (e.body.reason || e.body.error)) || e.message || String(e) }))
      .then(d => {
        setSent({ ...d, at: Date.now() });
        if (d.ok) { setText(""); setFiles([]); setRev(null); }
        if (ttsRef.current && PT && d.ok && d.target === "seat") PT.speak(window, "prompt delivered to the terminal seat");
      })
      .finally(() => setBusy(false));
  };
  /* the legacy file-pointer path, explicit and labelled: saves prompt.md (+
     files) to the prompt-inbox and reports the path. Nothing is delivered. */
  const saveInbox = () => {
    const t = text; if ((!t.trim() && !files.length) || busy) return;
    setBusy(true);
    api("/api/mct/prompt", { method: "POST", timeout: 120000, body: JSON.stringify({ text: t, files, seat: "tmux", save_only: true }) })
      .then(d => setSent({ ok: false, state: "saved", note: d.note || ("saved → " + (d.path || "?")) + " — NOT delivered", at: Date.now() }))
      .catch(e => setSent({ ok: false, state: "failed", target: "inbox", reason: e.message || String(e), at: Date.now() }))
      .finally(() => setBusy(false));
  };
  const retryQueue = () => {
    if (!sent || !sent.session_id) return;
    api("/api/prompt/status?vm=" + encodeURIComponent(promptVm(sent)),
        { method: "POST", timeout: 20000, body: JSON.stringify({ session_id: sent.session_id, action: "retry" }) })
      .then(d => setNote(d.ok ? "retry sent — following the turn" : ("retry failed: " + (d.error || d.status))))
      .then(() => setSent(x => x ? { ...x, track: { state: "queued" }, gen: (x.gen || 0) + 1 } : x))
      .catch(e => setNote("retry: " + (e.message || e)));
  };
  /* todo mode: queue the textarea's text on the host-native ☑ board instead of
     sending a prompt. Same endpoint/payload as SessionTodoDrawer.add(); shares
     the SAME `busy` in-flight guard as send() so neither path can double-submit. */
  const addTodo = () => {
    const t = text.trim(); if (!t || busy) return;
    setBusy(true); setNote(null);
    api("/api/mct/todo", { method: "POST", timeout: 120000,
        body: JSON.stringify({ op: "add", type: todoType, text: t, priority: todoPrio }) })
      .then(d => {
        if (d && d.ok === false) { setNote(d.error || "todo add failed"); return; }
        setText(""); setTodoPrio("low");
        setNote("added to ☑ todo (" + todoType + (todoPrio !== "low" ? " · " + todoPrio : "") + ")");
      })
      .catch(e => setNote("error: " + (e.message || e)))
      .finally(() => setBusy(false));
  };
  if (!dock) return null;
  const track = sent && sent.track;
  const sentBadge = sent && html`<span title=${(sent.reason || sent.detail || "") + (sent.why ? " · session via " + sent.why : "")}
      style=${{ color: PROMPT_STATE_COLOR[sent.state] || "var(--dim)", fontSize: 11, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>
      ${promptSendLabel(sent)}${track ? html`<span style=${{ color: PROMPT_STATE_COLOR[track.state] || "var(--dim)" }}> · ${track.state === "done" ? "✓ reply in" : track.state}${track.error ? " — " + track.error : ""}</span>` : ""}</span>`;
  const sel = { background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, fontSize: 11 };
  const body = !open
    ? html`<div className="prompt-bar" onClick=${() => setOpen(true)}
      style=${{ flex: "none", borderTop: "1px solid var(--edge)", padding: "5px 10px", cursor: "pointer", background: "var(--panel)", fontSize: 12, display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
    <b>✍ prompt</b><span style=${{ color: "var(--dim)", flex: "none" }}>▲ expand${files.length ? " · " + files.length + " file(s) attached" : ""}${text.trim() ? " · draft kept" : ""}</span>${sentBadge}</div>`
    : html`<div className="prompt-panel" style=${{ flex: "1 1 auto", minHeight: 0, height: "100%", display: "flex", flexDirection: "column", borderTop: "1px solid var(--edge)", background: "var(--panel)" }}>
    <div onPointerDown=${onDrag} title="drag to resize" style=${{ height: 6, cursor: "ns-resize", background: "var(--edge)", flex: "none" }}></div>
    <div style=${{ display: "flex", alignItems: "center", gap: 8, padding: "4px 10px", flex: "none", flexWrap: "wrap" }}>
      <b style=${{ fontSize: 12 }}>✍ prompt</b>
      <label className="btn" style=${{ fontSize: 11, cursor: "pointer" }}>📎 media<input type="file" multiple style=${{ display: "none" }} onChange=${e => addFiles(e.target.files)} /></label>
      <button className="btn" style=${{ fontSize: 11 }} title="attach the image on the clipboard (a screenshot / copied image). Copied file paths are text — paste them with Ctrl+V." onClick=${pasteImage}>📋 image</button>
      <select value=${target} disabled=${todoMode} onChange=${e => pickTarget(e.target.value)} style=${sel}
              title=${(PROMPT_TARGETS.find(x => x[0] === target) || [])[2] || "where send delivers the prompt"}>
        ${PROMPT_TARGETS.map(([v, l, tip]) => html`<option key=${v} value=${v} title=${tip}>${l}</option>`)}</select>
      ${/* todo mode switch + type/priority picks (2026-09-18): OFF = prompt mode
            (default, dropdowns greyed); ON = 'add' queues a todo. */""}
      <button className=${"btn" + (todoMode ? " on" : "")} style=${{ fontSize: 11 }}
              title="todo mode — ON: the send button becomes 'add' and queues the text as a todo (type + priority) on the ☑ board instead of sending a prompt"
              onClick=${() => setTodoMode(v => !v)}>${todoMode ? "☑ todo: ON" : "☑ todo: off"}</button>
      <select value=${todoType} disabled=${!todoMode} onChange=${e => setTodoType(e.target.value)}
              title="todo type (todo mode only)" style=${{ ...sel, opacity: todoMode ? 1 : .45 }}>
        <option value="todo">□ todo</option><option value="request">◇ request</option><option value="bookmark">🔖 bookmark</option></select>
      <select value=${todoPrio} disabled=${!todoMode} onChange=${e => setTodoPrio(e.target.value)}
              title="todo priority (todo mode only)" style=${{ ...sel, opacity: todoMode ? 1 : .45 }}>
        <option value="low">– prio</option><option value="medium">med</option><option value="high">HIGH</option></select>
      <button className=${"btn" + (stt ? " on" : "")} style=${{ fontSize: 11 }} onClick=${toggleStt}
              title="speech-to-text: dictate into the prompt (browser speech recognition, else the station's Whisper). Off by default; remembered in this browser.">${stt ? "🎙 on" : "🎙 off"}</button>
      <button className=${"btn" + (tts ? " on" : "")} style=${{ fontSize: 11 }} onClick=${toggleTts}
              title="read replies aloud: the reply of a prompt sent to a serve session is spoken with the browser's voice when its turn ends (Esc stops). Off by default; remembered in this browser.">${tts ? "🔊 on" : "🔇 off"}</button>
      <span style=${{ flex: 1 }}></span>
      ${note && html`<span style=${{ color: "var(--dim)", fontSize: 11 }}>${note}</span>`}
      <button className="btn" style=${{ fontSize: 11 }} onClick=${() => setOpen(false)}>▼ hide</button>
    </div>
    ${files.length > 0 && html`<div style=${{ display: "flex", gap: 6, flexWrap: "wrap", padding: "0 10px 4px" }}>
      ${files.map((f, i) => html`<span key=${i} style=${{ fontSize: 11, border: "1px solid var(--edge)", borderRadius: 4, padding: "1px 6px", display: "inline-flex", gap: 4, alignItems: "center" }}>
        ${f.type && f.type.indexOf("image/") === 0 ? html`<img src=${f.dataUrl} style=${{ height: 20, borderRadius: 2 }} />` : "📄"} ${f.name}
        <span style=${{ cursor: "pointer", color: "var(--bad)" }} onClick=${() => setFiles(fs => fs.filter((_, k) => k !== i))}>×</span></span>`)}
    </div>`}
    ${rev && html`<div style=${{ margin: "0 10px 6px", border: "1px solid var(--edge)", borderRadius: 4, padding: 6, fontSize: 11, maxHeight: "45%", overflow: "auto", background: "var(--bg)" }}>
      <div style=${{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
        <b>✎ B revision</b><span style=${{ flex: 1 }}></span>
        <button className="btn on" style=${{ fontSize: 11 }} onClick=${() => { setText(rev.revised); setRev(null); }}>apply</button>
        <button className="btn" style=${{ fontSize: 11 }} onClick=${() => setRev(null)}>dismiss</button>
      </div>
      <div style=${{ whiteSpace: "pre-wrap" }}>${rev.revised}</div>
      ${rev.corrections && rev.corrections.length > 0 && html`<div style=${{ marginTop: 4 }}><b>corrected</b> (per docs/NOMENCLATURE.md):
        ${rev.corrections.map((c, i) => html`<div key=${i}>· “${c.from}” → “${c.to}”${c.why ? " — " + c.why : ""}</div>`)}</div>`}
      ${rev.ambiguities && rev.ambiguities.length > 0 && html`<div style=${{ marginTop: 4, color: "var(--warn, #c9862b)" }}><b>B asks</b> (ambiguous — not changed):
        ${rev.ambiguities.map((a, i) => html`<div key=${i}>· “${a.span}”: ${a.question}</div>`)}</div>`}
    </div>`}
    <textarea value=${text} onInput=${e => setText(e.target.value)} onKeyDown=${onKey} onPaste=${onPaste}
      placeholder="compose a prompt…  (📎 or paste a screenshot to attach · copied paths stay text · Ctrl+E: ✎ B revises wording vs docs/NOMENCLATURE.md)"
      style=${{ flex: 1, minHeight: 0, resize: "none", margin: "0 10px 8px", background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, padding: 6, fontFamily: "inherit", fontSize: 12 }} />
    <div style=${{ padding: "0 10px 8px", flex: "none", display: "flex", gap: 6, alignItems: "center", minWidth: 0 }}>
      <button className="btn on" disabled=${busy || (todoMode ? !text.trim() : (!text.trim() && !files.length))} onClick=${() => (todoMode ? addTodo() : send())}>${busy ? (todoMode ? "adding…" : "sending…") : (todoMode ? "add" : "send")}</button>
      <button className="btn" disabled=${revBusy || !text.trim()} title="✎ B revises the wording against docs/NOMENCLATURE.md (Ctrl+E) — corrects unambiguous mislabels, asks about ambiguous ones; preview, then apply" onClick=${revise}>${revBusy ? "B…" : "✎ B revise"}</button>
      ${stt && html`<button className=${"btn" + (dictRef.current && dictRef.current.active() ? " on" : "")} style=${{ fontSize: 11 }}
              title=${speech.d || "dictate into the prompt — click to start, click again to stop"} onClick=${dictation}>${speech.s === "listening" || speech.s === "recording" ? "■ stop" : (speech.s === "transcribing" ? "… transcribing" : "🎙 dictate")}</button>`}
      ${stt && speech.d && html`<span style=${{ fontSize: 11, color: speech.s === "error" || speech.s === "unavailable" ? "var(--bad, #e06c6c)" : "var(--dim)" }}>${speech.s === "unavailable" ? "🎙 unavailable: " : ""}${speech.d}</span>`}
      ${sent && !sent.ok && sent.state === "failed" && !todoMode && html`<span style=${{ display: "inline-flex", gap: 4 }}>
        <button className="btn" style=${{ fontSize: 11 }} disabled=${busy} onClick=${() => send()} title="send the kept text again">↻ retry</button>
        ${sent.can_force && html`<button className="btn" style=${{ fontSize: 11 }} disabled=${busy} onClick=${() => send({ force: true })} title="type it into the seat even though its input line holds text">send anyway</button>`}
        <button className="btn" style=${{ fontSize: 11 }} disabled=${busy} onClick=${saveInbox} title="LEGACY file-pointer fallback: save prompt.md (+ files) to the workspace prompt-inbox. Nothing reads it by itself — you point a session at it.">🗂 save to inbox (file-pointer fallback)</button></span>`}
      ${track && track.retry && html`<button className="btn" style=${{ fontSize: 11 }} onClick=${retryQueue} title="start the queued prompt on that serve session (console queue retry)">↻ retry queue</button>`}
      ${sentBadge || html`<span style=${{ color: "var(--dim)", fontSize: 11 }}>→ delivered straight to the target session; the result shows here</span>`}
    </div>
  </div>`;
  return ReactDOM.createPortal(body, dock);
}

/* 🔌 per-VM access block (1.0.41): the two ways INTO a station — lxc exec and
   ssh — both explicit, both opening the confined in-VM terminal from this
   client; and the station's OWN hugpy-station (workbench) inside the VM:
   installed-or-not, serving-or-not, install/upgrade button, log tail. */
function VmAccessBlock({ vm, running, onSelect, kind }) {
  const [ssh, setSsh] = useState(null);
  const [wb, setWb] = useState(null);
  const [err, setErr] = useState(null);
  const [showLog, setShowLog] = useState(false);
  const load = useCallback(() => {
    if (!running) { setSsh(null); setWb(null); return; }
    api("/api/vm/" + vm + "/ssh-info", { timeout: 20000 }).then(setSsh).catch(e => setErr(e.message));
    if (kind !== "ssh") api("/api/stations/" + vm + "/console-status", { timeout: 20000 }).then(setWb).catch(e => setErr(e.message));
  }, [vm, running, kind]);
  useEffect(() => { setSsh(null); setWb(null); setErr(null); load(); const t = setInterval(load, 6000); return () => clearInterval(t); }, [load]);
  const openWith = (transport) => {
    onSelect(vm);
    try {
      window.__fvSurface && window.__fvSurface.set("shell");
      if (window.__fvBackend) window.__fvBackend.set("shell", transport);
      else { const chosen = JSON.parse(localStorage.getItem("fv-backends") || "{}") || {};
             chosen.shell = transport; localStorage.setItem("fv-backends", JSON.stringify(chosen)); }
    } catch (_) {}
  };
  const install = () => {
    setErr(null);
    api("/api/stations/" + vm + "/console-install", { method: "POST", timeout: 30000 })
      .then(() => { setShowLog(true); load(); }).catch(e => setErr(e.message || "install failed"));
  };
  const openWb = () => {
    api("/api/stations/" + vm + "/console-url").then(d => { if (d.url) window.open(d.url, "fc-" + vm); })
      .catch(e => setErr(e.message || "no workbench"));
  };
  const installing = wb && wb.job === "running";
  return html`<div style=${{ marginTop: 12, borderTop: "1px solid var(--edge)", paddingTop: 10 }}>
    <div style=${{ fontWeight: 600, marginBottom: 6 }}>🔌 access — ${vm} <span style=${{ fontWeight: 400, color: "var(--dim)" }}>(everything opens INSIDE the VM as ubuntu; a dead session falls back into the VM, never to the host)</span></div>
    <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
      ${kind !== "ssh" && html`<button className="btn" disabled=${!running} title="lxc exec — works even with no network path" onClick=${() => openWith("exec")}>⇥ terminal via exec</button>`}
      <button className="btn" disabled=${!running || !(ssh && ssh.ready)}
        title=${ssh && ssh.ready ? "a real sshd login as ubuntu@" + ssh.ip : "ssh not ready: needs an IP and an active sshd in the VM"}
        onClick=${() => openWith("ssh")}>⇥ terminal via ssh ${ssh ? (ssh.ready ? "✓" : "✗") : ""}</button>
    </div>
    ${ssh && html`<div style=${{ color: "var(--dim)", fontSize: 11, lineHeight: 1.7 }}>
      <div>ip <code>${ssh.ip || "(none yet)"}</code> · sshd <b style=${{ color: ssh.sshd === "active" ? "var(--ok)" : "var(--warn)" }}>${ssh.sshd}</b> · key ${ssh.fleet_key ? html`<code>${ssh.fleet_key}</code>` : "none (agent/password)"}</div>
      ${ssh.command && html`<div>ssh &nbsp;&nbsp;&nbsp;&nbsp;<code>${ssh.command}</code></div>`}
      ${ssh.exec_command && html`<div>exec &nbsp;&nbsp;&nbsp;<code>${ssh.exec_command}</code></div>`}
      ${ssh.enable_hint && html`<div>enable sshd: <code>${ssh.enable_hint}</code></div>`}
    </div>`}
    ${kind === "ssh" && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 8 }}>⧉ in-machine hugpy-station install is LXD-only for now; on an ssh host install the deb there by hand (<code>sudo dpkg -i hugpy-station_*.deb</code>) and open it directly.</div>`}
    ${kind !== "ssh" && html`<div style=${{ fontWeight: 600, margin: "10px 0 6px" }}>⧉ this station's own hugpy-station
      <span style=${{ fontWeight: 400, color: !wb ? "var(--dim)" : wb.installed ? "var(--ok)" : "var(--warn)" }}> — ${
        !running ? "VM not running" : !wb ? "…" : installing ? "INSTALLING…" : wb.installed ? "installed · serving " + wb.url : wb.token ? "installed but NOT serving on " + wb.url : "not installed"}</span></div>
    <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      <button className=${"btn" + (wb && !wb.installed ? " on" : "")} disabled=${!running || installing || !(wb && wb.installer_present)}
        title="push THIS host's station backend into the VM, run it as ubuntu on :8800 behind a per-VM token (install-vm-console). Idempotent — re-run to upgrade."
        onClick=${install}>${installing ? "installing…" : wb && wb.token ? "⟳ re-install / upgrade" : "＋ install hugpy-station in this VM"}</button>
      <button className="btn" disabled=${!(wb && wb.installed)} onClick=${openWb} title="open the VM's own console (tokened one-click URL)">⧉ open</button>
      ${wb && wb.log && html`<button className="btn" onClick=${() => setShowLog(v => !v)}>${showLog ? "hide" : "show"} install log</button>`}
    </div>
    ${wb && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 4 }}>token <code>${wb.token_path}</code> ${wb.token ? "✓" : "✗"} · port ${wb.port} ${wb.serving ? "answers" : "silent"} · installer <code>${wb.installer}</code>${wb.installer_present ? "" : " MISSING"}${wb.job === "failed" ? html` · <b style=${{ color: "var(--bad)" }}>last install FAILED (rc ${wb.rc})</b>` : ""}</div>`}
    ${showLog && wb && wb.log && html`<pre style=${{ fontSize: 10, maxHeight: 220, overflow: "auto", background: "var(--bg)", border: "1px solid var(--edge)", borderRadius: 4, padding: 6, marginTop: 4, whiteSpace: "pre-wrap" }}>${wb.log}</pre>`}`}
    ${err && html`<div style=${{ color: "var(--bad)", fontSize: 11, marginTop: 4 }}>error: ${err}</div>`}
  </div>`;
}

function VmsDrawer({ power, busy, active, onSelect }) {
  const [vms, setVms] = useState(null);
  const [sub, setSub] = useState(active || "host");   // the ⌂ host locus leads; "+vm" creates
  const [err, setErr] = useState(null);
  const [note, setNote] = useState(null);
  const [name, setName] = useState("");
  const [cpu, setCpu] = useState("4");
  const [mem, setMem] = useState("8GiB");
  const [disk, setDisk] = useState("100GiB");
  const [from, setFrom] = useState("");
  const [instOnly, setInstOnly] = useState(true);
  const [creating, setCreating] = useState(false);
  // ⇅ ssh host form (1.0.41b): an EXISTING machine becomes a station over ssh
  const [sName, setSName] = useState(""); const [sHost, setSHost] = useState(""); const [sUser, setSUser] = useState("ubuntu");
  const [sPort, setSPort] = useState("22"); const [sKey, setSKey] = useState(""); const [sTest, setSTest] = useState(null);
  const [sBusy, setSBusy] = useState(false);
  const load = useCallback(() => {
    api("/api/mct/vm").then(d => setVms(d.vms || [])).catch(e => setErr(e.message || "load failed"));
  }, []);
  const addSsh = () => {
    const n = sName.trim().toLowerCase(); if (!n || !sHost.trim() || sBusy) return;
    setSBusy(true); setErr(null); setNote(null); setSTest(null);
    api("/api/ssh-hosts", { method: "POST", timeout: 30000, body: JSON.stringify({ op: "add", name: n, host: sHost.trim(), user: sUser.trim() || "root", port: parseInt(sPort, 10) || 22, key: sKey.trim() }) })
      .then(() => api("/api/ssh-hosts", { method: "POST", timeout: 40000, body: JSON.stringify({ op: "test", name: n }) }))
      .then(t => { setSTest(t); setNote("added ⇅ " + n + (t.ok ? " — reachable: " + t.out.replace(/\n/g, " · ") : " — added, but NOT reachable by key yet")); setSub(n); load(); })
      .catch(e => setErr(e.message || "add failed")).finally(() => setSBusy(false));
  };
  const testSsh = (n) => {
    setSBusy(true); setSTest(null);
    api("/api/ssh-hosts", { method: "POST", timeout: 40000, body: JSON.stringify({ op: "test", name: n }) })
      .then(setSTest).catch(e => setSTest({ ok: false, err: e.message })).finally(() => setSBusy(false));
  };
  const delSsh = (n) => {
    if (!window.confirm("Remove ssh host '" + n + "' from this station? (the remote machine is untouched)")) return;
    api("/api/ssh-hosts", { method: "POST", body: JSON.stringify({ op: "delete", name: n }) })
      .then(() => { setSub("+vm"); load(); }).catch(e => setErr(e.message || "delete failed"));
  };
  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);
  useEffect(() => { if (active) setSub(active); }, [active]);
  const create = () => {
    const n = name.trim(); if (!n || creating) return;
    setCreating(true); setErr(null); setNote(null);
    const body = { op: "create", name: n, cpu, mem, disk, instance_only: instOnly };
    if (from.trim()) body.from = from.trim();
    api("/api/mct/vm", { method: "POST", timeout: 30000, body: JSON.stringify(body) })
      .then(() => { setNote("building '" + n + "' — appears as a tab when ready"); setName(""); load(); })
      .catch(e => setErr(e.message || "create failed"))
      .finally(() => setCreating(false));
  };
  /* ◌ hide / unhide (1.0.80): drop a locus from the tab strip + dropdown WITHOUT
     touching the VM or ssh host — it stays here, greyed, to unhide. */
  const hide = (vm, on) => {
    setErr(null); setNote(null);
    api("/api/mct/vm", { method: "POST", body: JSON.stringify({ op: on ? "hide" : "unhide", name: vm }) })
      .then(() => { setNote(on ? "'" + vm + "' hidden from the tab strip (the machine is untouched)" : "'" + vm + "' shown again"); load(); })
      .catch(e => setErr(e.message || "hide failed"));
  };
  const del = (vm) => {
    if (!window.confirm("Delete VM '" + vm + "'? Irreversible.")) return;
    setErr(null); setNote(null);
    api("/api/mct/vm", { method: "POST", body: JSON.stringify({ op: "delete", name: vm }) })
      .then(() => { setSub("+vm"); load(); }).catch(e => setErr(e.message || "delete failed"));
  };
  const list = vms || [];
  const cur = list.find(v => v.name === sub);
  const fld = { background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, padding: "3px 6px", fontSize: 12 };
  return html`<div className="design-panel" style=${{ display: "flex", flexDirection: "column", height: "100%" }}>
    <div style=${{ display: "flex", gap: 4, flexWrap: "wrap", padding: "6px 8px", borderBottom: "1px solid var(--edge)", flex: "none" }}>
      <button className=${"btn" + (sub === "host" ? " on" : "")} onClick=${() => setSub("host")}
              title="the locus hugpy Station itself runs on — always present">⌂ host</button>
      ${vms === null && html`<span style=${{ color: "var(--dim)", fontSize: 11 }}>loading…</span>`}
      ${list.filter(v => !v.hidden).map(v => html`<button key=${v.name} className=${"btn" + (sub === v.name ? " on" : "")} onClick=${() => setSub(v.name)}>
        <span style=${{ color: v.building ? "var(--warn)" : v.status === "RUNNING" ? "var(--ok)" : "var(--dim)" }}>●</span> ${v.kind === "ssh" ? "⇅ " : ""}${v.name}</button>`)}
      ${list.filter(v => v.hidden).map(v => html`<button key=${v.name} className=${"btn" + (sub === v.name ? " on" : "")} onClick=${() => setSub(v.name)}
        style=${{ opacity: 0.55 }} title="hidden from the tab strip — open to unhide">◌ ${v.kind === "ssh" ? "⇅ " : ""}${v.name}</button>`)}
      <button className=${"btn" + (sub === "+vm" ? " on" : "")} onClick=${() => setSub("+vm")}>＋ VM</button>
      <button className=${"btn" + (sub === "+ssh" ? " on" : "")} onClick=${() => setSub("+ssh")} title="add an EXISTING machine over ssh — it becomes a station in the dropdown">＋ ssh host</button>
    </div>
    <div style=${{ flex: 1, overflowY: "auto", padding: 12, fontSize: 12 }}>
      ${sub === "host" && html`
        <div style=${{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>⌂ host — this machine</div>
        <div style=${{ color: "var(--dim)", lineHeight: 1.5, maxWidth: 560 }}>
          The locus hugpy Station itself runs on. Always present — never created, started or
          deleted from here. Selecting it grounds every surface (frontier A · local B · shell),
          the 🛡 steward, the ☑ board and ⚙ settings in this machine.
          The old <code>@keeper</code> seat sentinel and the <code>keeper</code> board alias
          survive on the wire only — <b>keeper names agents, never machines</b> (docs → nomenclature).
        </div>
        <button className="btn on" style=${{ marginTop: 10 }}
          onClick=${() => { try { window.__fvVm && window.__fvVm.set("@keeper"); window.__fvSurface && window.__fvSurface.set("frontier"); } catch (e) {} }}>⇥ open host seat</button>
      `}
      ${sub === "+vm" ? html`
        <div style=${{ fontWeight: 600, marginBottom: 10 }}>New VM — LXD station (vm-new)</div>
        <div style=${{ display: "grid", gridTemplateColumns: "auto 1fr", gap: 8, alignItems: "center", maxWidth: 380 }}>
          <label>name</label><input value=${name} onInput=${e => setName(e.target.value)} placeholder="a-z, then a-z0-9-" style=${fld} />
          <label>from</label><input value=${from} onInput=${e => setFrom(e.target.value)} placeholder="golden (default) or an existing station" style=${fld} />
          <label>cpu</label><input value=${cpu} onInput=${e => setCpu(e.target.value)} style=${fld} />
          <label>mem</label><input value=${mem} onInput=${e => setMem(e.target.value)} style=${fld} />
          <label>disk</label><input value=${disk} onInput=${e => setDisk(e.target.value)} style=${fld} />
          <label>disposable</label><label style=${{ fontSize: 11 }}><input type="checkbox" checked=${instOnly} onChange=${() => setInstOnly(v => !v)} /> instance-only (no snapshots)</label>
        </div>
        <button className="btn on" disabled=${creating || !name.trim()} onClick=${create} style=${{ marginTop: 10 }}>${creating ? "starting build…" : "＋ build VM"}</button>
        <div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 8, lineHeight: 1.5 }}>Behind the provision gate (homebase + CSRF). Build streams to <code>~/.config/hugpy-station/vm-new-&lt;name&gt;.log</code>.
          The built VM gets sshd + the station's fleet key, so it is reachable via <b>exec</b> and <b>ssh</b> (see 🔌 access on its tab).</div>
      ` : sub === "+ssh" ? html`
        <div style=${{ fontWeight: 600, marginBottom: 10 }}>⇅ Add an existing machine over ssh</div>
        <div style=${{ display: "grid", gridTemplateColumns: "auto 1fr", gap: 8, alignItems: "center", maxWidth: 420 }}>
          <label>name</label><input value=${sName} onInput=${e => setSName(e.target.value)} placeholder="a-z0-9- — how it appears in the dropdown" style=${fld} />
          <label>host</label><input value=${sHost} onInput=${e => setSHost(e.target.value)} placeholder="192.168.1.250 or a hostname" style=${fld} />
          <label>user</label><input value=${sUser} onInput=${e => setSUser(e.target.value)} style=${fld} />
          <label>port</label><input value=${sPort} onInput=${e => setSPort(e.target.value)} style=${fld} />
          <label>key</label><input value=${sKey} onInput=${e => setSKey(e.target.value)} placeholder="optional: key path on THIS host (default: station fleet key, else your ssh agent)" style=${fld} />
        </div>
        <button className="btn on" disabled=${sBusy || !sName.trim() || !sHost.trim()} onClick=${addSsh} style=${{ marginTop: 10 }}>${sBusy ? "adding + testing…" : "＋ add ssh host"}</button>
        <div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 8, lineHeight: 1.6 }}>
          Every surface of an ssh host runs over ssh as that user: <b>shell</b> = an interactive ssh login (only if that host permits it),
          <b>frontier</b> (B/mct or claude-code) and <b>local</b> run on the remote, the 🛡 steward probes it (Claude login, models, sudo).
          Seeding the station key: <code>ssh-copy-id -i ~/.config/hugpy-station/fleet_ssh_key.pub user@host</code>. Stored in <code>~/.config/hugpy-station/ssh-hosts.json</code>.
        </div>
        ${sTest && html`<pre style=${{ fontSize: 11, marginTop: 8, color: sTest.ok ? "var(--ok)" : "var(--bad)", whiteSpace: "pre-wrap" }}>${sTest.ok ? "✓ " + (sTest.out || "") : "✗ " + (sTest.err || sTest.hint || "unreachable") + (sTest.hint ? "\n" + sTest.hint : "")}</pre>`}
      ` : (cur && cur.kind === "ssh" ? html`
        <div style=${{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>⇅ ${cur.name}
          <span style=${{ fontWeight: 400, fontSize: 12, color: cur.status === "RUNNING" ? "var(--ok)" : "var(--bad)" }}> · ${cur.status === "RUNNING" ? "reachable" : "UNREACHABLE"} · ${cur.user}@${cur.host}:${cur.port}</span></div>
        <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
          <button className="btn" disabled=${cur.status !== "RUNNING"} onClick=${() => onSelect(cur.name)}>⇥ open terminal (ssh)</button>
          <button className="btn" disabled=${sBusy} onClick=${() => testSsh(cur.name)}>⚡ test key login</button>
          <button className="btn" onClick=${() => hide(cur.name, !cur.hidden)} title=${cur.hidden ? "show it in the tab strip again" : "drop it from the tab strip + dropdown; the host is untouched"}>${cur.hidden ? "◉ unhide" : "◌ hide locus"}</button>
          <button className="btn" onClick=${() => delSsh(cur.name)} style=${{ color: "var(--bad)", borderColor: "var(--bad)" }}>✕ remove</button>
        </div>
        ${cur.hidden && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginBottom: 8 }}>◌ hidden — not in the tab strip or dropdown; the machine and its ssh entry are untouched.</div>`}
        ${sTest && html`<pre style=${{ fontSize: 11, color: sTest.ok ? "var(--ok)" : "var(--bad)", whiteSpace: "pre-wrap" }}>${sTest.ok ? "✓ " + (sTest.out || "") : "✗ " + (sTest.err || "") + (sTest.hint ? "\n" + sTest.hint : "")}</pre>`}
        <${VmAccessBlock} vm=${cur.name} running=${cur.status === "RUNNING"} onSelect=${onSelect} kind="ssh" />
      ` : cur ? html`
        <div style=${{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>🖥 ${cur.name}
          <span style=${{ fontWeight: 400, fontSize: 12, color: cur.building ? "var(--warn)" : cur.status === "RUNNING" ? "var(--ok)" : "var(--dim)" }}> · ${cur.building ? "BUILDING" : cur.status}</span></div>
        <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
          <button className="btn" disabled=${!!busy[cur.name] || cur.status === "RUNNING"} onClick=${() => power(cur.name, "start")}>▶ start</button>
          <button className="btn" disabled=${!!busy[cur.name] || cur.status !== "RUNNING"} onClick=${() => power(cur.name, "stop")}>■ stop</button>
          <button className="btn" disabled=${!!busy[cur.name]} onClick=${() => power(cur.name, "restart")}>↻ restart</button>
          <button className="btn" disabled=${cur.status !== "RUNNING"} onClick=${() => onSelect(cur.name)}>⇥ open terminal</button>
          <button className="btn" onClick=${() => hide(cur.name, !cur.hidden)} title=${cur.hidden ? "show it in the tab strip again" : "drop it from the tab strip + dropdown; the VM is untouched (no stop, no delete)"}>${cur.hidden ? "◉ unhide" : "◌ hide locus"}</button>
          <button className="btn" onClick=${() => del(cur.name)} style=${{ color: "var(--bad)", borderColor: "var(--bad)" }}>🗑 delete</button>
        </div>
        ${cur.hidden && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginBottom: 8 }}>◌ hidden — not in the tab strip or dropdown; the VM is untouched and keeps running if it was.</div>`}
        <${VmAccessBlock} vm=${cur.name} running=${cur.status === "RUNNING"} onSelect=${onSelect} />
      ` : html`<div style=${{ color: "var(--dim)" }}>select a station tab above, ＋ VM to build one, or ＋ ssh host to add an existing machine</div>`)}
      ${note && html`<div style=${{ color: "var(--warn)", marginTop: 10, fontSize: 11 }}>✓ ${note}</div>`}
      ${err && html`<div style=${{ color: "var(--bad)", marginTop: 10, fontSize: 11 }}>error: ${err}</div>`}
    </div>
  </div>`;
}

/* SESSION-PULL-PATCH 2026-09-02: ⤵ pulled — claude sessions pulled into the fleet (toolserver loci
   feed via /api/sessions/pulled) + live jump-in seats on this station's keeper
   socket. Click a live one to attach its seat as a terminal tab. */
function PulledChip() {
  const [rows, setRows] = useState([]);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    let on = true;
    const go = () => api("/api/sessions/pulled").then(d => { if (on) setRows((d && d.sessions) || []); })
      .catch(() => { if (on) setRows([]); });
    go(); const iv = setInterval(go, 15000);
    return () => { on = false; clearInterval(iv); };
  }, []);
  if (!rows.length) return null;
  const live = rows.filter(r => r.live).length;
  const attach = (r, e) => { e.stopPropagation(); if (window.__fvSurface && window.__fvSurface.attach) window.__fvSurface.attach(r.tmux); setOpen(false); };
  return html`<span className="stale" onClick=${() => setOpen(o => !o)}
      title="claude sessions pulled into the station (toolserver session/pull) — click to attach a live seat"
      style=${{ position: "relative", cursor: "pointer", background: "#12253a", color: "#58a6ff" }}>
    ⤵ ${live}/${rows.length} pulled
    ${open && html`<div onClick=${e => e.stopPropagation()} style=${{ position: "absolute", top: "100%", left: 0, zIndex: 60, background: "var(--panel, #161b22)", border: "1px solid var(--edge)", borderRadius: 6, padding: 6, minWidth: 360, maxHeight: 320, overflow: "auto", textAlign: "left" }}>
      ${rows.map(r => html`<div key=${r.tmux || r.locus} style=${{ display: "flex", gap: 6, alignItems: "center", padding: "3px 2px", fontSize: 11 }}>
        <span style=${{ color: r.live ? "var(--ok)" : "var(--dim)" }}>${r.live ? "●" : "○"}</span>
        <span style=${{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: "var(--fg)" }}
              title=${(r.ssh && r.ssh.user ? r.ssh.user + "@" + r.ssh.host + ":" : "") + (r.dir || "") + (r.goal ? "\n" + r.goal : "")}>
