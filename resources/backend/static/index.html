   the honest staleness note. Every branch is guarded — any field may be null. */
const activityMeter = (activity) => {
  const a = activity && typeof activity === "object" ? activity : {};
  const secs = actSince(a.keeper_last_activity_ts);
  if (secs === null) return { label: "⚡ —", title: "no relay activity data", warn: false, known: false };
  const warn = secs >= ACT_WARN_SECS;
  const lines = ["last keeper activity " + actExact(a.keeper_last_activity_ts)];
  const q = a.board_quiet_secs;
  if (typeof q === "number" && isFinite(q) && q >= 0) {
    if (q === 0) lines.push("delivers instantly (no quiet gate)");
    else {
      const remain = q - secs;   // seconds of keeper quiet still needed before this board delivers
      lines.push("delivers after " + actDur(q) + " quiet" +
        (remain > 0 ? " — " + actDur(remain) + " to the quiet threshold" : " — quiet threshold met"));
    }
  }
  if (actSince(a.collected_ts) !== null) lines.push("as of scan " + bugRel(a.collected_ts));
  if (warn) lines.push("older than 30m — the keeper/relay may be stalled");
  return { label: "⚡ " + bugRel(a.keeper_last_activity_ts), title: lines.join("\n"), warn, known: true };
};

/* WATCHES tab (board t41) — READ-ONLY render of the scanner's watch+compile output
   (see bugreport/README.md "Watches"). report.watches carries one row PER CONFIGURED
   WATCH, in config order; this mirrors that contract verbatim. Config editing needs a
   host sidecar op and is deliberately OUT OF SCOPE for this slice — nothing here writes.
   A group's `status` is null in COUNT MODE (matches are only tallied) — then the count
   is the headline; a non-null status is a status-mode watch, with a {status:count}
   histogram rendered as inline chips. last_ts is humanized with the drawer's own bugRel. */
const bugWatchTitle = (ts) => ts ? new Date(ts * 1000).toLocaleString() : "no matches yet";
function bugWatchGroups(groups) {
  const entries = groups && typeof groups === "object" ? Object.entries(groups) : [];
  if (!entries.length) return null;
  return html`
    <table className="bug-wtable">
      <thead><tr><th>key</th><th>status</th><th>count</th><th>last</th></tr></thead>
      <tbody>
        ${entries.map(([k, g]) => {
          const st = g && g.status;
          const cnt = (g && g.count) || 0;
          const hist = g && g.statuses && typeof g.statuses === "object" ? Object.entries(g.statuses) : [];
          return html`
            <tr key=${k}>
              <td className="bug-wg-key">${k}</td>
              <td className="bug-wg-status">
                ${st == null
                  ? html`<span className="bug-wg-count-mode" title="count mode — no per-group status, matches are only tallied">×${cnt}</span>`
                  : html`<span className="bug-wg-st" title="latest status (by timestamp)">${st}</span>`}
                ${hist.length > 0 && html`<span className="bug-wg-chips">${hist.map(([s, c]) =>
                    html`<span key=${s} className="bug-wg-chip" title="status histogram">${s} ${c}</span>`)}</span>`}
              </td>
              <td className="bug-wg-n">${cnt}</td>
              <td className="bug-wg-ts" title=${bugWatchTitle(g && g.last_ts)}>${bugRel(g && g.last_ts)}</td>
            </tr>`;
        })}
      </tbody>
    </table>`;
}
function bugWatch(w, i) {
  const name = (w && w.name) || "(unnamed)";
  const enabled = !!(w && w.enabled);
  const error = w && w.error;
  const total = (w && w.matched_total) || 0;
  const last = (w && w.matched_last_scan) || 0;
  const groups = w && w.groups;
  const groupCount = groups && typeof groups === "object" ? Object.keys(groups).length : 0;
  const dry = !error && groupCount === 0;               // valid + no matches yet — armed but dry
  const totals = total + " matched" + (last > 0 ? " · " + last + " new" : "");
  return html`
    <div key=${i} className=${"bug-watch" + (error ? " err" : "") + (enabled ? "" : " off")}>
      <div className="bug-watch-head">
        <span className="bug-watch-name">${name}</span>
        <span className=${"bug-watch-en" + (enabled ? " on" : "")}
              title=${enabled ? "enabled in the scanner config" : "disabled in the scanner config"}>${enabled ? "enabled" : "disabled"}</span>
        <span className="bug-watch-spacer"></span>
        ${!error && html`<span className="bug-watch-totals"
             title="matched total across all history · new since the last scan">${totals}</span>`}
      </div>
      ${error && html`<div className="bug-watch-error" title="fail-closed: this watch is invalid and was skipped">⚠ ${error}</div>`}
      ${!error && dry && html`<div className="bug-watch-dry">armed — no matches yet</div>`}
      ${!error && !dry && bugWatchGroups(groups)}
      ${!error && !dry && w && w.groups_truncated && html`<div className="bug-wtrunc">showing 50 most recent keys</div>`}
    </div>`;
}

function BugsDrawer({ vm }) {
  const [report, setReport] = useState(null);      // bugreport.v1 object | null while the first load is pending
  const [noReport, setNoReport] = useState(null);  // ok:false text ("no bugreport yet") — friendly, NOT an error
  const [err, setErr] = useState(null);            // {msg,status} — fetch/5xx failed; banner + retry
  const [checked, setChecked] = useState({});      // source name -> included in the next scan
  const [busy, setBusy] = useState(false);         // POST in flight
  const [note, setNote] = useState("");            // bottom status line (queue ack / errors)
  const [noteErr, setNoteErr] = useState(false);
  const [pending, setPending] = useState(false);   // queue ack armed (<10s) — disarms ⟳ scan now so it can't double-queue
  const [fresh, setFresh] = useState(false);       // a newer report just landed after our scan — flash the meta line
  const [tab, setTab] = useState("triage");        // board t41: "triage" (default, original content) | "watches"
  const say = (msg, isErr) => { setNote(msg || ""); setNoteErr(!!isErr); };
  const stopped = React.useRef(false);             // terminal load error (4xx) — hold the poll
  const acRef = React.useRef(null);                // in-flight POST, for cancel
  const cancelled = React.useRef(false);
  const awaitTs = React.useRef(null);              // generated_ts we queued against; a move off it = the scan landed
  const pendTimer = React.useRef(null);            // the 10s re-arm timer
  const freshTimer = React.useRef(null);           // the .fresh flash timer

  /* A 4xx is a settled answer (e.g. 409 "<vm> is not running") — show it and STOP
     re-polling; ok:false is the sidecar saying "nothing to show yet", which is not
     a failure, so keep polling; a 5xx/network error may pass, so keep polling too.
     Same shape as the to-do drawer's load, minus the mutation. */
  const load = useCallback(() => {
    api("/api/vm/" + vm + "/bugreport")
      .then(d => {
        if (d.ok) {
          // a scan we queued has landed once generated_ts moves off the value it
          // held when we posted (awaitTs===0 covers "there was no report at all").
          if (awaitTs.current !== null && d.report && d.report.generated_ts !== awaitTs.current) {
            awaitTs.current = null;
            setFresh(true);
            say("report updated " + bugHM(d.report.generated_ts));
            if (freshTimer.current) clearTimeout(freshTimer.current);
            freshTimer.current = setTimeout(() => setFresh(false), 5000);
          }
          setReport(d.report); setNoReport(null); setErr(null);
        } else {
          setNoReport(d.error || "no report yet"); setErr(null);
        }
      })
      .catch(e => {
        if (e.status >= 400 && e.status < 500) stopped.current = true;
        setErr({ msg: e.message || String(e), status: e.status });
      });
  }, [vm]);
  const retry = () => { stopped.current = false; setErr(null); load(); };

  useEffect(() => {
    setReport(null); setNoReport(null); setErr(null); setChecked({}); say("");
    setPending(false); setFresh(false);
    stopped.current = false; awaitTs.current = null;
    if (pendTimer.current) clearTimeout(pendTimer.current);
    if (freshTimer.current) clearTimeout(freshTimer.current);
    load();
    // live view — but not while the answer is settled (terminal error) or nobody
    // is looking (a backgrounded tab must not keep poking an lxc-backed sidecar).
    const id = setInterval(() => {
      if (stopped.current || document.visibilityState === "hidden") return;
      load();
    }, 10000);
    const onVis = () => { if (document.visibilityState === "visible" && !stopped.current) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis);
                   if (pendTimer.current) clearTimeout(pendTimer.current);
                   if (freshTimer.current) clearTimeout(freshTimer.current); };
  }, [load]);

  const sources = (report && report.sources) || [];
  // board t41: watch+compile rows, in config order. Absent/empty on an older scanner —
  // the watches tab shows a graceful "predates watches" line rather than crashing.
  const watches = report && Array.isArray(report.watches) ? report.watches : [];
  /* Seed a checkbox for every source the first time we see it (default = its
     `enabled` flag) and NEVER stomp an entry the operator has since toggled — so
     the 10s poll swapping `report` out can't reset the selection, while a source
     the sidecar adds mid-session still arrives with a sane default. */
  useEffect(() => {
    if (!sources.length) return;
    setChecked(prev => {
      let next = prev, changed = false;
      for (const s of sources) if (!(s.name in prev)) {
        if (!changed) { next = { ...prev }; changed = true; }
        next[s.name] = !!s.enabled;
      }
      return changed ? next : prev;
    });
  }, [report]);

  const guard = (fn) => {
    const ac = new AbortController();
    acRef.current = ac; cancelled.current = false;
    setBusy(true);
    return fn(ac.signal).finally(() => { acRef.current = null; setBusy(false); });
  };
  const cancel = () => { cancelled.current = true; if (acRef.current) acRef.current.abort(); };
  const fail = (prefix) => (e) =>
    say(cancelled.current ? prefix + " cancelled" : prefix + ": " + (e.message || e), true);

  /* Queue a scan. The checked subset becomes POST `sources`, EXCEPT when every
     source is checked (or there are none yet — the first scan from the empty
     state), in which case we omit the key and let the backend scan all enabled.
     The POST only queues, so on ack we arm `pending` (disarms the button for 10s)
     and stash the generated_ts we're waiting to move off of. */
  const scan = () => {
    const names = sources.map(s => s.name);
    const chosen = names.filter(n => checked[n]);
    const all = names.length > 0 && chosen.length === names.length;
    const body = { op: "scan" };
    if (names.length && !all) body.sources = chosen;
    const hadTs = report ? report.generated_ts : 0;
    guard(signal => api("/api/vm/" + vm + "/bugreport", { method: "POST", signal, body: JSON.stringify(body) })
      .then(d => {
        if (!d.ok) return say(d.error || "scan failed", true);
        awaitTs.current = hadTs;
        setPending(true);
        if (pendTimer.current) clearTimeout(pendTimer.current);
        pendTimer.current = setTimeout(() => setPending(false), 10000);
        say("scan queued " + bugHM((d.queued || {}).ts) + " — report refreshes when ready");
      })
      .catch(fail("scan failed")));
  };
  const toggle = (name) => setChecked(m => ({ ...m, [name]: !m[name] }));

  const finding = (f, i) => {
    const digest = f.source === "digest";
    const cites = Array.isArray(f.citations) ? f.citations : [];
    return html`
      <div key=${i} className="bug-find">
        <span className=${"bug-sev " + (bugSevBad(f.severity) ? "bad" : "warn")}>${f.severity}</span>
        <span className="bug-claim">
          ${digest && html`<span className="bug-star" title="from the LLM digest">✨</span>`}
          ${f.claim}
          ${cites.length > 0 && html`<span className="bug-cites">${cites.map((c, j) =>
            html`<span key=${j} className="bug-cite" title="cited input line">[${bugCite(c)}]</span>`)}</span>`}
        </span>
        <span className="bug-source-tag" title="source">${f.source}</span>
      </div>`;
  };

  const st = (report && report.status) || {};
  const failed = Array.isArray(st.failed_units) ? st.failed_units : [];
  const keyUnits = st.key_units && typeof st.key_units === "object" ? st.key_units : {};
  const dm = (report && report.digest_meta) || {};
  const digestLine = dm.error ? "error " + dm.error
                   : dm.ran ? "ran in " + (dm.wall_s != null ? dm.wall_s + "s" : "?")
                   : "skipped";
  /* board t46 — VITALS from the scanner's `activity` block (every field independently
     nullable). load (1m), mem free (GB from kb, 1dp), disk free (GB, 1dp) — each chip
     OMITTED when its field is null. The ⚡ chip reuses the shared activityMeter (same
     tooltip + warn tint as the todo drawer's meter), omitted when there's no last-activity
     ts — the same "null → absent" rule the other vitals follow. An older scanner with no
     `activity` key yields act={} → every chip drops out, and the strip is unchanged. */
  const act = report && report.activity && typeof report.activity === "object" ? report.activity : {};

        </div>`}

        ${note}
        ${busy && html`<button className="bug-cancel" title="abort the in-flight request" onClick=${cancel}>✕ cancel</button>`}
      </div>
    </div>`;

  const cancel = () => { cancelled.current = true; if (acRef.current) acRef.current.abort(); };

  /* Build the POST body from the current mode + inputs and fire it. `forOverride`
     is the import name a chip click supplies (imports mode); everything else reads
     the form. Defaults that match finder's own defaults are OMITTED, so the wire
     body stays the minimal spelling of the request. */
  const run = (forOverride) => {
    if (busy) return;                              // Enter while a POST is in flight must not double-fire
    const r = root.trim();
    if (!r) { say("enter a root path", true); return; }
    let body;
    if (mode === "grep") {
      const s = text.trim();
      if (!s) { say("enter search text", true); return; }
      body = { op: "grep", roots: [r], string: [s] };
      if (!allMatch) body.any = true;              // ALL-match is finder's default → omit `any`
      if (raw) body.no_add = true;
      if (nonRec) body.no_recursive = true;
      { const v = fExt.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.ext = v; }
      { const v = fExcludeExt.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.exclude_ext = v; }
      { const v = fDir.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.dir = v; }
      { const v = fExcludeDir.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.exclude_dir = v; }
      { const v = fPattern.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.pattern = v; }
      { const v = fExcludePattern.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.exclude_pattern = v; }
    } else if (mode === "files") {
      body = { op: "collect", roots: [r], meta: true };
      const e = text.trim();
      if (e) body.ext = [e];                       // blank ext = every (non-excluded) file
      const xd = excludeDir.split(",").map(s => s.trim()).filter(Boolean);
      if (xd.length) body.exclude_dir = xd;        // PRUNE these dir subtrees (the speed lever)
      if (after.trim()) body.after = [after.trim()];   // mtime range (find -newermt)
      if (before.trim()) body.before = [before.trim()];
      if (sortKey && sortKey !== "name") body.sort = [sortKey];
      if (reverse) body.reverse = true;
      if (raw) body.no_add = true;
      if (nonRec) body.no_recursive = true;
      { const v = fExcludeExt.split(",").map(x => x.trim()).filter(Boolean); if (v.length) body.exclude_ext = v; }
      if (fType.trim()) body.type = [fType.trim()];
      if (fMinSize.trim()) body.min_size = [fMinSize.trim()];
      if (fMaxSize.trim()) body.max_size = [fMaxSize.trim()];
      if (fLimit.trim()) body.limit = [fLimit.trim()];
      if (fMaxDepth.trim()) body.maxdepth = [fMaxDepth.trim()];
    } else if (mode === "view") {
      body = { op: "view", roots: [r] };           // root = the ONE file; text = line ranges
      const l = text.trim();
      if (l) body.lines = [l];                      // blank = the whole file
    } else {
      body = { op: "imports", roots: [r] };
      const f = (forOverride != null ? forOverride : text.trim());
      if (f) body.for = f;                         // blank = the full import map (chips)
    }
    setErr(null); setRes(null); say("");
    guard(signal => api("/api/mct/finder", { method: "POST", signal, timeout: 70000, body: JSON.stringify({ ...body, vm: wireVm }) })
      .then(d => {
        if (!d.ok) { setErr({ msg: searchErr(d.error, vm), status: 0 }); return; }
        setRes({ op: body.op, forName: body.for || null, data: d.result || {} });
        setRoots(pushRoot(vm, r));                  // remember this root in the per-VM recents (board t29)
      })
      .catch(e => {
        if (e.aborted) { say(cancelled.current ? "cancelled" : (e.message || "stopped"), true); return; }
        // A missing host route reads as a 404 through api() — the route isn't installed yet.
        if (e.status === 404) { setErr({ msg: "search route not yet enabled on the host", status: 404 }); return; }
        setErr({ msg: searchErr(e.message || String(e), vm), status: e.status });
      }));
  };
  const runFor = (im) => { setText(im); run(im); };   // chip click → who-imports-it
  const onKey = (e) => { if (e.key === "Enter") run(); };

  // ---- root directory picker (board t29) ----------------------------------
  /* Recents (▾): picking one only fills the input — it does NOT count as a use,
     so it isn't re-pushed to the front (only a successful search is). */
  const pickRoot = (r) => { onRoot(r); setRecentsOpen(false); };
  const toggleRecents = () => { setRecentsOpen(v => !v); setBrowseOpen(false); };

  /* Browse (📁): a depth-1 drill-down over op:"dirs". Each (hidden,path) pair is
     fetched once and cached in dirCache; navigation just moves browsePath and the
     effect below fills any cold cell. A 404 (route not activated on the host) is
     shown inline in the panel, exactly like the search list's own 404 state. */
  const dirKey = (path, hidden) => (hidden ? "H:" : "N:") + path;
  const fetchDirs = (path, hidden) => {
    const key = dirKey(path, hidden);
    if (dirCache[key]) return;                        // already loading / loaded / errored — leave it
    setDirCache(c => ({ ...c, [key]: { loading: true } }));
    const body = { op: "dirs", roots: [path], vm: wireVm };
    if (hidden) body.no_add = true;
    api("/api/mct/finder", { method: "POST", body: JSON.stringify(body) })
      .then(d => {
        if (!d.ok) { setDirCache(c => ({ ...c, [key]: { error: searchErr(d.error, vm) } })); return; }
        const dirs = Array.isArray(d.result && d.result.dirs) ? d.result.dirs : [];
        // p513: the backend now also returns files for this dir (separate agent
        // extends op:"dirs"); absent on an older host → files stays undefined and
        // renderBrowse shows dirs only, exactly as before.
        const files = Array.isArray(d.result && d.result.files) ? d.result.files : undefined;
        setDirCache(c => ({ ...c, [key]: { dirs, files } }));
      })
      .catch(e => {
        const msg = e.status === 404 ? "search route not yet enabled on the host" : searchErr(e.message || String(e), vm);
        setDirCache(c => ({ ...c, [key]: { error: msg } }));
      });
  };
  // Fetch on open / navigation / hidden-toggle; the cache dedups repeat visits.
  useEffect(() => { if (browseOpen) fetchDirs(browsePath, browseHidden); }, [browseOpen, browsePath, browseHidden]);

  const openBrowse = () => {                         // start at the root input if it looks absolute, else "/"
    const r = root.trim();
    setBrowsePath(looksAbs(r) ? r : (lhome || "/"));   // the picker starts inside the locus home
    setBrowseHidden(false); setRecentsOpen(false); setBrowseOpen(true);
  };
  const toggleBrowse = () => { if (browseOpen) setBrowseOpen(false); else openBrowse(); };
  /* "search here": plant the browsed path into the root input, remember it, close. */
  const searchHere = () => {
    const p = browsePath;
    onRoot(p); setRoots(pushRoot(vm, p));
    setBrowseOpen(false); setRecentsOpen(false);
  };

  /* Result counts for the status strip — shape depends on which op produced res. */
  const counts = () => {
    if (!res) return "";
    const d = res.data || {};
    if (res.op === "grep") {
      const files = Array.isArray(d.results) ? d.results : [];
      const hits = files.reduce((n, f) => n + (Array.isArray(f.lines) ? f.lines.length : 0), 0);
      return files.length + " file" + (files.length === 1 ? "" : "s") + " · " + hits + " hit" + (hits === 1 ? "" : "s");
    }
    if (res.op === "collect") { const n = (d.files || []).length; return n + " file" + (n === 1 ? "" : "s"); }
    if (res.op === "view") {
      const spans = Array.isArray(d.spans) ? d.spans : [];
      const n = spans.reduce((a, s) => a + (Array.isArray(s.lines) ? s.lines.length : 0), 0);
      return n + " line" + (n === 1 ? "" : "s") + " · " + spans.length + " span" + (spans.length === 1 ? "" : "s");
    }
    if (res.forName) { const n = (d.files || []).length; return n + " file" + (n === 1 ? "" : "s") + " · imports " + res.forName; }
    const n = (d.imports || []).length; return n + " import" + (n === 1 ? "" : "s");
  };

  // ---- result renderers (one per op) --------------------------------------
  const renderGrep = (d) => {
    const results = Array.isArray(d.results) ? d.results : [];
    if (!results.length) return html`<div className="search-empty">no matches</div>`;
    let shown = 0, moreFiles = 0;                  // cap the TOTAL hit rows, not just the file count
    const groups = [];
    for (const f of results) {
      const lines = Array.isArray(f.lines) ? f.lines : [];
      if (shown >= SEARCH_CAP) { moreFiles++; continue; }
      const take = lines.slice(0, SEARCH_CAP - shown);
      shown += take.length;
      groups.push({ path: f.file_path, take, total: lines.length });
    }
    return html`
      ${groups.map(g => {
        const open = !collapsed[g.path];
        const hidden = g.total - g.take.length;
        return html`
          <div key=${g.path} className="search-file">
            <div className="search-file-head" onClick=${() => toggle(g.path)} title=${g.path}>
              <span className="search-file-caret">${open ? "▾" : "▸"}</span>
              <span className="search-file-path">${g.path}</span>
              <span className="search-file-count">${g.total}</span>
            </div>
            ${open && g.take.map((ln, k) => html`
              <div key=${k} className="search-hit" title=${ln.content}>
                <span className="search-hit-ln">${ln.line}</span>
                <span className="search-hit-tx">${searchMark(ln.content, text)}</span>
              </div>`)}
            ${open && hidden > 0 && html`<div className="search-hit-more">…and ${hidden} more in this file</div>`}
          </div>`;
      })}
      ${moreFiles > 0 && html`<div className="search-more">…and ${moreFiles} more file${moreFiles === 1 ? "" : "s"} — narrow the search</div>`}`;
  };
  const renderPaths = (files, emptyMsg) => {
    if (!files.length) return html`<div className="search-empty">${emptyMsg}</div>`;
    const shown = files.slice(0, SEARCH_CAP);
    return html`
      ${shown.map((f, k) => {
        const p = typeof f === "string" ? f : (f && f.path) || "";
        const m = (f && typeof f === "object") ? f : null;   // collect --meta -> {path,mtime,size}
        return html`<div key=${k} className="search-path" title=${p}>${
          m && (m.size != null || m.mtime != null) ? html`<span className="search-file-count">${
            m.size != null ? fmtBytes(m.size) : ""}${m.size != null && m.mtime != null ? " · " : ""}${
            m.mtime != null ? fmtAgo(m.mtime) : ""}</span> ` : ""}${p}</div>`;
      })}
      ${files.length > SEARCH_CAP && html`<div className="search-more">…and ${files.length - SEARCH_CAP} more — narrow the search</div>`}`;
  };
  const renderImports = (d) => {
    if (res.forName)
      return html`
        <div className="search-for">files importing <b>${res.forName}</b></div>
        ${renderPaths(Array.isArray(d.files) ? d.files : [], "nothing imports " + res.forName)}`;
    const imps = Array.isArray(d.imports) ? d.imports : [];
    if (!imps.length) return html`<div className="search-empty">no imports found</div>`;
    const shown = imps.slice(0, SEARCH_CAP);
    return html`
      <div className="search-hint-line">click an import to see which files use it</div>
      <div className="search-chips">
        ${shown.map((im, k) => html`<button key=${k} className="search-chip"
                  title=${"who imports " + im} onClick=${() => runFor(im)}>${im}</button>`)}
      </div>
      ${imps.length > SEARCH_CAP && html`<div className="search-more">…and ${imps.length - SEARCH_CAP} more — narrow the search</div>`}`;
  };
  /* view: render finder's read_span contract — one file, explicit line ranges.
     Each span's lines show line#+content (full, not truncated — see .search-view
     CSS); a gap marker sits between non-contiguous spans. An error (bad file, or
     a VM whose abstract_search predates read_span) shows in drawer style. */
  const renderView = (d) => {
    if (d.error) return html`<div className="search-empty">${d.error}</div>`;
    const spans = Array.isArray(d.spans) ? d.spans : [];
    if (!spans.length) return html`<div className="search-empty">no lines${
      d.total ? " in range — file has " + d.total : ""}</div>`;
    return html`
      <div className="search-view search-file">
        <div className="search-file-head" title=${d.path}>
          <span className="search-file-path">${d.path}</span>
          <span className="search-file-count">${d.total} ln</span>
        </div>
        ${spans.map((sp, si) => html`
          ${si > 0 && html`<div key=${"g" + si} className="search-view-gap">⋯</div>`}
          ${(Array.isArray(sp.lines) ? sp.lines : []).map((ln, k) => html`
            <div key=${si + "-" + k} className="search-hit">
              <span className="search-hit-ln">${ln.line}</span>
              <span className="search-hit-tx">${searchMark(ln.content, text)}</span>
            </div>`)}`)}
      </div>`;
  };
  const renderRes = () => {
    const d = res.data || {};
    if (res.op === "grep") return renderGrep(d);
    if (res.op === "collect") return renderPaths(Array.isArray(d.files) ? d.files : [], "no files");
    if (res.op === "view") return renderView(d);
    return renderImports(d);
  };
  /* 📁 browse panel: breadcrumb + [hidden] toggle, the current path's subdir rows
     (loading/error in drawer style), and a "search here" action. */
  const renderBrowse = () => {
    const entry = dirCache[dirKey(browsePath, browseHidden)] || { loading: true };
    // crumbs above the locus home aren't browsable (the backend fences roots there)
    const crumbs = pathCrumbs(browsePath).filter(c => !lhome || c.path === lhome || c.path.startsWith(lhome + "/"));
    return html`
      <div className="search-browse">
        <div className="search-browse-head">
          <div className="search-crumbs">
            ${crumbs.map((c, k) => html`
              ${k > 0 && html`<span key=${"s" + k} className="search-crumb-sep">/</span>`}
              <button key=${k} className="search-crumb" type="button" title=${c.path}
                      disabled=${k === crumbs.length - 1}
                      onClick=${() => setBrowsePath(c.path)}>${c.label}</button>`)}
          </div>
          <label className="search-browse-hidden" title="include hidden dirs (op:dirs no_add)">
            <input type="checkbox" checked=${browseHidden} onChange=${() => setBrowseHidden(v => !v)} /> hidden</label>
        </div>
        <div className="search-browse-list">
          ${entry.loading && html`<div className="search-empty">loading…</div>`}
          ${entry.error && html`<div className="search-browse-err">${entry.error}</div>`}
          ${entry.dirs && entry.dirs.length === 0 && html`<div className="search-empty">no subdirectories</div>`}
          ${entry.dirs && entry.dirs.map((dpath, k) => html`
            <button key=${k} className="search-browse-row" type="button" title=${dpath}
                    onClick=${() => setBrowsePath(dpath)}>📁 ${baseName(dpath)}</button>`)}
          ${/* p513: files in this dir (backend op:"dirs" now returns them too) — a
                click opens the file through the existing op:"view" path (openPush). */""}
          ${entry.files && entry.files.map((fpath, k) => html`
            <button key=${"f" + k} className="search-browse-row" type="button" title=${fpath}
                    onClick=${() => openPush({ path: fpath })}>📄 ${baseName(fpath)}</button>`)}
        </div>
        <div className="search-browse-foot">
          <span className="search-browse-path" title=${browsePath}>${browsePath}</span>
          <button className="btn" type="button" onClick=${searchHere}>search here</button>
        </div>
      </div>`;
  };

  return html`
    <div className="design-panel search-panel">
      <div className="search-bar">
        <b>🔍 search — ${vm}</b>
        <span className="search-spacer"></span>
        <button className="search-cancel" title="widen / narrow this column"
                onClick=${() => setRcMode(rcCycle())}>${RC_LABEL[rcMode]}</button>
      </div>
      <div className="search-query">
        <select className="search-mode" value=${mode} title="what to search for"
                onChange=${(e) => onMode(e.target.value)}>
          <option value="grep">grep</option>
          <option value="files">files</option>
          <option value="imports">imports</option>
          <option value="view">view</option>
        </select>
        <input className="search-text" placeholder=${SEARCH_PH[mode]} value=${text}
               onInput=${(e) => setText(e.target.value)} onKeyDown=${onKey} />
        <div className="search-root-wrap">
          <div className="search-root-row">
            <input className="search-root" placeholder=${(lhome ? "root under " + lhome : "/abs/root") + " — remembered per locus"} value=${root}
                   title="root path to search (remembered per VM)"
                   onInput=${(e) => onRoot(e.target.value)} onKeyDown=${onKey} />
            <button className=${"search-root-recent" + (recentsOpen ? " on" : "")} type="button"
                    disabled=${!roots.length} title="recent roots" onClick=${toggleRecents}>▾</button>
            <button className=${"search-root-browse" + (browseOpen ? " on" : "")} type="button"
                    title="browse directories" onClick=${toggleBrowse}>📁</button>
          </div>
          ${recentsOpen && roots.length > 0 && html`
            <div className="search-recents">
              ${roots.map((r, k) => html`<button key=${k} className="search-recent-row" type="button"
                        title=${r} onClick=${() => pickRoot(r)}>${r}</button>`)}
            </div>`}
          ${browseOpen && renderBrowse()}
        </div>
        <button className="btn" disabled=${busy} onClick=${() => run()}>${busy ? "…" : "go"}</button>
      </div>
      <div className="search-opts">
        ${mode === "grep" && html`
          <label title="every string must be in the file — unchecked → ANY string is enough (finder --any)">
            <input type="checkbox" checked=${allMatch} onChange=${() => setAllMatch(v => !v)} /> all strings must match</label>
          <input className="search-text" style=${{ flex: "1 1 80px", minWidth: 0 }} placeholder="ext — py,js" value=${fExt}
                 title="only files with these extensions (comma-sep)" onInput=${(e) => setFExt(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 80px", minWidth: 0 }} placeholder="exclude ext" value=${fExcludeExt}
                 title="skip files with these extensions" onInput=${(e) => setFExcludeExt(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 90px", minWidth: 0 }} placeholder="dir names" value=${fDir}
                 title="only descend into dirs matching these names (--dir)" onInput=${(e) => setFDir(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 90px", minWidth: 0 }} placeholder="exclude dir" value=${fExcludeDir}
                 title="prune these dir subtrees (--exclude-dir)" onInput=${(e) => setFExcludeDir(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 100px", minWidth: 0 }} placeholder="path glob" value=${fPattern}
                 title="only paths matching this glob (--pattern)" onInput=${(e) => setFPattern(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 110px", minWidth: 0 }} placeholder="exclude path glob" value=${fExcludePattern}
                 title="drop paths matching this glob (--exclude-pattern)" onInput=${(e) => setFExcludePattern(e.target.value)} onKeyDown=${onKey} />`}
        ${(mode === "grep" || mode === "files") && html`
          <label title="raw: skip finder's default excludes (node_modules, __pycache__, media…) — sends no_add">
            <input type="checkbox" checked=${raw} onChange=${() => setRaw(v => !v)} /> raw</label>
          <label title="only the immediate level of the root — don't recurse (no_recursive)">
            <input type="checkbox" checked=${nonRec} onChange=${() => setNonRec(v => !v)} /> non-recursive</label>`}
        ${mode === "files" && html`
          <input className="search-text" style=${{ flex: "1 1 140px", minWidth: 0 }}
                 placeholder="exclude dirs — comma-sep, pruned" value=${excludeDir}
                 title="directory names to PRUNE — subtree is never walked (the speed lever)"
                 onInput=${(e) => setExcludeDir(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 90px", minWidth: 0 }}
                 placeholder="after (date)" value=${after}
                 title="modified after — any find date, e.g. 2026-07-01 or '7 days ago'"
                 onInput=${(e) => setAfter(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 90px", minWidth: 0 }}
                 placeholder="before (date)" value=${before} title="modified up to this date"
                 onInput=${(e) => setBefore(e.target.value)} onKeyDown=${onKey} />
          <label title="sort order">sort
            <select value=${sortKey} onChange=${(e) => setSortKey(e.target.value)}>
              <option value="name">name</option><option value="mtime">date</option><option value="size">size</option>
            </select></label>
          <label title="reverse — newest / biggest first"><input type="checkbox" checked=${reverse}
            onChange=${() => setReverse(v => !v)} /> reverse</label>
          <input className="search-text" style=${{ flex: "1 1 80px", minWidth: 0 }} placeholder="exclude ext" value=${fExcludeExt}
                 title="skip these extensions (--exclude-ext)" onInput=${(e) => setFExcludeExt(e.target.value)} onKeyDown=${onKey} />
          <label title="entry type (--type)">type
            <select value=${fType} onChange=${(e) => setFType(e.target.value)}>
              <option value="">any</option><option value="f">file</option><option value="d">dir</option><option value="l">link</option>
            </select></label>
          <input className="search-text" style=${{ flex: "1 1 70px", minWidth: 0 }} placeholder="min size" value=${fMinSize}
                 title="minimum size (--min-size)" onInput=${(e) => setFMinSize(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 70px", minWidth: 0 }} placeholder="max size" value=${fMaxSize}
                 title="maximum size (--max-size)" onInput=${(e) => setFMaxSize(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 60px", minWidth: 0 }} placeholder="limit" value=${fLimit}
                 title="cap number of results (--limit)" onInput=${(e) => setFLimit(e.target.value)} onKeyDown=${onKey} />
          <input className="search-text" style=${{ flex: "1 1 70px", minWidth: 0 }} placeholder="max depth" value=${fMaxDepth}
                 title="max recursion depth (--maxdepth)" onInput=${(e) => setFMaxDepth(e.target.value)} onKeyDown=${onKey} />`}
        ${mode === "imports" && html`<span className="search-opt-none">python only · blank searches the full import map</span>`}
        ${mode === "view" && html`<span className="search-opt-none">one file · line ranges like 100-140,200-210 · blank = whole file</span>
          <input className="search-text" style=${{ flex: "2 1 180px", minWidth: 0 }}
                 placeholder="🧠 prompt — distil this file against…" value=${kPrompt}
                 title="feed-to-keeper: what the LOCAL keeper should distil this file against (compact keeper-ask)"
                 onInput=${(e) => setKPrompt(e.target.value)} />
          <input className="search-text" style=${{ flex: "1 1 120px", minWidth: 0 }}
                 placeholder="tags — todo:k51,category:…" value=${kTags}
                 title="file-tags riding the request — the local-keeper routes/stores by tag; todo:<id> links the feed item to a board item"
                 onInput=${(e) => setKTags(e.target.value)} />
          <button className="btn" disabled=${kBusy}
                  title="send the file in the root box + this prompt to the VM's local-keeper; the distilled categorized feed lands in 📡 feed — the expensive keeper never reads the bytes"
                  onClick=${compactToKeeper}>${kBusy ? "…" : "🧠 compact"}</button>`}
      </div>
      <div className="search-list">
        ${mode === "view" && pushes.length > 0 && html`
          <div className="search-pushed">
            <div className="search-hint-line">📌 pushed by agent / local-keeper — click to view
              <button className="search-cancel" style=${{ marginLeft: 6 }} onClick=${clearPushes}>clear</button></div>
            ${pushes.slice().reverse().map((p, k) => html`
              <button key=${p.id || k} className="search-chip" style=${{ display: "block", width: "100%", textAlign: "left", marginBottom: "3px" }}
                      title=${p.path + (p.lines ? " :" + p.lines : "")} onClick=${() => openPush(p)}>
                ${p.label ? p.label + " — " : ""}${baseName(p.path)}${p.lines ? " :" + p.lines : ""}</button>`)}
          </div>`}
        ${busy && html`<div className="search-empty">searching…</div>`}
        ${!busy && err && html`
          <div className="search-err search-err-banner">
            <div><b>${err.msg}</b></div>
            ${err.status === 409 && html`<div className="search-err-hint">start ${vm} to search it</div>`}
            <button className="btn" style=${{ marginTop: 8 }} onClick=${() => run()}>↻ retry</button>
          </div>`}
        ${!busy && !err && res && renderRes()}
        ${!busy && !err && !res && html`<div className="search-empty">enter a query and hit go</div>`}
      </div>
      <div className=${"search-status" + (noteErr ? " err" : "") + (busy ? " busy" : "")}>
        ${busy ? "searching…" : (note || counts())}
        ${busy && html`<button className="search-cancel" title="abort the in-flight search" onClick=${cancel}>✕ cancel</button>`}
      </div>
    </div>`;
}

/* ─── 📡 feed drawer (roadmap 2.2 — the categorized pointer feed) ─────────────
   Renders the VM's keeper-ask spool (~/.keeper-bus) as click-to-expand rows.
   The listing (bus-list) and single-item fetch (bus-get) ride the existing
   /keeper-ask route as console-plane types: the browser reads the bytes, so
   the operator consumes feeds at ZERO LLM cost. A compact feed's items are
   themselves pointers (ref + optional line + one-line note); 📌 pushes one
   onto the view-push queue for the 🔍 view tab to render. */
const FEED_TYPE_ICON = { compact: "🧠", "next-todo": "☑", bookmark: "🔖",
                         view: "📄", grep: "📄", collect: "📄" };

      ? " — " + (row.categories || []).length + " cat · " + row.n_items + " items" : "");
  if (row.type === "next-todo")

    if (!quiet) { setBusy(true); setErr(null); }
    return api("/api/vm/" + vm + "/keeper-ask", { method: "POST",

    load();
    const pid = setInterval(() => { if (document.visibilityState !== "hidden") load(true); }, 15000);
    return () => clearInterval(pid);

  useEffect(() => {
    if (tab !== "events") return;

    return () => clearInterval(pid);

  const toggle = (id) => {

    if (files.length) return html`
      ${files.slice(0, 40).map((f, k) => {

        return html`<div key=${k} className="feed-ptr">

  const evRows = tab !== "events" ? [] : (() => {

        <button className=${"search-chip" + (tab === "events" ? " on" : "")}

                onClick=${() => setTab("events")}>⏱ events</button>

        <div className="search-list">

/* ─── 📖 docs drawer (board t27) ──────────────────────────────────────────────

   (docs/UI-GUIDE.md, docs/KEEPER-DEV-GUIDE.md — promoted via deploy-manifest.txt,
   fetched same-origin under the console's own auth). The renderer builds React
   ELEMENTS ONLY: it never touches innerHTML / dangerouslySetInnerHTML, so React
   escapes every scrap of doc text and a stray <script> or a javascript: URL comes
   out as literal, inert text. Any syntax the little grammar doesn't recognise

   #dev) — open http://127.0.0.1:8899/?dev=1 as a second, dev console; the
   window the operator is chatting in never reloads out from under them. The
   /static/ route (aiohttp StaticResource) answers HEAD with Last-Modified, so
   no backend endpoint — and no restart — is needed. tmux-backed seats survive

    try {
      const r = await fetch("/static/index.html", { method: "HEAD", cache: "no-store" });
      const lm = r.ok && (r.headers.get("Last-Modified") || r.headers.get("ETag"));
      if (!lm) return;
      if (base === null) base = lm;

})();
// Shell title carries the version (the Electron titlebar and browser tab both

fetch("/api/about").then(r => r.ok ? r.json() : null).then(a => {
  if (a && a.version && a.version !== "unknown") document.title = `hugpy Station ${a.version}`;
}).catch(() => { /* backend restarting — title stays plain */ });
const MD_DOCS = { using: "UI-GUIDE.md", tools: "STATION-TOOLS.md",  // 1.0.85: toolserver tools guide
                  terms: "NOMENCLATURE.md", fleet: "FLEET-OPS-GUIDE.md",
                  keeper: "KEEPER-DEV-GUIDE.md", sop: "TODO-BOARD-SOP.md",
                  format: "BOARD-ITEM-FORMAT.md",   // 1.0.144: operator items + proposals shape
                  arb: "QUERY-ARBITRATION-SOP.md",
                  seat: "SEAT-CONTROL.md",

                  handoff: "KEEPER-HANDOFF-ORACLE.md" };

    else if (m[2]) out.push(html`<strong key=${i++}>${mdInline(tok.slice(2, -2))}</strong>`);
    else if (m[3]) out.push(html`<em key=${i++}>${mdInline(tok.slice(1, -1))}</em>`);

  const blockStart = (l) =>
    l.trim() === "" || /^```/.test(l.trim()) || /^#{1,3}\s/.test(l) ||
    /^>\s?/.test(l) || /^\s*-\s+/.test(l) || /^---+$/.test(l.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line.trim())) {                  // fenced code — raw, never inline-parsed
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;                                            // closing fence (or EOF)
      nodes.push(html`<${MdPre} key=${k++} code=${buf.join("\n")} />`);
      continue;
    }
    if (line.trim() === "") { i++; continue; }
    if (/^---+$/.test(line.trim())) { nodes.push(html`<hr key=${k++} className="md-hr" />`); i++; continue; }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) {
      const level = h[1].length, txt = h[2].trim(), id = mdSlug(txt, seen);
      headings.push({ level, text: txt, id });
      const Tag = "h" + level;
      nodes.push(html`<${Tag} key=${k++} id=${id} className=${"md-h md-h" + level}>${mdInline(txt)}<//>`);
      i++; continue;
    }
    if (/^>\s?/.test(line)) {                         // blockquote (one level)
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      nodes.push(html`<blockquote key=${k++} className="md-quote">${mdInline(buf.join(" "))}</blockquote>`);
      continue;
    }
    if (/^\s*-\s+/.test(line)) {                      // unordered list
      const items = [];
      while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
        const m = /^(\s*)-\s+(.*)$/.exec(lines[i++]);
        items.push({ sub: m[1].length >= 2, text: m[2] });
      }
      nodes.push(mdList(items, k++));
      continue;
    }
    const buf = [line]; i++;                          // paragraph: soft-wrapped lines join with a space
    while (i < lines.length && !blockStart(lines[i])) buf.push(lines[i++]);
    nodes.push(html`<p key=${k++} className="md-p">${mdInline(buf.join(" "))}</p>`);
  }
  return { nodes, headings };
}

function DocsBody({ src }) {
  const { nodes, headings } = mdRender(src);
  // TOC scroll-to: getElementById is safe because exactly one doc is mounted at a
  // time, and scrollIntoView bubbles up to the .docs-body scroll container.
  const jump = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };
  return html`<div className="docs-content">
    ${headings.length > 1 && html`<nav className="docs-toc">
      <div className="docs-toc-title">on this page</div>
      ${headings.map(h => html`<button key=${h.id} className=${"docs-toc-link l" + h.level}
               title=${h.text} onClick=${() => jump(h.id)}>${h.text}</button>`)}
    </nav>`}
    <div className="md">${nodes}</div>
  </div>`;
}

function DocsDrawer() {
  const [tab, setTab] = useState("using");          // "using" (UI-GUIDE) | "keeper" (KEEPER-DEV-GUIDE)
  const [docs, setDocs] = useState({});             // tab -> {loading} | {text} | {error}
  const load = useCallback((t) => {
    // keep any already-shown text while refreshing so a refetch never blanks the page
    setDocs(d => ({ ...d, [t]: { ...(d[t] || {}), loading: true, error: false } }));
    fetch("/docs/" + MD_DOCS[t] + "?v=" + Date.now())
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(text => setDocs(d => ({ ...d, [t]: { text } })))
      .catch(() => setDocs(d => ({ ...d, [t]: { ...(d[t] || {}), loading: false, error: true } })));
  }, []);
  // Refetch on every tab open (docs are edited live on disk — the old
  // fetch-once cache showed stale text); cached text stays visible meanwhile.
  useEffect(() => { load(tab); }, [tab]);
  // While a doc is open, watch its Last-Modified over the same /docs/ static
  // route and hot-refetch in place — edits appear without a window reload.
  useEffect(() => {
    let lm = null;
    const id = setInterval(async () => {
      try {
        const r = await fetch("/docs/" + MD_DOCS[tab], { method: "HEAD", cache: "no-store" });
        const v = r.ok && r.headers.get("Last-Modified");
        if (!v) return;
        if (lm === null) lm = v;
        else if (v !== lm) { lm = v; load(tab); }
      } catch { /* transient — keep watching */ }
    }, 2000);
    return () => clearInterval(id);
  }, [tab, load]);

  const cur = docs[tab] || {};
  return html`
    <div className="design-panel docs-panel">
      <div className="docs-bar"><b>📖 docs</b><span className="docs-spacer"></span></div>
      <div className="docs-tabs">
        <button className=${"docs-tab" + (tab === "using" ? " active" : "")}
                onClick=${() => setTab("using")}>using the console</button>
        <button className=${"docs-tab" + (tab === "tools" ? " active" : "")}
                onClick=${() => setTab("tools")}>station tools</button>
        <button className=${"docs-tab" + (tab === "terms" ? " active" : "")}
                onClick=${() => setTab("terms")}>nomenclature</button>
        <button className=${"docs-tab" + (tab === "fleet" ? " active" : "")}
                onClick=${() => setTab("fleet")}>fleet ops</button>
        <button className=${"docs-tab" + (tab === "keeper" ? " active" : "")}
                onClick=${() => setTab("keeper")}>keeper dev</button>
        <button className=${"docs-tab" + (tab === "sop" ? " active" : "")}
                onClick=${() => setTab("sop")}>board SOP</button>
        <button className=${"docs-tab" + (tab === "format" ? " active" : "")}
                onClick=${() => setTab("format")}>item format</button>
        <button className=${"docs-tab" + (tab === "arb" ? " active" : "")}
                onClick=${() => setTab("arb")}>arbitration SOP</button>
        <button className=${"docs-tab" + (tab === "seat" ? " active" : "")}
                onClick=${() => setTab("seat")}>seat control</button>
        <button className=${"docs-tab" + (tab === "cinema" ? " active" : "")}
                onClick=${() => setTab("cinema")}>🎬 cinema flow</button>
        <button className=${"docs-tab" + (tab === "method" ? " active" : "")}
                onClick=${() => setTab("method")}>vigilant method</button>
        <button className=${"docs-tab" + (tab === "handoff" ? " active" : "")}
                onClick=${() => setTab("handoff")}>oracle handoff</button>
      </div>
      <div className="docs-body">
        ${cur.loading && cur.text == null && html`<div className="docs-note">loading…</div>`}
        ${cur.error && html`<div className="docs-err docs-err-banner">
          <div><b>docs not deployed yet — promote a build that ships docs/</b></div>
          <button className="btn" style=${{ marginTop: 8 }} onClick=${() => load(tab)}>↻ retry</button>
        </div>`}
        ${cur.text != null && html`<${DocsBody} src=${cur.text} />`}
      </div>
    </div>`;
}

/* ─── 🗄 db drawer (1.0.85) ───────────────────────────────────────────────────
   A read-only window onto the central toolserver database (Postgres behind
   toolserver.hugpy.ai) through the station's gated /ts/db proxy: db/tables,
   db/columns and db/query — the toolserver itself refuses anything but
   SELECT/WITH, and the drawer guards the same rule client-side so a typo never
   even leaves the window. Like 📖 docs it is NOT per-locus (the db is one shared
   thing), so its dock button and render slot carry no active-VM gate. Every
   cell is a React element built from the row value — no innerHTML — so db text
   is escaped exactly like doc text is. Table names are interpolated ONLY after
   matching DB_IDENT_RE, and always double-quoted. */
const DB_IDENT_RE = /^[a-z_][a-z0-9_]*$/;
const DB_LAST_QUERY_KEY = "hs.db.lastQuery";
const DB_MAX_ROWS = 500;                          // grid cap — the proxy answer may be larger
const DB_CELL_MAX = 200;                          // chars shown per cell; the full text rides on title=
const dbPost = (name, body) =>
  fetch("/ts/db/" + name, { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(body || {}) })
    .then(async r => {
      let d = null;
      try { d = await r.json(); } catch (_) { /* non-JSON body (proxy down, html error page) */ }
      // the toolserver AND the proxy both speak {"error": "..."} — surface it verbatim,
      // whatever the status (an old backend answers 403 {"error":"path not allowed via /ts"})
      if (d && d.error) throw new Error(String(d.error));
      if (!r.ok) throw new Error("HTTP " + r.status);
      return d;
    });
const dbRows = (d) => (d && Array.isArray(d.result)) ? d.result : [];
const dbErr = (e) => (e && e.message) || String(e);
// a cell: null → dimmed ∅; objects (jsonb columns) → JSON; everything else String(), clipped
const dbCell = (v) => {
  if (v === null || v === undefined) return html`<span className="db-null">∅</span>`;
  const s = typeof v === "object" ? JSON.stringify(v) : String(v);
  return s.length > DB_CELL_MAX ? html`<span title=${s}>${s.slice(0, DB_CELL_MAX)}…</span>` : s;
};
const DB_GRID_KEY = "hs.db.grid";                 // p512: per-table {widths,order,sort} view state
const dbFull = (v) => v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
/* p512: the result grid is interactive — click a header to sort (asc→desc→none),
   click a row to expand a full-value detail panel with per-column ⧉ copy, drag
   the header right edge to resize, drag a header to reorder. {widths,order,sort}
   persist in localStorage keyed by table + column-set (so a new query starts
   clean, but re-opening the same table restores the operator's layout). */
function DbGrid({ rows, name }) {
  if (!rows.length) return html`<div className="docs-note">no rows</div>`;
  const cols = Object.keys(rows[0]);               // canonical column set = the first row's keys
  const pkey = DB_GRID_KEY + ":" + (name || "?") + ":" + cols.join("|");
  const loadState = () => { try { return JSON.parse(localStorage.getItem(pkey) || "{}") || {}; } catch (_) { return {}; } };
  const okOrder = (o) => Array.isArray(o) && o.length === cols.length && cols.every(c => o.indexOf(c) >= 0);
  const s0 = loadState();
  const [sort, setSort] = useState(() => s0.sort || { col: null, dir: 0 });   // dir: 1 asc, -1 desc, 0 none
  const [widths, setWidths] = useState(() => s0.widths || {});
  const [order, setOrder] = useState(() => okOrder(s0.order) ? s0.order : cols.slice());
  const [sel, setSel] = useState(null);            // expanded row index (within the sorted view) or null
  const [dragCol, setDragCol] = useState(null);
  const resizing = React.useRef(false);
  // resync to the persisted layout whenever the table / column-set changes (pkey)
  useEffect(() => {
    const s = loadState();
    setSort(s.sort || { col: null, dir: 0 });
    setWidths(s.widths || {});
    setOrder(okOrder(s.order) ? s.order : cols.slice());
    setSel(null);
  }, [pkey]);
  useEffect(() => { try { localStorage.setItem(pkey, JSON.stringify({ widths, order, sort })); } catch (_) {} }, [pkey, widths, order, sort]);

  const shown = rows.slice(0, DB_MAX_ROWS);
  const sorted = useMemo(() => {
    if (!sort.col || !sort.dir) return shown;
    const c = sort.col, dir = sort.dir;
    const arr = shown.map((r, i) => [r, i]);       // decorate with index → stable sort
    arr.sort((A, B) => {
      const a = A[0][c], b = B[0][c];
      const an = a === null || a === undefined, bn = b === null || b === undefined;
      if (an && bn) return A[1] - B[1];
      if (an) return 1;                            // nulls last, regardless of direction
      if (bn) return -1;
      const na = Number(a), nb = Number(b);
      let cmp;
      if (Number.isFinite(na) && Number.isFinite(nb) && a !== "" && b !== "") cmp = na - nb;
      else { const sa = String(a), sb = String(b); cmp = sa < sb ? -1 : sa > sb ? 1 : 0; }
      return cmp === 0 ? A[1] - B[1] : dir * cmp;
    });
    return arr.map(x => x[0]);
  }, [shown, sort.col, sort.dir]);

  const cycleSort = (c) => { setSel(null); setSort(s => s.col !== c ? { col: c, dir: 1 } : s.dir === 1 ? { col: c, dir: -1 } : { col: null, dir: 0 }); };
  const mark = (c) => sort.col === c ? (sort.dir === 1 ? " ▲" : sort.dir === -1 ? " ▼" : "") : "";
  const startResize = (c) => (e) => {              // pointer idiom (see PromptPanel onDrag)
    e.preventDefault(); e.stopPropagation();
    resizing.current = true;
    const th = e.target.closest("th");
    const x0 = e.clientX, w0 = widths[c] || (th ? th.offsetWidth : 120);
    const mv = (ev) => setWidths(w => ({ ...w, [c]: Math.max(40, Math.round(w0 + (ev.clientX - x0))) }));
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); setTimeout(() => { resizing.current = false; }, 0); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  };
  const onDrop = (target) => (e) => {
    e.preventDefault();
    const src = dragCol; setDragCol(null);
    if (!src || src === target) return;
    setOrder(o => { const a = o.slice(), i = a.indexOf(src), j = a.indexOf(target); if (i < 0 || j < 0) return o; a.splice(i, 1); a.splice(j, 0, src); return a; });
  };
  const rowText = (r) => order.map(c => c + "\t" + dbFull(r[c])).join("\n");

  return html`<div className="db-grid"><table>
    <colgroup>${order.map(c => html`<col key=${c} style=${widths[c] ? { width: widths[c] + "px" } : undefined} />`)}</colgroup>
    <thead><tr>${order.map(c => html`<th key=${c} className=${widths[c] ? "db-sized" : ""} draggable=${true}
        onDragStart=${e => { if (resizing.current) { e.preventDefault(); return; } setDragCol(c); }}
        onDragOver=${e => e.preventDefault()} onDrop=${onDrop(c)}
        title="click: sort · drag: reorder · grab the right edge: resize"
        style=${{ cursor: "pointer" }} onClick=${() => cycleSort(c)}>${c}${mark(c)}<span className="db-grip"
          onClick=${e => e.stopPropagation()} onPointerDown=${startResize(c)}></span></th>`)}</tr></thead>
    <tbody>${sorted.flatMap((r, i) => {
      const isSel = sel === i;
      const main = html`<tr key=${"r" + i} className=${isSel ? "db-sel" : ""} style=${{ cursor: "pointer" }}
          onClick=${() => setSel(x => x === i ? null : i)}>
        ${order.map(c => html`<td key=${c} className=${widths[c] ? "db-sized" : ""}>${dbCell(r[c])}</td>`)}</tr>`;
      if (!isSel) return [main];
      const detail = html`<tr key=${"d" + i} className="db-detail"><td colSpan=${order.length}>
        <div className="db-detail-head"><b>row ${i + 1}</b>
          <button className="btn" style=${{ fontSize: 11, marginLeft: 8 }} onClick=${e => { e.stopPropagation(); copyText(rowText(r)); }}>⧉ copy row</button></div>
        <div className="db-detail-grid">${order.map(c => { const fv = dbFull(r[c]); return html`<div key=${c} className="db-detail-row">
          <span className="db-detail-k">${c}</span>
          <button className="db-detail-copy" title=${"copy " + c} onClick=${e => { e.stopPropagation(); copyText(fv); }}>⧉</button>
          <span className="db-detail-v">${fv === "" ? html`<span className="db-null">∅</span>` : fv}</span></div>`; })}</div>
      </td></tr>`;
      return [main, detail];
    })}</tbody>
  </table></div>`;
}
const dbCount = (r) => r.rows.length + " row" + (r.rows.length === 1 ? "" : "s")
  + (r.rows.length > DB_MAX_ROWS ? " (showing " + DB_MAX_ROWS + ")" : "") + " · " + r.ms + " ms";

function DbDrawer() {
  const [tab, setTab] = useState("tables");        // "tables" | "query"
  const [tables, setTables] = useState({ loading: true });   // {loading} | {names:[...]} | {error}
  const [picked, setPicked] = useState(null);      // table shown in the tables tab
  // name -> {cols:[{name,type}]|null, peek:{loading}|{rows,ms}|{error}} — keyed by
  // table (the DocsDrawer idiom) so a slow answer for A never lands under B's header
  const [info, setInfo] = useState({});
  const [query, setQuery] = useState(() => { try { return localStorage.getItem(DB_LAST_QUERY_KEY) || ""; } catch (_) { return ""; } });
  const [res, setRes] = useState(null);            // {loading} | {rows,ms} | {error}
  const loadTables = useCallback(() => {
    setTables(t => ({ ...t, loading: true, error: null }));
    dbPost("tables", {})
      .then(d => setTables({ names: dbRows(d) }))
      .catch(e => setTables(t => ({ ...t, loading: false, error: dbErr(e) })));
  }, []);
  useEffect(() => { loadTables(); }, [loadTables]);
  const patch = (name, p) => setInfo(m => ({ ...m, [name]: { ...(m[name] || {}), ...p } }));
  const pick = (name) => {
    if (!DB_IDENT_RE.test(name)) return;           // never interpolate anything odd
    setPicked(name);
    patch(name, { cols: null, peek: { loading: true } });
    dbPost("columns", { table_name: name })
      .then(d => patch(name, { cols: dbRows(d).map(c => typeof c === "string" ? { name: c, type: "" }
        : { name: c.name || c.column_name || "?", type: c.type || c.data_type || "" }) }))
      .catch(e => patch(name, { cols: [{ name: "columns: " + dbErr(e), type: "" }] }));
    const t0 = Date.now();
    dbPost("query", { query: `SELECT * FROM "${name}" ORDER BY 1 DESC LIMIT 50` })
      .then(d => patch(name, { peek: { rows: dbRows(d), ms: Date.now() - t0 } }))
      .catch(e => patch(name, { peek: { error: dbErr(e) } }));
  };
  const run = () => {
    const q = query.trim();
    if (!/^(select|with)\b/i.test(q)) { setRes({ error: "read-only: the query must start with SELECT or WITH" }); return; }
    try { localStorage.setItem(DB_LAST_QUERY_KEY, query); } catch (_) {}
    setRes({ loading: true });
    const t0 = Date.now();
    dbPost("query", { query: q })
      .then(d => setRes({ rows: dbRows(d), ms: Date.now() - t0 }))
      .catch(e => setRes({ error: dbErr(e) }));
  };
  const onKey = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); } };

  const cur = (picked && info[picked]) || {};
  return html`
    <div className="design-panel docs-panel">
      <div className="docs-bar"><b>🗄 db</b><span className="docs-spacer"></span>
        <a className="db-link" href="http://127.0.0.1:8771" target="_blank" rel="noopener"
           title="hugpy-dbview live viewer — only where it is installed">↗ dbview</a>
        <button className="btn" title="refresh the table list" onClick=${loadTables}>↻</button>
      </div>
      <div className="docs-tabs">
        <button className=${"docs-tab" + (tab === "tables" ? " active" : "")}
                onClick=${() => setTab("tables")}>tables</button>
        <button className=${"docs-tab" + (tab === "query" ? " active" : "")}
                onClick=${() => setTab("query")}>query</button>
      </div>
      <div className="docs-body">
        ${tab === "tables" && html`<div>
          ${tables.loading && !tables.names && html`<div className="docs-note">loading…</div>`}
          ${tables.error && html`<div className="docs-err docs-err-banner">
            <div><b>db/tables failed</b></div><div>${tables.error}</div>
            <button className="btn" style=${{ marginTop: 8 }} onClick=${loadTables}>↻ retry</button>
          </div>`}
          ${tables.names && html`<div className="db-tables">
            ${tables.names.map(n => html`<button key=${n} className=${"db-table-btn" + (picked === n ? " on" : "")}
                title=${"columns + the newest 50 rows of " + n} onClick=${() => pick(n)}>${n}</button>`)}
            ${!tables.names.length && html`<span className="db-status">no tables</span>`}
          </div>`}
          ${picked && html`<div className="db-cols"><b>${picked}</b>
            ${cur.cols == null ? html`<span className="db-status">columns…</span>`
              : cur.cols.map(c => html`<span key=${c.name} className="db-col">${c.name}${c.type && html`<em>${c.type}</em>`}</span>`)}
          </div>`}
          ${cur.peek && cur.peek.loading && html`<div className="docs-note">loading…</div>`}
          ${cur.peek && cur.peek.error && html`<div className="docs-err docs-err-banner">${cur.peek.error}</div>`}
          ${cur.peek && cur.peek.rows && html`<div>
            <div className="db-status" style=${{ marginBottom: 4 }}>newest 50 by column 1 · ${dbCount(cur.peek)}</div>
            <${DbGrid} rows=${cur.peek.rows} name=${picked} /></div>`}
        </div>`}
        ${tab === "query" && html`<div>
          <textarea className="db-sql" value=${query} onChange=${e => setQuery(e.target.value)} onKeyDown=${onKey}
                    spellCheck=${false} placeholder="SELECT locus, kind, status FROM loci ORDER BY updated DESC LIMIT 20"></textarea>
          <div className="db-hint">read-only SELECT/WITH · a literal % must be written %% (placeholder layer)</div>
          <div className="db-row">
            <button className="btn" title="run (Ctrl/⌘+Enter)" disabled=${!!(res && res.loading)} onClick=${run}>▶ run</button>
            ${res && res.rows && html`<span className="db-status">${dbCount(res)}</span>`}
          </div>
          ${res && res.loading && html`<div className="docs-note">running…</div>`}
          ${res && res.error && html`<div className="docs-err docs-err-banner">${res.error}</div>`}
          ${res && res.rows && html`<${DbGrid} rows=${res.rows} name="query" />`}
        </div>`}
      </div>
    </div>`;
}

/* ─── 🛡 session-steward drawer ───────────────────────────────────────────────
   The session steward is an in-VM daemon that, on a busy session, deliberately
   restarts the keeper at a QUIET moment with a written handoff — a controlled
   alternative to uncontrolled context compaction. This drawer is the operator's
   per-VM window onto it: it reads the steward's state and writes its config
   through the host route /api/vm/<vm>/steward. Like the 🔍 finder it degrades to
   a plain "not enabled" note when the route 404s (the operator installs it later),
   and it polls on a modest interval (visibility-gated, same idiom as the 🐞 bugs
   drawer) so the warning banner surfaces promptly.

   Route contract (build against this exactly):
     GET  → { state:<steward-state.v1>, config:<steward.v1> }
     POST { op:"config", mode, timeout_min[, threshold_bytes][, max_age_min] }
       → writes ~/steward.json. threshold_bytes (NEW route, vm-mgr-npm 06c955d /
       keeper-relay ec73186) and max_age_min (NEWEST route, t89) are both
       OPTIONAL-with-preserve: omitted ⇒ the stored value is kept; present ⇒ an
       int (bools rejected) — threshold_bytes in [50000, 4000000] bytes,
       max_age_min 0 (= off) or in [30, 10080] minutes — out of range → 400.
       An OLDER route fail-closes on ANY unrecognized key with 400
       "unsupported key(s) for config: <names>" (control-tested live for the
       t81 trio) — so postConfig retries ONCE by INTENT, dropping exactly the
       walled optional field(s): a mode/cadence/arm (or budget, when only
       max_age_min is walled) intent still lands; the walled field's OWN intent
       never retries, and applyWrite's verify-after-write keeps what's shown
       equal to what the host holds.
     POST { op:"extend", minutes:30 }        → writes the +30m hold (server caps 60m)
     POST { op:"reset" } (t89)               → pushes {"schema":"steward-request.v1",
       "op":"reset"} to ~/steward-request.json; the relay consumes it at-most-once
       and restarts the keeper at the first lull. An OLDER route answers 400
       "op must be config|extend" — surfaced as the honest not-yet-updated note. */
const STEWARD_POLL_MS = 5000;
const STEWARD_TIMEOUTS = [[30, "30m"], [60, "1h"], [120, "2h"], [240, "4h"]];
const STEWARD_TIMEOUT_SET = new Set([30, 60, 120, 240]);
// t89 max session age — the relay's time-ARM gate. 0 = off (a REAL value the
// route writes: it lets the console disable an env-set gate); the rest are
// minutes inside the backend's [30, 10080] validated range.
const STEWARD_MAX_AGES = [[0, "off"], [60, "1h"], [120, "2h"], [240, "4h"], [480, "8h"], [720, "12h"], [1440, "24h"]];
const STEWARD_MAX_AGE_SET = new Set(STEWARD_MAX_AGES.map(([v]) => v));
// off=inert · dry=detect+warn+write-handoff but never restart · on=LIVE restart
const STEWARD_MODES = [
  ["off", "off", "inert — the steward never restarts the keeper"],
  ["dry", "dry", "dry-run — detect a lull, warn, and write a handoff, but NEVER restart"],
  ["on",  "on",  "LIVE — the steward will actually restart this VM's keeper at a lull"],
];
const STEWARD_MODE_SET = new Set(["off", "dry", "on"]);
const stewardNum = (n) => (typeof n === "number" && isFinite(n)) ? n : null;
// bytes → "B / KB / MB"; a non-finite/absent value reads as an em dash, never 0
const stewardBytes = (n) => {
  const v = stewardNum(n);
  if (v === null || v < 0) return "—";
  if (v < 1024) return v + " B";
  // 2026-07-25: was .toFixed(1) at both scales, so a session sitting at 0.6 MB
  // showed NO movement until ~50 KB had accumulated — the operator typed and the
  // number stayed put. Bytes have far more resolution than one decimal; give the
  // display enough digits that a turn's growth is actually visible as it happens.
  if (v < 1024 * 1024) return (v / 1024).toFixed(2) + " KB";
  return (v / 1024 / 1024).toFixed(3) + " MB";
};
// a FUTURE epoch ts as a relative "in 12m" (past/absent → "now"/"—"); nowSec ticks 1s
const stewardWhen = (ts, nowSec) => {
  const v = stewardNum(ts);
  if (v === null) return "—";
  const s = v - nowSec;
  if (s <= 0) return "now";
  if (s < 60) return "in " + Math.round(s) + "s";
  if (s < 3600) return "in " + Math.round(s / 60) + "m";
  return "in " + (s / 3600).toFixed(1) + "h";
};
// a duration in SECONDS as "45s / 12m / 3.4h" — the stewardWhen scale without
// the "in" (these are elapsed/limit spans, not future targets); absent → em dash
const stewardDur = (sec) => {
  const v = stewardNum(sec);
  if (v === null || v < 0) return "—";
  if (v < 60) return Math.round(v) + "s";
  if (v < 3600) return Math.round(v / 60) + "m";
  return (v / 3600).toFixed(1) + "h";
};
// live "M:SS" countdown to a fire ts (clamped at 0); the banner's ticking clock
const stewardCountdown = (ts, nowSec) => {
  const v = stewardNum(ts);
  if (v === null) return "—";
  let s = Math.max(0, Math.round(v - nowSec));
  const m = Math.floor(s / 60); s -= m * 60;
  return m + ":" + String(s).padStart(2, "0");
};

/* session budget slider (board t81 part 2). The BACKEND's unit of truth is
   threshold_bytes (steward.v1, validated int in [MIN,MAX] — see the route contract
   above: the field is REQUIRED on every config write); the OPERATOR thinks in
   tokens out of a 1M budget, so the slider is bytes underneath and token-labelled
   on top, at a fixed ~4 bytes/token estimate. Always show the honest bytes figure
   alongside — the token number is explicitly flagged as an estimate, never
   presented as a measured value. */
const STEWARD_BYTES_PER_TOKEN = 4;
const STEWARD_THRESHOLD_MIN = 50000;                 // ~12.5k tokens
const STEWARD_THRESHOLD_MAX = 4000000;                // ~1M tokens
const STEWARD_THRESHOLD_DEFAULT = 300000;             // fallback when neither config nor state carries one
// a number the route's validator would accept as-is (in-range; ints only on the
// wire, but a float from a fixture still resolves — it's rounded before posting)
const stewardThrOk = (n) => { const v = stewardNum(n); return v !== null && v >= STEWARD_THRESHOLD_MIN && v <= STEWARD_THRESHOLD_MAX; };
/* RELAY LIVENESS. The host route only writes ~/steward-request.json; it cannot
   know whether the in-VM relay is alive to CONSUME it. So a reset pressed while
   the relay is down looked exactly like one that worked — which is what cost the
   operator six presses over six hours (18:03, 18:36 x2, 19:33, 20:13, 23:54).
   The relay rewrites steward-state.json every cycle (measured: a steady 15s), so
   a stale `ts` is the one honest down-signal available from outside the VM.
   6 missed cycles before we call it down: long enough that a slow cycle or a
   brief hiccup never cries wolf, short enough to catch a real outage before a
   second press. A state with NO ts is treated as unknown, not down — absent data
   must never be reported as a fault (same fail-safe posture as the relay's own
   steward helpers). */
const STEWARD_STALE_SEC = 90;
const stewardRelayAge = (st, nowSec) => {
  const ts = stewardNum(st && st.ts);
  if (ts === null) return null;                  // no ts → unknown, NOT down
  return Math.max(0, nowSec - ts);
};
const stewardRelayDown = (st, nowSec) => {
  const age = stewardRelayAge(st, nowSec);
  return age !== null && age > STEWARD_STALE_SEC;
};
/* MEASURED context tokens (steward-state.v1 `context_tokens`). The relay scrapes
   this out of the VM's own ~/.claude transcripts: each turn records the usage the
   MODEL reported, and input + cache_read + cache_creation is the context actually
   sent that turn. That is a measured number, not an inference — which matters,
   because the bytes→tokens estimate this drawer used to lead with is off by ~4x
   and, worse, the error VARIES ~4x between sessions (measured 2026-07-25:
   1.3 MB → 164k tok ≈ 126 tok/KB, but 0.03 MB → 15.4k tok ≈ 512 tok/KB). A byte
   threshold therefore fires on a lean session and spares a bloated one, so bytes
   can label the gate but must never be the headline number.

   1M is the ceiling the operator budgets against (this is a 1M-context station).
   An absent field → null, and every consumer degrades to the bytes estimate: an
   older relay that doesn't publish context_tokens must not blank the meter. */
const STEWARD_TOKEN_CAP = 1000000;
const stewardContextTokens = (st) => {
  const v = stewardNum(st && st.context_tokens);
  return v !== null && v >= 0 ? Math.round(v) : null;
};
// exact token count, thousands-separated — the measured figure is quoted in full
// rather than rounded, since unlike the estimate it has real precision to show.
const stewardTokenCount = (n) => {
  const v = stewardNum(n);
  return v === null || v < 0 ? "—" : Math.round(v).toLocaleString("en-US");
};
/* STALENESS. context_tokens is only as live as the transcript it was scraped from,
   so the honest question is "how long since THAT session was written".

   That is `context_tokens_age_sec` (relay, 2026-07-27) — NOT
   `live_transcript_age_sec`, which this first read and which means something else
   entirely: the age of the OLDEST transcript on disk ("how much history is the
   keeper still re-reading"). That value stays large while a session is perfectly
   healthy — measured on this box the same day, the oldest file was 44,513s old
   while the live session had been written 3 SECONDS earlier — so keying staleness
   off it flagged fresh data as stale permanently.

   Kept as a fallback ONLY for a relay too old to publish the new field, where a
   large oldest-age is at least weak evidence nothing is being written. A fresh
   relay never takes that path. Absent age → unknown, NOT stale (same fail-safe
   posture as relay liveness): missing data must never render as a fault. */
const STEWARD_TOKENS_STALE_SEC = 300;
const stewardTokensAge = (st) => {
  const fresh = stewardNum(st && st.context_tokens_age_sec);
  if (fresh !== null) return fresh;
  return stewardNum(st && st.live_transcript_age_sec);   // pre-2026-07-27 relay
};
const stewardTokensStale = (st) => {
  const age = stewardTokensAge(st);
  return age !== null && age > STEWARD_TOKENS_STALE_SEC;
};
// bytes → "~Nk tokens" / "~NM tokens" — always rounds, never claims false
// precision; the caller pairs this with stewardBytes() for the exact figure.
const stewardTokensLabel = (bytes) => {
  const v = stewardNum(bytes);
  if (v === null || v < 0) return "—";
  const tokens = v / STEWARD_BYTES_PER_TOKEN;
  if (tokens >= 1000000) return "~" + (Math.round(tokens / 100000) / 10) + "M tokens";
  const text = tokens >= 1000 ? (Math.round(tokens / 100) / 10) + "k" : Math.round(tokens).toString();
  return "~" + text + " tokens";
};
/* keeper-11: token_usage (steward-state relay ab75805) — the model's OWN usage
   records per class, live session vs whole-transcript-dir totals, refreshed
   each relay cycle. Normalized here so the drawer renders only what the relay
   actually published: an absent block or malformed live/total halves → null
   and the section simply doesn't mount (additive key — an older relay must
   not blank the drawer). Each class goes through stewardNum, so a negative or
   non-numeric value renders "—", never NaN. Pure + window-global for the
   harness, like the other steward helpers. */
function stewardTokUsage(st) {
  const tu = st && st.token_usage;
  if (!tu || typeof tu !== "object" || !tu.live || typeof tu.live !== "object"
          || !tu.total || typeof tu.total !== "object") return null;
  const cls = (o) => ({ output: stewardNum(o.output), input: stewardNum(o.input),
                        cache_write: stewardNum(o.cache_write), cache_read: stewardNum(o.cache_read),
                        calls: stewardNum(o.calls) });
  return { live: cls(tu.live), total: cls(tu.total), sessions: stewardNum(tu.sessions) };
}
/* Abbreviated count for the usage grid — cache_read runs to nine digits and a
   grid of full figures is unscannable. ≥10k abbreviates to k/M with one
   decimal; the EXACT figure rides in title= at every call site, so no
   precision is lost, only tucked away. */
function stewardTokAbbr(n) {
  const v = stewardNum(n);
  if (v === null || v < 0) return "—";
  if (v >= 1000000) return (Math.round(v / 100000) / 10) + "M";
  if (v >= 10000) return (Math.round(v / 100) / 10) + "k";
  return Math.round(v).toLocaleString("en-US");
}
// grid rows in render order. cheap: cache_read is the bulk-but-cheap class and
// input is negligible on a cached station — both render dim so the two paid
// classes (output, cache write) carry the visual weight the operator asked for.
const STEWARD_TOK_ROWS = [
  { key: "output",      label: "output",      cheap: false },
  { key: "cache_write", label: "cache write", cheap: false },
  { key: "cache_read",  label: "cache read",  cheap: true },
  { key: "input",       label: "input",       cheap: true },
  { key: "calls",       label: "calls",       cheap: true },
];
// clamp + integer-ize a threshold value to the backend's validated range, so a
// stray fixture/float/out-of-range value from state can never drive the slider
// (or a write) outside what the route will actually accept.
const stewardClampThreshold = (n) => {
  const v = stewardNum(n);
  const x = v === null ? STEWARD_THRESHOLD_DEFAULT : Math.round(v);
  return Math.min(STEWARD_THRESHOLD_MAX, Math.max(STEWARD_THRESHOLD_MIN, x));
};
// board k45 / operator 2026-07-31: the session-budget slider is REAL TOKENS now —
// the bar keeper_relay actually fires on (its STEWARD_THRESHOLD_TOKENS_LO/HI band,
// default 400k), NOT bytes shown as a ~4 B/tok estimate. The byte figure survives
// only as the secondary transcript-growth readout (which triggers nothing).
const STEWARD_TOKENS_MIN = 20000;
const STEWARD_TOKENS_MAX = 2000000;
const STEWARD_TOKENS_DEFAULT = 400000;
const stewardTokOk = (n) => { const v = stewardNum(n); return v !== null && v >= STEWARD_TOKENS_MIN && v <= STEWARD_TOKENS_MAX; };
const stewardClampTokens = (n) => {
  const v = stewardNum(n);
  const x = v === null ? STEWARD_TOKENS_DEFAULT : Math.round(v);
  return Math.min(STEWARD_TOKENS_MAX, Math.max(STEWARD_TOKENS_MIN, x));
};

/* Usage tracker per FRONTIER BACKEND (board t5, operator 2026-09-10): exact
   token counts, cost and prompt-cache timing from THAT seat's own transcript —
   GET /api/a/usage?backend=mct|claude-code (mct = the abstract-claude
   pointer-exchange session; claude-code = the keeper-claude seat itself).
   The budget is a per-backend localStorage number; the cost row turns red
   when over. showCache renders the cache line from the same doc (the
   claude-code section keeps its richer /api/frontier/cache readout instead). */
function UsageBlock({ backend, showCache }) {
  const [d, setD] = useState(null);
  const [err, setErr] = useState(null);
  const [nowS, setNowS] = useState(() => Math.floor(Date.now() / 1000));
  const bkey = "mct_budget" + (backend === "mct" ? "" : ":" + backend);
