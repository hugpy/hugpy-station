          <b>${r.tmux || r.locus}</b>${r.session_id ? " · " + String(r.session_id).slice(0, 8) : ""}${r.dir ? " · " + r.dir : ""}${r.live ? "" : " · not seated here"}</span>
        <button className="btn" disabled=${!r.live || !r.tmux} onClick=${e => attach(r, e)}>⇥ attach</button>
      </div>`)}
    </div>`}
  </span>`;
}

function FocusChip() {
  // Pinned "current focus" from the toolserver focus assessor (via the gated /ts
  // proxy) — the static reminder of what the operator is on. Hidden when the
  // toolserver is unreachable or nothing has been assessed yet.
  const [f, setF] = useState(null);
  useEffect(() => {
    let on = true;
    const go = () => fetch("/ts/assess/focus", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ locus: "" }),
    }).then(r => r.json()).then(d => { if (on) setF((d && d.result) || null); })
      .catch(() => { if (on) setF(null); });
    go(); const iv = setInterval(go, 120000);
    return () => { on = false; clearInterval(iv); };
  }, []);
  if (!f || !f.focus_summary) return null;
  const done = f.fulfilled === true || (f.item && f.item.status === "done");
  return html`<span className="stale"
    title=${(f.rationale || "") + (f.assessed_by ? (" — by " + f.assessed_by) : "")}
    style=${{ background: done ? "#12351f" : "#3a2d12",
              color: done ? "#3fb950" : "#d29922", cursor: "default" }}>
    🎯 ${f.focus_summary}${done ? " ✓" : ""}</span>`;
}

function App() {
  const [vms, setVms] = useState([]);
  const [active, setActive] = useState(null);
  /* 1.0.65: the locus chosen BEFORE the current one (fleetview-term's __fvVm.prev),
     for the ↩ button next to ⌂ host. Follows the terminal's own switch events. */
  const [prevLocus, setPrevLocus] = useState(null);
  useEffect(() => {
    const h = () => { try { const p = window.__fvVm && window.__fvVm.prev(); setPrevLocus(p === undefined ? null : (p || "@keeper")); } catch (_) {} };
    window.addEventListener("fv-vm", h); h();
    return () => window.removeEventListener("fv-vm", h);
  }, []);
  /* panes: "<vm>:<mode>" -> {vm, mode, nonce}. Keyed by (vm, mode), NOT by vm,
     because a VM's shell and its keeper are two different terminals and both
     must be able to exist at once. Keying by vm alone forced one iframe to
     serve both modes, so switching mode rewrote its src — a real navigation,
     which tore down the ttyd socket and threw away everything xterm.js had on
     screen. (tmux survived server-side; it was the browser's scrollback that
     was lost, which is why it "started anew".) Now each mode is its own pane
     and switching is a display toggle — the same thing that has always made
     switching VM TABS lossless.
     modes: vm -> which of its panes is on screen. Separate from `panes` so that
     hiding a mode never implies unmounting it. */
  const [panes, setPanes] = useState({});
  const [modes, setModes] = useState({});
  const [health, setHealth] = useState(null);
  const [keepers, setKeepers] = useState({});   // vm -> bool
  /* vm -> agents array, as ADVERTISED by the backend's /keeper response. Live
     console-api answers with no `agents` field (it only ever runs Claude), so
     this stays empty there and the single-button path below is the only one
     that ever renders — the chooser is capability-gated on the backend
     opting in, not on a build flag, so this file behaves identically against
     live and only lights up against a backend (e.g. the showroom) that
     advertises >1 agent. */
  const [keeperAgents, setKeeperAgents] = useState({});
  // vm -> which agent the GET said is live (d.agent), when the backend says.
  // A backend that advertises agents but omits this (e.g. an older reply)
  // leaves the entry undefined here — the switch control below treats that
  // as "unknown" and offers every advertised agent rather than hiding one.
  const [keeperAgentOf, setKeeperAgentOf] = useState({});
  /* vm -> {agent: {session, live, enabled, gateable}} from GET /keeper's additive
     `sessions` block. Undefined against a backend that predates it, which is the
     capability signal the per-agent controls fall back on. */
  const [keeperSessions, setKeeperSessions] = useState({});
  const [todoCounts, setTodoCounts] = useState({}); // vm -> {count, warn} open-work ticker; last known (never flaps to 0 on error)
  const [busy, setBusy] = useState({});         // vm -> verb in flight
  const [panel, setPanel] = useState("steward");  // side drawer: null | "design" | "todo" | "bugs" | "search" | "steward" | "studio" | "docs" | "db" — steward opens by default
  const [rcW, setRcW] = useState(rcCurrent());    // right-column width — static ⇔ control (salvaged from the per-drawer buttons)
  // Which VM group's ⏻ power tray is expanded (one at a time). Session-only.
  const [powerVm, setPowerVm] = useState(null);
  const [fleetErr, setFleetErr] = useState(null);  // /api/vms failed: tab strip is STALE
  const [healthErr, setHealthErr] = useState(null);// /api/health failed: footer is STALE
  const [lastOk, setLastOk] = useState(null);   // epoch ms of the last good fleet poll
  const [now, setNow] = useState(Date.now());
  const togglePanel = (p) => setPanel(cur => (cur === p ? null : p));
  /* A failed on the frontier terminal (fleetview-term's watch saw mct's
     failure banner): bring up the 💬 B chat so the operator has temporary
     inference to get answers / sort out what happened. The drawer seeds its
     own input from this event; nothing is auto-sent — inference stays an
     operator gesture. */
  useEffect(() => {
    const h = () => setPanel("bchat");
    window.addEventListener("fv-a-failed", h);
    return () => window.removeEventListener("fv-a-failed", h);
  }, []);
  /* The open-work ticker's write path (board t25): both the App poll below and the
     open drawer route through here, keyed by vm, so whichever has the fresher number
     wins without either clobbering the other's VM. Stable identity + a no-op guard so
     an unchanged summary never triggers a re-render. */
  const reportTodoCount = useCallback((vm, t) => {
    setTodoCounts(c => (c[vm] && c[vm].count === t.count && c[vm].warn === t.warn && c[vm].high === t.high
      ? c : { ...c, [vm]: t }));
  }, []);

  /* Live state from console-api. A failure here MUST be visible: the tab strip
     keeps rendering the last known power states, and a dot that says RUNNING
     when the console can no longer see the fleet is the exact lie this console
     must never tell. So no error is swallowed — each sets an explicit flag that
     the tab strip and footer render.
     (The old `.catch(() => fetch("vms.json"))` fallback is gone: vms.json is
     host-only, is NOT in deploy-manifest.txt, and GET /vms.json 404s — the
     branch could only ever swallow the error and keep the stale strip.) */
  const load = useCallback(() => {
    api("/api/vms")
      .then(d => { /* consolidation (operator 2026-08-27): console-api injects the
             local machine as a station named "keeper" — the SAME locus the ⌂
             host (@keeper) entry already is. One machine, ONE locus: drop the
             alias row; "keeper" survives on the wire (board alias) only. */
        /* 1.0.141: drop only the sidecar's injected local row (and this
           station's own names) — an ssh locus named "keeper" (vm_mgr's, seen
           from any other station) is a real, selectable locus. */
        setVms((d.vms || []).filter(v => !(v.name === "keeper" && v.kind !== "ssh") && !(v.name && isHostVm(v.name)))); setFleetErr(null); setLastOk(Date.now()); })
      .catch(e => setFleetErr(e.message || String(e)));
    api("/api/health")
      .then(d => { setHealth(d); setHealthErr(null); })
      .catch(e => setHealthErr(e.message || String(e)));
  }, []);
  useEffect(() => {
    load();
    // Gate on visibility: a backgrounded tab must not keep hammering an
    // lxc-backed backend. Refresh immediately when the operator comes back, so
    // the gating never costs freshness at the moment it is looked at.
    const id = setInterval(() => { if (document.visibilityState !== "hidden") load(); }, 8000);
    const onVis = () => { if (document.visibilityState === "visible") load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [load]);

  const blind = !!fleetErr;                       // console cannot see fleet state
  const offline = blind || !!healthErr;
  // The 1s clock behind "last update Ns ago" exists ONLY while blind — that is
  // the only time the number is worth watching. Healthy steady state runs no
  // timer at all and re-renders solely on the 8s poll.
  useEffect(() => {
    if (!blind) return;
    setNow(Date.now());
    const id = setInterval(() => { if (document.visibilityState !== "hidden") setNow(Date.now()); }, 1000);
    return () => clearInterval(id);
  }, [blind]);

  /* Keeper session status for the ACTIVE vm only (gates the toggle).
     Depends on the active VM's STATE STRING, not the `vms` array: setVms() built
     a new array identity every 8s, which tore this effect down and rebuilt it
     before its own 15s interval could ever fire — so /api/vm/<vm>/keeper was
     really being hit every 8s, and the old "cheap" comment was fiction. A string
     dep is stable across polls, so the 15s interval now actually survives to
     fire, and this still re-polls the instant the active VM's power state flips
     (which is the only reason `vms` was ever in here). */
  const activeState = active ? ((vms.find(v => v.name === active) || {}).state || null) : null;
  useEffect(() => {
    if (!active) return;
    let dead = false;
    const poll = () => {
      if (document.visibilityState === "hidden") return;
      api("/api/vm/" + active + "/keeper")
        .then(d => { if (dead) return;
                     setKeepers(k => ({ ...k, [active]: !!d.keeper }));
                     setKeeperAgents(a => ({ ...a, [active]: Array.isArray(d.agents) ? d.agents : [] }));
                     setKeeperAgentOf(a => ({ ...a, [active]: d.agent || null }));
                     /* Only record `sessions` when the backend actually sent it —
                        writing {} for an older backend would look like "this VM has
                        no agents" rather than "this backend can't say". */
                     setKeeperSessions(s => (d.sessions && typeof d.sessions === "object"
                                             ? { ...s, [active]: d.sessions } : s)); })
        .catch(() => {});                       // toggle-gating hint only; footer carries fleet truth
    };
    poll();
    const id = setInterval(poll, 15000);
    const onVis = () => { if (document.visibilityState === "visible") poll(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { dead = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [active, activeState]);

  /* OPEN-WORK TICKER (board t25): the ☑ toolbar button carries the ACTIVE vm's count
     of still-standing work, visible without opening the drawer. Poll ONLY the active
     VM's board — ~30s, visibility-gated exactly like the fleet/keeper polls, and
     immediately whenever the active VM (or its power state) changes. On any error keep
     the LAST known count (never flap to 0); a VM we've never fetched has no entry and
     shows no pill. While the drawer is open it writes the same todoCounts[active] every
     10s (reportTodoCount), so the button mirrors the drawer's fresher number.
     NOTE: active VM only — a whole-fleet ticker (a badge on every tab) is a separate
     future item, deliberately not this one (it would poll every VM's board on a loop). */
  useEffect(() => {
    if (!active) return;
    let dead = false;
    const poll = () => {
      if (document.visibilityState === "hidden") return;
      api("/api/vm/" + active + "/todo")
        .then(d => { if (!dead && d.ok && d.state) reportTodoCount(active, standingTicker(d.state.items || [], active)); })
        .catch(() => {});                        // keep last known — a stopped/blind VM must not flap the badge to 0
    };
    poll();
    const id = setInterval(poll, 30000);
    const onVis = () => { if (document.visibilityState === "visible") poll(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { dead = true; clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [active, activeState]);

  const stateOf = (name) => { const v = vms.find(x => x.name === name); return v ? v.state : null; };
  const homeOf = (name) => { const v = vms.find(x => x.name === name); return (v && v.home) || ""; };
  const isProtected = (name) => !!(health && health.protected && health.protected.includes(name));
  /* First-open default is the KEEPER, not the shell (board t26): a VM's primary
     surface is its keeper (Claude) session, so opening a VM with no prior mode
     choice puts the keeper on stage and the shell is one tab away. An explicit
     tab pick lands in `modes` and wins from then on, so this default only ever
     decides the untouched first view. */
  const modeOf = (vm) => modes[vm] || "keeper";
  // Mount a (vm, mode) terminal if it is not up yet, and never touch it if it
  // is: an existing pane must keep its identity, or it reloads.
  const mount = (vm, mode) => setPanes(p =>
    p[paneKey(vm, mode)] ? p : { ...p, [paneKey(vm, mode)]: { vm, mode, nonce: 0 } });
  const open = (vm) => { mount(vm, modeOf(vm)); setActive(vm); };
  const select = (vm) => { setActive(vm); if (stateOf(vm) === "RUNNING") open(vm); };
  /* Auto-derive the active VM: with nothing selected yet, prefer a station
     named "keeper" (the local machine), else the only VM, else the first
     RUNNING one. One-shot — a user's own selection is never overridden. */
  /* 1.0.41 (operator, 2026-08-20): the DEFAULT seat is the ⌂ keeper host
     console — the host machine's own keeper, the one deliberate bottleneck
     every host-level request passes through. No VM is ever auto-selected;
     a VM becomes the seat only by an explicit pick in the dropdown. */
  useEffect(() => {
    if (active) return;
    try { window.__fvVm && window.__fvVm.set("@keeper"); } catch (e) {}
  }, [vms]);
  /* The terminal bar's surfaces follow the active VM (grounding rule: a
     VM's shell/frontier/local are ITS OWN). Every station in the dropdown is
     a real VM — including one named "keeper", which is a station like any
     other (the old fold of "keeper" to no-VM silently shared its frontier
     with the model VM). The HOST seat is only ever the explicit "@keeper"
     sentinel (the ⌂ button). */
  useEffect(() => {
    try {
      window.__fvVm && window.__fvVm.set(active || "@keeper");
    } catch (e) {}
  }, [active]);
  /* pickTerm = click a terminal tab: mount that (vm,mode) if new, make it the
     on-stage pane, and select its VM. This ONE gesture now does both switches —
     VM↔VM and keeper↔shell — since a tab IS the switch (no mode toggle, no dock).
     The LAZY mount is deliberate: a keeper/shell pane is only created the first
     time its tab is clicked, so N open VM groups cost N sockets, not 2N — the
     shell's ghost tab holds a socket only once someone actually opens it. */
  const pickTerm = (vm, mode) => {
    mount(vm, mode);
    setModes(m => ({ ...m, [vm]: mode }));
    setActive(vm);
  };
  // Reconnect rebuilds ONE pane: bumping this nonce changes only that iframe's
  // React key, so the sibling mode's terminal is untouched and stays connected.
  const reload = (vm) => setPanes(p => {
    const k = paneKey(vm, modeOf(vm));
    return p[k] ? { ...p, [k]: { ...p[k], nonce: p[k].nonce + 1 } } : p;
  });
  const resetTerm = (vm) => {
    try {
      const f = document.querySelector('iframe[data-vm="' + vm + '"][data-mode="' + modeOf(vm) + '"]');
      const t = f && f.contentWindow && f.contentWindow.term;
      if (t && typeof t.reset === "function") t.reset();
    } catch (_) { /* reconnect below still resets server-side */ }
    reload(vm);
  };
  /* Close ONE terminal tab (this vm+mode), not the whole VM: each terminal is its
     own tab now, so ✕ drops just that pane. If it was the on-stage pane, fall to
     the sibling terminal when it's still open; otherwise leave the VM selected
     with no pane on stage — its group keeps rendering (a running VM always shows
     its keeper/shell tabs, now as ghosts), so the closed terminal is one click
     from reopening and the VM is never stranded. */
  const closeTerm = (vm, mode) => {
    const k = paneKey(vm, mode);
    setPanes(p => { if (!p[k]) return p; const n = { ...p }; delete n[k]; return n; });
    if (modeOf(vm) !== mode) return;              // closed a hidden sibling; stage unchanged
    /* Fall back to whichever sibling is STILL OPEN. This used to be a two-way
       flip (keeper<->shell); with a second keeper agent a VM can have three or
       more tabs, and that flip could name a mode that was never mounted — the
       stage would go blank while an open terminal sat there unshown. Search the
       live panes instead, preferring the canonical keeper, then any other
       keeper, then the shell. */
    const prefer = ["keeper", ...Object.keys(panes)
                      .filter(k => k.startsWith(vm + ":keeper:"))
                      .map(k => k.slice(vm.length + 1)), "shell"];
    const other = prefer.find(m2 => m2 !== mode && panes[paneKey(vm, m2)]);
    setModes(m => {
      if (other) return { ...m, [vm]: other };    // show the still-open sibling
      const n = { ...m }; delete n[vm]; return n;  // none left → stage shows the hint
    });
  };

  const power = (vm, verb) => {
    if (verb !== "start" && !confirm(verb + " " + vm + "?")) return;
    setBusy(b => ({ ...b, [vm]: verb }));
    api("/api/vm/" + vm + "/" + verb, { method: "POST" })
      .then(d => { if (!d.ok) alert(verb + " " + vm + " failed: " + (d.error || d.output || "?")); })
      .catch(e => alert(verb + " " + vm + " failed: " + e))
      .finally(() => { setBusy(b => { const n = { ...b }; delete n[vm]; return n; }); load(); });
  };
  /* agent is optional: omitted (today's only path) posts an empty body, exactly
     as before. Passed only when the backend advertised >1 agent (the chooser
     below), so live console-api — which never advertises more than one — never
     sees a body shape it hasn't already been sent. busy-verb stays "keeper"
     regardless of which agent, so the tray's "launching…" label needs no
     per-agent variant.
     replace (board t58): set ONLY by the switch control, on a VM that already
     has a live keeper — it tells the backend to kill that session first, so
     it must never be sent silently. Every other caller (the launch chooser,
     the single-button path) omits it, and the backend treats its absence as
     "refuse if a keeper is already live", so this file cannot switch a live
     keeper except through the one path that confirms with the operator first. */
  const launchKeeper = (vm, agent, replace) => {
    setBusy(b => ({ ...b, [vm]: "keeper" }));
    const body = agent ? { agent, ...(replace ? { replace: true } : {}) } : null;
    api("/api/vm/" + vm + "/keeper/launch", body
          ? { method: "POST", body: JSON.stringify(body) }
          : { method: "POST" })
      .then(d => { setKeepers(k => ({ ...k, [vm]: !!d.keeper }));
                   if (d.agent) setKeeperAgentOf(k => ({ ...k, [vm]: d.agent }));
                   if (!d.ok) alert("keeper launch failed: " + (d.error || d.output || "?")); })
      .catch(e => alert("keeper launch failed: " + e))
      .finally(() => setBusy(b => { const n = { ...b }; delete n[vm]; return n; }));
  };

  /* One handler for the three per-agent keeper actions (launch / stop / gate).
     Busy is keyed "keeper:<agent>" rather than plain "keeper" so acting on one
     agent never greys out the other's controls — with two keepers side by side
     they are genuinely independent operations.

     Every action re-reads GET /keeper afterwards instead of trusting the POST's
     echo: the gate route reports the FLAG, not liveness, and starting a keeper
     that the gate forbids legitimately succeeds-with-nothing (the ensure script
     exits 0 saying "DISABLED"). Only a fresh read tells the truth about both. */
  const keeperAction = (vm, agent, action, enabled) => {
    const key = "keeper:" + agent;
    setBusy(b => ({ ...b, [vm]: key }));
    const path = action === "gate" ? "/keeper/gate"
               : action === "stop" ? "/keeper/stop" : "/keeper/launch";
    const body = action === "gate" ? { agent, enabled: !!enabled } : { agent };
    api("/api/vm/" + vm + path, { method: "POST", body: JSON.stringify(body) })
      .then(d => {
        if (!d.ok) alert(agent + " keeper " + action + " failed: " +
                         (d.error || d.output || "?"));
        return api("/api/vm/" + vm + "/keeper");
      })
      .then(d => {
        if (!d) return;
        setKeepers(k => ({ ...k, [vm]: !!d.keeper }));
        if (d.sessions) setKeeperSessions(s => ({ ...s, [vm]: d.sessions }));
        setKeeperAgentOf(k => ({ ...k, [vm]: d.agent || null }));
      })
      .catch(e => alert(agent + " keeper " + action + " failed: " + e))
      .finally(() => setBusy(b => { const n = { ...b }; delete n[vm]; return n; }));
  };

  const cur = active && panes[paneKey(active, modeOf(active))];
  const activeUp = active && stateOf(active) === "RUNNING";
  const todoTick = active ? todoCounts[active] : null;  // {count, warn} | undefined — the ☑ ticker for the active vm
  const feedAge = health && health.fleet_feed_age_s;
  const feedCls = feedAge == null ? "bad" : feedAge < 7200 ? "ok" : "warn";
  // vms_json_age_s = how fresh the HOST's VM-state snapshot is (backend-side) —
  // shipped in every /api/health and, until now, rendered nowhere. That is a
  // different fact from "when did THIS console last get an answer" (client-side),
  // so the two are labelled separately rather than blended into one number.
  const vmsAge = health && health.vms_json_age_s;
  const vmsCls = vmsAge == null ? "bad" : vmsAge < 60 ? "ok" : vmsAge < 300 ? "warn" : "bad";
  const ago = (ms) => {
    if (ms == null) return "never";
    const s = Math.max(0, Math.round(ms / 1000));
    return s < 60 ? s + "s ago" : Math.round(s / 60) + "m ago";
  };
  // A live counter is only meaningful while blind — and only then is a 1s clock
  // running to feed it. While healthy we deliberately do NOT print "updated 0s
  // ago": between 8s polls that is fake precision, and the honest claim is just
  // that the console is current. `vm state <n>s old` carries real freshness.
  const agoText = ago(lastOk == null ? null : now - lastOk);

  /* One terminal tab = one (vm, mode). Clicking it puts that terminal on the full
     stage (pickTerm). Keeper is styled PRIMARY and leads; shell is SECONDARY/dim.
     A mounted terminal carries a ✕; an unmounted one is a dim GHOST that opens on
     click — so a running VM always shows both, and closing the last one leaves the
     ghosts as the reopen path. `.active` = this pane is the one on stage. */
  const termTab = (vm, mode) => {
    const mounted = !!panes[paneKey(vm, mode)];
    const onStage = active === vm && modeOf(vm) === mode;
    const agent = agentOfMode(mode);              // non-null on a per-agent keeper tab
    const keeper = mode === "keeper" || !!agent;
    /* The class keeps carrying the base kind ("keeper"/"shell") rather than the
       raw mode, so an agent tab inherits the keeper styling instead of needing a
       new rule per agent name. */
    const cls = "term-tab " + (keeper ? "keeper" : mode)
              + (keeper ? " primary" : " secondary")
              + (onStage ? " active" : "") + (mounted ? "" : " ghost");
    /* Liveness: `keepers[vm]` is one bool for the VM, so it can only honestly
       light the session the backend reported on. For a named agent, only claim
       green when the GET actually said that agent is the live one. */
    const live = agent ? keeperAgentOf[vm] === agent : !!keepers[vm];
    /* Label by ROLE, matching the session name: the tab reads "local", not
       "hugpy", so it keeps meaning the same thing if the engine behind the
       local keeper is ever swapped. Unknown agents fall back to their own name
       rather than being forced into a role that may not fit. */
    const label = agent ? (AGENT_LABEL[agent] || agent) : "keeper";
    return html`
      <button key=${mode} className=${cls} data-vm=${vm} data-tabmode=${mode}
              title=${(mounted ? "" : "open ") + vm + " " +
                      (agent ? label + " keeper — " + (KEEPER_SESSION_OF[agent] || "keeper-" + agent) +
                               ", its own tmux session alongside the Claude one (agent: " + agent + ")"
                             : keeper ? "keeper (the VM's Claude session)" : "shell")}
              onClick=${() => pickTerm(vm, mode)}>
        ${keeper
          ? html`${label}<span className="kdot" style=${{ background: live ? "var(--ok)" : "#6e7681" }}></span>`
          : "shell"}
        ${mounted && html`<span className="term-close" title=${"close " + vm + " " + mode}
              onClick=${(e) => { e.stopPropagation(); closeTerm(vm, mode); }}>✕</span>`}
      </button>`;
  };

  /* A per-VM group: the VM name + (running → its keeper/shell terminal tabs) + a
     ⏻ power tray. This is where power lives now — per VM, on its own group, not a
     single global button row. The tray expands INLINE (never an absolute popup:
     the strip clips overflow), one VM open at a time. */
  const vmGroup = (v) => {
    const vm = v.name;
    const up = v.state === "RUNNING";
    const trayOpen = powerVm === vm;
    return html`
      <div key=${vm} data-vm=${vm}
           className=${"vmgroup" + (active === vm ? " active" : "") + (up ? "" : " down")}>
        <span className="vm-name" title=${up ? "select this VM" : v.state + " — select to manage"}
              onClick=${() => select(vm)}>${vm}</span>
        ${/* per-VM keeper/shell terminal-mode toggle removed — the top-bar
              local·frontier·shell surface tabs cover host terminals; VM terminals
              open via the 🖥 VMs tab (⇥ open) and selecting the VM name. */""}
        ${!up && html`<span className="vm-state">${v.state || "…"}</span>`}
        <button className=${"vm-power" + (trayOpen ? " on" : "")} aria-expanded=${trayOpen}
                title=${"power — " + vm} onClick=${() => setPowerVm(p => (p === vm ? null : vm))}>⏻</button>
        ${trayOpen && html`<span className="vm-power-menu">
          ${!up && html`
            <button className="btn" disabled=${!!busy[vm]} onClick=${() => power(vm, "start")}>
              ${busy[vm] === "start" ? "starting…" : "▶ start"}</button>`}
          ${up && html`
            <button className="btn danger" disabled=${!!busy[vm] || isProtected(vm)}
                    title=${isProtected(vm) ? "protected VM — stop refused by policy" : "stop " + vm}
                    onClick=${() => power(vm, "stop")}>
              ${busy[vm] === "stop" ? "stopping…" : "⏹ stop"}</button>`}
          ${up && html`
            <button className="btn danger" disabled=${!!busy[vm] || isProtected(vm)}
                    title=${isProtected(vm) ? "protected VM — restart refused by policy" : "restart " + vm}
                    onClick=${() => power(vm, "restart")}>
              ${busy[vm] === "restart" ? "restarting…" : "⟳ restart"}</button>`}
          ${up && (() => {
            /* PER-AGENT KEEPER CONTROLS (operator, 2026-07-27: "that needs to be
               in the ui, everything needs to be in the ui").

               The two keepers now run SIDE BY SIDE in their own tmux sessions, and
               the claude one is gated by a file — /opt/llm-station/keeper-agents.d/
               claude.enabled — that used to be reachable only over SSH. So the
               console could not show whether a keeper was even ALLOWED to run, let
               alone change it, and a keeper you can only manage by SSH is not
               managed.

               This replaces the old launch-chooser + ⇄ switch pair. The switch was
               built when one keeper ran at a time and it KILLED the running session
               to change agent; with side-by-side sessions that trade-off is gone —
               you start and stop each keeper independently, and never have to
               destroy one to see the other.

               Driven by the backend's per-agent `sessions` block. When it is absent
               (older console-api) we fall back to the previous single-button
               behavior, so this file still works against a backend that predates
               the route — the capability gate is what the backend says, as before. */
            const agents = keeperAgents[vm] || [];
            const sess = keeperSessions[vm];
            if (!sess || agents.length === 0) {
              // Legacy backend: no per-agent detail. Keep the old single control.
              if (keepers[vm] !== false) return null;
              return html`
                <button className="btn" disabled=${!!busy[vm]}
                        title="start the keeper tmux session in this VM"
                        onClick=${() => launchKeeper(vm)}>
                  ${busy[vm] === "keeper" ? "launching…" : "☉ launch keeper"}</button>`;
            }
            return agents.map(a => {
              const s = sess[a] || {};
              const icon = a === "claude" ? "☉" : "🤖";
              const name = AGENT_LABEL[a] || a;
              const b = busy[vm] === "keeper:" + a;
              /* Three facts, three controls, deliberately not collapsed into one
                 toggle: LIVE (a session exists), ENABLED (its timer may restart
                 it), and the actions. Enabled-but-dead and disabled-but-running
                 are both real, ordinary states — the flag only governs whether a
                 keeper COMES BACK, it never kills a live one — so a single
                 on/off would have to lie about one of them. */
              return html`<span key=${"ka-" + a} className="keeper-ctl">
                <span className="ka-name" title=${a + " keeper — session " +
                        (s.session || "?") + (s.live ? " (running)" : " (not running)")}>
                  ${icon} ${name}<span className="kdot"
                       style=${{ background: s.live ? "var(--ok)" : "#6e7681" }}></span>
                </span>
                ${s.live
                  ? html`<button className="btn" disabled=${b}
                            title=${"stop " + vm + "'s " + name + " keeper (kills session " +
                                    s.session + "; it can be started again)"}
                            onClick=${() => {
                              if (!confirm("stop " + vm + "'s " + name +
                                           " keeper? the session is killed mid-task")) return;
                              keeperAction(vm, a, "stop");
                            }}>${b ? "…" : "⏹"}</button>`
                  : html`<button className="btn" disabled=${b}
                            title=${"start " + vm + "'s " + name + " keeper (session " +
                                    (s.session || "?") + ")"}
                            onClick=${() => keeperAction(vm, a, "launch")}>
                            ${b ? "…" : "▶"}</button>`}
                ${s.gateable && html`
                  <button className=${"btn ka-gate" + (s.enabled ? " on" : "")} disabled=${b}
                          title=${s.enabled
                            ? "Frontier Keeper: Enabled — " + name + "'s timer restarts it if it dies. " +
                              "Click to disable (this does NOT stop a running one; use ⏹ for that). " +
                              "Disabling gates only this frontier keeper (A) — the local-keeper and " +
                              "your shell are unaffected. It spends metered tokens while it runs."
                            : "Frontier Keeper: Disabled — nothing will start " + name + ", and the " +
                              "keeper tab stays empty. The local-keeper and your shell still work. " +
                              "Click to enable."}
                          onClick=${() => keeperAction(vm, a, "gate", !s.enabled)}>
                    ${b ? "…" : (s.enabled ? "enabled" : "disabled")}</button>`}
              </span>`;
            });
          })()}
          ${/* ⚿ keys shortcut (board p13, moved into the 🛡 steward drawer on
               operator direction — the drawer already owns per-VM keeper
               control, and a second inline form in the clipped tray strip
               would have fought the "never an absolute popup" constraint for
               no real gain). This tray button is deliberately TINY (icon
               only): it just makes sure the right VM is active and opens the
               steward drawer, where the "⚿ keeper keys" section lives.
               Capability-gated on the same signal as the multi-agent chooser
               above — the backend's advertised agent list — so it stays
               hidden everywhere live console-api's agent-less /keeper reply
               is the only answer. */""}
          ${up && (keeperAgents[vm] || []).includes("hugpy") && html`
            <button className="btn" disabled=${!!busy[vm]}
                    title=${"⚿ " + vm + "'s keeper keys (opens the 🛡 steward drawer)"}
                    onClick=${() => { if (active !== vm) select(vm); setPanel("steward"); }}>⚿</button>`}
        </span>`}
      </div>`;
  };

  /* THE DROPDOWN IS THE NAVIGATION (operator, 2026-07-27): "i need for the
     dropdown to dictate which vm is open, the scroll through open vms is
     arduous. just have the same component be static for whatever vm is selected
     in the dropdown".

     Supersedes t74's activity rule, which grouped the strip by ACTIVITY: a VM
     rendered as a full inline group while it had an open pane. That made the
     strip GROW — every VM you visited kept its group forever — so after a few
     VMs the row scrolled and finding one meant hunting through it. Worse, the
     dropdown held only what you had NOT opened, so it emptied out at exactly the
     moment the strip became unwieldy. Backwards.

     Now: the dropdown holds EVERY vm and reflects the current selection, and
     exactly ONE group renders — the selected one, in a fixed spot, so the
     controls under the pointer never move. Picking from the dropdown is still
     `select()`: same gesture and semantics as clicking a vm-name was, but it
     switches the strip instead of appending to it.

     Panes are deliberately untouched. They stay mounted and keyed by (vm, mode),
     so switching away and back is still lossless — only the tab STRIP stops
     accumulating. This also subsumes t74's active-pin: the selected VM is the
     only group there is, so a stopped VM being managed via its ⏻ tray can never
     be swallowed by a collapsed control.

     Kept from t74: running/stopped stays visible in the dropdown (●/○ + the
     state word); states are last-known like the power dots, and under fleetErr
     the control goes amber and says so rather than auto-reshuffling on an 8s
     blip. Layout: dropdown and group sit TOGETHER at the left edge, with the
     spacer after them (2026-07-27). The earlier far-right placement made sense
     when the strip held many groups; with a single group it just put the
     selector and the thing it selects at opposite ends of the screen. */
  /* `hasPane` went with the activity rule — nothing keys off "has an open pane"
     any more, because that is exactly the condition that made the strip grow. */
  const inlineVms = vms.filter(v => v.name === active);
  const droppedVms = vms;

  return html`
    <div className="app">
      <div className="tabs">
        <div className="tablist">
        ${/* DEPRECATED (operator, 2026-08-12): the inline per-VM group strip
             [inlineVms.map(vmGroup)] — its power tray + keeper controls live in
             the 🖥 VMs tab and the 🛡 steward drawer. In its place: the VM
             dropdown (selecting = open terminal, same select() gesture) and
             two quick tabs — the selected VM's console, and the permanent
             vm_mgr host keeper (the fleet's escalation arm). */""}
        ${/* 2026-09-18 (operator): the locus/vm/prev/console group leads the
              tablist; the local/frontier/shell/+shell seat tabs follow to their
              right (SurfaceTabs moved below). The "console of" label was removed. */""}
        <select className="vm-dd" value=${active || "@keeper"}
                title="this console is now this locus's console — its OWN seats (frontier A, local B, shell), files, steward and sessions. ⌂ host = this machine; ● lxd guest / ⇅ ssh host = that machine."
                onChange=${(e) => { const vm = e.target.value;
                  if (vm === "@keeper") { setActive(null);
                    try { window.__fvVm && window.__fvVm.set("@keeper"); window.__fvSurface && window.__fvSurface.set("frontier"); } catch (err) {}
                  } else if (vm) select(vm); }}>
          <option value="@keeper">⌂ host (this machine)</option>
          ${vms.map(v => html`<option key=${v.name} value=${v.name} title=${"locus kind: " + (v.kind === "ssh" ? "ssh host" : "lxd guest") + " · " + (v.state || "")}>
              ${(v.state === "RUNNING" ? "● " : "○ ") + (v.kind === "ssh" ? "⇅ " : "") + v.name}</option>`)}
        </select>
        <button className=${"btn term-tab" + (active ? " keeper" : "")} disabled=${!active}
                title=${active ? "open " + active + "'s console terminal" : "pick a locus first"}
                onClick=${() => { if (active) open(active); }}>
          ⌨ ${active || "vm"}</button>
        <button className=${"btn term-tab" + (!active ? " keeper" : "")}
                title="⌂ host — go to this machine's frontier session AND make the console the host's (the locus dropdown follows)."
                onClick=${() => { try {
                  setActive(null);                                   // 1.0.65: the dropdown follows
                  window.__fvVm && window.__fvVm.set("@keeper");
                  window.__fvSurface && window.__fvSurface.set("frontier");
                } catch (e) {} }}>
          ⌂ host</button>
        ${/* 1.0.65 (operator): the locus chosen BEFORE this one — one click goes to
              ITS frontier session and re-grounds the console there (dropdown follows). */""}
        ${prevLocus !== null && prevLocus !== (active || "") && html`
        <button className="btn term-tab"
                title=${"↩ back to " + locusLabel(prevLocus) + " — its frontier session; the console becomes that locus's"}
                onClick=${() => { try {
                  if (isHostVm(prevLocus)) {
                    setActive(null); window.__fvVm && window.__fvVm.set("@keeper");
                  } else { select(prevLocus); }
                  window.__fvSurface && window.__fvSurface.set("frontier");
                } catch (e) {} }}>
          ↩ ${locusLabel(prevLocus)}</button>`}
        ${/* The terminal pane owns its backend/provider selection now; the old
             top-level console/local/frontier shortcuts were redundant. */""}
        ${/* Spacer AFTER the group, not between it and the dropdown (operator,
              2026-07-27): with the far-right layout the two controls sat at
              opposite ends of a wide screen, so every VM switch was a long
              mouse trip from the dropdown to the tabs it had just changed.
              Now they sit together at the left edge and the slack collapses to
              the right. It stays a flex-grow spacer rather than being deleted so
              the .tablist still fills its row and the fleet-stale warning keeps
              its position. */ ""}
        <span className="tab-spacer" aria-hidden="true"></span>
        </div>
        ${fleetErr && html`
          <span className="stale" title=${"/api/vms failed: " + fleetErr +
                 " — the power states shown are the last ones the console could read, not live"}>
            ⚠ fleet state stale — last update ${agoText}</span>`}
        <${FocusChip} />
        <${PulledChip} />
        <div className="actions">
        ${/* reset/reconnect act on the ON-STAGE pane = the selected terminal tab
              (modeOf(active)); power moved onto the per-VM groups above. */ ""}
        ${/* reset / reconnect deprecated (P1): a fresh session is the dropdown's job; VM-specific resets live in the VMs tab. */ ""}
        ${/* 2026-09-18 (operator): right-side panel buttons ordered
              Steward · todo · canvas · search · docs · db · resize. 🖥 loci is
              kept leftmost (it was not part of the requested group). The 🔧 claude
              button was removed (the panel==="ac" drawer is now unreachable from
              the toolbar — see note). */""}
        <button className=${"btn" + (panel === "vms" ? " on" : "")}
                title="VMs — LXD stations: per-VM controls + create (＋ VM)"
                onClick=${() => togglePanel("vms")}>🖥 loci</button>
        <button className=${"btn" + (panel === "steward" ? " on" : "")}
                title="session steward — arm/monitor the in-VM daemon that restarts the keeper at a lull with a written handoff (🛡)"
                onClick=${() => togglePanel("steward")}>🛡 steward</button>
        ${/* ☑ todo - single host-native board (you + the agent); replaces the legacy per-VM todo. */ ""}
        <button className=${"btn" + (panel === "sesstodo" ? " on" : "")}
                title=${"todo — " + ((!active || active === "@keeper") ? "the host keeper's" : active + "'s") + " shared task board (follows the station selection)"}
                onClick=${() => togglePanel("sesstodo")}>☑ todo</button>
        ${(window.WF || window.FLOW) && html`<button className=${"btn" + (panel === "canvas" ? " on" : "")}
                title="canvas — design (wireframe) + flow, one central copy per locus shared live with its keeper (canvas/get|put)"
                onClick=${() => togglePanel("canvas")}>◳ canvas</button>`}
        <button className=${"btn" + (panel === "search" ? " on" : "")}
                title="search — file/content/import search over the VM's finder (grep · files · imports)"
                onClick=${() => togglePanel("search")}>🔍 search</button>
        ${/* docs are NOT per-VM — this button stays enabled with no active VM, and its
              drawer render slot below carries no `active` gate (board t27). */ ""}
        <button className=${"btn" + (panel === "docs" ? " on" : "")}
                title="docs — using the console + the keeper dev guide (shipped markdown; no VM needed)"
                onClick=${() => togglePanel("docs")}>📖 docs</button>
        ${/* 1.0.85: 🗄 db is central, not per-locus — same no-active-VM rule as docs. */ ""}
        <button className=${"btn" + (panel === "db" ? " on" : "")}
                title="db — the central toolserver database, read-only (tables · columns · SELECT queries via the station's /ts/db proxy)"
                onClick=${() => togglePanel("db")}>🗄 db</button>
        <button className="btn" title="right-column width — cycles 44% / 70% / 88% (applies to every drawer)"
                onClick=${() => setRcW(rcCycle())}>${RC_LABEL[rcW]}</button>
        </div>
      </div>
      <div className="main">
      <div className="stage">
        ${Object.entries(panes).map(([key, p]) => {
          // Every mounted pane renders EVERY time; only `display` decides which
          // one you see. That is what makes both switching VM groups and switching
          // keeper↔shell lossless — the iframes never unmount, so their sockets
          // and scrollback simply carry on behind whatever is on top. Exactly ONE
          // terminal fills the full stage: the on-stage pane (modeOf) of the
          // active VM. There is no side slot — the acded94 lesson holds.
          const show = active === p.vm && modeOf(p.vm) === p.mode;
          // term-wrapper v2 holds (never exit-loops) on a stopped VM, but an
          // unmounted placeholder is still cheaper than an idle WS per tab.
          if (stateOf(p.vm) !== "RUNNING")
            return html`<div key=${key} className="hint" style=${{ display: show ? "flex" : "none" }}>
              <div>${p.vm} is ${stateOf(p.vm) || "unavailable"}</div>
              <button className="btn" disabled=${!!busy[p.vm]} onClick=${() => power(p.vm, "start")}>
                ${busy[p.vm] === "start" ? "starting…" : "▶ start " + p.vm}</button></div>`;
          // The nonce rides in the KEY, not the src: a new key is what makes
          // React drop this iframe and build a fresh one (a genuine reload),
          // while an unchanged key keeps the exact same element — and with it
          // the session — across every re-render.
          return html`<iframe key=${key + ":" + p.nonce} title=${p.vm} data-vm=${p.vm} data-mode=${p.mode}
                       src=${paneSrc(p.vm, p.mode)}
                       style=${{ display: show ? "block" : "none" }} />`;
        })}
        ${!cur && active && html`<div className="hint">
          <div>${active} is ${stateOf(active) || "…"}</div>
          ${stateOf(active) !== "RUNNING" && html`
            <button className="btn" disabled=${!!busy[active]} onClick=${() => power(active, "start")}>
              ${busy[active] === "start" ? "starting…" : "▶ start " + active}</button>`}
        </div>`}
        ${!active && html`<div className="hint"><div>hugpy Station</div><div>pick a locus from the dropdown — an lxd guest or ssh host, running or stopped</div></div>`}
      </div>
      ${panel && html`<div className="rc-col">
        <div className="rc-drawer">
          ${panel === "canvas" && html`<${CanvasDrawer} vm=${active || "@keeper"} />`}
          ${panel === "vms" && html`<${VmsDrawer} power=${power} busy=${busy} active=${active} onSelect=${select} />`}
          ${panel === "search" && html`<${SearchDrawer} vm=${active} home=${homeOf(active)} />`}
          ${/* feed drawer retired — lives in 🛡 steward → session now; a stale
                localStorage panel="feed" simply renders an empty drawer once. */""}
          ${panel === "steward" && html`<div style=${{ overflowY: "auto", height: "100%" }}>
                  <${StewardDrawer} vm=${active || "@keeper"}
                  hugpyKeys=${activeUp && (keeperAgents[active] || []).includes("hugpy")} /></div>`}
          ${panel === "docs" && html`<${DocsDrawer} />`}
          ${panel === "db" && html`<${DbDrawer} />`}
          ${panel === "ac" && html`<iframe src="/ac/" title="claude settings"
                style=${{ width: "100%", height: "100%", border: 0, background: "#0e1116" }} />`}
          ${panel === "bchat" && html`<${BChatDrawer} />`}
          ${/* 1.0.42: the ☑ board FOLLOWS the station selection, like every other drawer.
                It was pinned to vm="keeper" so picking a VM in the dropdown still showed the
                host board. The host seat (no pick / @keeper) maps to the "keeper" alias because
                /api/vm/@keeper/todo is not a route — /api/vm/keeper/todo is. The key remounts
                the drawer on a switch so its state never bleeds across boards. */ ""}
          ${panel === "sesstodo" && html`<${TodoDrawer} key=${active || HOST_BOARD} vm=${isHostVm(active) ? HOST_BOARD : active} onCount=${reportTodoCount} />`}
        </div>
      </div>`}
      </div>
      <${PromptPanel} />
      ${/* The footer is the console's own status line, so it renders ALWAYS. It
            used to be gated on ${health && …}: the one moment it mattered — the
            backend not answering — was the one moment it vanished, taking the
            only "something is wrong" signal off the screen with it. */ ""}
      <div className=${"health" + (offline ? " degraded" : "")}>
        ${healthErr
          ? html`<span><span className="pill bad"></span><b>health unavailable</b> — /api/health: ${healthErr}</span>`
          : health
            ? html`
              <span><span className=${"pill " + (health.keeper_broker === "active" ? "ok" : "bad")}></span>broker <b>${health.keeper_broker}</b></span>
              <span><span className=${"pill " + (health.vm_bridge === "active" ? "ok" : "bad")}></span>vm-bridge <b>${health.vm_bridge}</b></span>
              <span><span className=${"pill " + feedCls}></span>fleet feed <b>${feedAge == null ? "missing" : feedAge < 120 ? "fresh" : Math.round(feedAge / 60) + "m old"}</b></span>
              <span><span className=${"pill " + vmsCls}></span>vm state <b>${vmsAge == null ? "unknown" : Math.round(vmsAge) + "s old"}</b></span>
              <span>gates: <b>${Object.keys(health.gates || {}).join(", ") || "none"}</b></span>
              <span style=${{ opacity: .6 }}>protected: ${(health.protected || []).join(", ")}</span>`
            : html`<span><span className="pill warn"></span>connecting…</span>`}
        <span className="health-spacer"></span>
        ${fleetErr
          ? html`<span className="health-err" title=${"/api/vms: " + fleetErr +
                   " — the fleet may have changed in ways this console cannot see"}>
              <span className="pill bad"></span><b>console offline</b> — last update ${agoText}</span>`
          : html`<span title="this console polls /api/vms + /api/health every 8s while the tab is visible">
              <span className="pill ok"></span>console <b>live</b></span>`}
      </div>
    </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
