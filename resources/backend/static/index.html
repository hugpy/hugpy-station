      setFormatPrev({ kind: "bash", scoped: true, rows });
      return say("✨ wrapped " + rows.length + " item(s) as bash — review, then apply");
    }
    const t = text.trim();
    if (!t) return say("type or paste text in the box first, then ✨ wrap as bash", true);
    setText("```bash\n" + t + "\n```");   // reversible — the operator sees it in the box, no preview needed
    say("wrapped as a bash block");
  };
  const format = (kind) => {
    const targets = selectedIn(items);
    if (targets.length) return formatScoped(kind, targets);   // scoped (board t42): per selected item
    const t = text.trim();
    if (!t) return say("type or paste text in the box first, then ✨ " + FORMAT_LABEL[kind], true);
    setProposal(null);   // the tidy + format previews are mutually exclusive
    say("✨ hugpy is reformatting the box… (model may cold-load; ✕ cancel to give up)");
    guard(signal => api("/api/vm/" + vm + "/todo/assist", { method: "POST", signal,
        timeout: ASSIST_TIMEOUT_MS, body: JSON.stringify({ mode: "format", kind, text: t }) })
      .then(d => {
        if (d.ok && typeof d.result === "string") { setFormatPrev({ kind, result: d.result }); say(""); }
        else if (d.error && /unknown mode|unsupported|format/i.test(d.error)) say(FORMAT_O9, true);
        else say(d.error || "format failed", true);
      })
      .catch(e => e && e.status === 400 ? say(FORMAT_O9, true) : fail("format failed")(e)));
  };
  /* Scoped LLM transform (board t42): run mode:"format" PER selected item, SEQUENTIALLY
     (one local model — no stampede), against each item's `text` only (a note carries
     keeper history, so it is never sent or rewritten). Progress ticks through say(); a
     failed item keeps its original text, is marked in the preview, and is SKIPPED on
     apply. Honest counts land in the final say(). All under guard() → the ✕ cancel and
     busy-latch protection apply to the whole batch. */
  const formatScoped = (kind, targets) => {
    setProposal(null);
    const total = targets.length;
    guard(async (signal) => {
      const rows = [];
      let degraded = false;
      for (let i = 0; i < targets.length; i++) {
        if (cancelled.current) break;
        const it = targets[i];
        const before = it.text || "";
        say("✨ " + (i + 1) + "/" + total + " reformatting…");
        try {
          const d = await api("/api/vm/" + vm + "/todo/assist", { method: "POST", signal,
            timeout: ASSIST_TIMEOUT_MS, body: JSON.stringify({ mode: "format", kind, text: before }) });
          if (d.ok && typeof d.result === "string") rows.push({ id: it.id, before, after: d.result, ok: true });
          else { if (d.error && /unknown mode|unsupported|format/i.test(d.error)) degraded = true;
                 rows.push({ id: it.id, before, after: before, ok: false }); }
        } catch (e) {
          if (e && e.status === 400) degraded = true;
          rows.push({ id: it.id, before, after: before, ok: false });
        }
      }
      if (!rows.length) return say("✨ transform cancelled — nothing to preview", true);
      setFormatPrev({ kind, scoped: true, rows });
      const okN = rows.filter(r => r.ok).length;
      if (okN === 0) say(degraded ? FORMAT_O9 : "✨ 0/" + total + " transformed — all failed; nothing to apply", true);
      else say("✨ " + okN + "/" + total + " ready — review, then apply"
               + (okN < total ? " (" + (total - okN) + " failed, skipped)" : ""));
    });
  };
  /* Apply a scoped text transform: one surgical op:"update" per SUCCESSFUL item (never a
     whole-board replace), sequentially so the local backend isn't stampeded and the count
     stays honest. Failed rows were already dropped from the preview's apply set. */
  const applyScopedFormat = () => {
    const rows = ((formatPrev && formatPrev.rows) || []).filter(r => r.ok);
    setFormatPrev(null);
    if (!rows.length) return say("nothing to apply — every item failed", true);
    guard(async (signal) => {
      let done = 0;
      for (let i = 0; i < rows.length; i++) {
        if (cancelled.current) break;
        say("✨ applying " + (i + 1) + "/" + rows.length + "…");
        try {
          const d = await api("/api/vm/" + vm + "/todo", { method: "POST", signal,
            body: JSON.stringify({ op: "update", id: rows[i].id, fields: { text: rows[i].after } }) });
          if (d.ok) { setState(d.state); done++; }
        } catch (e) { /* keep going — the final count is honest about what landed */ }
      }
      say("✨ applied to " + done + "/" + rows.length + " item(s)");
    });
  };
  const edit = (it) => {
    const t = prompt("edit item:", it.text);
    if (t === null || !t.trim() || t.trim() === it.text) return;
    op({ op: "update", id: it.id, fields: { text: t.trim() } });
  };
  /* t-priority: cycle an item's priority (low → medium → high → low) through the
     normal update op — and VERIFY-AFTER-WRITE, like postComment/setRelay, because the
     live whitelist silently drops "priority" with ok:true. Read the item back out of
     the echoed board: if OUR value didn't land, show the honest wall message and
     render the stripped board (no phantom). Keeper-authored priorities round-trip the
     moment the whitelist widens, with this code unchanged. */
  const setPriority = (it) => {
    const next = PRIO_NEXT[prioOf(it)];
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", signal,
        body: JSON.stringify({ op: "update", id: it.id, fields: { priority: next } }) })
      .then(d => {
        if (!d.ok) return say(d.error || "failed", true);
        const saved = (d.state.items || []).find(i => i.id === it.id);
        const landed = saved && prioOf(saved) === next;
        setState(d.state);
        if (landed) say("priority → " + next);
        else say(PRIO_WALL + " — not saved", true);
      })
      .catch(fail("priority")));
  };
  /* The chip IS the control: high (red) / medium (amber) read as the t23 task chip;
     low shows a dim "prio" affordance (the empty-💬 idiom) so raising a low item is
     always one click away without a colored chip claiming attention. Disabled under
     the dup-id guard — a priority write keyed on an ambiguous id would misfire (o10).
     `stop` swallows the click on a proposal head so cycling never toggles the card. */
  const prioBtn = (it, stop) => {
    const p = prioOf(it);
    const dup = isDup(it);
    return html`<button className=${"todo-prio " + p + (p === "low" ? " empty" : "")}
      disabled=${busy || dup}
      title=${dup ? dupTitle(it) : "priority: " + p + " — click to cycle low → medium → high"}
      onClick=${e => { if (stop) e.stopPropagation(); setPriority(it); }}>${p === "low" ? "prio" : p}</button>`;
  };
  const commentsOf = (it) => Array.isArray(it.comments) ? it.comments : [];
  /* postComment() VERIFIES-AFTER-WRITE, mirroring add()'s type check, because the
     backend's `update` op round-trips only {text,note,status} and SILENTLY STRIPS
     `comments`/`query` from `fields` while still answering ok:true (the same
     whitelist wall as the historical type-coercion; operator item o8 widens it).
     So we POST the full new comments array, then read the item back out of the
     response (update echoes the whole board) and confirm OUR comment actually
     landed before rendering it as saved. If the backend stripped it, we keep the
     draft, show the honest o8 status, and setState to the stripped board so the
     thread does NOT show a phantom comment. When o8 lands this code is unchanged —
     the write simply starts persisting and `landed` starts coming back true. */
  const postComment = (it) => {
    const t = (draft[it.id] || "").trim();
    if (!t) return;
    const mine = { by: "operator", ts: Math.floor(Date.now() / 1000), text: t };
    const next = commentsOf(it).concat([mine]);
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", signal,
        body: JSON.stringify({ op: "update", id: it.id, fields: { comments: next } }) })
      .then(d => {
        if (!d.ok) return say(d.error || "failed", true);
        // first-match hazard (operator item o10): find() returns the FIRST item with
        // this id, so on a duplicate-id board it could read back the wrong item. The
        // dup-id guard disables comment-add on such items (isDup), so this line isn't
        // reached for them — but that hazard is exactly why the guard exists.
        const saved = (d.state.items || []).find(i => i.id === it.id);
        const landed = saved && commentsOf(saved).some(
          c => c && c.by === mine.by && c.ts === mine.ts && c.text === mine.text);
        setState(d.state);
        if (landed) { setDraft(m => ({ ...m, [it.id]: "" })); say("💬 comment added"); }
        else say("comments aren't enabled on the backend yet (operator item o8) — not saved", true);
      })
      .catch(fail("comment")));
  };
  /* 📎 long revisions (o14) — a long reply or a whole rewritten item is too big for a
     one-line comment, so its body is written to a FILE in the VM (POST …/todo-revision,
     op:write, per-op key whitelist) and announced by a compact 📎 pointer comment posted
     through the normal comment path. REV_PREFIX is the wire marker both sides key on;
     the pointer is `📎 revision: <path> — <first 120 chars, single-line>`. */
  const REV_PREFIX = "📎 revision: ";
  const revSummary = (t) => String(t).replace(/\s+/g, " ").trim().slice(0, 120);
  const parseRev = (t) => {
    if (typeof t !== "string" || t.slice(0, REV_PREFIX.length) !== REV_PREFIX) return null;
    const rest = t.slice(REV_PREFIX.length);
    const sep = rest.indexOf(" — ");           // path never contains " — " (it is ~/board-revisions/<id>-<ts>.md)
    return sep < 0 ? { path: rest.trim(), summary: "" }
                   : { path: rest.slice(0, sep).trim(), summary: rest.slice(sep + 3).trim() };
  };
  // auto-grow a revision textarea to its content (capped, then it scrolls) — a ref
  // callback so it sizes on mount AND every keystroke, no shared ref needed.
  const growTA = (el) => { if (el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 300) + "px"; } };
  /* attach: write the body to a file, THEN — verify-after-write, exactly like
     postComment — post the 📎 pointer comment and confirm it landed before collapsing
     the composer. The two error surfaces the brief names: a 404/network (route not yet
     installed host-side) degrades to the honest o14 hint (the t21 route-pending idiom);
     any other status shows the sidecar's own error text (oversize/413, bad id, …). */
  const revFail = (e) => {
    if (cancelled.current) return say("revision cancelled", true);
    if (e && e.timedOut) return say("revision timed out — try again", true);
    if (!e || e.status === 404 || !e.status) return say("revision files need the host installer (o14)", true);
    return say(e.message || "revision failed", true);
  };
  const attachRevision = (it) => {
    const body = longDraft[it.id] || "";
    if (!body.trim()) return;
    guard(signal => api("/api/vm/" + vm + "/todo-revision", { method: "POST", signal,
        body: JSON.stringify({ op: "write", id: it.id, text: body }) })
      .then(w => {
        if (!w.ok) return say(w.error || "revision write failed", true);
        const mine = { by: "operator", ts: Math.floor(Date.now() / 1000),
                       text: REV_PREFIX + w.path + " — " + revSummary(body) };
        const next = commentsOf(it).concat([mine]);
        return api("/api/vm/" + vm + "/todo", { method: "POST", signal,
            body: JSON.stringify({ op: "update", id: it.id, fields: { comments: next } }) })
          .then(d => {
            if (!d.ok) return say(d.error || "failed", true);
            const saved = (d.state.items || []).find(i => i.id === it.id);
            const landed = saved && commentsOf(saved).some(
              c => c && c.by === mine.by && c.ts === mine.ts && c.text === mine.text);
            setState(d.state);
            if (landed) {
              setLongDraft(m => ({ ...m, [it.id]: "" }));
              setLongMode(m => ({ ...m, [it.id]: false }));   // collapse back to the one-line composer
              say("📎 revision attached (" + w.bytes + " bytes) — pointer posted");
            } else {
              say("comments aren't enabled on the backend yet (operator item o8) — pointer not saved", true);
            }
          });
      })
      .catch(revFail));
  };
  // view: fetch a pointer's file (op:read) into revData[path]; a read failure is shown
  // inline under the pointer (which stays visible), never as a whole-drawer error — so
  // it uses a plain fetch + local state, like the ⏱ history / ⚡ activity pulls.
  const loadRev = (path) => {
    setRevData(m => ({ ...m, [path]: { loading: true } }));
    api("/api/vm/" + vm + "/todo-revision", { method: "POST", body: JSON.stringify({ op: "read", path }) })
      .then(d => setRevData(m => ({ ...m, [path]: d.ok ? { text: d.text || "" } : { error: d.error || "read failed" } })))
      .catch(e => setRevData(m => ({ ...m, [path]:
        { error: (e && e.status === 404) ? "route not installed (o14)" : ((e && e.message) || String(e)) } })));
  };
  const toggleRev = (path) => {
    const willOpen = !revOpen[path];
    setRevOpen(m => ({ ...m, [path]: willOpen }));
    if (willOpen && !revData[path]) loadRev(path);   // fetch once, on first open
  };
  // Discord bridge: attach a hugpy comms-session endpoint so operator messages
  // in that channel queue items here (and get confirmations back) — the same
  // non-interrupting file channel, reachable from anywhere Discord is.
  const discord = () => {
    api("/api/vm/" + vm + "/todo/discord").then(d => {
      const cur = d.configured
        ? "connected to #" + d.channel + (d.last_error ? " — last error: " + d.last_error : "")
        : "not connected";
      const ep = prompt(
        "Discord bridge for " + vm + " (" + cur + ").\n" +
        "Paste a hugpy comms-session endpoint URL (…/api/discord/session/<token>) — blank = disconnect:", "");
      if (ep === null) return;
      guard(signal => api("/api/vm/" + vm + "/todo/discord", { method: "POST", signal,
          body: JSON.stringify({ endpoint: ep.trim() || null }) })
        .then(r => {
          if (r.ok) say(r.configured
            ? "🔗 bridged to #" + r.channel + " — messages there now queue items here (poll ~30s)"
            : "bridge disconnected");
          else say(r.error || "bridge failed", true);
        })
        .catch(fail("bridge")));
    }).catch(e => say("bridge status: " + (e.message || e), true));
  };

  const items = (state && state.items) || [];
  /* Duplicate-id guard — defense-in-depth for the backend's match-by-FIRST-id
     hazard (operator item o10). A board can carry two items sharing one id (hugpy
     had t33 as BOTH a done request AND an open proposal). Every mutating op targets
     an item BY id, and the host matches the FIRST item with that id, so accept /
     comment / status-cycle on the SECOND silently lands on the FIRST — "doesn't
     stick," and can clobber the wrong item's note. The frontend has nothing to
     disambiguate by except the same id the backend keys on, so it does the honest
     thing: NAME the collisions in a banner (below) and REFUSE the ambiguous writes
     (isDup gates the mutating controls). dupIds is the set of ids seen more than
     once; on a normal board it is EMPTY and every check below is a no-op — nothing
     renders, nothing is disabled, behaviour is byte-for-byte unchanged. */
  const dupIds = useMemo(() => {
    const seen = new Set(), dup = new Set();
    for (const it of items) { if (seen.has(it.id)) dup.add(it.id); else seen.add(it.id); }
    return dup;
  }, [items]);
  const isDup = (it) => dupIds.has(it.id);
  const dupTitle = (it) => "disabled: duplicate id " + it.id
    + " — a write would hit the wrong item (the backend matches the first with this id); make ids unique first";
  /* ✨ tidy selection (board t42). An item is selectable iff it is NOT a duplicate-id
     item (a write keyed on a dup id is ambiguous — the same reason the guard disables
     its other controls). Selection is stored as a Set of ids; selectedIn() re-derives the
     live selectable items each render, so a stale id (a poll dropped the item, or it went
     dup) simply stops resolving and drops out of every transform's target set. */
  const selectable = (it) => !isDup(it);
  const toggleSel = (it) => setSel(s => { const n = new Set(s); n.has(it.id) ? n.delete(it.id) : n.add(it.id); return n; });
  // the live, selectable items a given tab's list currently offers — the unit select-all
  // toggles and the scoped transforms consume (never a dup, never a phantom id).
  const selectableIn = (list) => list.filter(selectable);
  const selectedIn = (list) => selectableIn(list).filter(it => sel.has(it.id));
  // the per-item ✨ tidy checkbox — rendered ONLY while the menu is armed (menuOpen), so
  // a normal board is visually unchanged. A dup-id item's box is disabled (its writes are
  // ambiguous). `stop` swallows the click on a proposal head so ticking never expands it.
  const selBox = (it, stop) => menuOpen && html`
    <label className=${"todo-sel" + (isDup(it) ? " off" : "")} title=${isDup(it) ? dupTitle(it) : "select this item for the ✨ tidy transform"}
           onClick=${stop ? (e => e.stopPropagation()) : undefined}>
      <input type="checkbox" checked=${sel.has(it.id)} disabled=${isDup(it)} onChange=${() => toggleSel(it)} /></label>`;
  /* A decided ⚖ keeps its card — the pros/cons ARE the record of why the call
     went that way, and flattening it into `done` would throw that away. But it
     sinks below the undecided ones and stops being counted, because a section
     header reading "need a decision" over a settled proposal is the same species
     of lie as a board that renders "loading…" forever. */
  const proposals = items.filter(i => i.type === "proposal" && !isMsgItem(i, vm))
    // decided cards keep sinking below the undecided; among the UNDECIDED, high →
    // medium → low (t-priority). Decided cards stay in their current relative order —
    // a settled decision's priority is history, not standing urgency. Stable sort.
    .sort((a, b) => ((a.status === "done") - (b.status === "done"))
                 || (a.status !== "done" ? PRIO_RANK[prioOf(a)] - PRIO_RANK[prioOf(b)] : 0));
  /* board t45: the reserved relay-cadence item. `relay` is the cfg-relay item itself
     (null = uninitialized — the keeper hasn't minted it yet), `relayDup` reuses the
     dup-id guard (a duplicated cfg-relay is an ambiguous write target, so the knob
     disables, same doctrine as every other control). It is CONFIG, not a checkpoint,
     so it is hidden from the 🔖 bookmarks list — every id in CFG_IDS (board t80 added
     cfg-agent-deploy to that set, generalizing what used to be a lone `!== RELAY_ID`
     check) — and the tab badge (bookmarks.length) follows automatically. It renders
     NOWHERE else: a bookmark type never lands in the queue/operator/proposal/done
     buckets. */
  const relay = items.find(i => i.id === RELAY_ID) || null;
  const relayDup = dupIds.has(RELAY_ID);
  const bookmarks = items.filter(i => i.type === "bookmark" && !CFG_IDS.has(i.id) && !isMsgItem(i, vm))
    // open pins surface above done ones, newest first within each — a bookmark
    // board reads as "current checkpoints, then history", not append order
    // (operator ask, board t57). Same stable done-sinks idiom as `proposals`.
    .sort((a, b) => ((a.status === "done") - (b.status === "done"))
                 || (b.ts || 0) - (a.ts || 0));
  const done = items.filter(i => i.type !== "bookmark" && i.type !== "proposal" && i.status === "done" && !isMsgItem(i, vm));
  /* board t100: the ✉ board bucket — every peer/VM message item plus the peer-inbox
     reply feed, reverse-chron (a conversation reads newest-first; feed and messages
     interleave by their own timestamps). This is a BOARD bucket like operator/
     proposals — the bridge-mail view keeps its own `messages` state below it. */
  const msgItems = items.filter(i => isMsgItem(i, vm)).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  /* Write the chosen cadence into cfg-relay's note. VERIFIES-AFTER-WRITE, exactly like
     postComment(): `note` is on the update whitelist, but rather than trust ok:true we
     read cfg-relay back out of the echoed board and confirm OUR value parsed back before
     reporting success — so a backend that silently dropped the write can't leave the knob
     lying. Refused on a missing/duplicated item (the select isn't even offered then). */
  const setRelay = (secs) => {
    if (!relay || relayDup) return;
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", signal,
        body: JSON.stringify({ op: "update", id: RELAY_ID,
                               fields: { note: JSON.stringify({ board_quiet_secs: secs }) } }) })
      .then(d => {
        if (!d.ok) return say(d.error || "failed", true);
        const saved = (d.state.items || []).find(i => i.id === RELAY_ID);
        const landed = saved && parseRelaySecs(saved.note) === secs;
        setState(d.state);
        if (landed) say("⏱ push cadence → " + relayLabel(secs));
        else say("the push-cadence write didn't land (cfg-relay note unchanged on the board) — try again", true);
      })
      .catch(fail("push cadence")));
  };
  /* The knob itself, rendered in the drawer toolbar. Four honest states:
       · board not loaded (null/errored) → nothing (we don't know the board yet);
       · no cfg-relay item → an "uninitialized" hint (the keeper mints the reserved id;
         the console API can't, so we NEVER forge an add);
       · cfg-relay duplicated → disabled, wearing the dup-id guard's own tooltip;
       · live → a compact select; a non-preset current value shows as its own option,
         and an unreadable note shows "—" (re-selecting overwrites it clean). */
  const relayKnob = () => {
    if (state === null || err) return null;
    if (!relay) return html`
      <span className="todo-knob off" title=${RELAY_HELP + " — not initialized yet; the keeper creates the reserved cfg-relay item (the console API can't mint its id)"}>
        ⏱ push: <em>set by keeper</em></span>`;
    if (relayDup) return html`
      <span className="todo-knob off" title=${dupTitle(relay)}>⏱ push: <em>dup id</em></span>`;
    const secs = parseRelaySecs(relay.note);
    const bad = secs === null;
    const opts = RELAY_PRESETS.slice();
    if (!bad && !opts.includes(secs)) opts.push(secs);   // surface a custom value as its own option
    opts.sort((a, b) => a - b);
    return html`
      <label className=${"todo-knob" + (bad ? " off" : "")}
             title=${bad ? "unreadable value; re-set to fix — " + RELAY_HELP : RELAY_HELP}>
        ⏱ push:
        <select value=${bad ? "" : String(secs)} disabled=${busy}
                onChange=${e => setRelay(Number(e.target.value))}>
          ${bad && html`<option value="" disabled>—</option>`}
          ${opts.map(s => html`<option key=${s} value=${String(s)}>${relayLabel(s)}</option>`)}
        </select>
      </label>`;
  };
  /* ⚡ ACTIVITY METER (board t46) — the compact relay-liveness readout that rides the
     toolbar beside the ⏱ knob. Renders unconditionally off `activity` (independent of the
     board load/err — it has its own data source): a known last-activity age when we have
     the data, "⚡ —" quietly otherwise. Stale (>30m) → .warn tint; the tooltip carries the
     exact age, the quiet-gate window, and the snapshot's as-of stamp. */
  const actMeter = activityMeter(activity);
  const activityKnob = () => html`
    <span className=${"todo-act" + (actMeter.warn ? " warn" : "")} title=${actMeter.title}>${actMeter.label}</span>`;
  /* The queue, the operator-waiting list, and the count of proposals still awaiting a
     decision all come from the SHARED standingBuckets() (board t25) — the very buckets
     the ☑ toolbar ticker sums, so the tab badges and the button's badge can't drift.
     `proposals` above still lists DECIDED cards too (they stay in their section, badge 0);
     standingBuckets.propPending counts only the undecided ones. `open` drops ⚑/⚖ outright:
     a ⚑ is either not-done (its own section) or done (falls through to `done`), and a ⚖
     is always a card in its section, never a row. */
  const { open, operator, propPending: propPendingItems, directions } = standingBuckets(items, vm);
  const propPending = propPendingItems.length;
  /* board t-refchips: allIds is the "does this token resolve" gate extractRefs uses —
     every id currently on the loaded board, case-sensitive. idTabMap is which DRAWER
     TAB a resolved id currently lives in, built from the same five buckets the tab
     strip itself renders (open/proposals/operator/bookmarks/done) so it can never
     disagree with what's on screen — no re-derivation of the bucket rules. */
  const allIds = useMemo(() => new Set(items.map(i => i.id)), [items]);
  const idTabMap = useMemo(() => {
    const m = new Map();
    for (const it of open) m.set(it.id, "queue");
    for (const it of proposals) m.set(it.id, "proposals");
    for (const it of directions) m.set(it.id, "directions");   // 🧭 ref-chip jumps land on the directions tab
    for (const it of operator) m.set(it.id, "operator");
    for (const it of bookmarks) m.set(it.id, "bookmarks");
    for (const it of done) m.set(it.id, "done");
    for (const it of msgItems) m.set(it.id, "messages");   // t100: ref-chip jumps land on the ✉ tab
    return m;
  }, [open, proposals, directions, operator, bookmarks, done, msgItems]);
  const toggleRefsOpen = (id) => setRefsOpen(m => ({ ...m, [id]: !m[id] }));
  /* jumpToId: switch to the tab the target lives in, then let the scroll+flash effect
     (below, once the tab's content has actually mounted) do the rest. A target that
     resolved out of allIds but isn't in any bucket (shouldn't happen — the buckets
     partition every non-history item) is a silent no-op rather than a crash. */
  const jumpToId = (id) => {
    const t = idTabMap.get(id);
    if (t === undefined) return;
    if (t === "proposals") setPropOpen(m => ({ ...m, [id]: true }));  // land on an OPEN card, not a collapsed head
    setTab(t);
    setFlashId(id);
    if (flashTimer.current) clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setFlashId(null), 1400);
  };
  // click a sha chip: copy it, no navigation — the console has no code viewer to jump to.
  const copySha = (sha) => { const ok = copyText(sha); say(ok ? "sha copied — " + sha : "copy blocked by browser", !ok); };
  /* board t-itemids: click an item's OWN id tag → copy it, same idiom as copySha
     (copyText + the drawer's say() toast for the brief "copied" feedback). */
  const copyId = (id) => { const ok = copyText(id); say(ok ? "id copied — " + id : "copy blocked by browser", !ok); };
  /* idTag: the item's own id, rendered as a quiet monospace button — present on
     EVERY row/card regardless of whether it carries any ref chips (refsChips can
     legitimately return []). Kept as its own small helper (not folded into
     refsChips) precisely so it never depends on the item having refs. */
  const idTag = (it) => html`<button className="todo-id" disabled=${isDup(it)} title=${"copy id — " + it.id}
      onClick=${e => { e.stopPropagation(); copyId(it.id); }}>${it.id}</button>`;
  const refFlashCls = (id) => flashId === id ? " todo-flash" : "";
  const rowRef = (id) => (el) => { if (el) rowNodes.current[id] = el; };
  // once the jump has switched tabs and the target has (re)mounted, scroll it into view.
  useEffect(() => {
    if (!flashId) return;
    const el = rowNodes.current[flashId];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }, [tab, flashId]);
  /* Default active tab: the first of queue > proposals > operator carrying an
     ACTIONABLE count (proposals count their pending, not their decided cards),
     else queue. Runs ONCE per board — the tabInit guard means the 10s refresh,
     which swaps `state` out from under us, can never yank the tab away; only the
     operator's clicks move it after this. Fires on the first successful load
     (state !== null), so a load that only ever errors never locks a default. */
  useEffect(() => {
    if (tabInit.current || state === null) return;
    tabInit.current = true;
    setTab(open.length ? "queue" : propPending ? "proposals" : operator.length ? "operator" : "queue");
  }, [state]);
  /* Feed the ☑ toolbar ticker (board t25): whenever the board changes — the 10s poll
     OR any local mutation (both land through setState) — hand App this vm's fresh
     standing summary, so while the drawer is open the button badge mirrors the
     drawer's (fresher) number. Skipped while state is null (a load-in-progress must
     not report a phantom 0). */
  useEffect(() => {
    if (state && onCount) onCount(vm, standingTicker(items, vm));
  }, [state]);
  const when = (ts) => ts ? new Date(ts * 1000).toLocaleString([], { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  // comment timestamps read as a relative age ("just now" / "2m ago") — a thread is
  // a conversation, so recency matters more than a wall-clock date does on a row.
  const rel = (ts) => {
    if (!ts) return "";
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 45) return "just now";
    if (s < 3600) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  };
  /* A thread's default open-state: OPEN when the item carries a ❓ query (the answer
     belongs in the thread, so surface it unasked), CLOSED otherwise — an explicit
     click in threadOpen always wins over that default. */
  const threadIsOpen = (it) => threadOpen[it.id] !== undefined ? threadOpen[it.id] : !!it.query;
  const toggleThread = (it) => setThreadOpen(m => ({ ...m, [it.id]: !threadIsOpen(it) }));
  // the 💬 count toggle — shared by rows and proposal heads; "💬 N" when a thread
  // exists, a dim bare 💬 (.empty) otherwise. `asToggle` false = a proposal head
  // indicator (the card head is the toggle, so it just bubbles, no own handler).
  const commentsBtn = (it, asToggle) => {
    const n = commentsOf(it).length;
    const cls = "todo-comments-btn" + (n ? "" : " empty");
    const title = n ? n + " comment" + (n === 1 ? "" : "s") + (asToggle ? " — click to " + (threadIsOpen(it) ? "hide" : "show") : "")
                    : "start a comment thread";
    const label = n ? "💬 " + n : "💬";
    return asToggle
      ? html`<button className=${cls} title=${title} onClick=${() => toggleThread(it)}>${label}</button>`
      : html`<span className=${cls} title=${title}>${label}</span>`;
  };
  // the thread itself — comments one-per-line (`by · relative-age — text`, all plain
  // text nodes: React escapes them, so there is no HTML-injection surface) plus an
  // operator comment box. by is always "operator": the console user IS the operator;
  // keeper comments arrive through the keeper's own file writes, never from here.
  // a single 📎 revision pointer comment: its summary + a "view" toggle that fetches the
  // file (op:read) and renders it (docs md renderer) in a collapsible block. Read failures
  // show inline; the pointer line stays visible either way.
  const revLine = (c, i, rv) => {
    const open = !!revOpen[rv.path];
    const data = revData[rv.path];
    return html`<div key=${i} className="todo-comment">
      <span className="todo-comment-meta">${c.by} · ${rel(c.ts)}</span> — <span className="todo-rev-tag" title=${rv.path}>📎 revision</span> ${rv.summary && html`<span className="todo-rev-sum">${rv.summary}</span> `}<button className="todo-rev-view" title=${open ? "hide the revision file" : "load & show the full revision file"} onClick=${() => toggleRev(rv.path)}>${open ? "hide" : "view"}</button>
      ${open && html`<div className="todo-rev-body">
        ${!data || data.loading
          ? html`<div className="todo-rev-load">loading…</div>`
          : data.error
            ? html`<div className="todo-rev-err">couldn't load (${data.error})</div>`
            : html`<div className="md">${mdRender(data.text).nodes}</div>`}
      </div>`}
    </div>`;
  };
  const thread = (it) => {
    const cs = commentsOf(it);
    // the thread stays fully readable on a dup-id item — only the WRITE (comment-add /
    // 📎 attach) is refused, because a write matches the first item with this id (o10).
    const dup = isDup(it);
    const long = !!longMode[it.id];
    return html`
      <div className="todo-thread">
        ${cs.length
          ? cs.map((c, i) => {
              const rv = parseRev(c.text);
              return rv ? revLine(c, i, rv)
                        : html`<div key=${i} className="todo-comment">
                            <span className="todo-comment-meta">${c.by} · ${rel(c.ts)}</span> — ${isRefItem(it)
                              ? html`<${BMD.Body} cls="bmd-inl" src=${c.text} onCopy=${m => say(m)} />` : richSpans(c.text)}</div>`;
            })
          : html`<div className="todo-thread-empty">no comments yet</div>`}
        <div className="todo-comment-add">
          ${long
            ? html`<div className="todo-long">
                <textarea ref=${growTA} value=${longDraft[it.id] || ""}
                          placeholder="long revision content (Markdown ok) — written to a file in the VM; a 📎 pointer is posted here"
                          disabled=${busy || dup}
                          onInput=${e => { setLongDraft(m => ({ ...m, [it.id]: e.target.value })); growTA(e.target); }} />
                <div className="todo-long-acts">
                  <button className="btn" disabled=${busy || dup || !(longDraft[it.id] || "").trim()}
                          title="write this revision to a file and post its 📎 pointer" onClick=${() => attachRevision(it)}>attach & post</button>
                  <button className="todo-long-cancel" disabled=${busy} title="back to a one-line comment"
                          onClick=${() => setLongMode(m => ({ ...m, [it.id]: false }))}>✕ 📎 long</button>
                </div>
              </div>`
            : html`
              <input value=${draft[it.id] || ""} title=${dup ? dupTitle(it) : undefined}
                     placeholder=${dup ? "commenting disabled — duplicate id" : "comment as operator… (Enter = comment)"} disabled=${busy || dup}
                     onInput=${e => setDraft(m => ({ ...m, [it.id]: e.target.value }))}
                     onKeyDown=${e => { if (e.key === "Enter") postComment(it); }} />
              <button className="btn" disabled=${busy || dup} title=${dup ? dupTitle(it) : undefined} onClick=${() => postComment(it)}>comment</button>
              <button className="todo-long-toggle" disabled=${busy || dup}
                      title=${dup ? dupTitle(it) : "📎 attach a long reply/revision as a file instead of a one-line comment"}
                      onClick=${() => setLongMode(m => ({ ...m, [it.id]: true }))}>📎 long</button>`}
        </div>
      </div>`;
  };
  /* Structured operator fields (board t23) — worker/task/cmd are keeper-authored:
     the backend add op can't carry them (so the add dropdown stays text-only), but
     any item that has them renders them in whatever tab shows it. cmd normalizes
     string → [string]; a line whose first non-space char is # is a comment/caveat,
     rendered dim and excluded from what the ⧉ button copies. */
  const cmdLines = (cmd) => Array.isArray(cmd) ? cmd : cmd == null ? [] : [cmd];
  const isCmt = (ln) => /^\s*#/.test(ln);
  /* board t82: a note rendered as its parsed timeline (noteSegments above). A single-
     segment note returns the RAW string — the exact child both call sites rendered
     before, so a convention-free note is byte-identical to today. Multi-segment: the
     NEWEST segment stays inline in the note's current style; the earlier ones hide
     behind a "+N earlier" toggle (noteOpen, per item id — pure view state, like
     refsOpen). Every shown segment is VERBATIM (its opener text included — the chip is
     additive), so the expanded view reads as the whole note minus the separators.
     PROP_MARK is the caller's business: propCard passes the already-stripped body.
     board t99: `rich` renders each segment's BODY through richNodes (paragraphs/
     bullets/fences/`code`) — EXPANDED views only (thread-open rows, prop bodies).
     Compact call sites omit it and get today's raw-string path byte-identical. */
  /* keeper-4: a rich segment's body routes through the '## History' fold
     (richHistory above): the archive of dated entries collapses behind the same
     fold idiom as the segment timeline, with the NEWEST entry (by its opening
     date, so newest-first and newest-last authors both win) kept visible and
     any section AFTER History ('## Provenance'…) rendered outside the fold.
     histOpen keys "id:segIdx" — per note-segment view state, like noteOpen.
     A note with no History heading renders through richNodes untouched. */
  const richSegNodes = (hk, seg) => {
    const hist = richHistory(seg);
    if (!hist) return richNodes(seg);
    const open = !!histOpen[hk];
    const n = hist.entries.length - 1;
    return html`
      ${richNodes(hist.head)}
      <div className="todo-hist">
        <span className="todo-hist-h" title="the note's '## History' section — dated entries, newest kept visible">History</span>
        ${n > 0 && html`<button className="todo-note-fold"
            title=${open ? "collapse to the newest entry" : "show the " + n + " earlier entr" + (n === 1 ? "y" : "ies")}
            onClick=${e => { e.stopPropagation(); setHistOpen(m => ({ ...m, [hk]: !m[hk] })); }}
            onDblClick=${e => e.stopPropagation()}>${(open ? "−" : "+") + n + " earlier"}</button>`}
        ${(open ? hist.entries : hist.entries.slice(richHistoryNewest(hist.entries)).slice(0, 1))
          .map((en, i) => html`<div key=${i} className="todo-hist-entry">${richNodes(en)}</div>`)}
      </div>
      ${hist.tail.trim() !== "" && richNodes(hist.tail)}`;
  };
  const noteView = (id, note, rich) => {
    const segs = noteSegments(note);
    const segBody = (seg, si) => rich ? html`<span className="todo-rich">${richSegNodes(id + ":" + si, seg)}</span>` : seg;
    if (segs.length < 2) return segBody(note, 0);
    const open = !!noteOpen[id];
    const shown = open ? segs : segs.slice(-1);
    const n = segs.length - 1;
    return html`
      <button className="todo-note-fold"
              title=${open ? "collapse to the latest update" : "show the " + n + " earlier update" + (n === 1 ? "" : "s")}
              onClick=${e => { e.stopPropagation(); setNoteOpen(m => ({ ...m, [id]: !m[id] })); }}
              onDblClick=${e => e.stopPropagation()}>
        ${(open ? "−" : "+") + n + " earlier"}</button>
      ${shown.map((seg, i) => {
        const chip = noteChip(seg);
        return html`<span key=${i} className=${"todo-note-seg" + (i === shown.length - 1 ? " latest" : "")}>
          ${chip && html`<span className="todo-note-chip" title="segment opener — text shown verbatim below">${chip}</span>`}${segBody(seg, open ? i : segs.length - 1)}</span>`;
      })}`;
  };
  const row = (it, idx) => {
    const cmds = it.cmd ? cmdLines(it.cmd) : [];
    const dup = isDup(it);
    /* board t99: a row is COMPACT (one line: the first non-blank line of text +
       a "…" affordance when there's more) until its thread is open — threadIsOpen
       is already the row's only expand state, so the affordance reuses toggleThread
       rather than inventing a parallel one. Expanded, text and note render through
       richNodes/noteView(rich): paragraphs, bullets, fences, `code`. A single-line
       item with a single-line note renders byte-identical to before. */
    const xp = threadIsOpen(it);
    const fl = richFirstLine(it.text);
    const more = fl.more || /\n/.test(it.note || "");
    // key threads the render index so a REPEATED it.id can't collide (React would
    // otherwise merge the siblings). it.id sent to the API is untouched (o10).
    return html`
    <div key=${it.id + ":" + idx} ref=${rowRef(it.id)} className=${"todo-row " + it.status + refFlashCls(it.id)}>
      ${selBox(it, false)}
      <button className=${"todo-st " + it.status} disabled=${busy || dup}
              title=${dup ? dupTitle(it) : "status: " + it.status + " — click → " + TODO_NEXT[it.status]}
              onClick=${() => op({ op: "update", id: it.id, fields: { status: TODO_NEXT[it.status] } })}>
        ${it.status === "done" ? "✓" : it.status === "doing" ? "…" : "○"}</button>
      <span className="todo-ic" title=${it.type}>${TODO_ICON[it.type] || "☑"}</span>
      ${idTag(it)}
      ${it.type !== "bookmark" && prioBtn(it, false)}
      ${it.task && html`<span className="todo-task" title="task category">${it.task}</span>`}
      ${it.worker && html`<span className="todo-worker" title="worker / box that runs it">@${it.worker}</span>`}
      ${refsChips(it, allIds, !!refsOpen[it.id], jumpToId, copySha, toggleRefsOpen)}
      <span className="todo-meta">${it.by} · ${when(it.ts)}</span>
      <button className="todo-x" disabled=${busy || dup} title=${dup ? dupTitle(it) : "delete"}
              onClick=${() => op({ op: "del", id: it.id })}>✕</button>
      ${commentsBtn(it, true)}
      <!-- board t77: text rides its OWN full-width row (flex-basis:100% on .todo-text,
           the same trick .todo-cmd/.todo-thread/.todo-query already use below) so it
           never shares a line with the identifier chips above — status/icon/id/prio/
           task/@worker/refs/by·timestamp meta/✕/💬 all sit on the row ABOVE it,
           regardless of how much width the line has to spare. -->
      ${isRefItem(it)
        ? html`<${BMD.Item} text=${it.text} note=${it.note} done=${it.status === "done"} onCopy=${m => say(m)} operator=${it.type === "operator"}
                 oneLiner=${it.one_liner} rollbackOneLiner=${it.rollback_one_liner} result=${it.result}
                 extraCmd=${cmds.filter(l => !isCmt(l)).join("\n")} onDblClick=${() => { if (!dup) edit(it); }} />`
        : xp
        ? html`<div className="todo-text todo-rich" title=${dup ? dupTitle(it) : undefined} onDblClick=${() => { if (!dup) edit(it); }}>
            ${richNodes(it.text)}${it.note && html`<div className="todo-note">${noteView(it.id, it.note, true)}</div>`}</div>`
        : html`<span className="todo-text" title=${dup ? dupTitle(it) : (it.note || "")} onDblClick=${() => { if (!dup) edit(it); }}>
            ${fl.head}${more && html`<button className="todo-more" title="multi-line item — expand to the formatted view"
                onClick=${e => { e.stopPropagation(); toggleThread(it); }}>…</button>`}${it.note && html` <span className="todo-note">— ${noteView(it.id, it.note)}</span>`}</span>`}
      <!-- query is keeper-authored and READ-ONLY from the console in v1: the same
           whitelist wall that strips comments would strip a query written here (o8),
           so there is no query input — the operator answers it in the thread below. -->
      ${it.query && html`<div className="todo-query" title="a question whose answer unblocks this — reply in the thread">❓ ${it.query}</div>`}
      ${cmds.length > 0 && html`
        <div className="todo-cmd">
          <button className="todo-cmd-copy" title="copy the runnable command(s)"
                  onClick=${() => { copyText(cmds.filter(l => !isCmt(l)).join("\n")); say("command copied"); }}>⧉</button>
          <div className="todo-cmd-lines">
            ${cmds.map((ln, i) => html`<div key=${i} className=${"todo-cmd-ln" + (isCmt(ln) ? " cmt" : "")}>${ln}</div>`)}
          </div>
        </div>`}
      ${threadIsOpen(it) && thread(it)}
    </div>`;
  };

  /* A decision is spelled as status:done + a "[accepted] "/"[declined] " prefix
     on the note because those are the only fields `update` will actually keep
     (see PROP_MARK above). The keeper's original note is preserved AFTER the
     marker — it carries the context the decision was made against — and any
     existing marker is stripped first so re-deciding can't stack them.
     No status-cycle button here: on a ⚖ the decision IS the status, and two
     controls writing the same field would just disagree with each other. */
  const decide = (it, verdict) =>
    op({ op: "update", id: it.id,
         fields: { status: "done", note: ("[" + verdict + "] " + propNote(it.note)).trim() } },
       "proposal " + verdict);
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  const propCard = (it, idx) => {
    const pros = propList(it.pros), cons = propList(it.cons), rec = propRec(it.rec);
    const verdict = propVerdict(it.note), body = propNote(it.note);
    // board-md: a PENDING proposal opens by default (static reference, nothing
    // hidden); decided cards stay folded until clicked. An explicit click wins.
    const expanded = propOpen[it.id] !== undefined ? !!propOpen[it.id] : (isRefItem(it) && it.status !== "done");
    const dup = isDup(it);
    /* board t99: the card HEAD stays one line (first non-blank line + "…" when
       multi-line — the head itself is already the expand affordance); the OPEN
       body renders the full text rich, the note through noteView(rich), and
       pros/cons/rec through the `inline code` spans. */
    const fl = richFirstLine(it.text);
    // key threads the render index so a REPEATED it.id can't collide (o10) — the
    // id sent to the API is untouched; only the write actions are disabled below.
    return html`
      <div key=${it.id + ":" + idx} ref=${rowRef(it.id)} className=${"todo-prop" + refFlashCls(it.id)}>
        <div className="todo-prop-head" title=${expanded ? "collapse" : "expand"}
             onClick=${() => setPropOpen(m => ({ ...m, [it.id]: !expanded }))}>
          ${selBox(it, true)}
          <span className="todo-ic">${expanded ? "▾" : "▸"}</span>
          <span className="todo-ic" title="proposal">${TODO_ICON.proposal}</span>
          ${idTag(it)}
          ${prioBtn(it, true)}
          <span className="todo-prop-tw" title=${dup ? dupTitle(it) : undefined} onDblClick=${() => { if (!dup) edit(it); }}>
            ${fl.head}${fl.more && html`<span className="todo-more" title="multi-line proposal — expand the card for the formatted view">…</span>`}</span>
          ${refsChips(it, allIds, !!refsOpen[it.id], jumpToId, copySha, toggleRefsOpen)}
          ${verdict && html`<span className=${"todo-prop-badge " + (verdict === "accepted" ? "ok" : "bad")}>${verdict}</span>`}
          <span className="todo-prop-count">${plural(pros.length, "pro")} · ${plural(cons.length, "con")}</span>
          ${commentsBtn(it, false)}
          <button className="todo-x" disabled=${busy || dup} title=${dup ? dupTitle(it) : "delete"}
                  onClick=${e => { e.stopPropagation(); op({ op: "del", id: it.id }); }}>✕</button>
        </div>
        ${expanded && html`
          <div className="todo-prop-body">
            ${isRefItem(it)
              ? html`<${BMD.Item} text=${fl.more ? it.text : ""} note=${body} onCopy=${m => say(m)} />`
              : html`${fl.more && html`<div className="todo-prop-text todo-rich">${richNodes(it.text)}</div>`}
                ${body && html`<div className="todo-prop-note">${noteView(it.id, body, true)}</div>`}`}
            ${(pros.length || cons.length)
              ? html`<div className="todo-prop-cols">
                  <div className="todo-prop-col pro"><h4>pros</h4>
                    ${pros.length ? html`<ul>${pros.map((p, i) => html`<li key=${i}>${isRefItem(it) ? html`<${BMD.Body} cls="bmd-inl" src=${p} onCopy=${m => say(m)} />` : richSpans(p)}</li>`)}</ul>`
                                  : html`<div className="todo-prop-none">—</div>`}</div>
                  <div className="todo-prop-col con"><h4>cons</h4>
                    ${cons.length ? html`<ul>${cons.map((c, i) => html`<li key=${i}>${isRefItem(it) ? html`<${BMD.Body} cls="bmd-inl" src=${c} onCopy=${m => say(m)} />` : richSpans(c)}</li>`)}</ul>`
                                  : html`<div className="todo-prop-none">—</div>`}</div>
                </div>`
              : !isRefItem(it) && html`<div className="todo-prop-none">no pros or cons listed</div>`}
            ${rec && html`<div className="todo-prop-rec"><b>keeper recommends</b> — ${isRefItem(it) ? html`<${BMD.Body} cls="bmd-inl" src=${rec} onCopy=${m => say(m)} />` : richSpans(rec)}</div>`}
            <div className="todo-prop-acts">
              ${it.status !== "done" && html`<button className="btn" disabled=${busy || dup}
                  title=${dup ? dupTitle(it) : "accept — marks the proposal done and records [accepted] on its note"}
                  onClick=${() => decide(it, "accepted")}>✔ accept</button>`}
              ${it.status !== "done" && html`<button className="btn danger" disabled=${busy || dup}
                  title=${dup ? dupTitle(it) : "decline — marks the proposal done and records [declined] on its note"}
                  onClick=${() => decide(it, "declined")}>✕ decline</button>`}
              <span className="todo-meta">${it.by} · ${when(it.ts)}</span>
            </div>
            ${thread(it)}
          </div>`}
      </div>`;
  };

  /* One entry per tab, in strip order. `badge` is the number ticker painted on
     the tab; `list` is the bucket itself and its length drives whether the tab
     looks alive — a proposals tab holding only DECIDED cards has badge 0 but a
     non-empty list, so it must NOT recede. The active list is rendered below with
     the SAME row/propCard renderers used before, so the cards are untouched. */
  /* Unread = messages the route flags unread; if it carries no such flag we count
     NOTHING rather than guess (a wrong badge is worse than no badge). */
  const msgUnread = ((messages && messages.items) || [])
    .filter(x => x && (x.unread === true || x.read === false)).length;
  const tabs = [
    /* t-priority: the queue + operator lists render prioSorted (high → medium → low,
       stable within a rank); proposals got their priority ordering in the comparator
       above. Bookmarks + done are deliberately untouched — finished/pinned items have
       no standing urgency to sort by. Badges still count the RAW buckets. */
    { key: "queue",     label: "☑ queue",      list: prioSort(open), badge: open.length,
      empty: "queue clear — nothing waiting" },
    { key: "proposals", label: "⚖ proposals",  list: proposals, badge: propPending, warn: propPending > 0,
      empty: "no proposals from the keeper" },
    /* 🧭 directions — a KNOWLEDGE lane (board direction type): session-uncovered
       clarifications/determinations. A tab like every board type, badge = the directions
       bucket length, list drives the alive/quiet look. Deliberately OUT of standingBuckets'
       ☑ work count (standingTicker sums open+operator+propPending only): knowledge, not work.
       Renders through the shared `row` (below) — text prominent, note as the secondary line. */
    { key: "directions", label: "🧭 directions", list: directions, badge: directions.length,
      empty: "no directions yet — session clarifications land here" },
    { key: "operator",  label: "⚑ operator",   list: prioSort(operator), badge: operator.length,
      empty: "nothing waiting on the operator" },
    { key: "bookmarks", label: "🔖 bookmarks",  list: bookmarks, badge: bookmarks.length,
      empty: "no bookmarks pinned yet" },
    { key: "done",      label: "done",          list: done,      badge: done.length,
      empty: "nothing marked done yet" },
    /* ⏱ history (board t32) is the journal, NOT a standing-work bucket: it carries
       NO count badge and empty `list:[]` keeps it permanently .quiet (dim) — clickable
       but recessive. Its content is `history` state, rendered by historyView() below,
       so it deliberately does not follow the list-length rendering path. The
       standingBuckets/ticker arithmetic never sees it. */
    { key: "history",   label: "⏱ history",     list: [],        badge: 0,
      empty: "no history yet — the journal starts recording from its first deploy" },
    /* ✉ messages: board t100 made this a REAL board bucket — peer/VM message items
       + the peer-inbox reply feed (msgItems) — stacked above the bridge-mail view
       (still `messages` state via msgView()). The list drives the tab's alive/quiet
       look like every board tab; the badge still counts bridge UNREAD only (board
       message items carry no read flag, and a count of everything ever received
       would be noise — no phantom "unread" is invented for them). Excluded from the
       standingBuckets arithmetic: conversation, not standing work. */
    { key: "messages",  label: "✉ messages",    list: msgItems,  badge: msgUnread,
      warn: msgUnread > 0,
      empty: "no messages — the bridge inbox is clear" },
  ];
  // the old ⚖ section-header nuance, kept as both the tab's tooltip and a line
  // atop the proposals content so "needs a decision" doesn't get lost in the swap.
  const propHint = propPending
    ? propPending + (propPending === 1 ? " needs" : " need") + " a decision" : "";
  const activeTab = tabs.find(t => t.key === tab) || tabs[0];
  /* ✨ tidy select-all (board t42) for the section on screen — the active tab's own
     selectable (non-dup) items. `allSel` is true only when every one of them is checked,
     so the box reads the section's state; toggling adds/removes the whole set at once. */
  const tabSelectable = selectableIn(activeTab.list);
  const tabSelected = tabSelectable.filter(it => sel.has(it.id));
  const allSel = tabSelectable.length > 0 && tabSelected.length === tabSelectable.length;
  const toggleSelAll = () => setSel(s => {
    const n = new Set(s);
    tabSelectable.forEach(it => allSel ? n.delete(it.id) : n.add(it.id));
    return n;
  });

  /* ✨ tidy menu entries (board t33). 1 reorganizes the whole board (needsBoard — the
     old ✨ tidy, disabled on an empty board); 2-5 transform the ADD-BOX text and work
     with an empty board. `run` fires the matching handler defined above the render. */
  /* board t99: each entry's <small> sublabel says exactly what the transform DOES
     (the old hints were vague enough that "improve readability" read as a synonym
     wand). kinds/API values stay untouched — only the operator-facing words moved. */
  const tidyMenu = [
    { key: "reorg",       label: "Reorganize board",     hint: "dedupe / merge / prioritize the whole board", needsBoard: true, run: tidy },
    { key: "readability", label: "Improve readability",  hint: "restructure: paragraphs, bullets, code fences",  run: () => format("readability") },
    { key: "listify",     label: "Prose → bullet list",  hint: "prose → markdown '- ' bullets",   run: () => format("listify") },
    { key: "proposal",    label: "Decision → pros/cons", hint: "decision → pros/cons card", run: () => format("proposal") },
    { key: "bash",        label: "Wrap as ```bash```",   hint: "wrap verbatim in a ```bash fence — instant, no model", run: wrapBash },
  ];

  /* ⏱ history content (board t32). The four non-event states mirror the drawer's own
     idioms: a plain "loading…"/empty line, and an error banner with ↻ retry. The
     route-404 ("not yet enabled on the host") reuses the search drawer's wording so a
     not-activated route reads the same everywhere. Events arrive oldest→newest, so
     reverse to newest-first before grouping by day. */
  const histRow = (ev, key) => {
    const ln = histLine(ev);
    return html`
      <div key=${key} className="todo-hist-row">
        <span className="todo-hist-time">${histHHMM(ev.ts)}</span>
        <span className="todo-hist-ev" title=${ev.event || ""}>${histEventIcon(ev)}</span>
        <span className="todo-hist-line" title=${ln.full || undefined}>
          <span className="todo-hist-id">${ln.id}</span>
          ${ln.typeIcon && html`<span className="todo-hist-ic todo-ic">${ln.typeIcon}</span>`}
          <span className="todo-hist-detail">${ln.text}</span>
        </span>
      </div>`;
  };
  /* Bridge mail, newest first. Tolerant of field naming because the host route
     doesn't exist yet and its exact shape isn't pinned: from/sender, ts/time,
     text/body/msg all resolve. Anything unreadable still renders its raw JSON
     rather than being silently dropped — an unread message is the failure mode
     this tab exists to prevent. */
  const msgView = () => {
    const m = messages || {};
    if (m.loading || messages === null) return html`<div className="todo-empty">loading…</div>`;
    if (m.notEnabled) return html`<div className="todo-empty">
      messages route not yet enabled on the host — bridge mail is delivered in-VM
      (<code>vm-bridge recv</code>); this lights up when the route lands</div>`;
    if (m.error) return html`
      <div className="todo-err todo-err-banner">
        <div><b>${m.error}</b></div>
        <button className="btn" style=${{ marginTop: 8 }} onClick=${loadMessages}>↻ retry</button>
      </div>`;
    const list = (m.items || []).slice().reverse();
    if (m.empty || !list.length)
      return html`<div className="todo-empty">no messages — the bridge inbox is clear</div>`;
    return html`
      <div className="todo-msgs">
        ${list.map((x, i) => {
          const from = x.from || x.sender || x.by || "—";
          const when = typeof x.ts === "number" ? rel(x.ts) : (x.time || "");
          const body = x.text || x.body || x.msg || (typeof x === "string" ? x : JSON.stringify(x));
          return html`
            <div key=${x.id || i} className="todo-msg">
              <div className="todo-msg-head">
                <b className="todo-msg-from">${from}</b>
                ${when && html`<span className="todo-msg-when">${when}</span>`}
              </div>
              <div className="todo-msg-body">${body}</div>
            </div>`;
        })}
      </div>`;
  };
  /* board t100: one ✉ board-message row — compact sender + first line + the "…"
     affordance; expanding REUSES the thread toggle (threadIsOpen/toggleThread, the
     t99 idiom — never a parallel expand state) and renders the body through the t99
     rich renderer, with the thread below it. Replying posts a NORMAL comment via the
     existing thread() flow — that IS the operator's answer to a peer; the keeper's
     replies travel via peer-msg (said on the section header's title). No status/
     priority/delete chrome: a message is conversation, not a work item to steer. */
  const msgRow = (it, idx) => {
    const xp = threadIsOpen(it);
    const fl = richFirstLine(it.text);
    const feed = isPeerFeed(it);
    const more = fl.more || /\n/.test(it.note || "");
    return html`
      <div key=${it.id + ":" + idx} ref=${rowRef(it.id)} className=${"todo-row todo-msgrow" + refFlashCls(it.id)}>
        <span className="todo-ic" title=${feed ? "peer-msg reply feed" : "peer/VM message"}>${TODO_ICON.message}</span>
        ${idTag(it)}
        <b className="todo-msg-from" title=${feed ? "the peer-msg reply feed" : "sender"}>${it.by || "—"}</b>
        ${feed && html`<span className="todo-task" title="the peer-msg reply feed — keeper-to-keeper replies land here">reply feed</span>`}
        ${refsChips(it, allIds, !!refsOpen[it.id], jumpToId, copySha, toggleRefsOpen)}
        <span className="todo-meta">${when(it.ts)}</span>
        ${commentsBtn(it, true)}
        ${xp
          ? html`<div className="todo-text todo-rich">
              ${richNodes(it.text)}${it.note && html`<div className="todo-note">${noteView(it.id, it.note, true)}</div>`}</div>`
          : html`<span className="todo-text">
              ${fl.head}${more && html`<button className="todo-more" title="multi-line message — expand to the formatted view"
                  onClick=${e => { e.stopPropagation(); toggleThread(it); }}>…</button>`}</span>`}
        ${xp && thread(it)}
      </div>`;
  };
  /* The ✉ tab's content: the board-message section (when any exist) above the
     bridge-mail view — two sources, one tab, each honestly labeled. An empty board
     section renders NOTHING extra, so the pre-t100 bridge-mail-only view is
     byte-identical for boards with no message traffic. */
  const msgSection = () => html`
    ${msgItems.length > 0 && html`
      <div className="todo-sec"
           title="peer/VM traffic on this board — replying here posts a normal comment on the item's thread (that is how the operator answers); the keeper's own replies travel via peer-msg, not this console">
        ✉ peer / vm messages</div>`}
    ${msgItems.map((it, i) => msgRow(it, i))}
    ${msgItems.length > 0 && html`
      <div className="todo-sec" title="bridge mail — delivered in-VM via vm-bridge">✉ bridge mail</div>`}
    ${msgView()}
    ${msgCompose()}`;
  /* ✉ fleet-mail compose row — the keeper console is the host arm: it writes
     to one station at a time; stations write back with `fleet-msg`. */
  const msgCompose = () => html`
    <div className="todo-msgsend">
      ${hostBoard && html`
        <select value=${msgTo} onChange=${e => setMsgTo(e.target.value)}
                title="which station receives this — the keeper console messages stations individually">
          ${(stations || []).map(n => html`<option key=${n} value=${n}>${n}</option>`)}
        </select>`}
      <textarea rows="2" value=${msgDraft}
        placeholder=${hostBoard
          ? (stations !== null && !stations.length
             ? "no stations to message — build one with +VM"
             : "message a station… (⌘/ctrl-Enter sends)")
          : "message " + vm + " — lands in its ✉ inbox; its keeper reads it with fleet-msg --inbox"}
        onInput=${e => setMsgDraft(e.target.value)}
        onKeyDown=${e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendMsg(); }} />
      <button className="btn" disabled=${msgBusy || !msgDraft.trim() || (hostBoard && !msgTo)}
        title=${hostBoard ? "send to the selected station's ✉ inbox" : "send to " + vm + "'s ✉ inbox"}
        onClick=${sendMsg}>✉ send</button>
    </div>`;
  const historyView = () => {
    const h = history || {};
    if (h.loading || history === null) return html`<div className="todo-empty">loading…</div>`;
    if (h.notEnabled) return html`<div className="todo-empty">history route not yet enabled on the host</div>`;
    if (h.error) return html`
      <div className="todo-err todo-err-banner">
        <div><b>${h.error}</b></div>
        <button className="btn" style=${{ marginTop: 8 }} onClick=${loadHistory}>↻ retry</button>
      </div>`;
    const events = (h.events || []).slice().reverse();
    if (h.empty || !events.length)
      return html`<div className="todo-empty">no history yet — the journal starts recording from its first deploy</div>`;
    return html`
      <div className="todo-hist">
        ${histGroups(events).map(g => html`
          <div key=${g.key} className="todo-hist-group">
            <div className="todo-hist-day">${g.label}</div>
            ${g.events.map((ev, i) => histRow(ev, g.key + "-" + i))}
          </div>`)}
      </div>`;
  };

  return html`
    <div className="design-panel todo-panel">
      <div className="todo-bar">
        <b>☑ to-do — ${vm}</b>
        ${/* 1.0.138: name the central rows when the dropdown pick maps onto another
              locus key (an LXD guest / local ssh pointer at a registered locus) */""}
        ${state && state.central && state.locus && state.locus !== vm && html`<span
              style=${{ fontSize: 11, opacity: .7, marginLeft: 6 }}
              title=${"central rows: locus " + state.locus + " (toolserver todos) — the dropdown pick " + vm + " resolves to this locus key"}>→ ${state.locus}</span>`}
        <span className="todo-spacer"></span>
        ${relayKnob()}
        ${activityKnob()}
        <div className="todo-tidy-wrap">
          <button className=${"btn" + (menuOpen ? " on" : "")} disabled=${busy}
                  title="✨ readability transforms — reorganize the whole board, or reformat the text in the add box"
                  onClick=${() => setMenuOpen(o => !o)}>✨ tidy ▾</button>
          ${menuOpen && html`
            <div className="todo-tidy-menu">
              ${tidyMenu.map(en => html`<button key=${en.key} className="todo-tidy-item" type="button"
                        disabled=${busy || (en.needsBoard && !items.length)}
                        title=${en.needsBoard && !items.length ? "the board is empty — nothing to reorganize" : en.hint}
                        onClick=${() => { setMenuOpen(false); en.run(); }}>
                  ${en.label}<small>${en.hint}</small></button>`)}
            </div>`}
        </div>
        <button className="btn" disabled=${busy} title="Discord bridge — attach a hugpy comms-session endpoint so messages in that channel queue items here without interrupting anyone" onClick=${discord}>🔗</button>
        <button className="btn" disabled=${busy || hostBoard}
          title=${hostBoard ? "the host keeper is briefed by its charge" : "prompt " + vm + "'s live keeper about the board: types the brief + the open items into its terminal (falls back to copying the brief if no keeper is running)"}
          onClick=${briefKeeper}>⧉ brief keeper</button>
        <button className="btn" title="refresh now (board auto-refreshes every 10s; ⏱ history is pull-on-demand — ↻ re-pulls it)" onClick=${refresh}>↻</button>
      </div>
      <div className="todo-add">
        <!-- ⚑ operator is offered because add() verifies the type survives the
             backend and undoes a downgrade (see add). ⚖ proposal stays OUT: its
             whole value is the structured pros/cons/rec card, which this bare
             text input can't author — proposals are keeper-written. Likewise the
             worker/task/cmd fields (t23) get NO inputs here: the backend add op
             can't carry them, so they're keeper-authored — the drawer only renders
             them, it never creates them. -->
        <select value=${type} onChange=${e => setType(e.target.value)} title="request = ask the keeper · todo = plain task · bookmark = pin a build/checkpoint · operator = a task only the operator can do (⚖ proposals are keeper-authored)">
          <option value="todo">☑ todo</option>
          <option value="request">✋ request</option>
          <option value="bookmark">🔖 bookmark</option>
          <option value="operator">⚑ operator</option>
        </select>
        <!-- t-priority: the priority pick, default low. Low never rides the POST
             (absent = the canonical low); medium/high do, and add() verifies the
             field survived the whitelist (see add / PRIO_WALL). -->
        <select className="todo-prio-sel" value=${prio} onChange=${e => setPrio(e.target.value)}
                title="priority of the new item — low is the default; the live console-api may still need a whitelist update to persist medium/high (the add says so honestly if it didn't stick)">
          <option value="low">prio: low</option>
          <option value="medium">prio: medium</option>
          <option value="high">prio: high</option>
        </select>
        <textarea ref=${addRef} rows="1" value=${text}
               placeholder="queue it without interrupting the keeper… (Enter = add · Shift+Enter = newline)"
               onInput=${e => setText(e.target.value)}
               onKeyDown=${e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } }}></textarea>
        <button className="btn" disabled=${busy} onClick=${add}>add</button>
        <button className="btn" disabled=${busy} title="✨ let hugpy turn free text (even several asks at once) into structured items" onClick=${assistAdd}>✨</button>
      </div>
      ${proposal && html`
        <div className="todo-proposal">
          <div className="todo-sec">✨ proposed list (${proposal.length})${tidyScope ? " · scoped to " + tidyScope.length + " item(s) — the rest stay untouched" : ""} — review, then</div>
          <div>
            <button className="btn" disabled=${busy} onClick=${() => {
              const p = proposal, scope = tidyScope;
              setProposal(null); setTidyScope(null);
              // scope is enforced HERE, not trusted from the model: unselected items are
              // spliced back byte-identical (scopedMerge). Empty scope = whole-board replace.
              op({ op: "replace", items: (scope && scope.length) ? scopedMerge(p, scope) : p }, "tidied list applied"); }}>apply</button>
            <button className="btn" onClick=${() => { setProposal(null); setTidyScope(null); }}>discard</button>
          </div>
          ${proposal.map((it, i) => html`<div key=${i} className="todo-row">
            <span className="todo-ic">${TODO_ICON[it.type] || "☑"}</span>
            <span className="todo-text">${it.text}${it.note && html` <span className="todo-note">— ${it.note}</span>`}</span>
            <span className="todo-meta">${it.status || "open"}</span></div>`)}
        </div>`}
      ${formatPrev && (formatPrev.scoped
        ? html`
          <div className="todo-proposal">
            <div className="todo-sec">✨ ${fmtLabel(formatPrev.kind)} · ${formatPrev.rows.filter(r => r.ok).length}/${formatPrev.rows.length} item(s) — preview, then</div>
            <div>
              <button className="btn" disabled=${busy || !formatPrev.rows.some(r => r.ok)}
                      onClick=${applyScopedFormat}>apply</button>
              <button className="btn" onClick=${() => setFormatPrev(null)}>discard</button>
            </div>
            ${formatPrev.rows.map((r, i) => html`
              <div key=${i} className=${"todo-fmt-row" + (r.ok ? "" : " failed")}>
                <span className="todo-fmt-id" title=${r.ok ? "item " + r.id : "item " + r.id + " — the transform failed; this item keeps its original text and is skipped on apply"}>${r.id}${r.ok ? "" : " · failed"}</span>
                <div className="todo-fmt-ba">
                  <span className="todo-fmt-before">${r.before}</span>
                  ${r.ok && html`<span className="todo-fmt-arrow"> → </span><span className="todo-fmt-after">${r.after}</span>`}
                </div>
              </div>`)}
          </div>`
        : html`
          <div className="todo-proposal">
            <div className="todo-sec">✨ ${fmtLabel(formatPrev.kind)} — preview, then</div>
            <div>
              <button className="btn" disabled=${busy} onClick=${() => { setText(formatPrev.result); setFormatPrev(null); say("applied to the box — review, then add"); }}>apply</button>
              <button className="btn" onClick=${() => setFormatPrev(null)}>discard</button>
            </div>
            <pre className="todo-format-pre">${formatPrev.result}</pre>
          </div>`)}
      ${dupIds.size > 0 && html`
        <div className="todo-dup-warn" role="alert">
          <b>⚠ duplicate id${dupIds.size > 1 ? "s" : ""}: ${[...dupIds].join(", ")}</b>
          <div className="todo-dup-hint">the board has 2+ items sharing ${dupIds.size > 1 ? "these ids" : "this id"} — accept / comment / status target the FIRST one, so actions on the others won't stick and could clobber the wrong item's note. Mutating actions on ${dupIds.size > 1 ? "these items are" : "this item is"} disabled until the ids are unique. Re-id to fix.</div>
        </div>`}
      ${/* The tab bar used to be gated on items.length, so an EMPTY board showed no
            tabs at all — which hid ✉ messages and ⏱ history, the two tabs whose
            content does not come from the board and which are exactly what you want
            when the queue is empty. Show the bar whenever the board has loaded. */
        state !== null && !err && html`
        <div className="todo-tabs" role="tablist">
          ${tabs.map(t => html`
            <button key=${t.key} role="tab" aria-selected=${tab === t.key}
                    className=${"todo-tab" + (tab === t.key ? " active" : "") + (t.list.length ? "" : " quiet")}
                    title=${t.key === "proposals" && propHint ? propHint : t.label}
                    onClick=${() => setTab(t.key)}>
              <span>${t.label}</span>
              ${t.badge > 0 && html`<span className=${"todo-tab-badge" + (t.warn ? " warn" : "")}>${t.badge}</span>`}
            </button>`)}
        </div>`}
      <div className="todo-list">
        ${state === null && !err && html`<div className="todo-empty">loading…</div>`}
        ${err && html`
          <div className=${"todo-err" + (state === null ? "" : " todo-err-banner")}>
            <div><b>${err.msg}</b></div>
            ${err.status === 409 && html`<div className="todo-err-hint">start ${vm} to see its board</div>`}
            ${state !== null && html`<div className="todo-err-hint">showing the last board loaded — it may be out of date</div>`}
            <button className="btn" style=${{ marginTop: 8 }} onClick=${retry}>↻ retry</button>
          </div>`}
        ${state !== null && !err && !items.length
          && activeTab.key !== "messages" && activeTab.key !== "history"
          && html`<div className="todo-empty">
          nothing queued for ${vm} yet — file a request, pin a build, or ⧉ brief the keeper</div>`}
        ${(items.length > 0 || activeTab.key === "messages" || activeTab.key === "history")
          && (activeTab.key === "history"
          ? historyView()
          : activeTab.key === "messages"
          ? msgSection()
          : activeTab.list.length
            ? html`
                ${menuOpen && tabSelectable.length > 0 && html`
                  <div className="todo-selall">
                    <label title="select every item in this section for the ✨ tidy transform">
                      <input type="checkbox" checked=${allSel} onChange=${toggleSelAll} />
                      <span>select all${tabSelected.length ? " · " + tabSelected.length + " selected" : ""}</span>
                    </label>
                    ${tabSelected.length > 0 && html`<button className="todo-selclear" type="button"
                        title="clear the ✨ tidy selection" onClick=${() => setSel(new Set())}>clear</button>`}
                  </div>`}
                ${activeTab.key === "proposals" && propHint && html`<div className="todo-sec">${propHint}</div>`}
                ${activeTab.list.map(activeTab.key === "proposals" ? propCard : row)}`
            : html`<div className="todo-empty">${activeTab.empty}</div>`)}
      </div>
      <div className=${"todo-status" + (noteErr ? " err" : "")}>
        ${note}
        ${busy && html`<button className="todo-cancel" title="abort the in-flight request" onClick=${cancel}>✕ cancel</button>`}
      </div>
    </div>`;
}

/* Bug-reporter drawer (board t19) — a read-mostly window on the VM's own
   log/process scanner. A host route (GET/POST /api/vm/<vm>/bugreport) proxies a
   VM-side sidecar that watches journals + key units and, on request, runs an LLM
   "digest" over them; the report file (schema bugreport.v1) is what this renders.
   Two moving parts the UI has to respect:
   - the report is a SNAPSHOT with a generated_ts — we poll it every 10s
     (visibility-gated, exactly like the to-do drawer) so a scan the keeper or
     cron kicks off elsewhere shows up live without a manual refresh.
   - POST {op:"scan"} only QUEUES a scan; the scanner picks it up within ~5s but
     the digest can take minutes and the file only updates when it finishes. So a
     scan NEVER blocks the UI: we ack "scan queued HH:MM", disarm the button for
     10s, and let the next poll notice a newer generated_ts (flagged as .fresh).
   The sources box drives which inputs a queued scan reads — checked-by-default
   iff the source is enabled, the checked subset rides in as POST `sources`, and
   we OMIT the key entirely when EVERY source is checked (the backend reads a
   missing key as "all enabled", so sending the full list would be the same
   request spelled longer — and would silently pin the set if the enabled list
   later grew). A disabled source is still toggleable: checking it into a scan is
   allowed even though it is off by default. */
const BUG_ERRP = new Set(["emerg", "alert", "crit", "err", "error", "critical"]);
// "err+" (err and everything more severe) is bad-colored; warning/notice/info/etc.
// are warn. An unknown severity falls through to warn — a badge we cannot rank is
// not an emergency, and painting it red would just cry wolf.
const bugSevBad = (s) => BUG_ERRP.has(String(s || "").toLowerCase());
const bugRel = (ts) => {                           // "just now" / "2m ago" — the meta line's relative age
  if (!ts) return "never";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const bugHM = (ts) => new Date((ts || Date.now() / 1000) * 1000)
  .toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
// The spec wants [L1] chips, but the live sidecar cites lines as BARE INTEGERS
// (citations:[1,2]) — only the doc example was pre-stringified "L1". So a bare
// number gets an "L" prefix and an already-labelled "L1" passes through unchanged.
const bugCite = (c) => { const s = String(c).trim(); return /^\d+$/.test(s) ? "L" + s : s; };

/* ⚡ ACTIVITY METER (board t46) — shared humanizers + a meter builder over the bug
   scanner's `activity` block (bugreport.v1; see bugreport/README.md "activity"). EVERY
   field is independently nullable, so each helper answers defensively. Consumed in TWO
   places off ONE humanizer: the ☑ to-do drawer's toolbar meter (which fetches /bugreport
   once on open + ↻, never on a poll — activity is garnish there) and the 🐞 bugs strip.
   The coarse "⚡ Nm ago" reuses bugRel; the tooltip carries a finer "Nm Ss ago", the
   quiet-gate window, and the snapshot's own as-of stamp. Defined here, beside the other
   bugreport humanizers it reuses; both drawers call it at render time. */
const ACT_WARN_SECS = 1800;   // 30 min — older last-activity gets a subtle warn tint (possible keeper/relay stall)
// finite, non-negative seconds since an epoch ts (null/absent/NaN → null; a future ts clamps to 0)
const actSince = (ts) => (typeof ts === "number" && isFinite(ts)) ? Math.max(0, Date.now() / 1000 - ts) : null;
// finer "Ns ago" / "Nm Ss ago" for the tooltip; past an hour, defer to the coarse bugRel
const actExact = (ts) => {
  const s = actSince(ts);
  if (s === null) return "unknown";
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) { const m = Math.floor(s / 60); return m + "m " + Math.round(s - m * 60) + "s ago"; }
  return bugRel(ts);
};
// humanize a bare DURATION in seconds → "Ns" / "Nm" / "Nh" (null on a non-finite/negative value)
const actDur = (s) => {
  if (typeof s !== "number" || !isFinite(s) || s < 0) return null;
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  return Math.round(s / 3600) + "h";
};
/* Build the ⚡ meter from an activity block (null/absent → treated as all-null). Returns
   {label, title, warn, known}: `known` is false when there is no last-activity ts (then
   label is "⚡ —" and the tooltip is the plain no-data line); `warn` is true when the
   keeper has been quiet longer than ACT_WARN_SECS. The tooltip is multi-line: the exact
   last-activity age; the quiet-gate window + remaining time to the threshold when both
   the cadence and last-activity are known; the snapshot's as-of stamp; and, when stale,
