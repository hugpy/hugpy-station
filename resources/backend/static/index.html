  const running = agents.filter(a => a.status === "running").length;
  const head = html`<div className="steward-thr-row" style=${{ marginTop: 8 }}>
      <span className="steward-k"><b>subagents</b></span>
      <span className="steward-v" style=${{ fontSize: 11, color: "var(--dim)" }}>${!d ? "…" : !d.ok ? (d.error || "unavailable") : running + " running · " + agents.length + " listed" + (d.note ? " · " + d.note : "")}</span>
    </div>`;
  if (!d || !d.ok || !agents.length) return head;
  const col = { display: "grid", gridTemplateColumns: "minmax(90px, 1.2fr) minmax(70px, .8fr) minmax(120px, 2fr) 74px 60px", gap: "0 8px", alignItems: "baseline", fontSize: 11, padding: "2px 4px" };
  const cell = { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" };
  return html`<div>
    ${head}
    <div role="listbox" aria-label=${"subagents of " + backend} style=${{ border: "1px solid var(--edge)", borderRadius: 4, maxHeight: 168, overflowY: "auto", marginTop: 2 }}>
      <div style=${{ ...col, color: "var(--dim)", borderBottom: "1px solid var(--edge)", position: "sticky", top: 0, background: "var(--panel, var(--bg))" }}>
        <span>purpose</span><span>model</span><span>title</span><span>status</span><span style=${{ textAlign: "right" }}>⏱</span></div>
      ${agents.map((a) => {
        const run = a.status === "running";
        const el = run ? Math.max(0, nowS - (a.started_at || nowS)) : (a.elapsed_s || 0);
        const scol = run ? "var(--warn)" : a.status === "failed" ? "var(--bad)" : "var(--dim)";
        const tk = a.tokens ? "\ntokens " + ((a.tokens.input || 0) + (a.tokens.cache_read || 0) + (a.tokens.cache_write || 0)).toLocaleString() + " in / " + (a.tokens.output || 0).toLocaleString() + " out" : "";
        return html`<div key=${a.id || a.tool_use_id} role="option" aria-selected=${run}
            style=${{ ...col, color: run ? "var(--fg)" : "var(--dim)", background: run ? "rgba(127,170,255,.10)" : undefined, borderLeft: run ? "2px solid var(--accent)" : "2px solid transparent" }}
            title=${(a.title || "") + "\n" + a.subagent_type + (a.background ? " · background" : " · foreground") + (a.id ? " · " + a.id : "") + "\nmodel " + (a.model || "—") + (a.model_explicit ? "" : " (inherited from the session)") + "\nstarted " + (a.started_at ? new Date(a.started_at * 1000).toLocaleTimeString() : "—") + (a.ended_at ? " · ended " + new Date(a.ended_at * 1000).toLocaleTimeString() : "") + tk}>
          <span style=${cell}>${a.purpose || "—"}</span>
          <span style=${cell}>${a.model || "—"}</span>
          <span style=${cell}>${a.title || "—"}</span>
          <span style=${{ color: scol, fontWeight: run ? 600 : 400 }}>${run ? "● running" : a.status === "failed" ? "✗ failed" : "✓ done"}</span>
          <span style=${{ textAlign: "right", fontFamily: "ui-monospace, monospace", color: run ? "var(--warn)" : "var(--dim)" }}>${seatElapsed(el)}</span>
        </div>`; })}
    </div>
  </div>`;
}

/* p509 ROLLOVER READOUT (UI half): the direct seat's context-rollover policy.
   GET /api/ac/rollover?vm=… → {policy, pending, current, rolling, due} (a
   separate agent adds the route). Renders the mode (color-coded), a
   context-vs-threshold meter (steward-stat/steward-meter), a pending chip with a
   grace countdown, and ↻ roll now / ✕ cancel roll (POST {action, session_id}).
   A 404 or an empty answer degrades to nothing (kept compact for the tight card). */
/* t4262 (operator 2026-10-01): the KEEPER card = the locus's serve roster
   Keeper role (GET /api/locus/keeper?vm=): one session, its backend, the ACTIVE
   model (+ "→ <pending> from next turn" when a pick is staged), ONE context
   gauge = that session's own rollover gauge (tokens / window), and a separate
   "relayed" line for the cumulative total the old card mislabelled as context.
   The picker lists EVERY catalog entry (label + id, grouped by backend — no
   default-only filter) plus a free-text id tagged "unverified"; a pick POSTs
   {action:"set_model"} to /api/locus/keeper (staged → next turn). Re-fetches
   when the locus dropdown changes (vm) and every 10 s. */
function KeeperCard({ vm, nowS }) {
  const [d, setD] = useState(null);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const [custom, setCustom] = useState(null);     // free-text model id editor (no window.prompt in Electron)
  const load = useCallback(() => api("/api/locus/keeper" + seatQ(vm), { timeout: 25000 })
    .then(j => setD(j))
    .catch(e => setD({ ok: false, error: (e.body && e.body.error) || e.message || String(e) })), [vm]);
  useEffect(() => { setD(null); setNote(null); setCustom(null); load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);
  const k = (n) => Number(n || 0).toLocaleString();
  const kp = d && d.keeper;
  const pick = (model, backend) => {
    if (busy) return;
    setBusy(true); setNote(null);
    const body = { vm: vm || "@keeper", action: "set_model", model, by: "station-ui" };
    if (backend && kp && backend !== kp.backend) body.backend = backend;
    api("/api/locus/keeper", { method: "POST", timeout: 30000, body: JSON.stringify(body) })
      .then(r => { setNote((r.staged ? "staged → " : "model → ") + (r.pending_model || r.model || "(serve default)") + (r.staged ? " from the next turn" : " (applied)")); load(); })
      .catch(e => setNote("error: " + ((e.body && e.body.error) || e.message || String(e))))
      .finally(() => setBusy(false));
  };
  const MODEL_ID_RE = /^[a-z0-9][a-z0-9._:\/-]{2,255}$/i;
  const title = html`<span style=${{ fontWeight: 600 }}>🛡 Keeper — ${locusLabel(vm)} (serve)</span>`;
  if (!d) return html`<div className="steward-readout ds-card" style=${{ border: "1px solid var(--edge)", borderRadius: 6, padding: 8 }}>${title}<div style=${{ color: "var(--dim)", fontSize: 11 }}>⏳ reading the serve roster…</div></div>`;
  if (!d.ok || !kp) return html`<div className="steward-readout ds-card" style=${{ border: "1px solid var(--edge)", borderRadius: 6, padding: 8 }}>${title}
      <div style=${{ color: "var(--bad)", fontSize: 11, marginTop: 4 }}>${d.error || "keeper unavailable"}</div>
      ${d.serve && d.serve.url && html`<div style=${{ color: "var(--dim)", fontSize: 11 }}>serve: <code>${d.serve.url}</code></div>`}</div>`;
  const g = kp.gauge;
  const pct = g && g.window ? Math.min(100, Math.round(10 * (g.pct || 100 * g.tokens / g.window)) / 10) : null;
  const models = d.models || [];
  const groups = [];
  models.forEach(m => { let grp = groups.find(x => x.backend === m.backend); if (!grp) { grp = { backend: m.backend, items: [] }; groups.push(grp); } grp.items.push(m); });
  const cur = kp.model || "";
  const curKey = (kp.backend || "") + "|" + cur;
  const listed = models.some(m => (m.backend || "") + "|" + (m.model || "") === curKey);
  const picker = custom !== null
    ? html`<span style=${{ display: "inline-flex", gap: 4, alignItems: "center" }}>
        <input type="text" autoFocus value=${custom} disabled=${busy} placeholder="model id (unverified)"
               style=${{ background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, padding: "2px 6px", fontSize: 12, minWidth: 240 }}
               onInput=${e => setCustom(e.target.value)}
               onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); const v = custom.trim(); if (v && !MODEL_ID_RE.test(v)) { setNote("not a model id"); return; } setCustom(null); pick(v, kp.backend); } if (e.key === "Escape") setCustom(null); }} />
        <span style=${{ fontSize: 10, color: "var(--warn)", border: "1px solid var(--warn)", borderRadius: 10, padding: "0 5px" }} title="typed id — not checked against the catalog; the serve validates the format only">unverified</span>
        <button className="btn on" disabled=${busy} onClick=${() => { const v = custom.trim(); if (v && !MODEL_ID_RE.test(v)) { setNote("not a model id"); return; } setCustom(null); pick(v, kp.backend); }}>apply</button>
        <button className="btn" disabled=${busy} onClick=${() => setCustom(null)}>cancel</button>
      </span>`
    : html`<select value=${listed ? curKey : (cur ? "__cur__" : curKey)} disabled=${busy} title="every catalog entry the serve knows (baked + Models API), grouped by backend"
        style=${{ background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, padding: "2px 6px", fontSize: 12, maxWidth: 360 }}
        onChange=${e => { const v = e.target.value; if (v === "__custom__") { setCustom(cur); return; } if (v === "__cur__") return; const i = v.indexOf("|"); pick(v.slice(i + 1), v.slice(0, i)); }}>
        ${groups.map(grp => html`<optgroup key=${grp.backend} label=${grp.backend || "?"}>
          ${grp.items.map(m => html`<option key=${grp.backend + "|" + m.model} value=${grp.backend + "|" + m.model}>${m.label || m.model}${m.model ? " · " + m.model : ""}</option>`)}
        </optgroup>`)}
        ${!listed && cur && html`<option value="__cur__">${cur} (current, off-catalog)</option>`}
        <option value="__custom__">✎ custom id… (unverified)</option>
      </select>`;
  const last = kp.last_turn_ts ? (() => { const a = Math.max(0, nowS - Math.floor(kp.last_turn_ts)); return fmtTs(kp.last_turn_ts) + " (" + (a < 60 ? a + " s" : a < 3600 ? Math.floor(a / 60) + " min" : Math.floor(a / 3600) + " h") + " ago)"; })() : "—";
  return html`<div className="steward-readout ds-card" style=${{ border: "1px solid var(--edge)", borderRadius: 6, padding: 8, minWidth: 0 }}>
    <div style=${{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 4 }}>
      ${title}
      ${picker}
      <span style=${{ fontSize: 11, color: kp.busy ? "var(--warn)" : "var(--dim)", fontWeight: 600 }}>${kp.busy ? "● busy" : "○ idle"}</span>
    </div>
    <div style=${{ display: "grid", gridTemplateColumns: "max-content 1fr", gap: "2px 10px", fontSize: 11 }}>
      ${seatKV("session", html`<code title=${kp.native_id ? "native " + kp.native_id : ""}>${kp.session_id || "—"}</code>${kp.label ? " · " + kp.label : ""}`)}
      ${seatKV("backend", kp.backend || "—")}
      ${seatKV("model", html`<code>${cur || "(serve default" + (kp.default_model ? ": " + kp.default_model : "") + ")"}</code>${kp.pending_model ? html` <span style=${{ color: "var(--warn)" }} title="staged on the roster; the serve applies it when the next turn launches">→ ${kp.pending_model} from next turn</span>` : ""}`)}
      ${seatKV("last turn", last)}
    </div>
    ${g ? html`<div className="steward-stat" style=${{ marginTop: 4 }}><span className="steward-k">context</span>
        <span className="steward-v" title=${"the serve's own gauge: " + (g.source || "") + (g.model ? " · " + g.model : "")}>${k(g.tokens)} / ${k(g.window)} (${pct}%)</span></div>
      <div className="steward-meter"><span className=${"steward-meter-fill" + (pct >= 80 ? " full" : "")} style=${{ width: pct + "%" }}></span></div>`
      : html`<div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 4 }}>context — no gauge yet for this session</div>`}
    ${d.relayed && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 3 }} title=${"cumulative tokens relayed through this serve (" + (d.relayed.source || "") + ") — NOT the context window"}>relayed today: ${k(d.relayed.tokens)} tok · ${k(d.relayed.runs)} runs${d.relayed.cost_usd ? " · ≈ $" + Number(d.relayed.cost_usd).toFixed(2) : ""}</div>`}
    <${RolloverMeter} vm=${vm} nowS=${nowS} gauge=${false} />
    ${note && html`<div style=${{ fontSize: 11, marginTop: 4, color: note.startsWith("error") ? "var(--bad)" : "var(--dim)" }}>${note}</div>`}
    ${(d.errors || []).length > 0 && html`<div style=${{ fontSize: 11, marginTop: 2, color: "var(--warn)" }}>${d.errors.join(" · ")}</div>`}
    <div style=${{ color: "var(--dim)", fontSize: 10, marginTop: 4 }}>serve <code>${d.serve && d.serve.url}</code></div>
  </div>`;
}

function RolloverMeter({ vm, nowS, gauge = true }) {
  const [d, setD] = useState(null);      // null = first load; false = absent/empty (render nothing); else the doc
  const [busy, setBusy] = useState(false);
  const load = useCallback(() => {
    api("/api/ac/rollover" + seatQ(vm), { timeout: 15000 })
      .then(j => setD(j && (j.policy || j.current != null || j.pending || j.rolling != null) ? j : false))
      .catch(() => setD(false));
  }, [vm]);
  useEffect(() => { setD(null); load(); const t = setInterval(load, 15000); return () => clearInterval(t); }, [load]);
  if (!d) return null;                    // pending or absent → stay quiet
  const policy = String(d.policy || "off").toLowerCase();
  const pcol = policy === "auto" ? "var(--ok, #2ea043)" : policy === "manual" ? "var(--warn)" : "var(--dim)";
  const used = Number(d.current), cap = Number(d.rolling);
  const pct = Number.isFinite(used) && Number.isFinite(cap) && cap > 0 ? Math.min(100, Math.round(1000 * used / cap) / 10) : null;
  const pend = d.pending && typeof d.pending === "object" ? d.pending : (d.pending ? {} : null);
  const grace = pend && (pend.grace_s != null ? Math.max(0, Math.round(pend.grace_s))
      : pend.grace_until != null ? Math.max(0, pend.grace_until - nowS) : null);
  const sid = (pend && pend.session_id) || d.session_id || (d.current && d.current.session_id) || null;
  const act = (action) => {
    if (busy) return; setBusy(true);
    api("/api/ac/rollover" + seatQ(vm), { method: "POST", timeout: 20000, body: JSON.stringify({ action, session_id: sid }) })
      .then(() => load()).catch(() => {}).finally(() => setBusy(false));
  };
  const k = (n) => Number(n || 0).toLocaleString();
  return html`<div style=${{ marginTop: 6 }}>
    <div className="steward-thr-row">
      <span className="steward-k"><b>rollover</b></span>
      <span className="steward-v" style=${{ fontSize: 11 }}><span style=${{ color: pcol, fontWeight: 600 }}>${policy}</span>${d.due ? " · due" : ""}</span>
    </div>
    ${gauge && pct !== null && html`<div className="steward-stat" style=${{ marginTop: 4 }}><span className="steward-k">context</span>
      <span className="steward-v">${k(used)} / ${k(cap)} tok (${pct}%)</span></div>`}
    ${gauge && pct !== null && html`<div className="steward-meter"><span className=${"steward-meter-fill" + (pct >= 80 ? " full" : "")} style=${{ width: pct + "%" }}></span></div>`}
    ${!gauge && pct !== null && html`<div style=${{ color: "var(--dim)", fontSize: 11, marginTop: 2 }}>rolls at ${k(cap)} tok</div>`}
    <div style=${{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
      ${pend && html`<span style=${{ fontSize: 11, color: "var(--warn)", border: "1px solid var(--warn)", borderRadius: 10, padding: "0 6px" }}>⏳ roll pending${grace != null ? " · " + Math.floor(grace / 60) + ":" + String(grace % 60).padStart(2, "0") : ""}</span>`}
      ${pend
        ? html`<button className="btn" disabled=${busy} onClick=${() => act("cancel")}>✕ cancel roll</button>`
        : html`<button className="btn" disabled=${busy || policy === "off"} title=${policy === "off" ? "rollover is off" : "roll this session now"} onClick=${() => act("roll")}>↻ roll now</button>`}
    </div>
  </div>`;
}

/* p515 LIMITS GAUGE (UI half): the frontier limit state for the direct seat.
   Reads the {default_model, fallback_model, state:ok|near|hit, last_hit_ts,
   fallback_active} doc SeatPanel already fetched from /api/frontier/limits.
   A model chip colored green(ok)/amber(near)/red(hit), plus "on fallback:
   <model>" when a limit auto-switch is active. lim===false / null → nothing. */
function LimitsBadge({ lim }) {
  if (!lim) return null;
  const st = String(lim.state || "ok").toLowerCase();
  const col = st === "hit" ? "var(--bad)" : st === "near" ? "var(--warn)" : "var(--ok, #2ea043)";
  const model = lim.default_model || "(default)";
  return html`<div style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, marginTop: 2, flexWrap: "wrap" }}>
    <span style=${{ display: "inline-flex", alignItems: "center", gap: 5, color: col, border: "1px solid " + col, borderRadius: 10, padding: "0 7px", fontWeight: 600 }}
          title=${"frontier limit state: " + st + (lim.last_hit_ts ? " · last hit " + fmtTs(lim.last_hit_ts) : "")}>●${model}<span style=${{ color: "var(--dim)", fontWeight: 400 }}>· ${st}</span></span>
    ${lim.fallback_active && lim.fallback_model && html`<span style=${{ color: "var(--warn)" }}>on fallback: <code>${lim.fallback_model}</code></span>`}
  </div>`;
}

function SeatPanel({ vm, section }) {
  const [seat, setSeat] = useState(null);
  const [dirv, setDirv] = useState(null);      // /api/frontier/directive doc
  const [text, setText] = useState(null);      // directive editor
  const [saved, setSaved] = useState("");
  const [models, setModels] = useState(null);  // /api/frontier/models doc
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [note, setNote] = useState(null);
  const [showComposed, setShowComposed] = useState(false);
  const [showSteps, setShowSteps] = useState(false);
  /* 1.0.143: directives are generated per (locus × session kind); the editor
     edits ONE kind's operator overlay. keeper/chat/worker/local = the standing
     serve sessions; tmux = the terminal seats (fallback / inference arm). */
  const [dsess, setDsess] = useState(() => { try { return sessionStorage.getItem("steward_dir_session") || "keeper"; } catch (_) { return "keeper"; } });
  const pickDsess = (k) => { setText(null); setSaved(""); setDsess(k); try { sessionStorage.setItem("steward_dir_session", k); } catch (_) {} };
  const dirQ = (vm) => seatQ(vm) + "&session=" + encodeURIComponent(dsess);
  const [bm, setBm] = useState(null);          // /api/b/model doc
  const [hand, setHand] = useState(null);      // /api/frontier/handoff doc
  const [htext, setHtext] = useState(null);
  const [hsaved, setHsaved] = useState("");
  const [wipeConfirm, setWipeConfirm] = useState(false);
  const [m2s, setM2s] = useState(null);        // /api/mct2/status — is A working? + pending queries
  const [gptDraft, setGptDraft] = useState(null);
  const [gpt, setGpt] = useState(null);        // abstract-gpt settings + live Codex tracker
  const [deleg, setDeleg] = useState(null);    // /api/frontier/delegate — per-backend delegate-only switch (board t7)
  const [lim, setLim] = useState(null);        // p515: /api/frontier/limits — {default_model, fallback_model, state, last_hit_ts, fallback_active}; false = route absent
  /* 1.0.67: prompt-cache countdown — now inside SeatMeter, one per frontier
     backend tab (steward tabs, operator 2026-09-15); the 1 s clock below is
     shared by the meters' countdowns and the subagent elapsed timers. */
  const [nowS, setNowS] = useState(() => Math.floor(Date.now() / 1000));
  // steward tabs: seatTab = the operator's manual pick (sticky for the page
  // session); "" = follow the provider the console picked as keeper.
  const [seatTab, setSeatTab] = useState(() => { try { return sessionStorage.getItem("steward_seat_tab") || ""; } catch (_) { return ""; } });
  const [keeperBe, setKeeperBe] = useState(frontierKeeperBackend);
  const pickSeatTab = (be) => { setSeatTab(be); try { if (be) sessionStorage.setItem("steward_seat_tab", be); else sessionStorage.removeItem("steward_seat_tab"); } catch (_) {} };
  const activeSeat = (seatTab === "codex" || seatTab === "claude-code") ? seatTab : (keeperBe || "claude-code");
  useEffect(() => { const t = setInterval(() => setNowS(Math.floor(Date.now() / 1000)), 1000); return () => clearInterval(t); }, []);
  /* 1.0.68: the ROLLING STATE (toolserver assess/state — fleet-judged from the seat's
     own transcript): derived objective + a ready init prompt; ⟳ relaunch hands it to a
     fresh seat. The idle-relaunch rule does the same automatically (server-side). */
  const [rstate, setRstate] = useState(null);
  const relaunch = () => {
    if (busy) return;
    if (!window.confirm("Relaunch the frontier claude-code seat on the derived init prompt? The current seat is killed (its transcript stays on disk); the new one starts on the directive + this init prompt.")) return;
    setBusy(true); setErr(null); setNote(null);
    api("/api/frontier/relaunch" + seatQ(vm), { method: "POST", timeout: 60000, body: JSON.stringify({}) })
      .then(d => { setNote("relaunched on the init prompt (" + (d.init_prompt_chars || 0) + " chars) — new seat " + (d.session || "")); load(); })
      .catch(e => setErr(e.message || "relaunch failed")).finally(() => setBusy(false));
  };
  const load = useCallback(() => {
    api("/api/seat" + seatQ(vm), { timeout: 20000 }).then(d => { setSeat(d); setErr(null); })
      .catch(e => setErr(e.message || "seat status failed"));
    // steward tabs: the provider the console picked as keeper decides the
    // default tab — the picker's own localStorage first, else the server's
    // live frontier backend (a first visit), else Claude.
    { const be = frontierKeeperBackend(); if (be) setKeeperBe(be);
      else api("/api/term/backends?vm=@keeper", { timeout: 15000 }).then(d => { const lb = d && d.frontier && d.frontier.live_backend; if (lb === "codex" || lb === "claude-code") setKeeperBe(lb); }).catch(() => {}); }
    api("/api/frontier/state" + seatQ(vm), { timeout: 25000 }).then(setRstate).catch(() => {});
    api("/api/frontier/directive" + dirQ(vm)).then(d => { setDirv(d); if (text === null) { setText(d.text || ""); setSaved(d.text || ""); } })
      .catch(e => setErr(e.message || "directive load failed"));
    api("/api/frontier/handoff" + seatQ(vm)).then(d => { setHand(d);
        // 1.0.65: the init prompt is CONSUMED at seat launch — when the file is
        // gone (handed off) the field empties too; never keep showing stale text.
        if (htext === null || (!d.exists && hsaved !== "")) { setHtext(d.text || ""); setHsaved(d.text || ""); } })
      .catch(() => {});
    api("/api/frontier/models" + seatQ(vm)).then(setModels).catch(() => {});
    api("/api/b/model" + seatQ(vm)).then(setBm).catch(() => {});
    api("/api/mct2/status" + seatQ(vm)).then(setM2s).catch(() => {});
    api("/api/frontier/delegate").then(setDeleg).catch(() => {});
    api("/api/frontier/limits" + seatQ(vm)).then(setLim).catch(() => setLim(false));  // p515: 404 → false → badge renders nothing
    api("/api/gpt" + seatQ(vm)).then(setGpt).catch(e => setGpt({ error: e.message || "GPT settings unavailable" }));
  }, [vm, dsess]);
  /* board t7 (operator 2026-09-10): delegate-only = the seat ROUTES, subagents
     work. Persisted server-side; lands in the directive (claude-code: next
     launch; mct: next turn) and a live seat is told right away. */
  const setDelegate = (be, on) => {
    if (busy) return;
    setBusy(true); setErr(null);
    api("/api/frontier/delegate", { method: "POST", body: JSON.stringify({ backend: be, on }), timeout: 20000 })

const ccGet = (doc, path) => path.split(".").reduce((o, k) => (o && typeof o === "object") ? o[k] : undefined, doc);
/* returns a NEW doc; val === undefined DELETES the key and prunes any parent
   object the delete left empty, so "(default)" leaves no {} husk behind */
const ccSet = (doc, path, val) => {
  const ks = path.split("."), out = JSON.parse(JSON.stringify(doc || {}));
  let o = out;
  for (let i = 0; i < ks.length - 1; i++) {
    if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) {
      if (val === undefined) return out;
      o[ks[i]] = {};
    }
    o = o[ks[i]];
  }
  if (val === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = val;
  if (val === undefined) {
    for (let cut = ks.length - 1; cut >= 1; cut--) {
      let p = out;
      for (let i = 0; i < cut - 1; i++) p = p && p[ks[i]];
      const k = ks[cut - 1];
      if (p && p[k] && typeof p[k] === "object" && Object.keys(p[k]).length === 0) delete p[k];
    }
  }
  return out;

        ${f.d.map(o => html`<option key=${o} value=${o}>${o === "" ? "(default)" : o}</option>`)}</select>`;
    if (f.t === "number") return html`<input type="number" style=${CC_CTL} disabled=${busy || doc === null}
        value=${cur === undefined ? "" : cur} placeholder="(default)"
        onChange=${e => { const v = e.target.value;
          update(f.k, v === "" ? undefined : Math.max(0, parseInt(v, 10) || 0)); }} />`;
    return html`<input type="text" style=${{ ...CC_CTL, width: 220 }} disabled=${busy || doc === null}
        value=${cur === undefined ? "" : cur} placeholder=${f.eg ? "(default) e.g. " + f.eg : "(default)"}
        onChange=${e => update(f.k, e.target.value === "" ? undefined : e.target.value)} />`;
  };
  /* list/kv textareas are UNCONTROLLED and commit on blur — per-keystroke
     normalization (trim/filter) would eat the line being typed. The key ties
     the mounted textarea to the doc's current value, so an external change
     (load, raw apply) re-seeds it; local typing never remounts it. */
  const block = (f) => {
    const cur = doc === null ? undefined : ccGet(doc, f.k);
    const text = f.t === "kv" ? kvText(cur) : listText(cur);
    return html`<div style=${{ margin: "4px 0" }}>
      <div className="steward-thr-row" title=${f.k + " — " + f.desc}><span className="steward-k">${f.label}</span>
        <span style=${{ color: "var(--dim)", fontSize: 10 }}>${text ? text.split("\n").length + " line" + (text.includes("\n") ? "s" : "") : "(default — none)"}</span></div>
      <textarea key=${f.k + " " + text} rows=${Math.min(6, Math.max(2, text.split("\n").length))}
        defaultValue=${text} disabled=${busy || doc === null} placeholder=${f.desc}
        onBlur=${f.t === "kv" ? commitKv(f.k) : commitList(f.k)}
        style=${{ width: "100%", boxSizing: "border-box", resize: "vertical", fontFamily: "ui-monospace, monospace",
                  fontSize: 11, background: "var(--panel, #0b1622)", color: "var(--fg, #cde)",
                  border: "1px solid var(--edge)", borderRadius: 4, padding: 6 }}></textarea>
    </div>`;
  };
  return html`<div className="steward-claude-settings" style=${seatBox}>
    <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style=${{ flex: 1, fontWeight: 600 }}>⚙ claude code settings
        <span style=${{ fontWeight: 400, color: "var(--dim)" }}> — the settings.json every claude seat launches with${src ? " · source: " + src.source : ""}${dirty ? " · unsaved" : ""}</span></span>
      <button className="btn" onClick=${showRaw ? () => setShowRaw(false) : openRaw}
              title="the same document as raw JSON — for hooks, statusLine, sandbox.*, MCP lists and anything the form doesn't surface">${showRaw ? "form-only view" : "{ } raw JSON"}</button>
      <button className="btn" onClick=${load} title="reload from the host (discards unsaved edits)">↻</button>
      <button className=${"btn" + (dirty ? " on" : "")} disabled=${busy || !dirty} onClick=${save}>${busy ? "…" : "save"}</button>
    </div>
    ${err && html`<div style=${{ color: "var(--bad)", fontSize: 11, marginTop: 4 }}>error: ${err}</div>`}
    ${doc === null && !err && html`<div className="steward-note">loading…</div>`}
    ${doc !== null && CC_FIELDS.map(([title, fields]) => html`
      <div key=${title} className="steward-readout" style=${{ marginTop: 8 }}>
        <div style=${{ fontWeight: 600, fontSize: 11, color: "var(--dim)", textTransform: "uppercase", letterSpacing: ".04em" }}>${title}</div>
        ${fields.map(f => (f.t === "list" || f.t === "kv")
          ? html`<div key=${f.k}>${block(f)}</div>`
          : html`<div key=${f.k} className="steward-thr-row" title=${f.k + (f.desc ? " — " + f.desc : "")}>
              <span className="steward-k">${f.label}</span>${inline(f)}</div>`)}
      </div>`)}
    ${showRaw && doc !== null && html`
      <div style=${{ marginTop: 8 }}>
        <textarea value=${raw} rows=${14} disabled=${busy}
          onInput=${e => setRaw(e.target.value)}
          style=${{ width: "100%", boxSizing: "border-box", resize: "vertical", fontFamily: "ui-monospace, monospace",
                    fontSize: 11, background: "var(--panel, #0b1622)", color: "var(--fg, #cde)",
                    border: "1px solid var(--edge)", borderRadius: 4, padding: 6 }}></textarea>
        <div style=${{ display: "flex", gap: 6, marginTop: 4 }}>
          <button className="btn" disabled=${busy} onClick=${applyRaw}>apply raw → form</button>
          <span style=${{ color: "var(--dim)", fontSize: 11, alignSelf: "center" }}>unknown keys are kept verbatim either way — the form only edits what it shows</span>
        </div>
      </div>`}
    ${note && html`<div style=${{ color: "var(--warn)", fontSize: 11, marginTop: 4 }}>✓ ${note}</div>`}
    <div className="steward-thr-est">"(default)" = the key is absent and Claude Code's own default applies (↺ un-pins a switch back to it). Saving stamps the LIVE host seat settings.json immediately and the template for every future launch on every locus. Rows the seat's /settings screen keeps in the global ~/.claude.json (copy on select, agents-view prefs, IDE auto-connect, external editor) are per-user state, not templatable — set those in the seat itself.</div>
  </div>`;
}

function SudoPanel({ vm }) {
  const [st, setSt] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [confirm, setConfirm] = useState(null);   // "on" | "off" | null
  const [showLog, setShowLog] = useState(false);
  const load = useCallback(() => {
    api("/api/sudo/status" + seatQ(vm), { timeout: 20000 }).then(d => { setSt(d); setErr(null); })
      .catch(e => setErr(e.message || "sudo status failed"));
  }, [vm]);
  useEffect(() => { setSt(null); setConfirm(null); load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);
  const flip = (desired) => {
    setBusy(true); setErr(null); setConfirm(null);
    api("/api/sudo/toggle" + seatQ(vm), { method: "POST", body: JSON.stringify({ desired }), timeout: 120000 })
      .then(() => load())
      .catch(e => { setErr(e.message || "toggle failed"); load(); })
      .finally(() => setBusy(false));
  };
  const on = st && st.on;
  const eff = st && st.effective;          // true/false/null(unknown)
  const leak = st && !on && eff === true;  // revoked here, yet passwordless sudo still works — another source grants it
  return html`<div className="steward-sudo" style=${seatBox}>
    <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style=${{ flex: 1, fontWeight: 600 }}>${(on || eff) ? "🔓" : "🔒"} sudo — ${locusLabel(vm)}
        <span style=${{ fontWeight: 400, color: (on || eff) ? "var(--bad)" : "var(--dim)" }}> — ${st === null ? "…"
          : on ? "GRANTED here (passwordless)" + (eff === false ? " · but NOT effective?!" : "")
          : leak ? "not granted here — BUT passwordless sudo WORKS via another source"
          : "not granted" + (eff === false ? " · verified: sudo -n fails" : eff === null ? " · effective state unknown" : "")}</span></span>
      ${confirm === null && html`<button className=${"btn" + (on ? "" : " on")} disabled=${busy || st === null}
          style=${on ? { color: "var(--bad)", borderColor: "var(--bad)" } : undefined}
          onClick=${() => setConfirm(on ? "off" : "on")}>${busy ? "…" : on ? "revoke" : "grant"}</button>`}
    </div>
    ${confirm && st && html`<div className="steward-confirm" style=${{ marginTop: 6 }}>
      <span>${confirm === "on"
        ? "Grant passwordless sudo (NOPASSWD:ALL) to '" + st.grantee + "' on " + st.locus + "? Covers: " + st.covers + ". Every sudo command is logged."
        : "Revoke the grant for '" + st.grantee + "' on " + st.locus + "? sudo goes back to asking for a password." + (st.locus !== "host" && st.others && st.others.length ? " Also moves " + st.others.length + " other drop-in(s) aside so the revoke is REAL (listed below afterwards)." : "")}</span>
      <button className="btn on" disabled=${busy} onClick=${() => flip(confirm)}>${confirm === "on" ? "yes, grant" : "yes, revoke"}</button>
      <button className="btn" disabled=${busy} onClick=${() => setConfirm(null)}>cancel</button>
    </div>`}
    ${st && html`<div className="steward-readout" style=${{ marginTop: 6 }}>
      ${seatKV("grantee", st.grantee + "@" + st.locus)}
      ${seatKV("mechanism", st.mechanism)}
      ${seatKV("drop-in", st.dropin)}
      ${seatKV("covers", st.covers)}
      ${seatKV("effective now", eff === true ? "passwordless sudo WORKS for " + st.grantee : eff === false ? "sudo -n is refused for " + st.grantee : "unknown (could not probe)", eff ? "steward-armed" : "")}
      ${st.others && st.others.length ? html`<div><span className="steward-k">other sudoers sources for ${st.grantee}${st.locus === "host" ? " (reported only — never touched on the host)" : " (revoke moves these aside)"}</span><div style=${seatCode}>${st.others.join("\n")}</div></div>` : ""}
      ${st.group_sudo && seatKV("group", st.grantee + " is in the 'sudo' group (password sudo via /etc/sudoers — not a NOPASSWD grant)")}
      ${st.sources_readable === false && eff === true && !on && seatKV("source", "passwordless sudo comes from a sudoers file this seat cannot read (probe runs as " + st.grantee + ", not root) — revoke will try to move it aside via sudo", "steward-armed")}
      ${st.disabled && st.disabled.length ? html`<div><span className="steward-k">disabled by the station (restore by hand: mv back into /etc/sudoers.d)</span><div style=${seatCode}>${st.disabled.join("\n")}</div></div>` : ""}
      ${on && st.rules && st.rules.length ? html`<div><span className="steward-k">active rule</span><div style=${seatCode}>${st.rules.join("\n")}</div></div>` : ""}
      ${st.log && st.log.length ? html`<button className="btn" style=${{ alignSelf: "flex-start" }} onClick=${() => setShowLog(v => !v)}>${showLog ? "hide" : "show"} sudo log (last ${st.log.length})</button>` : ""}
      ${showLog && st.log && html`<div style=${seatCode}>${st.log.join("\n")}</div>`}
      ${!st.tool && html`<div style=${{ color: "var(--warn)", fontSize: 11 }}>agent-sudo is not present in this locus yet — the first grant pushes the shipped copy</div>`}
    </div>`}
    ${err && html`<div style=${{ color: "var(--bad)", fontSize: 11, marginTop: 4 }}>error: ${err}${/pkexec|authorization/i.test(err) ? " — the host grant needs a human at this desktop to answer the polkit prompt" : ""}</div>`}
    <div className="steward-thr-est">same switch, same drop-in, on the host and in every VM: grantable and revocable here only. A (frontier) and B (local) share the seat's unix user, so the grant is per locus — it cannot be given to one model and not the other.</div>
  </div>`;
}

function FrontierFsSwitch() {
  const [allowed, setAllowed] = useState(null);   // null = loading
  const [roots, setRoots] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const load = useCallback(() => {
    api("/api/frontier/fs/status")
      .then(d => { setAllowed(!!d.allowed); setRoots(d.roots || []); setErr(null); })
      .catch(e => setErr(e.message || "status failed"));
  }, []);
  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);
  const flip = () => {
    if (busy || allowed === null) return;
    const desired = allowed ? "off" : "on";
    setBusy(true); setErr(null);
    api("/api/frontier/fs/toggle", { method: "POST", body: JSON.stringify({ desired }), timeout: 30000 })
      .then(d => setAllowed(!!d.allowed))
      .catch(e => setErr(e.message || "toggle failed"))
      .finally(() => { setBusy(false); load(); });
  };
  const stateText = allowed === null ? "…" : (allowed ? "ALLOWED" : "blocked");
  return html`<div className="steward-frontierfs"
      style=${{ borderTop: "1px solid var(--edge)", marginTop: 10, paddingTop: 10 }}>
    <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style=${{ flex: 1, fontWeight: 600 }}>${allowed ? "📂" : "🔒"} frontier file access (fs switch)
        <span style=${{ fontWeight: 400, color: allowed ? "var(--warn)" : "var(--dim)" }}> — ${stateText}</span>
      </span>
      ${allowed === null && err && html`<button className="btn" disabled=${busy} onClick=${load}
        title="the fs-policy probe failed (see the message below) — probe again">↻ retry</button>`}
      <button className=${"btn" + (allowed ? " on" : "")}
        style=${allowed ? { background: "var(--warn)", color: "#04101f", borderColor: "var(--warn)" } : undefined}
        disabled=${busy || allowed === null} onClick=${flip}
        title=${allowed === null ? (err ? "greyed: the probe failed — " + err : "greyed: probing…")
              : allowed ? "Disallow the frontier model's filesystem access"
                        : "Allow the frontier model's filesystem access"}>${
        busy ? "…" : (allowed === null ? (err ? "unavailable" : "…") : (allowed ? "disallow" : "allow"))}</button>
    </div>
    <div style=${{ color: err ? "var(--bad)" : "var(--dim)", marginTop: 6, fontSize: 11 }}>${
      err ? ("error: " + err)
          : ("FRONTIER ONLY: one switch for both frontier backends — mct (hugpy-agent mct-fs, live) and claude-code (permissions.deny on Read/Edit/Write/Grep/Glob at its next launch). Local (B) and shell are NEVER affected."
             + (allowed && roots.length ? " " + roots.length + " granted root" + (roots.length === 1 ? "" : "s") + "." : ""))}</div>
  </div>`;
}

   console launch; the password gates NEW requests immediately. */
function BrowserAccessPanel() {
  const [st, setSt] = useState(null);       // null = loading; {error} = failed
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const load = useCallback(() => {
    api("/api/browser-access")
      .then(d => setSt(d))
      .catch(e => setSt({ error: e.message || "status failed" }));
  }, []);
  useEffect(() => { load(); }, [load]);
  const save = (patch, said) => {
    if (busy) return;
    setBusy(true); setNote(null);
    api("/api/browser-access", { method: "POST", body: JSON.stringify(patch) })
      .then(d => { setSt(d); setPw(""); setNote(said(d)); })
      .catch(e => setNote("error: " + (e.message || "failed")))
      .finally(() => setBusy(false));

      style=${{ borderTop: "1px solid var(--edge)", marginTop: 10, paddingTop: 10 }}>

        <span style=${{ fontWeight: 400, color: st.enabled ? "var(--warn)" : "var(--dim)" }}> — ${

      </span>
      <button className=${"btn" + (st.enabled ? " on" : "")}
        disabled=${busy || (!st.enabled && !st.password_set)}
        title=${st.enabled ? "stop serving LAN browsers (next launch)"
                : st.password_set ? "serve the console to LAN browsers (login required; next launch)"
                : "set a password first — LAN access refuses to run open"}
        onClick=${() => save({ enabled: !st.enabled },
          d => d.enabled ? "LAN access ON — takes effect on the next console launch"
                         : "LAN access off on the next launch")}>${
        busy ? "…" : (st.enabled ? "disable" : "enable")}</button>
    </div>
    <div style=${{ display: "flex", gap: 6, marginTop: 6 }}>
      <input type="password" value=${pw} onInput=${e => setPw(e.target.value)}

        style=${{ flex: 1, background: "#161b22", color: "var(--fg)",
                  border: "1px solid var(--edge)", borderRadius: 6, padding: "4px 8px" }}

      <button className="btn" disabled=${busy || pw.length < 8}
        title="store the password (pbkdf2-hashed) — every NEW request then requires the admin login"
        onClick=${() => save({ password: pw },
          () => "password saved — new page loads (this window too) now log in as admin")}>save</button>
    </div>
    <div style=${{ color: "var(--dim)", marginTop: 6, fontSize: 11 }}>
      This console is a web app. On this machine: <code>${st.local_url}</code>

    </div>
    <div style=${{ color: "var(--dim)", marginTop: 4, fontSize: 11 }}>
      Domain: <code>sudo hugpy-station-domain your.domain.tld</code> publishes an
      always-on console at https://your.domain.tld — nginx + Let's Encrypt +

    </div>
    ${(st.urls || []).length > 0 && html`<div style=${{ marginTop: 4, fontSize: 11 }}>
      ${st.urls.map(u => html`<div key=${u}>LAN: <code>${u}</code>
        <button className="btn" style=${{ padding: "0 6px", fontSize: 10 }}

    </div>`}
    ${note && html`<div style=${{ marginTop: 6, fontSize: 11,

/* 🧭 frontier guidance - the operator's standing instruction to B (the broker)
   on how to frame the frontier model (A). Saved to <mct-ws>/operator-guidance.md
   via /api/b/guidance; the MCT broker reads it each turn and injects it as an L0
   governing_instruction, so it always reaches A at top authority. This is the
   durable lever for "A keeps misreading intent" - it outranks A's own replayed
   prior turns, without touching C's history or resetting any session. */
function FrontierGuidance() {
  const [text, setText] = useState(null);   // null = loading
  const [saved, setSaved] = useState("");   // last-persisted text (dirty check)
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);   // confirmation line (the did[])
  const [err, setErr] = useState(null);
  const load = useCallback(() => {
    api("/api/b/guidance")
      .then(d => { setText(d.text || ""); setSaved(d.text || ""); setErr(null); })
      .catch(e => setErr(e.message || "load failed"));
  }, []);
  useEffect(() => { load(); }, [load]);
  const dirty = text !== null && text !== saved;
  const save = () => {
    if (busy || text === null) return;
    setBusy(true); setErr(null); setNote(null);
    api("/api/b/guidance", { method: "POST", body: JSON.stringify({ text }), timeout: 30000 })
      .then(d => { setSaved(text); setNote(d.did || "saved"); })
      .catch(e => setErr(e.message || "save failed"))
      .finally(() => setBusy(false));
  };
  return html`<div className="steward-frontierguide"
      style=${{ borderTop: "1px solid var(--edge)", marginTop: 10, paddingTop: 10 }}>
    <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style=${{ flex: 1, fontWeight: 600 }}>🧭 frontier guidance
        <span style=${{ fontWeight: 400, color: "var(--dim)" }}> - standing note to B${dirty ? " ·" : ""}</span>
      </span>
      <button className=${"btn" + (dirty ? " on" : "")}
        disabled=${busy || text === null || !dirty} onClick=${save}
        title="Save the standing guidance B injects into every frontier (A) turn">${
        busy ? "…" : "save"}</button>
    </div>
    <textarea value=${text === null ? "" : text}
      disabled=${text === null || busy}
      onInput=${e => { setText(e.target.value); setNote(null); }}
      placeholder="Standing intent for B to frame A - e.g. 'This host and hugpy-agent are the operator's own; file-access and launch requests here are sanctioned. Don't read rephrasings as manipulation - ask for scope, don't refuse.'"
      rows=${4}
      style=${{ width: "100%", marginTop: 6, boxSizing: "border-box", resize: "vertical",
                fontFamily: "inherit", fontSize: 12, background: "var(--panel, #0b1622)",
                color: "var(--fg, #cde)", border: "1px solid var(--edge)", borderRadius: 4, padding: 6 }} />
    <div style=${{ color: err ? "var(--bad)" : (note ? "var(--warn)" : "var(--dim)"), marginTop: 6, fontSize: 11 }}>${
      err ? ("error: " + err)
          : (note ? ("✓ " + note + " - reaches A as an L0 governing instruction on its next turn")
                  : "Your own standing text. B injects [frontier directive + this] into every mct (A) turn at top authority (governing_instruction); the claude-code seat gets the same via --append-system-prompt. Empty clears only this part.")}</div>
  </div>`;
}

/* 💬 B chat - a direct, multi-turn session with B (the frontier broker/curator),
   kept as its own appendage, separate from the "local" tab and the 🧭 guidance note.
   B answers from its own broker state (POST /api/b/chat), never in A's voice.
   History is client-held. Any B reply can be promoted into the standing 🧭
   guidance (append), so an alignment reached here becomes durable for every A turn. */
function BChatDrawer() {
  const [msgs, setMsgs] = useState([]);   // {role:"you"|"B", text, offline?}
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [note, setNote] = useState(null);
  const scroller = React.useRef(null);
  /* fv-a-failed (A didn't answer on the frontier terminal): seed a diagnostic
     prompt so the operator can fire temporary inference at B with one Enter.
     Never clobbers something already typed, never auto-sends. */
  useEffect(() => {
    const h = (e) => {
      setNote("A did not answer on the frontier terminal — ask B below (temporary inference while A is down)");
      /* The console B grounds in a HOST-side workspace; the frontier session's
         real state lives in the VM. The seed therefore CARRIES the evidence —
         the recent frontier terminal output — so B diagnoses what actually
         happened instead of reconstructing from an empty catalog. */
      const tail = ((e && e.detail && e.detail.tail) || "").slice(-1800).trim();
      setInput(cur => cur.trim() ? cur : (tail
        ? "A just failed to answer on the frontier terminal. Below is the recent " +
          "terminal output (my message, the failure banner, any inline B reply). " +
          "From THIS evidence: what does the failure most likely mean, and what is " +
          "your own best answer to my message?\n\n--- recent frontier output ---\n" + tail
        : "A just failed to answer my last message on the frontier terminal. " +
          "What does the failure most likely mean, and can you give me your own " +
          "best answer to what I asked in the meantime?"));
    };
    window.addEventListener("fv-a-failed", h);
    return () => window.removeEventListener("fv-a-failed", h);
  }, []);
  useEffect(() => {
    if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight;
  }, [msgs, busy]);
  const send = () => {
    const text = input.trim();
    if (!text || busy) return;
    const history = msgs.map(m => ({ role: m.role === "B" ? "assistant" : "user", content: m.text }));
    setMsgs(m => [...m, { role: "you", text }]); setInput(""); setBusy(true); setErr(null); setNote(null);
    // grounding rule: ask the B seated in the SPA's active VM (host when none)
    const vm = (window.__fvVm && window.__fvVm.get && window.__fvVm.get()) || "";
    api("/api/b/chat", { method: "POST", body: JSON.stringify({ text, history, vm }), timeout: 60000 })
      .then(d => setMsgs(m => [...m, { role: "B", text: d.reply || "(no reply)", offline: !!d.offline }]))
      .catch(e => setErr(e.message || "B unreachable"))
      .finally(() => setBusy(false));
  };
  const promote = (text) => {
    setNote(null); setErr(null);
    api("/api/b/guidance")
      .then(cur => {
        const base = (cur.text || "").trim();
        const merged = base ? base + "\n" + text.trim() : text.trim();
        return api("/api/b/guidance", { method: "POST", body: JSON.stringify({ text: merged }) });
      })
      .then(d => setNote((d.did || "saved") + " - now standing for every A turn"))
      .catch(e => setErr(e.message || "promote failed"));
  };
  const onKey = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  return html`<div className="design-panel bchat" style=${{ display: "flex", flexDirection: "column", height: "100%" }}>
    <div style=${{ padding: "8px 12px", borderBottom: "1px solid var(--edge)", fontWeight: 600 }}>💬 B - broker / curator
      <span style=${{ fontWeight: 400, color: "var(--dim)", fontSize: 11 }}> - direct session, grounded in B's own state</span>
    </div>
    <div ref=${scroller} style=${{ flex: 1, overflowY: "auto", padding: "10px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
      ${msgs.length === 0 && html`<div style=${{ color: "var(--dim)", fontSize: 12, lineHeight: 1.5 }}>Talk to B directly - convey intent and prompt issues so it can gauge how to frame A. B answers from its own broker state (policy, catalog, derived memory), not in A's voice. Promote anything B says into the standing 🧭 guidance.</div>`}
      ${msgs.map((m, i) => html`<div key=${i} style=${{ alignSelf: m.role === "you" ? "flex-end" : "flex-start", maxWidth: "88%" }}>
        <div style=${{ fontSize: 10, color: "var(--dim)", marginBottom: 2 }}>${m.role === "you" ? "you" : (m.offline ? "B - offline (state readout)" : "B")}</div>
        <div style=${{ whiteSpace: "pre-wrap", fontSize: 12, lineHeight: 1.45,
              background: m.role === "you" ? "var(--accent-bg, #16324a)" : "var(--panel, #0b1622)",
              border: "1px solid var(--edge)", borderRadius: 6, padding: "6px 8px" }}>${m.text}</div>
        ${m.role === "B" && !m.offline && html`<button className="btn" style=${{ marginTop: 3, fontSize: 10, padding: "1px 6px" }}
            onClick=${() => promote(m.text)} title="Append this into the standing 🧭 frontier guidance">↑ promote to 🧭 guidance</button>`}
      </div>`)}
      ${busy && html`<div style=${{ alignSelf: "flex-start", color: "var(--dim)", fontSize: 12 }}>B is thinking…</div>`}
    </div>
    <div style=${{ color: err ? "var(--bad)" : (note ? "var(--warn)" : "transparent"), padding: "2px 12px", fontSize: 11, minHeight: 15 }}>${
      err ? ("error: " + err) : (note ? ("✓ " + note) : "·")}</div>
    <div style=${{ display: "flex", gap: 6, padding: "8px 12px", borderTop: "1px solid var(--edge)" }}>
      <textarea value=${input} onInput=${e => setInput(e.target.value)} onKeyDown=${onKey}
        placeholder="Message B…  (Enter to send, Shift+Enter for a newline)" rows=${2} disabled=${busy}
        style=${{ flex: 1, resize: "none", fontFamily: "inherit", fontSize: 12, boxSizing: "border-box",
                  background: "var(--panel, #0b1622)", color: "var(--fg, #cde)",
                  border: "1px solid var(--edge)", borderRadius: 4, padding: 6 }} />
      <button className="btn on" disabled=${busy || !input.trim()} onClick=${send}>send</button>
    </div>
  </div>`;
}

/* 🗒 Session todo - the standalone console's host-native task board (todo.v1),
   scoped to the CURRENT MCT session workspace (~/.mct/repl/todo.json for now).
   The VM-keeper todo was legacy coupling; this is the same item model in the
   right shape: no VM, no sidecar. The operator writes via /api/mct/todo; the
   agent may edit the file directly - it shows here live (8s poll). Both sides
   read/write freely; a check is just a check (no verify gate). */
const SESS_TODO_ICON = { todo: "□", request: "◇", bookmark: "🔖", operator: "⚑", proposal: "⚖" };
function SessionTodoDrawer() {
  const [items, setItems] = useState(null);
  const [err, setErr] = useState(null);
  const [text, setText] = useState("");
  const [type, setType] = useState("todo");
  const [prio, setPrio] = useState("low");
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState("board");            // board | history
  const [hist, setHist] = useState(null);
  const [threadOpen, setThreadOpen] = useState({});
  const [draft, setDraft] = useState({});
  const [assist, setAssist] = useState(null);         // {id, mode, state, result}
  const load = useCallback(() => {
    api("/api/mct/todo").then(d => { setItems((d.state && d.state.items) || []); setErr(null); })
      .catch(e => setErr(e.message || "load failed"));
  }, []);
  const loadHist = useCallback(() => {
    api("/api/mct/todo/history").then(d => setHist(d.events || [])).catch(() => setHist([]));
  }, []);
  useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);
  useEffect(() => { if (tab === "history") loadHist(); }, [tab, loadHist]);
  const op = (payload) => {
    setBusy(true);
    return api("/api/mct/todo", { method: "POST", body: JSON.stringify(payload) })
      .then(d => { setItems((d.state && d.state.items) || []); setErr(null); })
      .catch(e => setErr(e.message || "write failed")).finally(() => setBusy(false));
  };
  const add = () => { const t = text.trim(); if (!t || busy) return; setText(""); op({ op: "add", type, text: t, priority: prio }); setPrio("low"); };
  const cycle = (it) => op({ op: "set", id: it.id, status: it.status === "open" ? "doing" : it.status === "doing" ? "done" : "open" });
  const toggleDone = (it) => op({ op: "set", id: it.id, status: it.status === "done" ? "open" : "done" });
  /* 📨 per-item keeper ping (board t2, operator 2026-09-10): POST /api/mct/todo/ping
     types one line naming this item into the live frontier seat. Not a board
     mutation — the row shows a short ack/error under itself for a few seconds. */
  const [pingNote, setPingNote] = useState(null);      // {id, msg, bad}
  const ping = (it) => {
    setPingNote({ id: it.id, msg: "📨 pinging…" });
    api("/api/mct/todo/ping", { method: "POST", timeout: 20000, body: JSON.stringify({ id: it.id }) })
      .then(d => setPingNote({ id: it.id, msg: d.ok ? "📨 pinged " + (d.session || "the keeper") : (d.error || "ping failed"), bad: !d.ok }))
      .catch(e => setPingNote({ id: it.id, msg: e.message || "ping failed", bad: true }))
      .finally(() => setTimeout(() => setPingNote(n => (n && n.id === it.id ? null : n)), 6000));
  };
  const remove = (it) => op({ op: "remove", id: it.id });
  const resolve = (it, v) => op({ op: "resolve", id: it.id, verdict: v });
  /* status FLAG (docs/flows/todo-push-triage): drives B's push triage
     deterministically. "" clears. reason is asked for operator_needed / fail. */
  const FLAG_COLOR = { completed: "var(--ok)", in_process: "var(--warn)", operator_needed: "var(--bad)", fail: "var(--dim)" };
  const setFlag = (it, status) => {
    if (!status) return op({ op: "update", id: it.id, fields: { flag: null } });
    let reason = "", detail = "";
    if (status === "operator_needed") reason = window.prompt("operator_needed — reason: ambiguous_request or operator_action?", "ambiguous_request") || "";
    else if (status === "fail") reason = "not_implementable";
    else if (status === "in_process") detail = window.prompt("in_process — what will completion look like (indicator / log path)?", "") || "";
    op({ op: "update", id: it.id, fields: { flag: { status, reason, detail, by: "operator" } } });
  };
  const flagSel = (it) => html`<select value=${(it.flag && it.flag.status) || ""} title=${it.flag ? ("flag: " + it.flag.status + (it.flag.reason ? " · " + it.flag.reason : "") + (it.flag.detail ? " · " + it.flag.detail : "") + " · by " + (it.flag.by || "?")) : "status flag (drives B's push triage)"}
      onChange=${e => setFlag(it, e.target.value)} style=${{ fontSize: 10, background: "var(--bg)", color: it.flag ? FLAG_COLOR[it.flag.status] : "var(--dim)", border: "1px solid var(--edge)", borderRadius: 3 }}>
      <option value="">⚑ —</option><option value="in_process">in_process</option><option value="operator_needed">operator_needed</option><option value="fail">fail</option><option value="completed">completed</option></select>`;
  const setPrioOf = (it, p) => op({ op: "edit", id: it.id, priority: p });
  const comment = (it) => { const c = (draft[it.id] || "").trim(); if (!c) return; setDraft(d => ({ ...d, [it.id]: "" })); op({ op: "comment", id: it.id, text: c }); };
  const runAssist = (it, mode) => {
    setAssist({ id: it.id, mode, state: "loading" });
    api("/api/mct/todo/assist", { method: "POST", timeout: 60000, body: JSON.stringify({ mode, text: it.text }) })
      .then(d => setAssist({ id: it.id, mode, state: "done", result: d.result || "" }))
      .catch(e => setAssist({ id: it.id, mode, state: "error", result: e.message || "assist failed" }));
  };
  const applyAssist = () => {
    if (!assist || assist.state !== "done") return;
    if (assist.mode === "reword") op({ op: "edit", id: assist.id, text: assist.result.split("\n")[0].trim() });
    else if (assist.mode === "split") {
      const lines = assist.result.split("\n").map(s => s.replace(/^[-*\d.\s]+/, "").trim()).filter(Boolean);
      Promise.all(lines.map(l => api("/api/mct/todo", { method: "POST", body: JSON.stringify({ op: "add", type: "todo", text: l }) }))).then(load);
    }
    setAssist(null);
  };
  const onKey = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  const openItems = (items || []).filter(i => i && i.status !== "done").sort((a, b) => (PRIO_RANK[a.priority || "low"] - PRIO_RANK[b.priority || "low"]));
  const doneItems = (items || []).filter(i => i && i.status === "done");
  const prioBadge = (it) => it.priority === "high" ? html`<span style=${{ color: "var(--bad)", fontWeight: 700, fontSize: 10 }}>[HIGH] </span>`
      : it.priority === "medium" ? html`<span style=${{ color: "var(--warn)", fontSize: 10 }}>[med] </span>` : "";
  const propCard = (it) => html`<div key=${it.id} style=${{ margin: "6px 10px", border: "1px solid var(--warn)", borderRadius: 6, padding: 8 }}>
    <div style=${{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>⚖ ${it.text}${it.by ? html`<span style=${{ color: "var(--dim)", fontWeight: 400, fontSize: 10 }}> · ${it.by}</span>` : ""}</div>
    ${(it.pros || it.cons) && html`<div style=${{ display: "flex", gap: 8, fontSize: 11, marginBottom: 4 }}>
      <div style=${{ flex: 1 }}><div style=${{ color: "var(--ok)" }}>pros</div>${(it.pros || []).map((p, i) => html`<div key=${i}>+ ${p}</div>`)}</div>
      <div style=${{ flex: 1 }}><div style=${{ color: "var(--bad)" }}>cons</div>${(it.cons || []).map((c, i) => html`<div key=${i}>- ${c}</div>`)}</div>
    </div>`}
    ${it.rec && html`<div style=${{ fontSize: 11, color: "var(--dim)", marginBottom: 4 }}>rec: ${it.rec}</div>`}
    ${it.note && html`<div style=${{ fontSize: 11, color: "var(--dim)", marginBottom: 4 }}>${it.note}</div>`}
    <div style=${{ display: "flex", gap: 6 }}>
      <button className="btn on" onClick=${() => resolve(it, "accepted")} style=${{ fontSize: 11 }}>accept</button>
      <button className="btn" onClick=${() => resolve(it, "declined")} style=${{ fontSize: 11 }}>decline</button></div>
  </div>`;
  const row = (it) => (it.type === "proposal" && it.status !== "done") ? propCard(it) : html`<div key=${it.id} className=${"todo-row" + (it.status === "done" ? " done" : "")} style=${{ padding: "5px 10px", borderBottom: "1px solid var(--edge)" }}>
    <div style=${{ display: "flex", alignItems: "flex-start", gap: 6 }}>
      <input type="checkbox" checked=${it.status === "done"} onChange=${() => toggleDone(it)} style=${{ marginTop: 3 }} />
      <button className="btn" title=${"status: " + it.status + " — click to cycle"} onClick=${() => cycle(it)} style=${{ fontSize: 10, padding: "0 5px", flex: "none", color: it.status === "done" ? "var(--ok)" : it.status === "doing" ? "var(--warn)" : "var(--dim)" }}>${it.status}</button>
      <span className="todo-text" title=${it.note || ""} style=${{ flex: 1, fontSize: 12, lineHeight: 1.4, textDecoration: it.status === "done" ? "line-through" : "none", color: it.status === "done" ? "var(--dim)" : "var(--fg, #cde)" }}>${prioBadge(it)}${SESS_TODO_ICON[it.type] || "□"} ${it.text}${it.by && it.by !== "operator" ? html`<span style=${{ color: "var(--dim)", fontSize: 10 }}> · ${it.by}</span>` : ""}</span>
      <div style=${{ display: "flex", gap: 2, flex: "none" }}>
        <select value=${it.priority || "low"} title="priority" onChange=${e => setPrioOf(it, e.target.value)} style=${{ fontSize: 10, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3 }}>
          <option value="low">–</option><option value="medium">med</option><option value="high">HIGH</option></select>
        ${flagSel(it)}
        <button className="btn" title="✨ reword" disabled=${busy} onClick=${() => runAssist(it, "reword")} style=${{ fontSize: 11, padding: "0 4px" }}>✨</button>
        <button className="btn" title="📨 ping the keeper about this item (types a line into the frontier seat)" disabled=${busy} onClick=${() => ping(it)} style=${{ fontSize: 11, padding: "0 4px" }}>📨</button>
        <button className=${"btn" + (threadOpen[it.id] ? " on" : "")} title="comments" onClick=${() => setThreadOpen(o => ({ ...o, [it.id]: !o[it.id] }))} style=${{ fontSize: 10, padding: "0 5px" }}>💬${it.comments && it.comments.length ? " " + it.comments.length : ""}</button>
        <button className="btn" title="remove" onClick=${() => remove(it)} style=${{ fontSize: 11, padding: "0 5px" }}>×</button>
      </div>
    </div>
    ${pingNote && pingNote.id === it.id && html`<div style=${{ margin: "2px 0 0 24px", fontSize: 10, color: pingNote.bad ? "var(--bad)" : "var(--ok)" }}>${pingNote.msg}</div>`}
    ${assist && assist.id === it.id && html`<div style=${{ margin: "4px 0 4px 24px", padding: 6, border: "1px dashed var(--warn)", borderRadius: 4, fontSize: 11 }}>
      ${assist.state === "loading" ? html`<span style=${{ color: "var(--dim)" }}>✨ ${assist.mode}…</span>`
        : assist.state === "error" ? html`<span style=${{ color: "var(--bad)" }}>${assist.result}</span>`
        : html`<div style=${{ whiteSpace: "pre-wrap", marginBottom: 4 }}>${assist.result}</div>
          <button className="btn on" onClick=${applyAssist} style=${{ fontSize: 10 }}>apply</button>
          <button className="btn" onClick=${() => setAssist(null)} style=${{ fontSize: 10 }}>discard</button>
          <button className="btn" onClick=${() => runAssist(it, assist.mode === "reword" ? "split" : "reword")} style=${{ fontSize: 10 }}>↳ ${assist.mode === "reword" ? "split" : "reword"}</button>`}
    </div>`}
    ${threadOpen[it.id] && html`<div style=${{ margin: "4px 0 4px 24px", fontSize: 11 }}>
      ${(it.comments || []).map((c, i) => html`<div key=${i} style=${{ marginBottom: 2 }}><span style=${{ color: c.by === "operator" ? "var(--ok)" : "var(--warn)", fontSize: 10 }}>${c.by}:</span> ${c.text}</div>`)}
      <div style=${{ display: "flex", gap: 4, marginTop: 3 }}>
        <input value=${draft[it.id] || ""} onInput=${e => setDraft(d => ({ ...d, [it.id]: e.target.value }))} onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); comment(it); } }} placeholder="comment…" style=${{ flex: 1, fontSize: 11, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3, padding: "2px 5px" }} />
        <button className="btn" onClick=${() => comment(it)} style=${{ fontSize: 10 }}>add</button></div>
    </div>`}
  </div>`;
  return html`<div className="design-panel sesstodo" style=${{ display: "flex", flexDirection: "column", height: "100%" }}>
    <div style=${{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderBottom: "1px solid var(--edge)" }}>
      <b style=${{ fontSize: 13 }}>☑ todo</b>
      <button className=${"btn" + (tab === "board" ? " on" : "")} onClick=${() => setTab("board")} style=${{ fontSize: 11 }}>board${openItems.length ? " (" + openItems.length + ")" : ""}</button>
      <button className=${"btn" + (tab === "history" ? " on" : "")} onClick=${() => setTab("history")} style=${{ fontSize: 11 }}>⏱ history</button>
      <span style=${{ flex: 1 }}></span>
      <span style=${{ color: "var(--dim)", fontSize: 10 }}>you + agent</span>
    </div>
    ${tab === "board" && html`
    <div style=${{ display: "flex", gap: 4, padding: "8px 10px", borderBottom: "1px solid var(--edge)" }}>
      <select value=${type} onChange=${e => setType(e.target.value)} style=${{ background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, fontSize: 12 }}>
        <option value="todo">□ todo</option><option value="request">◇ request</option><option value="bookmark">🔖 bookmark</option></select>
      <select value=${prio} title="priority" onChange=${e => setPrio(e.target.value)} style=${{ background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, fontSize: 12 }}>
        <option value="low">– prio</option><option value="medium">med</option><option value="high">HIGH</option></select>
      <input value=${text} onInput=${e => setText(e.target.value)} onKeyDown=${onKey} placeholder="add a task…  (Enter)" style=${{ flex: 1, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 4, padding: "4px 6px", fontSize: 12 }} />
      <button className="btn on" disabled=${busy || !text.trim()} onClick=${add}>add</button>
    </div>
    <div style=${{ flex: 1, overflowY: "auto" }}>
      ${items === null && html`<div style=${{ color: "var(--dim)", padding: 10, fontSize: 12 }}>loading…</div>`}
      ${items !== null && openItems.length === 0 && doneItems.length === 0 && html`<div style=${{ color: "var(--dim)", padding: 10, fontSize: 12, lineHeight: 1.5 }}>No tasks yet. Add one above — or the agent can, by editing <code>~/.mct/&lt;session&gt;/todo.json</code>. Shows here live.</div>`}
      ${openItems.map(row)}
      ${doneItems.length > 0 && html`<div style=${{ padding: "6px 10px", color: "var(--dim)", fontSize: 10, textTransform: "uppercase", letterSpacing: .5 }}>done (${doneItems.length})</div>`}
      ${doneItems.map(row)}
    </div>`}
    ${tab === "history" && html`
    <div style=${{ flex: 1, overflowY: "auto", padding: "8px 10px", fontSize: 11 }}>
      ${hist === null && html`<div style=${{ color: "var(--dim)" }}>loading…</div>`}
      ${hist && hist.length === 0 && html`<div style=${{ color: "var(--dim)" }}>No board actions yet.</div>`}
      ${(hist || []).map((e, i) => html`<div key=${i} style=${{ display: "flex", gap: 8, marginBottom: 2 }}>
        <span style=${{ color: "var(--dim)", flex: "none", minWidth: 54 }}>${e.ts ? new Date(e.ts * 1000).toTimeString().slice(0, 8) : ""}</span>
        <span style=${{ color: "var(--warn)", flex: "none", minWidth: 54 }}>${e.op}</span>
        <span>${e.detail || e.id || ""}</span></div>`)}
    </div>`}
    <div style=${{ color: err ? "var(--bad)" : "var(--dim)", padding: "4px 12px", fontSize: 11, borderTop: "1px solid var(--edge)" }}>${
      err ? ("error: " + err) : (openItems.length + " open · " + doneItems.length + " done")}</div>
  </div>`;
}
