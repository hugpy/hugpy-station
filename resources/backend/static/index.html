<style>
  :root { --bg:#0d1117; --panel:#161b22; --edge:#30363d; --fg:#c9d1d9; --accent:#2f81f7; --dim:#8b949e;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  html,body,#root { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:13px/1.4 ui-sans-serif,system-ui,sans-serif; }
  .app { display:flex; flex-direction:column; height:100%; }
  .tabs { display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding:6px 8px; background:var(--panel);
          border-bottom:1px solid var(--edge); flex:0 0 auto; }
  /* The per-VM groups scroll horizontally within their own strip; the action
     buttons live in a separate group that wraps to a new line instead of scrolling
     off-screen (previously the keeper toggle/launch were pushed off the right edge
     and were unreachable on mobile). */
  .tablist { display:flex; align-items:center; gap:6px; overflow-x:auto; flex:1 1 240px; min-width:0; }
  .actions { display:flex; align-items:center; flex-wrap:wrap; gap:4px; flex:0 0 auto; margin-left:auto; }
  /* disclosure CONTROL, not a VM group — dashed + dim so it never reads as a VM.
     Born as the stopped-VM fold; since t74 it styles the + VM dropdown (which
     folds EVERY idle VM, not just stopped ones). */
  .tabgroup { flex:0 0 auto; padding:5px 10px; border:1px dashed var(--edge); border-radius:6px;
              background:#0d1117; color:var(--dim); cursor:pointer; white-space:nowrap; font-size:12px; }
  .tabgroup:hover { border-color:var(--accent); color:var(--fg); }
  .tabgroup:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .tabgroup.warn { color:var(--warn); border-color:var(--warn); }   /* states are last-known, not live */
  /* t74: the + VM dropdown is a native <select> (keyboard-operable for free, and
     its popup is the BROWSER's — the tablist clips overflow, the same constraint
     that keeps the ⏻ tray inline, so an absolutely-positioned menu would be cut
     off). It wears .tabgroup for the disclosure look; a <select> resets font and
     UA chrome, so re-assert them here. */
  .vm-drop { font:inherit; font-size:12px; max-width:220px; }
  /* t74: grows between the dropdown (left edge) and the ACTIVE VM groups, pushing
     the groups to the FAR RIGHT of the strip — the operator ask. Collapsed on
     mobile (media query below): right-alignment is meaningless in a scroll strip. */
  .tab-spacer { flex:1 1 12px; min-width:0; }
  .btn { padding:5px 10px; border:1px solid var(--edge); border-radius:6px; background:#0d1117;
         color:var(--fg); cursor:pointer; font-size:12px; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.danger:hover { border-color:var(--bad); color:var(--bad); }
  /* UNIFIED TAB BAR — one strip, every open terminal is a tab grouped per VM.
     A VM group holds its keeper (PRIMARY) + shell (SECONDARY) terminal tabs and a
     ⏻ power affordance. Keeper is styled primary and ordered first; the shell is
     dim/secondary. This is where keeper-primacy now lives ALONE: the side-dock
     that used to co-enforce it was reverted (acded94 — "the keeper is the
     operator's workspace, not a peer of the shell"), so the tab bar carries it. */
  .vmgroup { display:inline-flex; align-items:center; gap:3px; flex:0 0 auto; white-space:nowrap;
             padding:2px 4px 2px 8px; border:1px solid var(--edge); border-radius:8px; background:#0d1117; }
  .vmgroup.active { border-color:var(--accent); }
  .vmgroup.down { border-style:dashed; }        /* stopped: reachable, but not a live workspace */
  .vm-name { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px;
             cursor:pointer; padding-right:2px; }
  .vmgroup.active .vm-name { color:var(--fg); }
  .vm-state { color:var(--dim); font-size:11px; padding:0 4px; }
  .term-tab { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; font-size:12px;
              border:1px solid var(--edge); border-radius:6px; background:#0d1117; color:var(--fg);
              cursor:pointer; white-space:nowrap; }
  .term-tab:hover { border-color:var(--accent); }
  .term-tab:disabled { opacity:.5; cursor:default; }
  /* VM dropdown (replaces the inline per-VM group): all VMs, ●/○ = last-known
     running state; selecting opens that VM's terminal. */
  .vm-dd { background:#0d1117; color:var(--fg); border:1px solid var(--edge); border-radius:6px;
           padding:4px 6px; font-size:12px; max-width:170px; cursor:pointer; }
  .vm-dd:hover { border-color:var(--accent); }
  /* keeper PRIMARY (heavier, brighter, leads) vs shell SECONDARY (dim, lighter):
     the workspace must never read as a peer of the shell. */
  .term-tab.primary { font-weight:600; }
  .term-tab.secondary { color:var(--dim); font-weight:400; }
  .term-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }  /* on stage */
  .term-tab.active.secondary { color:#fff; }
  /* a ghost tab is a terminal that isn't open yet — the open/reopen affordance.
     Still clickable (click = mount + put on stage); it just recedes so the open
     terminals read louder, and it is what a VM falls back to when its last tab is
     closed (so a closed VM is never stranded — its keeper tab is one click away). */
  .term-tab.ghost { opacity:.5; border-style:dashed; }
  .term-close { opacity:.7; font-size:11px; padding-left:2px; }
  .term-close:hover { opacity:1; color:var(--bad); }
  .vm-power { padding:4px 7px; font-size:12px; border:1px solid var(--edge); border-radius:6px;
              background:#0d1117; color:var(--fg); cursor:pointer; }
  .vm-power:hover { border-color:var(--accent); }
  .vm-power.on { border-color:var(--accent); color:var(--accent); }
  .vm-power-menu { display:inline-flex; align-items:center; gap:3px; }   /* inline, never an absolute popup (the strip clips overflow) */
  .stage { position:relative; flex:1 1 auto; }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  /* Scoped to .stage on purpose: wireframe.js ALSO uses a bare `hint` class on
     its status line and modal captions, and an unscoped absolute/inset:0 rule
     here silently stretched that status div over the whole design drawer —
     every click landed on it, so the editor rendered fine but was dead to the
     pointer (t18, live since the seed). The console's placeholder hints all
     live inside .stage; keep this selector scoped or the drawer dies again. */
  .stage .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:var(--dim); flex-direction:column; gap:10px; }
  .health { flex:0 0 auto; display:flex; gap:14px; align-items:center; padding:4px 10px;
            border-top:1px solid var(--edge); background:var(--panel); color:var(--dim); font-size:11px; }
  .health b { color:var(--fg); font-weight:500; }
  /* degraded: the console can't see the fleet — say so loudly rather than vanish */
  .health.degraded { border-top-color:var(--bad); }
  .health-spacer { flex:1; }
  .health-err { color:var(--bad); }
  /* stale marker sits in the tab strip, next to the power dots it discredits */
  .stale { flex:0 0 auto; color:var(--warn); font-size:11px; white-space:nowrap;
           padding:0 8px; cursor:help; }
  .pill { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); } .pill.bad { background:var(--bad); }
  .kdot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:5px; vertical-align:middle; }
  /* per-agent keeper control: name+liveness dot, then ▶/⏹, then the gate.
     Grouped in one bordered pill so two agents' controls never read as one
     undifferentiated row of buttons. */
  .keeper-ctl { display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
                padding:2px 4px; border:1px solid var(--edge); border-radius:6px; }
  .keeper-ctl .ka-name { font-size:11px; color:var(--dim); white-space:nowrap; }
  .keeper-ctl .btn { padding:2px 6px; font-size:11px; }
  /* The gate reads as a STATE, not an action: dim when disabled, accent-outlined
     when enabled, so "is this keeper allowed to run" is legible at a glance
     without hovering for the title. */
  .btn.ka-gate { color:var(--dim); border-style:dashed; }
  .btn.ka-gate.on { color:var(--ok); border-style:solid; border-color:var(--ok); }
  /* design drawer (wireframe.js editor; its .wf-* chrome is self-injected) */
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .main { display:flex; flex:1 1 auto; min-height:0; }
  .main .stage { min-width:0; }
  .design-panel { flex:0 0 var(--rcw, 44%); min-width:360px; max-width:var(--rcmax, 660px); display:flex; flex-direction:column;
                  border-left:1px solid var(--edge); background:var(--panel); overflow-y:auto; }
  .rc-col { display:flex; flex-direction:column; min-height:0; overflow:hidden; border-left:1px solid var(--edge); background:var(--panel); }
  .rc-drawer { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .rc-drawer > * { flex:1 1 auto !important; min-height:0; height:100% !important; max-width:none !important; border-left:none !important; }
  /* expandable right column — a class on :root widens the shared drawer panel */
  :root.rc-wide { --rcw:70%; --rcmax:1200px; }
  :root.rc-full { --rcw:88%; --rcmax:2000px; }
  /* flow drawer (flow.js editor; its .fl-* chrome is self-injected). The panel
     shell reuses .design-panel; these two are the drawer's own React chrome:
     the o19 "route not enabled" note and the editor's mount host. */
  .flow-note { flex:none; padding:6px 10px; color:var(--dim); font-size:12px;
               border-bottom:1px solid var(--edge); background:var(--panel); }
  .flow-host { display:flex; flex-direction:column; flex:1; min-height:0; }
  @media (max-width: 900px) {
    .main { flex-direction:column; }
    /* Header on a phone: the actions group is ~13 controls (start…⟳ VMs). It is
       `flex:0 0 auto`, which sizes it to its SINGLE-LINE max-content — so
       `flex-wrap` never fires and the whole group ran off the right edge of the
       viewport (unreachable, and the page scrolled sideways). Stack the VM tabs
       and the actions into two full-width rows, each a horizontal scroll strip
       with a hidden scrollbar (same idiom .tablist already uses). Every control
       stays reachable by swiping; nothing forces the page wider than the screen. */
    .tabs { flex-direction:column; align-items:stretch; flex-wrap:nowrap; }
    .tabs > .tablist, .tabs > .actions {
      min-width:0; margin-left:0; flex:0 0 auto;   /* align-items:stretch gives full width */
      flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
      scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .tabs > .tablist::-webkit-scrollbar, .tabs > .actions::-webkit-scrollbar { display:none; }
    .actions > * { flex:0 0 auto; }        /* buttons keep their width; the strip scrolls */
    /* nowrap scoped to the scroll strips only — a .btn elsewhere (e.g. in a
       full-width drawer) must still be free to wrap rather than overflow. */
    .actions .btn, .tablist .tabgroup, .tablist .vmgroup, .tablist .term-tab { white-space:nowrap; }
    /* t74: in the stacked/scrolling strip the spacer would just push the VM
       groups off the right edge of the scroll area — collapse to normal flow. */
    .tab-spacer { display:none; }
    /* the fleet-stale warning is the third .tabs child; stretched full-width it
       must WRAP (its base white-space:nowrap would otherwise spill past the edge
       when the fleet API is failing on a narrow phone). */
    .tabs > .stale { white-space:normal; min-width:0; }
    /* ⚿ keeper keys section (inside the steward drawer, which already goes
       full-width on a phone via .design-panel below): its fixed 190px label
       column doesn't fit a phone, so stack label over input. */
    .vm-keys-row { flex-direction:column; align-items:stretch; gap:2px; }
    .vm-keys-row span { flex:none; }
    /* Footer health line: its ~6 status items + the flex:1 spacer overran the
       viewport (the spacer collapses to 0 but the min-content still pushes the
       last items — "console live" — past the right edge, scrolling the page
       sideways). Let it WRAP across rows and drop the right-push spacer, which
       is meaningless once wrapped. Every indicator stays visible. */
    .health { flex-wrap:wrap; gap:3px 12px; }
    .health-spacer { display:none; }
    /* On a phone a drawer takes the FULL screen instead of splitting 55/45 with
       the terminal (operator: "full screen rather than 50% keeper at all times").
       The stage stays mounted (display:none, not unmounted) so the terminal is
       lossless when you toggle the drawer closed and return to it. */
    .main:has(> .design-panel) > .stage { display:none; }
    .design-panel { flex:1 1 100%; min-width:0; max-width:none;
                    border-left:none; border-top:none; }
  }
  /* to-do drawer (per-keeper queue + build bookmarks on ~/todo.json) */
  .todo-panel { font-size:12px; }
  .todo-bar { display:flex; align-items:center; gap:6px; padding:8px 10px;
              border-bottom:1px solid var(--edge); background:#1c2129; flex:none; }
  .todo-spacer { flex:1; }
  /* ⏱ push-cadence knob (board t45) — the relay-quiet-gate select in the drawer
     toolbar. Compact + flex:none so it rides in the bar next to the action buttons;
     .off is the uninitialized / duplicated / unreadable state (dim + italic). */
  .todo-knob { display:inline-flex; align-items:center; gap:4px; flex:none;
               color:var(--dim); font-size:11px; white-space:nowrap; }
  .todo-knob select { background:var(--bg); color:var(--fg); border:1px solid var(--edge);
               border-radius:6px; padding:2px 4px; font:11px inherit; }
  .todo-knob select:focus { outline:none; border-color:var(--accent); }
  .todo-knob.off { opacity:.7; }
  .todo-knob em { font-style:italic; color:var(--dim); }
  /* ⚡ ACTIVITY METER (board t46) — a compact relay-liveness readout that rides the
     toolbar beside the ⏱ knob. Same 11px/dim rhythm as the knob; .warn tints it when
     the keeper's last activity is older than 30m (a possible keeper/relay stall — the
     tooltip explains). "⚡ —" (no .warn) is the honest no-data / fetch-failed state. */
  .todo-act { flex:none; white-space:nowrap; color:var(--dim); font-size:11px; cursor:default; }
  .todo-act.warn { color:var(--warn); }
  /* align-items:flex-start so the select + buttons stay top-anchored at their own
     height when the compose textarea auto-grows to several lines (board t33). */
  .todo-add { display:flex; align-items:flex-start; gap:6px; padding:8px 10px; border-bottom:1px solid var(--edge); flex:none; }
  .todo-add select, .todo-add input, .todo-add textarea { background:var(--bg); color:var(--fg);
    border:1px solid var(--edge); border-radius:6px; padding:5px 8px; font:12px inherit; }
  .todo-add input, .todo-add textarea { flex:1; min-width:0; }
  .todo-add input:focus, .todo-add textarea:focus { outline:none; border-color:var(--accent); }
  /* the compose box is a textarea (board t33) so the ✨ text transforms — bash fences,
     bullet lists, pros/cons — display + round-trip their newlines (a single-line input
     strips them). It auto-grows to its content (capped, then scrolls) via an effect. */
  .todo-add textarea { resize:none; overflow-y:auto; line-height:1.4; }
  .todo-list { flex:1; overflow-y:auto; padding:6px 10px; }
  .todo-sec { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px;
              margin:10px 0 4px; }
  .todo-empty { color:var(--dim); text-align:center; padding:24px 10px; }
  /* tabbed sections — one bucket visible at a time, replacing the old stacked
     .todo-sec headers. Each tab carries a live count badge (the "number ticker");
     a 0 badge is hidden and its tab recedes (.quiet) but stays clickable, and a
     proposals badge with pending decisions goes attention-colored (.warn). */
  /* ✉ bridge mail list — plain, readable, no chrome competing with the body text */
  .todo-msgs { display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .todo-msg { border:1px solid var(--edge); border-radius:6px; padding:8px 10px; }
  .todo-msg-head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .todo-msg-from { color:var(--accent); }
  .todo-msg-when { color:var(--dim); font-size:11px; margin-left:auto; }
  .todo-msg-body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.45; }
  /* ✉ fleet-mail compose — one row pinned under the mail list: [to] text send */
  .todo-msgsend { display:flex; align-items:flex-end; gap:6px; margin-top:8px;
                  padding-top:8px; border-top:1px solid var(--edge); }
  .todo-msgsend select { flex:none; max-width:130px; background:#161b22; color:var(--fg);
                         border:1px solid var(--edge); border-radius:6px; padding:5px 6px; }
  .todo-msgsend textarea { flex:1; min-height:38px; resize:vertical; background:#161b22;
                           color:var(--fg); border:1px solid var(--edge); border-radius:6px;
                           padding:6px 8px; font:inherit; line-height:1.4; }
  .todo-msgsend .btn { flex:none; }
  .todo-tabs { display:flex; gap:2px; padding:4px 8px 0; flex:none; overflow-x:auto;
               border-bottom:1px solid var(--edge); background:#1c2129; }
  .todo-tab { display:flex; align-items:center; gap:5px; flex:none; cursor:pointer;
              padding:5px 8px; background:none; border:none; border-bottom:2px solid transparent;
              color:var(--dim); font:12px inherit; white-space:nowrap; }
  .todo-tab:hover { color:var(--fg); }
  .todo-tab.quiet { opacity:.5; }                        /* empty bucket — recede, still selectable */
  .todo-tab.active { color:var(--fg); opacity:1; border-bottom-color:var(--accent); }
  .todo-tab-badge { flex:none; min-width:15px; text-align:center; font-size:10px;
                    padding:0 4px; border:1px solid var(--edge); border-radius:8px;
                    color:var(--dim); background:var(--bg); }
  .todo-tab-badge.warn { color:var(--warn); border-color:var(--warn); }  /* N need a decision */
  /* ⏱ HISTORY (board t32) — the journal timeline. A sticky day header groups rows;
     each row is time · action-icon · (id + type-icon + detail), the detail ellipsised
     to one line (full text on title=). Recessive by design — it is a log, not work. */
  .todo-hist { display:flex; flex-direction:column; }
  .todo-hist-day { position:sticky; top:0; z-index:1; padding:6px 8px 3px; background:var(--panel);
                   color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em;
                   border-bottom:1px solid var(--edge); }
  .todo-hist-row { display:flex; align-items:baseline; gap:8px; padding:3px 8px; font-size:12px; }
  .todo-hist-row:hover { background:#1c2129; }
  .todo-hist-time { flex:none; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .todo-hist-ev { flex:none; width:1.3em; text-align:center; }
  .todo-hist-line { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .todo-hist-id { color:var(--accent); }
  .todo-hist-ic { margin:0 4px; opacity:.85; }
  .todo-hist-detail { color:var(--fg); }
  /* OPEN-WORK TICKER (board t25): the count pill on the ☑ toolbar button. Same look
     as the drawer's tab badges (.todo-tab-badge) with a little breathing room after
     the label; inline-flex + vertical-align keep it centred on the button text and
     out of the way of the button's own layout. .warn mirrors the ⚖ tab tint. */
  .todo-btn-badge { display:inline-flex; align-items:center; justify-content:center;
                    min-width:15px; margin-left:6px; padding:0 4px; font-size:10px;
                    border:1px solid var(--edge); border-radius:8px; vertical-align:middle;
                    color:var(--dim); background:var(--bg); }
  .todo-btn-badge.warn { color:var(--warn); border-color:var(--warn); }  /* a proposal awaits a decision */
  /* board t-priority: .high (red) declared AFTER .warn so on a badge carrying both
     classes the high tint wins — high-priority open work outranks a pending proposal. */
  .todo-btn-badge.high { color:var(--bad); border-color:var(--bad); }    /* high-priority open work */
  .todo-row { display:flex; flex-wrap:wrap; align-items:baseline; gap:7px; padding:4px 2px;
              border-bottom:1px solid #1c2129; }
  /* structured operator fields (board t23): keeper-authored worker/task/cmd on an
     item. task + @worker ride the main line as flex:none chips; cmd wraps to its own
     full-width sub-block via the row's flex-wrap. All three are absent on an ordinary
     item, so a fieldless row is byte-identical to before (nothing ever wraps). */
  .todo-task { flex:none; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
               border:1px solid var(--edge); border-radius:4px; padding:0 4px; color:var(--dim); }
  /* board t-priority: the per-item priority chip/cycle control. Same chip rhythm as
     .todo-task (t23). high = red, medium = amber; low renders NO colored chip — just a
     dim "prio" affordance (the 💬.empty idiom) so every item still offers the cycle.
     It is a BUTTON (click cycles low → medium → high), disabled under the dup-id guard. */
  .todo-prio { flex:none; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
               border:1px solid var(--edge); border-radius:4px; padding:0 4px;
               background:none; color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .todo-prio.high { color:var(--bad); border-color:var(--bad); }
  .todo-prio.medium { color:var(--warn); border-color:var(--warn); }
  .todo-prio.empty { opacity:.4; }
  .todo-prio:hover:not(:disabled) { opacity:1; border-color:var(--accent); }
  .todo-worker { flex:none; font-size:11px; color:var(--dim); font-family:ui-monospace,monospace; }
  /* board t-refchips: first-class ref chips for ids/commits cited in an item's own
     text/note/comments — ride the SAME main line as .todo-task/.todo-prio (flex:none,
     same size scale), right after those chips, so they're visible without expanding
     the row. (board t77: the text span moved to its own full-width row below the
     whole identifier line, so refs now sit before the meta/✕/💬 chips that PRECEDE
     text in DOM order — still an identifier, still above the text.) .todo-ref-id is
     tinted like a link (jump);
     .todo-ref-sha is monospace with a ⧉ affordance (copy, no navigation — the console
     has no code viewer). .todo-ref-more is the "+N" overflow toggle. No refs → the
     helper below returns an empty array → nothing renders (zero clutter). */
  .todo-ref { flex:none; font-size:10px; border:1px solid var(--edge); border-radius:4px;
              padding:0 4px; background:none; color:var(--dim); cursor:pointer;
              font-family:inherit; line-height:1.5; }
  .todo-ref:hover { border-color:var(--accent); color:var(--accent); }
  .todo-ref-id { color:var(--accent); }
  .todo-ref-sha { font-family:ui-monospace,monospace; }
  .todo-ref-more { opacity:.6; }
  .todo-ref-more:hover { opacity:1; }
  /* board t-itemids: every item's OWN id, shown quiet/dim/monospace so it reads at
     a glance but never competes with the text — deliberately NOT accent-tinted like
     .todo-ref-id (which links to OTHER items). Same chip rhythm (flex:none, 10px,
     var(--edge) border) so it sits on the same scale as .todo-task/.todo-ref, but
     .todo-id's resting + hover colors stay in the --dim/--fg neutral range so own-id
     vs reference reads apart even at a glance. Click copies the id (copyText + the
     drawer's own say() toast — the same idiom copySha already uses). */
  .todo-id { flex:none; font-size:10px; border:1px solid var(--edge); border-radius:4px;
             padding:0 4px; background:none; color:var(--dim); cursor:pointer;
             font-family:ui-monospace,monospace; line-height:1.5; opacity:.7; }
  .todo-id:hover { opacity:1; border-color:var(--fg); color:var(--fg); }
  /* click-to-jump flash (board t-refchips): a brief, self-clearing highlight (JS
     removes the class ~1.4s later) so landing on the target item after a cross-tab
     jump is unambiguous. rgba mirrors --accent (#2f81f7) since CSS custom props can't
     be torn apart into rgba() components inline. */
  @keyframes todoRefFlash { 0% { background:rgba(47,129,247,.35); } 100% { background:transparent; } }
  .todo-row.todo-flash, .todo-prop.todo-flash { animation:todoRefFlash 1.4s ease-out; }
  /* copy button rides the outer box, pinned top-right no matter how long a command
     is. min-width:0 + max-width:100% keep this flex-basis:100% child from letting a
     long unbreakable one-liner push the row (and thus the drawer/page) sideways. */
  .todo-cmd { flex-basis:100%; min-width:0; max-width:100%; position:relative; margin:3px 0 1px;
              background:var(--bg); border:1px solid var(--edge); border-radius:5px; }
  /* overflow-x:auto is now a belt-and-suspenders fallback — the lines WRAP (below), so
     a long cmd is fully readable in-place instead of running off the right edge (keeper
     bug: "cannot catch all of it"). The 22px right pad keeps wrapped text clear of ⧉. */
  .todo-cmd-lines { overflow-x:auto; padding:5px 22px 5px 8px;
                    font-family:ui-monospace,monospace; font-size:11px; }
  /* pre-wrap keeps intentional spacing but wraps; break-all/anywhere lets an unbroken
     token (a long path/flag chain) break mid-string so it can never overflow. Copy is
     unaffected — it joins the source cmd array, not the wrapped DOM text. */
  .todo-cmd-ln { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-all; }
  .todo-cmd-ln.cmt { color:var(--dim); }                 /* # comment / caveat — not copied */
  .todo-cmd-copy { position:absolute; top:2px; right:2px; background:none; border:none;
                   color:var(--dim); cursor:pointer; font-size:11px; padding:0 2px; line-height:1.4; }
  .todo-cmd-copy:hover { color:var(--accent); }
  .todo-row.done .todo-text { color:var(--dim); text-decoration:line-through; }
  .todo-st { flex:none; width:22px; height:22px; border-radius:50%; cursor:pointer;
             background:var(--bg); color:var(--dim); border:1px solid var(--edge); font-size:11px; }
  .todo-st.doing { color:var(--warn); border-color:var(--warn); }
  .todo-st.done { color:var(--ok); border-color:var(--ok); }
  .todo-st:hover { border-color:var(--accent); }
  .todo-ic { flex:none; }
  /* board t77 (supersedes t65): the operator asked for the item TEXT to sit on its
     OWN row below the identifiers (id tag/type icon/priority/ref chips/by·timestamp
     meta) in every section — queue/operator/bookmarks/done — not just when the chip
     crowd happened to squeeze it there. flex-basis:100% is the SAME idiom already
     used by .todo-cmd/.todo-thread/.todo-query below to force a flex-wrap child onto
     its own full-width line regardless of how much room the line above has left, so
     the split is structural, not a width accident. t65's min-width stays as a
     belt-and-suspenders floor (harmless now that basis already guarantees full
     width) — it's what stopped the old 1-char-column squeeze and there's no reason
     to drop a working guard. */
  .todo-text { flex:1 1 100%; min-width:min(24ch, 100%); margin-top:2px; overflow-wrap:anywhere; cursor:default; }
  .todo-note { color:var(--dim); }
  .todo-meta { flex:none; color:var(--dim); font-size:10px; white-space:nowrap; }
  .todo-x { flex:none; background:none; border:none; color:var(--dim); cursor:pointer; }
  .todo-x:hover { color:var(--bad); }
  /* 💬 board discussion layer (board t24) — comment threads on ANY item + a ❓ query
     line on operator items. The 💬 toggle rides every row and proposal head: "💬 N"
     when a thread exists, a dim bare 💬 (.empty, 40%) otherwise — a quiet, always-
     present affordance to START a thread. A thread breaks to its own full-width line
     under a row (flex-basis:100%, like .todo-cmd) or sits in the expanded prop body. */
  .todo-comments-btn { flex:none; background:none; border:none; color:var(--dim);
                       cursor:pointer; font-size:11px; padding:0 2px; white-space:nowrap; }
  .todo-comments-btn.empty { opacity:.4; }
  .todo-comments-btn:hover { color:var(--accent); opacity:1; }
  .todo-thread { flex-basis:100%; margin:4px 0 2px; padding:6px 8px;
                 background:var(--bg); border-left:2px solid var(--edge); border-radius:0 4px 4px 0; }
  .todo-comment { font-size:11px; margin-bottom:3px; overflow-wrap:anywhere; }
  .todo-comment:last-child { margin-bottom:0; }
  .todo-comment-meta { color:var(--dim); }
  .todo-thread-empty { color:var(--dim); font-size:11px; font-style:italic; }
  .todo-comment-add { display:flex; gap:6px; margin-top:6px; }
  .todo-comment-add input { flex:1; min-width:0; background:var(--panel); color:var(--fg);
                            border:1px solid var(--edge); border-radius:5px; padding:3px 6px; font-size:11px; }
  .todo-comment-add input:focus { outline:none; border-color:var(--accent); }
  /* 📎 long-revision composer (o14) — a toggle on the comment-add row swaps the
     one-line input for an auto-grow textarea whose body is written to a FILE in the VM
     (POST …/todo-revision, op:write) and announced by a compact 📎 pointer comment.
     The toggle is disabled on a dup-id item, exactly like comment-add (ambiguous write). */
  .todo-long-toggle, .todo-long-cancel { flex:none; background:none; border:1px solid var(--edge);
    color:var(--dim); cursor:pointer; font-size:11px; border-radius:5px; padding:2px 7px; white-space:nowrap; }
  .todo-long-toggle:not(:disabled):hover, .todo-long-cancel:not(:disabled):hover { color:var(--accent); border-color:var(--accent); }
  .todo-long-toggle:disabled, .todo-long-cancel:disabled { opacity:.4; cursor:default; }
  .todo-long { display:flex; flex-direction:column; gap:6px; flex:1 1 100%; min-width:0; }
  .todo-long textarea { resize:none; overflow-y:auto; line-height:1.4; min-height:46px; max-height:300px;
    background:var(--panel); color:var(--fg); border:1px solid var(--edge); border-radius:5px; padding:4px 6px; font:11px inherit; }
  .todo-long textarea:focus { outline:none; border-color:var(--accent); }
  .todo-long-acts { display:flex; gap:6px; align-items:center; }
  /* a 📎 revision pointer comment — its summary + a "view" toggle that fetches the file
     (op:read) and renders it (the docs md renderer, .md) in a collapsible block; a read
     failure shows inline and the pointer itself stays visible. */
  .todo-rev-tag { color:var(--accent); white-space:nowrap; }
  .todo-rev-sum { overflow-wrap:anywhere; }
  .todo-rev-view { background:none; border:none; color:var(--accent); cursor:pointer;
    font-size:11px; padding:0 3px; text-decoration:underline; }
  .todo-rev-body { margin:4px 0 2px; padding:6px 8px; background:var(--panel);
    border:1px solid var(--edge); border-radius:5px; max-height:320px; overflow:auto; }
  .todo-rev-load { color:var(--dim); font-style:italic; font-size:11px; }
  .todo-rev-err { color:var(--bad); font-size:11px; overflow-wrap:anywhere; }
  /* ❓ query on an operator item — a question whose answer unblocks it. Warn-tinted
     and left-barred so it reads as distinct from the accent recommendation and the
     plain cmd block; its thread auto-expands, because the answer belongs there. */
  .todo-query { flex-basis:100%; margin:2px 0; padding:4px 8px; font-size:11px; color:var(--warn);
                border-left:2px solid var(--warn); background:#1a160c; border-radius:0 4px 4px 0;
                overflow-wrap:anywhere; }
  /* ⚖ proposal CARDS (a board item type) — not to be confused with .todo-proposal
     below, which is the ✨ tidy preview. Different feature, unlucky name overlap. */
  .todo-prop { border:1px solid var(--edge); border-radius:6px; background:#10151d;
               margin:4px 0; padding:6px 8px; }
  .todo-prop-head { display:flex; align-items:baseline; gap:7px; cursor:pointer; }
  .todo-prop-tw { flex:1; min-width:0; overflow-wrap:anywhere; }
  .todo-prop-count { flex:none; color:var(--dim); font-size:10px; white-space:nowrap; }
  .todo-prop-badge { flex:none; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
                     border:1px solid currentColor; border-radius:4px; padding:0 4px; }
  .todo-prop-badge.ok { color:var(--ok); } .todo-prop-badge.bad { color:var(--bad); }
  .todo-prop-body { margin-top:6px; }
  .todo-prop-note { color:var(--dim); margin-bottom:6px; overflow-wrap:anywhere; }
  /* board t82: note timeline — a keeper-appended " -- author date:" note folds to its
     newest segment + a "+N earlier" toggle (same chip rhythm as .todo-ref/.todo-id:
     10px, var(--edge) border, dim). Earlier segments stack as blocks when expanded;
     .latest (the newest, and the only one shown folded) stays INLINE so the note keeps
     its current one-line-flow style in rows and prop cards alike. The chip is dim
     monospace like .todo-id — it labels, it never competes with the text. */
  .todo-note-fold { background:none; border:1px solid var(--edge); border-radius:4px;
                    color:var(--dim); cursor:pointer; font-size:10px; padding:0 4px;
                    font-family:inherit; line-height:1.5; opacity:.7; margin-right:4px; }
  .todo-note-fold:hover { opacity:1; border-color:var(--accent); color:var(--accent); }
  .todo-note-seg { display:block; margin:3px 0; overflow-wrap:anywhere; }
  .todo-note-seg.latest { display:inline; margin:0; }
  .todo-note-chip { font-size:10px; border:1px solid var(--edge); border-radius:4px;
                    padding:0 4px; color:var(--dim); font-family:ui-monospace,monospace;
                    opacity:.8; margin-right:4px; white-space:nowrap; }
  /* keeper-4: the '## History' fold — the section label is a chip like .todo-note-chip
     (it labels, it never competes with the entries); the fold button reuses
     .todo-note-fold so the two fold idioms read as one. */
  .todo-hist { display:block; margin:4px 0 2px; }
  .todo-hist-h { font-size:10px; border:1px solid var(--edge); border-radius:4px;
                 padding:0 4px; color:var(--dim); font-family:ui-monospace,monospace;
                 opacity:.8; margin-right:4px; white-space:nowrap; }
  .todo-hist-entry { margin:2px 0; }
  /* pros|cons ride a WRAPPING flex, not a media query: this drawer is a % of the
     viewport, so a viewport breakpoint would stack the columns at a width that
     has nothing to do with how wide the card actually got. flex-basis stacks
     them exactly when two columns stop fitting. */
  .todo-prop-cols { display:flex; flex-wrap:wrap; gap:8px; }
  .todo-prop-col { flex:1 1 150px; min-width:0; }
  .todo-prop-col h4 { margin:0 0 3px; font-size:11px; font-weight:500;
                      text-transform:uppercase; letter-spacing:.5px; }
  .todo-prop-col.pro h4 { color:var(--ok); }
  .todo-prop-col.con h4 { color:var(--bad); }
  .todo-prop-col ul { margin:0; padding-left:14px; }
  .todo-prop-col li { margin-bottom:2px; overflow-wrap:anywhere; }
  .todo-prop-rec { margin-top:7px; padding:5px 7px; border-left:2px solid var(--accent);
                   background:var(--bg); overflow-wrap:anywhere; }
  .todo-prop-rec b { color:var(--accent); font-weight:500; }
  .todo-prop-acts { display:flex; align-items:center; gap:6px; margin-top:7px; }
  .todo-prop-none { color:var(--dim); }
  .todo-proposal { flex:none; max-height:45%; overflow-y:auto; padding:6px 10px;
                   border-bottom:2px solid var(--accent); background:#10151d; }
  .todo-proposal > div:nth-child(2) { display:flex; gap:6px; margin:4px 0 6px; }
  /* the ✨ text-transform preview (board t33) reuses .todo-proposal's frame; its
     body is a single reflowed text blob (not a list), shown before apply → add box. */
  .todo-format-pre { margin:2px 0; padding:6px 8px; background:var(--bg); border:1px solid var(--edge);
                     border-radius:6px; font:12px/1.4 ui-monospace,monospace; white-space:pre-wrap;
                     overflow-wrap:anywhere; max-height:220px; overflow:auto; color:var(--fg); }
  /* ✨ scoped tidy (board t42). Per-item selection checkbox on rows/cards — only mounts
     while the menu is armed, so a normal board is untouched. A disabled (dup-id) box is
     dimmed. The select-all bar sits atop the section; the scoped text-transform preview
     lists one before→after block per selected item, failures marked + dimmed. */
  .todo-sel { flex:none; display:inline-flex; align-items:center; cursor:pointer; align-self:center; }
  .todo-sel.off { cursor:not-allowed; opacity:.45; }
  .todo-sel input { cursor:inherit; margin:0; }
  .todo-selall { display:flex; align-items:center; gap:10px; padding:3px 2px 6px; margin-bottom:4px;
                 border-bottom:1px dashed var(--edge); }
  .todo-selall label { display:inline-flex; align-items:center; gap:6px; cursor:pointer;
                       color:var(--dim); font-size:11px; }
  .todo-selall input { margin:0; cursor:pointer; }
  .todo-selclear { background:none; border:1px solid var(--edge); border-radius:5px; color:var(--dim);
                   cursor:pointer; font-size:10px; padding:1px 6px; }
  .todo-selclear:hover { border-color:var(--accent); color:var(--accent); }
  .todo-fmt-row { padding:5px 0; border-bottom:1px solid #1c2129; font-size:12px; }
  .todo-fmt-row.failed { opacity:.6; }
  .todo-fmt-id { display:inline-block; font-family:ui-monospace,monospace; font-size:10px; color:var(--dim);
                 margin-bottom:2px; }
  .todo-fmt-row.failed .todo-fmt-id { color:var(--bad); }
  .todo-fmt-ba { font-family:ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.4; }
  .todo-fmt-before { color:var(--dim); }
  .todo-fmt-arrow { color:var(--accent); }
  .todo-fmt-after { color:var(--fg); }
  /* ✨ tidy MENU (board t33) — the toolbar ✨ button drops a small popover of
     readability transforms. Same floating look as the search ▾ recents menu. */
  .todo-tidy-wrap { position:relative; display:inline-flex; }
  .todo-tidy-menu { position:absolute; z-index:6; left:0; top:100%; margin-top:3px; min-width:220px;
                    background:var(--panel); border:1px solid var(--edge); border-radius:6px;
                    overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .todo-tidy-item { display:block; width:100%; text-align:left; background:none; border:none;
                    color:var(--fg); cursor:pointer; font:12px inherit; padding:6px 10px;
                    border-bottom:1px solid #1c2129; }
  .todo-tidy-item:last-child { border-bottom:none; }
  .todo-tidy-item:hover:not(:disabled) { background:var(--bg); color:var(--accent); }
  .todo-tidy-item:disabled { opacity:.4; cursor:not-allowed; }
  .todo-tidy-item small { display:block; color:var(--dim); font-size:10px; margin-top:1px; }
  /* board t99: rich item text — the tiny markdown the ✨ readability transform emits
     (paragraphs / '- ' bullets / ``` fences / `inline code`). Mounted ONLY in
     EXPANDED views (thread-open rows, prop-card bodies, note timelines); compact
     rows keep the one-line inline style. Paragraphs pre-wrap so intra-paragraph
     newlines survive; the fence block is monospace-on---bg with its own scrollbar
     (white-space:pre — code is verbatim, never reflowed). */
  .todo-rich { display:block; flex:1 1 100%; min-width:0; overflow-wrap:anywhere; }
  .todo-rich-p { margin:0 0 6px; white-space:pre-wrap; }
  .todo-rich > *:last-child { margin-bottom:0; }
  .todo-rich-ul { margin:0 0 6px; padding-left:18px; }
  .todo-rich-ul ul { margin:1px 0 0; padding-left:16px; }
  .todo-rich-ul li { margin-bottom:2px; overflow-wrap:anywhere; }
  /* keeper-4: position:relative anchors the ⧉ copy button (MdPre renders these
     now); the right padding keeps long lines from sliding under it. */
  .todo-rich-pre { margin:2px 0 6px; padding:6px 24px 6px 8px; background:var(--bg);
                   border:1px solid var(--edge); border-radius:6px; overflow-x:auto;
                   font:12px/1.4 ui-monospace,monospace; white-space:pre; color:var(--fg);
                   position:relative; }
  .todo-rich-code { font-family:ui-monospace,monospace; font-size:.92em; background:var(--bg);
                    border:1px solid var(--edge); border-radius:4px; padding:0 3px; }
  /* the compact row's "…" expand affordance — same chip rhythm as .todo-note-fold;
     it reuses the thread toggle (threadIsOpen), never a parallel expand state. */
  .todo-more { flex:none; background:none; border:1px solid var(--edge); border-radius:4px;
               color:var(--dim); cursor:pointer; font-size:10px; padding:0 4px;
               font-family:inherit; line-height:1.5; opacity:.7; margin-left:4px; }
  .todo-more:hover { opacity:1; border-color:var(--accent); color:var(--accent); }
  .todo-prop-text { margin-bottom:6px; }
  .todo-status { flex:none; min-height:18px; padding:5px 10px; color:var(--dim);
                 display:flex; align-items:center; gap:8px; }
  .todo-status.err { color:var(--bad); }
  .todo-cancel { margin-left:auto; flex:none; background:none; border:1px solid var(--edge);
                 border-radius:6px; padding:2px 7px; color:var(--dim); cursor:pointer; font-size:11px; }
  .todo-cancel:hover { border-color:var(--bad); color:var(--bad); }
  /* a load failure is terminal + visible (and retryable) — never a forever "loading…" */
  .todo-err { color:var(--bad); text-align:center; padding:24px 10px; }
  .todo-err.todo-err-banner { padding:10px; margin-bottom:6px; text-align:left;
                              border:1px solid var(--bad); border-radius:6px; background:#1a1214; }
  .todo-err-hint { color:var(--dim); margin-top:4px; }
  /* duplicate-id guard banner (operator item o10, defense-in-depth): warn-tinted,
     same box shape as the load-error banner but NOT an outright failure — the board
     still renders in full; only the ambiguous WRITES are refused. Sits above the tab
     strip so it stays visible whichever tab is active. */
  .todo-dup-warn { flex:none; margin:0 10px 6px; padding:10px; text-align:left;
                   border:1px solid var(--warn); border-radius:6px; background:#1c1608;
                   color:var(--warn); font-size:12px; }
  .todo-dup-warn b { color:var(--warn); }
  .todo-dup-hint { color:var(--dim); margin-top:4px; line-height:1.4; }
  /* 🐞 bug-reporter drawer (board t19) — the VM's own log/process scanner
     (schema bugreport.v1). Same drawer column as design/to-do (it reuses
     .design-panel for width + mobile stacking); bug-* mirrors todo-* below it. */
  .bug-panel { font-size:12px; }
  .bug-bar { display:flex; align-items:center; gap:6px; padding:8px 10px;
             border-bottom:1px solid var(--edge); background:#1c2129; flex:none; }
  .bug-spacer { flex:1; }
  /* sources box: which inputs a queued scan reads. Wraps as a chip grid and caps
     its own height so a VM with many sources can't shove the findings offscreen. */
  .bug-sources { flex:none; max-height:30%; overflow-y:auto; padding:6px 10px;
                 border-bottom:1px solid var(--edge); display:flex; flex-wrap:wrap; gap:4px 14px; }
  .bug-src { display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  .bug-src.dim { opacity:.55; }                          /* disabled source — off by default, still toggleable */
  .bug-src input { accent-color:var(--accent); cursor:pointer; }
  .bug-src-count { color:var(--dim); font-size:10px; }
  .bug-src-cap { color:var(--warn); }                    /* capped — older lines were dropped */
  .bug-list { flex:1; overflow-y:auto; padding:6px 10px; }
  .bug-empty { color:var(--dim); text-align:center; padding:24px 10px; }
  .bug-find { display:flex; align-items:baseline; gap:7px; padding:5px 2px;
              border-bottom:1px solid #1c2129; }
  .bug-sev { flex:none; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
             border:1px solid currentColor; border-radius:4px; padding:0 4px; }
  .bug-sev.bad { color:var(--bad); } .bug-sev.warn { color:var(--warn); }  /* err+ vs warning/etc. */
  .bug-claim { flex:1; min-width:0; overflow-wrap:anywhere; }
  .bug-star { margin-right:3px; }                        /* ✨ = a digest (LLM) finding */
  .bug-cites { margin-left:5px; }
  .bug-cite { color:var(--accent); font-size:10px; margin-left:2px; white-space:nowrap; cursor:default; }
  .bug-source-tag { flex:none; color:var(--dim); font-size:10px; white-space:nowrap; }
  /* item 4: process-status strip — failed units (bad) + key unit:state pairs */
  .bug-strip { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px;
               padding:6px 10px; border-top:1px solid var(--edge); background:#1c2129; font-size:11px; }
  .bug-unit { flex:none; white-space:nowrap; }
  .bug-unit.bad { color:var(--bad); }                    /* a failed unit */
  .bug-unit-none { flex:none; color:var(--dim); }
  /* board t46 — VITALS chips appended to the strip (load / mem free / disk free / ⚡
     last activity), sourced from the scanner's `activity` block. Same flex:none/nowrap
     rhythm as .bug-unit; dim, as garnish beside the unit health. .bug-act.warn tints
     the ⚡ chip when the keeper's been quiet > 30m (mirrors the todo drawer's meter). */
  .bug-vital { flex:none; white-space:nowrap; color:var(--dim); }
  .bug-act.warn { color:var(--warn); }

  /* 🔍 search drawer (board t21) — user-facing file/content search over the VM's

const histHHMM = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }) : "";
/* {id, typeIcon, text, full} for one event's compact line. `full` (or null) is the
   untruncated detail, for title=. Deploy events carry no item-type icon and read
   "deploy <commit> · N files". */
const histLine = (ev) => {
  const d = (ev && ev.detail) || {};
  const id = (ev && ev.id) || "";
  const typeIcon = ev && ev.type && ev.type !== "deploy" ? (TODO_ICON[ev.type] || "☑") : "";
  const mk = (text, full) => ({ id, typeIcon, text, full: full == null ? null : String(full) });
  switch (ev && ev.event) {
    case "added":         return mk('"' + histTrunc(d.text) + '"', d.text);
    case "status":        return mk("— " + (d.to || "?"), null);
    case "note":          return mk('note "' + histTrunc(d.to) + '"', d.to);
    case "text":          return mk('text "' + histTrunc(d.to) + '"', d.to);
    case "comment":       return mk((d.by || "someone") + ': "' + histTrunc(d.text) + '"', d.text);
    case "removed":       return mk('removed "' + histTrunc(d.text) + '"', d.text);
    case "deploy-ok": {
      const commit = String(d.commit || "").slice(0, 7);
      const n = d.files == null ? null : d.files;
      return { id: "deploy", typeIcon: "",
        text: (commit || "deployed") + (n == null ? "" : " · " + n + " file" + (Number(n) === 1 ? "" : "s")), full: null };
    }
    case "deploy-failed": return { id: "deploy", typeIcon: "", text: "failed — " + histTrunc(d.reason), full: d.reason || "" };
    default:              return mk(ev && ev.event ? String(ev.event) : "", null);
  }
};
/* Grouping by LOCAL calendar day: "today" / "yesterday" / else a short date. The
   route returns oldest→newest, so callers reverse to newest-first FIRST, then walk
   here — a new group opens whenever the day changes. */
const histDayStart = (ts) => { const d = new Date((ts || 0) * 1000);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const histDayLabel = (ts) => {
  const diff = Math.round((histDayStart(Date.now() / 1000) - histDayStart(ts)) / 86400000);
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  return new Date((ts || 0) * 1000).toLocaleDateString([], { month: "short", day: "2-digit", year: "numeric" });
};
const histGroups = (events) => {
  const out = [];
  for (const ev of events) {
    const key = histDayStart(ev && ev.ts);
    let g = out.length && out[out.length - 1].key === key ? out[out.length - 1] : null;
    if (!g) { g = { key, label: histDayLabel(ev && ev.ts), events: [] }; out.push(g); }
    g.events.push(ev);
  }
  return out;
};

/* STANDING WORK — the ONE definition of "actionable, still-standing" items, shared
   by the drawer's tabs and the ☑ toolbar ticker (board t25) so the button's badge
   and the drawer's numbers can never drift apart. The queue (anything that isn't a
   bookmark/operator/proposal and isn't done), the items waiting on the OPERATOR, and
   the proposals still awaiting a decision — bookmarks and anything done are excluded.
   ⚑/⚖ are subtracted from the queue explicitly or it double-counts them (they satisfy
   "not a bookmark, not done" too). */
/* board t-priority — per-item priority. The field is OPTIONAL: absent means low (the
   canonical spelling — the console never writes "low" on create), and an unknown value
   reads as low too, so an old or hand-edited board can never crash the sort. Shared by
   the drawer (chips + sorting) and the ☑ ticker (the high tint), so they can't drift. */
const prioOf = (it) => (it && (it.priority === "high" || it.priority === "medium")) ? it.priority : "low";
const PRIO_RANK = { high: 0, medium: 1, low: 2 };
// stable sort high → medium → low; equal priorities keep their current relative order
// (Array.prototype.sort is spec-stable). Copies — never mutates a bucket in place.
const prioSort = (list) => list.slice().sort((a, b) => PRIO_RANK[prioOf(a)] - PRIO_RANK[prioOf(b)]);
const PRIO_NEXT = { low: "medium", medium: "high", high: "low" };   // the chip's cycle order
/* The honest wall message: console-api's update/add whitelists currently DROP
   "priority" while answering ok:true (probe-proven — same species as the o8 comments
   wall). Verify-after-write surfaces this string instead of a phantom chip; when the
   host whitelist widens, the same code just starts persisting, no UI change. */
const PRIO_WALL = "priority needs a console-api whitelist update — ask the keeper/operator";
/* board t100: peer/VM MESSAGE items — traffic other keepers wrote onto this board,
   which is conversation, not work, so it gets its own ✉ category instead of
   crowding the queue. Two spellings are recognized because the traffic predates
   the type: an explicit type:"message", or a `by` ending "-keeper" that isn't the
   board's own "keeper" (peer keepers sign "<vm>-keeper"). The reserved peer-inbox
   feed item (id "peer-inbox", by "peer-msg" — the peer-msg reply feed) rides the
   same category, labeled as the feed. Top-level function declarations, so the
   harness can unit-test both rules as window globals (same idiom as richParse).
   ⏱ history and search deliberately still see message items — only the WORK
   buckets below (and the drawer's board tabs) exclude them. */
function isPeerFeed(it) { return !!(it && it.id === "peer-inbox" && it.by === "peer-msg"); }
/* explicit signatures (nomenclature 2026-08-27): every keeper signs
   "<locus>-keeper" — the HOST's keeper signs "host-keeper" (keeper names
   agents, never machines). A board's OWN signatures are that set; legacy
   traffic predates the ruling, so the unqualified "keeper" still reads as
   own. vm is the board's locus as the wire knows it ("keeper"/"@keeper"/
   ""/"host" = the host board). */
function boardOwnSigs(vm) {
  const self = isHostVm(vm) ? "host" : vm;
  return ["keeper", self + "-keeper"];
}
function isMsgItem(it, vm) {
  if (!it) return false;
  if (it.type === "message" || isPeerFeed(it)) return true;
  return typeof it.by === "string" && it.by.endsWith("-keeper") && !boardOwnSigs(vm).includes(it.by);
}
const standingBuckets = (items = [], vm) => {
  const work = items.filter(i => !isMsgItem(i, vm));   // t100: messages are not standing work
  return {
    open: work.filter(i => i.type !== "bookmark" && i.type !== "operator"
                        && i.type !== "proposal" && i.type !== "direction" && i.status !== "done"),
    operator: work.filter(i => i.type === "operator" && i.status !== "done"),
    propPending: work.filter(i => i.type === "proposal" && i.status !== "done"),
    // KNOWLEDGE lane, not standing work: session-uncovered clarifications. Gets its own
    // tab/badge but is deliberately ABSENT from standingTicker's ☑ count (see below).
    directions: work.filter(i => i.type === "direction" && i.status !== "done"),
  };
};
/* {count, warn} for the ☑ button, built on the SAME standingBuckets the drawer's
   tabs read: count = the SUM of the three buckets (the sum lives here ONCE, so the
   button and the drawer can't disagree on the arithmetic); warn mirrors the ⚖ tab's
   tint — a pending proposal is a decision waiting on the operator, worth flagging on
   the button too. */
const standingTicker = (items, vm) => {
  const b = standingBuckets(items, vm);
  const all = b.open.concat(b.operator, b.propPending);
  return { count: all.length,
           warn: b.propPending.length > 0,
           // board t-priority: any COUNTED open item at high priority reddens the pill
           // (visually outranking the proposal warn tint — see .todo-btn-badge.high).
           high: all.some(i => prioOf(i) === "high") };
};

/* ⏱ push-cadence knob (board t45). A RESERVED bookmark item (id "cfg-relay", type
   "bookmark") carries the relay's quiet-gate cadence as JSON in its note field:
   {"board_quiet_secs": N}. The VM-side relay reader delivers this board's to-dos to
   the keeper only after N seconds of keeper inactivity (0 = deliver instantly, no
   quiet gate). The console can only UPDATE this item — never CREATE it — because
   console-api mints its own t<N> id on `add`, and both the reader and this knob trust
   ONLY the literal id "cfg-relay". So a board WITHOUT the item shows an "uninitialized"
   knob (the keeper-side CLI mints the reserved id); the console never forges a bogus
   add. `note` IS on the update whitelist, so a value change round-trips honestly. */
const RELAY_ID = "cfg-relay";
const RELAY_PRESETS = [0, 120, 300, 600, 1200, 1800];   // instant / 2 / 5 / 10 / 20 / 30 min, in SECONDS
const RELAY_HELP = "board to-dos are delivered to the keeper after this much keeper inactivity; instant = no quiet gate";
// the label a cadence wears in the select: instant, whole minutes as "N min", and any
// odd sub-minute value honestly as "Ns" (the console only ever writes presets, so a
// non-minute value can only be one a keeper hand-set — don't dress it up as "N min").
const relayLabel = (s) => s === 0 ? "instant" : (s % 60 === 0 ? (s / 60) + " min" : s + "s");
// read board_quiet_secs out of a cfg-relay note; null = UNREADABLE (bad JSON, a missing
// key, or a non-finite/negative number) → the knob shows "—" and invites a re-set.
const parseRelaySecs = (note) => {
  try {
    const o = JSON.parse(note);
    const n = o && o.board_quiet_secs;
    return (typeof n === "number" && isFinite(n) && n >= 0) ? n : null;
  } catch (_) { return null; }
};

/* ⚙ agent deploy directive (board t80). A SECOND reserved bookmark item, id
   "cfg-agent-deploy", living on the SAME per-VM board as cfg-relay and following
   the exact same doctrine (see the cfg-relay comment above — read it first):
   console can only UPDATE the item, never CREATE it, because console-api mints
   its own id on `add` and only the keeper's own tooling trusts the literal id
   "cfg-agent-deploy". Unlike cfg-relay's JSON payload, this note IS the operator's
   directive text, VERBATIM plain text — no JSON envelope to parse — a standing
   instruction for HOW the keeper deploys agents (e.g. "delegate fixes to
   lower-tier agents; keeper orchestrates and verifies"). Editing/saving it lives
   in DeployDirectivePanel, inside the 🛡 steward drawer (further down this file),
   NOT here in TodoDrawer — it has nothing to do with the queue/proposal/bookmark
   sections a keeper works through day to day. It's still config, though, so it's
   hidden from the 🔖 bookmarks list exactly like cfg-relay — see CFG_IDS below. */
const DEPLOY_ID = "cfg-agent-deploy";
const DEPLOY_HELP = "a standing instruction for HOW the keeper deploys agents (e.g. a delegate/orchestrate policy) — the keeper reads and honors this note";
// Every reserved config id that must NEVER render as a bookmark (both here in
// TodoDrawer's 🔖 list, and everywhere else a board's items are shown as
// checkpoints). One set, so a THIRD reserved id later is a one-line add, not a
// hunt through every `!== RELAY_ID` comparison in the file.
const CFG_IDS = new Set([RELAY_ID, DEPLOY_ID]);

function TodoDrawer({ vm, onCount }) {
  /* 1.0.141: the host board is the reserved @self token (or this station's own
     locus name); a dropdown entry literally named "keeper" is vm_mgr's locus. */
  const hostBoard = isHostVm(vm);
  const [state, setState] = useState(null);       // {items:[...]} | null while loading
  const [note, setNote] = useState("");           // status line
  const [noteErr, setNoteErr] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);           // {msg,status} — load failed; board is NOT showing
  const [proposal, setProposal] = useState(null); // tidy preview awaiting apply (✨ tidy — NOT the ⚖ type)
  const [formatPrev, setFormatPrev] = useState(null); // ✨ text-transform preview (board t33): {kind,result} → apply sets the add box
  const [menuOpen, setMenuOpen] = useState(false);    // ✨ tidy dropdown (board t33) open?
  /* ✨ tidy SCOPE (board t42): a Set of item ids checked while the tidy menu is armed.
     Checkboxes render on rows/cards ONLY while the menu is open; the chosen transform
     then acts on JUST these items (empty set = today's whole-board / compose-box flow,
     so a normal board is byte-for-byte unchanged). Cleared when the menu closes (below)
     and on VM change (the reset effect). Dup-id items can never enter it — their box is
     disabled — so every id in here is unique and safe to key a write on. */
  const [sel, setSel] = useState(() => new Set());
  const [tidyScope, setTidyScope] = useState(null);   // ids a scoped reorganize was drafted against (null = whole board)
  const [propOpen, setPropOpen] = useState({});   // ⚖ id -> expanded; view state only, so it dies with the drawer
  const [threadOpen, setThreadOpen] = useState({}); // 💬 id -> thread expanded (board t24); view state only
  const [draft, setDraft] = useState({});          // 💬 id -> in-progress comment text; view state only
  const [longMode, setLongMode] = useState({});    // 📎 id -> long-revision composer active (o14); view state only
  const [longDraft, setLongDraft] = useState({});  // 📎 id -> in-progress revision body; view state only
  const [revOpen, setRevOpen] = useState({});      // 📎 revision path -> view block expanded; view state only
  const [revData, setRevData] = useState({});      // 📎 revision path -> {loading}|{text}|{error} (op:read result)
  const [text, setText] = useState("");
  const [type, setType] = useState("todo");       // board t6 (operator 2026-09-10): todo is the default, not request
  const [prio, setPrio] = useState("low");        // t-priority: the add form's priority pick; low = the absent default
  const [tab, setTab] = useState("queue");        // active section tab; only user clicks move it after mount
  /* ⏱ history (board t32): the journal is PULLED ON DEMAND, not polled. null = never
     fetched; then {loading} | {events:[…]} | {empty:true} (ok:false, no journal yet)
     | {notEnabled:true} (404, route not activated) | {error:msg}. Reset to null on VM
     change so a new board re-fetches its own journal on first history-tab open. */
  const [history, setHistory] = useState(null);
  const [messages, setMessages] = useState(null);   // ✉ bridge mail — see loadMessages
  /* ⚡ activity meter (board t46): report.activity from the bug scanner, which this drawer
     does NOT otherwise fetch. null = unknown (not fetched yet, or a quiet fetch failure) →
     the meter renders "⚡ —". Reset to null on VM change; re-fetched on open + on ↻ only. */
  const [activity, setActivity] = useState(null);
  const [refsOpen, setRefsOpen] = useState({});   // board t-refchips: id -> ref-chip overflow expanded; view state only
  const [noteOpen, setNoteOpen] = useState({});   // board t82: id -> note-timeline earlier segments expanded; view state only
  const [histOpen, setHistOpen] = useState({});   // keeper-4: "id:segIdx" -> '## History' entries expanded; view state only
  const [flashId, setFlashId] = useState(null);   // board t-refchips: id currently wearing the post-jump flash highlight
  const say = (msg, isErr) => { setNote(msg || ""); setNoteErr(!!isErr); };
  const stopped = React.useRef(false);            // terminal load error: hold the poll
  const acRef = React.useRef(null);               // in-flight mutating call, for cancel
  const cancelled = React.useRef(false);
  const tabInit = React.useRef(false);            // pick the default tab once, when the first board lands
  const rowNodes = React.useRef({});              // board t-refchips: item id -> row/card DOM node, for jump-scroll
  const flashTimer = React.useRef(null);          // board t-refchips: clears the flash a beat after it lands
  const addRef = React.useRef(null);              // the compose textarea, for auto-grow (board t33)

  /* A failed load used to leave state===null with the list rendering "loading…"
     forever while re-polling every 10s — the drawer's most visible lie (it is
     reproducible right now on any STOPPED VM: 409 "<vm> is not running").
     Failures are now terminal-and-visible: a 4xx is a settled answer, so show it
     and STOP re-polling; a 5xx/network error may pass, so keep the poll. */
  /* 1.0.138: the CENTRAL locus key behind this drawer's board (the backend maps a
     dropdown pick onto its toolserver rows — e.g. an LXD guest onto the locus
     registered at its address), so the live DB-change match follows the rows
     actually shown, not just the dropdown name. */
  const locusRef = React.useRef(fvLocusOf(vm));
  const load = useCallback(() => {
    api("/api/vm/" + vm + "/todo")
      .then(d => { if (d.ok) { setState(d.state);
                               if (d.state && d.state.locus && d.state.central) locusRef.current = d.state.locus;
                               setErr(null); }
                   else setErr({ msg: d.error || "load failed" }); })
      .catch(e => {
        if (e.status >= 400 && e.status < 500) stopped.current = true;
        setErr({ msg: e.message || String(e), status: e.status });
      });
  }, [vm]);
  const retry = () => { stopped.current = false; setErr(null); load(); };
  /* Pull the journal on demand: on first history-tab open, and on a manual ↻ while
     that tab is active — never on the 10s board poll. A 404 is the not-yet-activated
     route (shown as its own message, like the search drawer's 404); ok:false is the
     "no journal yet" answer; a network/5xx is a retryable error. */
  const loadHistory = useCallback(() => {
    setHistory({ loading: true });
    api("/api/vm/" + vm + "/todo-history")
      .then(d => setHistory(d.ok ? { events: Array.isArray(d.events) ? d.events : [] } : { empty: true }))
      .catch(e => setHistory(e.status === 404 ? { notEnabled: true } : { error: e.message || String(e) }));
  }, [vm]);
  /* ✉ MESSAGES (bridge mail). The fleet bridge — vm-bridge over vsock to the host
     broker — is the CANONICAL intake for inter-VM asks ("the console board is not
     the canonical intake for asks — the bridge is; board stays for todos/bookmarks",
     per the fleet notice). It was completely invisible from the console: a keeper
     sent blackbird a comms check on 2026-07-25 that sat unread for over an hour
     because nothing surfaced it. This tab is that missing window.

     The route is HOST-SIDE and does not exist yet (verified 404 on
     /api/vm/<vm>/messages, /bridge, /inbox, /mail). Same honest degrade as ⏱
     history: a 404 says so plainly and the tab stays dim rather than pretending
     to be empty — "no messages" and "no route" are different facts and must not
     look alike. It lights up the moment the operator installs the route. */
  const loadMessages = useCallback(() => {
    setMessages({ loading: true });
    api("/api/vm/" + vm + "/messages")
      .then(d => setMessages(d && d.ok === false ? { empty: true }
        : { items: Array.isArray(d && d.messages) ? d.messages
                 : Array.isArray(d && d.items) ? d.items : [] }))
      .catch(e => setMessages(e.status === 404 ? { notEnabled: true } : { error: e.message || String(e) }));
  }, [vm]);
  /* ✉ fleet-mail compose (POST /api/fleet/message). Direction follows the
     drawer: a STATION's drawer messages that station (keeper console → it,
     individually — lands in its ~/.bridge-mail.jsonl, read by its ✉ tab and
     `fleet-msg --inbox` in-VM); the KEEPER drawer picks a station from a
     dropdown. Stations message the keeper console the other way (fleet-msg →
     collector → the keeper drawer's inbox here). */
  const [msgDraft, setMsgDraft] = useState("");
  const [msgTo, setMsgTo] = useState("");
  const [msgBusy, setMsgBusy] = useState(false);
  const [stations, setStations] = useState(null);   // keeper drawer: to-picker
  useEffect(() => {
    if (!hostBoard || tab !== "messages" || stations !== null) return;
    api("/api/vms")
      .then(d => {
        const names = ((d && d.vms) || []).map(v => v.name).filter(n => n && !isHostVm(n));
        setStations(names); setMsgTo(t => t || names[0] || "");
      })
      .catch(() => setStations([]));
  }, [vm, tab, stations]);
  const sendMsg = () => {
    const text = msgDraft.trim();
    const to = hostBoard ? msgTo : vm;
    if (!text || !to || msgBusy) return;
    setMsgBusy(true);
    api("/api/fleet/message", { method: "POST", body: JSON.stringify({ to, text }) })
      .then(d => { setMsgDraft("");
                   say("✉ sent to " + to + (d && d.pinged
                       ? " — its keeper (A) was pinged"
                       : " — no live keeper; it lands in the inbox (fleet-msg --inbox)"));
                   if (!hostBoard) loadMessages(); })
      .catch(e => say(e.message || "send failed", true))
      .finally(() => setMsgBusy(false));
  };
  /* ⚡ ACTIVITY METER (board t46). The relay-liveness data lives in the bug scanner's
     report, which this drawer does NOT otherwise fetch — so pull /bugreport ONCE on open
     and on ↻ (never on the 10s board poll; activity is garnish here, not the board). We
     keep ONLY report.activity; any failure (404 / 5xx / network / ok:false) resolves to
     null → the meter shows "⚡ —" QUIETLY, never an error banner. Cached in `activity`. */
  const loadActivity = useCallback(() => {
    api("/api/vm/" + vm + "/bugreport")
      .then(d => setActivity(d && d.ok && d.report ? (d.report.activity || null) : null))
      .catch(() => setActivity(null));
  }, [vm]);
  // ↻ refreshes the board (as ever), re-fetches the ⚡ activity meter, AND — when the
  // history tab is showing — re-pulls the journal (the tab's only refresh path, since it
  // is deliberately un-polled).
  const refresh = () => { load(); loadActivity(); if (tab === "history") loadHistory();
                          if (tab === "messages") loadMessages(); };
  useEffect(() => {
    setState(null); setErr(null); setProposal(null); setTidyScope(null); setFormatPrev(null); setMenuOpen(false); setSel(new Set()); setPropOpen({}); setThreadOpen({}); setDraft({}); setHistory(null); setActivity(null); setRefsOpen({}); setFlashId(null); say("");
    stopped.current = false;
    // a new VM is a fresh board: let it re-pick its own default tab (the reset
    // to "queue" is invisible — the strip is hidden while state is still null).
    tabInit.current = false; setTab("queue");
    load();
    // ⚡ board t46: fetch the activity meter ONCE on open (and this fires on VM change).
    // Deliberately NOT in the interval below — activity is not polled, only ↻-refreshed.
    loadActivity();
    // live view of keeper edits — but not while the answer is settled (terminal
    // error) or nobody is looking (backgrounded tab hammering an lxc backend).
    const central = !!fvLocusOf(vm);      // a DB-backed board is pushed; the host file board still polls
    const id = setInterval(() => {
      if (stopped.current || document.visibilityState === "hidden") return;
      load();
    }, central ? 60000 : 10000);
    const onVis = () => { if (document.visibilityState === "visible" && !stopped.current) load(); };
    document.addEventListener("visibilitychange", onVis);
    const offDb = onDbChange((e) => {
      const d = e.detail || {};
      if (stopped.current || !central) return;
      if (["todos", "board", "prompts"].includes(d.table)
          && (d.locus === fvLocusOf(vm) || d.locus === locusRef.current)) load();
    });
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); offDb(); };
  }, [load]);
  // First open of the ⏱ history tab pulls the journal once; thereafter it is cached
  // (history !== null) and only a manual ↻ (refresh) re-pulls it. The VM-change reset
  // above sets history back to null, so switching VMs re-fetches on the next open.
  useEffect(() => { if (tab === "history" && history === null) loadHistory(); }, [tab, history, loadHistory]);
  useEffect(() => { if (tab === "messages" && messages === null) loadMessages(); }, [tab, messages, loadMessages]);
  // board t33: auto-grow the compose textarea to fit its content (a ✨ transform can
  // drop a multi-line bash fence / bullet list into it), capped — then it scrolls.
  useEffect(() => {
    const el = addRef.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }, [text]);
  /* ✨ tidy scope (board t42) is ephemeral to one menu engagement: closing the menu
     drops the selection. A picked transform reads `sel` synchronously in its handler
     BEFORE this commit-time effect fires, so the capture is never lost — this only
     resets the board for the next open. Runs harmlessly on mount (sel already empty). */
  useEffect(() => { if (!menuOpen) setSel(new Set()); }, [menuOpen]);

  /* Every mutating call runs through guard(): it owns `busy`, carries an abort
     signal, and always releases — so a slow/cold backend can no longer latch the
     drawer's buttons off with a reload as the only escape. */
  const guard = (fn) => {
    const ac = new AbortController();
    acRef.current = ac; cancelled.current = false;
    setBusy(true);
    return fn(ac.signal).finally(() => { acRef.current = null; setBusy(false); });
  };
  const cancel = () => { cancelled.current = true; if (acRef.current) acRef.current.abort(); };
  const fail = (prefix) => (e) =>
    say(cancelled.current ? prefix + " cancelled" : prefix + ": " + (e.message || e), true);

  const op = (body, okMsg) =>
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", body: JSON.stringify(body), signal })
      .then(d => { if (d.ok) { setState(d.state); say(okMsg || ""); } else say(d.error || "failed", true); })
      .catch(fail("failed")));
  /* add() VERIFIES the type survived, because the backend's `add` coerces any
     type its whitelist doesn't know to "todo" while still answering ok:true —
     so a bare op() would file the wrong item and report success. Until the
     host whitelist learns "operator" (todo o1), picking ⚑ gets an honest
     error and the miscreated item is undone; the moment o1 lands, this same
     code just starts succeeding. It also guards forever against the UI and
     the backend's type lists drifting apart. */
  const add = () => {
    const t = text.trim();
    if (!t) return;
    const want = type;
    /* t-priority: ride the field on the add ONLY when medium/high — absent is the
       canonical low, so a default add is byte-identical to before. Verified below,
       exactly like the type check: the live whitelist DROPS priority with ok:true. */
    const wantPrio = prio;
    const item = { type: want, text: t };
    if (wantPrio !== "low") item.priority = wantPrio;
    const before = new Set(items.map(i => i.id));
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", signal,
        body: JSON.stringify({ op: "add", item }) })
      .then(d => {
        if (!d.ok) return say(d.error || "failed", true);
        const created = (d.state.items || []).filter(i => !before.has(i.id));
        const it = created[created.length - 1];
        if (it && it.type !== want)
          return api("/api/vm/" + vm + "/todo", { method: "POST", signal,
              body: JSON.stringify({ op: "del", id: it.id }) })
            .then(r => { if (r.ok) setState(r.state);
                         say("backend doesn't accept '" + want + "' yet — it downgraded the item to '"
                             + it.type + "', so the add was undone. Host change o1 enables it.", true); });
        setState(d.state); setText(""); setPrio("low");
        /* Unlike a coerced type, a stripped priority doesn't undo the add — the item
           itself is fine, only the field was dropped. Say so, honestly: the board we
           just rendered IS the stripped truth, so no phantom chip appears. */
        if (it && wantPrio !== "low" && prioOf(it) !== wantPrio)
          say("added as low — " + PRIO_WALL, true);
        else say("");
      })
      .catch(fail("failed")));
  };
  // ✨ assist runs a model that the UI itself warns may cold-load, so it gets a
  // longer leash than API_TIMEOUT_MS — bounded (never latching) but not so tight
  // that it aborts a request the backend would have completed. ✕ cancel is the
  // manual way out either way.
  const ASSIST_TIMEOUT_MS = 120000;
  const assistAdd = () => {
    const t = text.trim();
    if (!t) return say("type the request first — ✨ turns it into structured items", true);
    say("✨ hugpy is parsing that… (model may cold-load; ✕ cancel to give up)");
    guard(signal => api("/api/vm/" + vm + "/todo/assist", { method: "POST", signal,
        timeout: ASSIST_TIMEOUT_MS, body: JSON.stringify({ mode: "add", instruction: t }) })
      .then(d => { if (d.ok) { setState(d.state); setText(""); say("✨ added " + d.added + " item(s)"); }
                   else say(d.error || "assist failed", true); })
      .catch(fail("assist failed")));
  };
  /* Reorganize the board (menu entry 1). SCOPED (board t42) when the tidy menu left a
     non-empty selection: name the chosen ids in the instruction and pin the rest, but
     scope is ENFORCED on apply (scopedMerge) — never trusted from the model's answer.
     Empty selection = today's whole-board flow (tidyScope stays null). `sel` is read
     synchronously here, before the menu-close effect clears it, so the capture is safe. */
  /* ⧉ brief keeper — prompt the model about the to-dos directly (POST
     /api/vm/<vm>/todo/brief types KEEPER_BRIEF + an open-items snapshot into
     the live keeper pane). Copying is only the degrade when no keeper is up. */
  const briefKeeper = () => {
    if (hostBoard) return;
    guard(signal => api("/api/vm/" + vm + "/todo/brief", { method: "POST", signal,
        body: JSON.stringify({ text: KEEPER_BRIEF }) })
      .then(() => say("keeper prompted about the board"))
      .catch(e => {
        if (e && e.status === 409) { copyText(KEEPER_BRIEF); say("no live keeper — brief copied, paste it once the keeper is up"); }
        else fail("brief failed")(e);
      }));
  };
  const tidy = () => {
    const scopeItems = selectedIn(items);
    const scopeIds = scopeItems.map(it => it.id);
    const ask = "tidy instruction (blank = dedupe / merge / prioritize):";
    const instruction = prompt(scopeIds.length
      ? scopeIds.length + " item(s) selected — reorganize ONLY these, leaving the rest untouched.\n" + ask
      : ask, "");
    if (instruction === null) return;
    const sent = scopeIds.length
      ? instruction + "\n\n[scope] Reorganize ONLY these item ids: " + scopeIds.join(", ")
        + ". Return every OTHER item exactly as-is, unchanged and in place."
      : instruction;
    say("✨ hugpy is drafting a tidied list… (nothing changes until you apply; ✕ cancel to give up)");
    guard(signal => api("/api/vm/" + vm + "/todo/assist", { method: "POST", signal,
        timeout: ASSIST_TIMEOUT_MS, body: JSON.stringify({ mode: "tidy", instruction: sent }) })
      .then(d => { if (d.ok) { setFormatPrev(null); setTidyScope(scopeIds.length ? scopeIds : null); setProposal(d.proposal || []); say(""); }
                   else say(d.error || "tidy failed", true); })
      .catch(fail("tidy failed")));
  };
  /* Scoped reorganize is ENFORCED here at APPLY time, not trusted from the model (board
     t42). The final list keeps every UNSELECTED current item byte-identical and in place
     (its exact record, by id) and splices the model's reorganized block in where the
     selected items were — so a model that "helpfully" rewrote an unselected item can't:
     we substitute our own record. The model may only reorder / merge / split the SELECTED
     items (new ids from a split ride along in the reorg block). */
  const scopedMerge = (proposalItems, scopeIds) => {
    const scope = new Set(scopeIds);
    const keepIds = new Set(items.filter(it => !scope.has(it.id)).map(it => it.id));
    const reorg = (proposalItems || []).filter(p => !keepIds.has(p.id));   // the model's take on the selected items
    const out = [];
    let spliced = false;
    for (const it of items) {
      if (scope.has(it.id)) { if (!spliced) { out.push(...reorg); spliced = true; } }  // selected → replaced by the reorg block, once
      else out.push(it);                                                                // unselected → exact current record (byte-identical)
    }
    if (!spliced) out.push(...reorg);   // no selected item survived a mid-flight poll — append rather than drop it
    return out;
  };
  /* ✨ tidy is a MENU (board t33). tidy() above is entry 1 (reorganize the board).
     Entries 2-5 are TEXT transforms. With an EMPTY selection they operate on the ADD-BOX
     text (today's behavior). With a non-empty tidy selection (board t42) they operate PER
     SELECTED ITEM instead — reformatting each item's own `text` and applying surgical
     per-item updates. 2-4 are LLM reformats (mode:"format", the o9 host patch); 5 (wrap as
     bash) is deterministic + needs no backend, so it always works even before o9 lands. */
  const FORMAT_LABEL = { readability: "improve readability",
                         listify: "prose → bullet list", proposal: "decision → pros/cons" };
  const fmtLabel = (kind) => kind === "bash" ? "wrap as bash" : FORMAT_LABEL[kind];
  // Honest degradation before the host learns mode:"format" (operator task o9): the
  // backend answers {error:"unknown mode 'format'"} (200) or a 400 — either way point
  // at the deterministic 'wrap as bash', which needs no host change, instead of crashing.
  const FORMAT_O9 = "this transform needs the host assist update — operator task o9; ‘wrap as bash’ works now";
  const wrapBash = () => {
    const targets = selectedIn(items);
    if (targets.length) {                       // scoped (board t42): deterministic, per selected item
      setProposal(null);
      const rows = targets.map(it => ({ id: it.id, before: it.text || "", after: "```bash\n" + (it.text || "") + "\n```", ok: true }));
