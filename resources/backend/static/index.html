  const [budget, setBudget] = useState(() => { try { return parseInt(localStorage.getItem(bkey), 10) || 1000000; } catch (_) { return 1000000; } });
  const saveBudget = (v) => { const n = Math.max(0, parseInt(v, 10) || 0); setBudget(n); try { localStorage.setItem(bkey, String(n)); } catch (_) {} };
  useEffect(() => {
    let dead = false;
    const load = () => fetch(vmScope("/api/a/usage?backend=" + encodeURIComponent(backend)), { credentials: "same-origin" })
      .then((r) => r.json())
      .then((j) => { if (!dead) { setD(j); setErr(j && j.error || null); } })
      .catch((e) => { if (!dead) setErr(String(e)); });
    load();
    const t = setInterval(load, 15000);
    const tick = setInterval(() => setNowS(Math.floor(Date.now() / 1000)), 1000);
    return () => { dead = true; clearInterval(t); clearInterval(tick); };
  }, [backend]);
  const sess = d && d.sessions && d.sessions.length
    ? d.sessions[d.sessions.length - 1] : null;
  const r = sess && sess.report;
  const c = sess && sess.cache;
  const realTok = r ? (r.input + r.cache_read + r.cache_write) : 0;
  const over = !!(r && budget > 0 && realTok > budget);
  const live = d && d.live_session;
  const k = (n) => (n || 0).toLocaleString();
  const rem = c && c.expires_at ? Math.max(0, c.expires_at - nowS) : 0;
  const cstate = c ? (rem > 0 ? "warm" : "lapsed") : null;
  const ccol = cstate === "warm" ? "var(--ok, #2ea043)" : "var(--bad)";
  return html`<div>
    <div className="steward-thr-row" style=${{ marginTop: 6 }}>
      <span className="steward-k"><b>usage</b></span>
      <span className="steward-v" style=${{ fontSize: 11 }}>${d ? (live ? "● " + live : "○ not running") : "…"}${sess && sess.session_id ? " · " + String(sess.session_id).slice(0, 8) + "…" : ""}${r && r.model ? " · " + r.model : ""}</span>
    </div>
    ${err && html`<div className="steward-note">${err}</div>`}
    ${!err && !r && html`<div className="steward-note">no turns yet</div>`}
    ${r && html`<div className="ds-usage">
      <div className="steward-stat"><span className="steward-k">session budget</span>
        <span className="steward-v" style=${{ color: over ? "var(--bad)" : undefined, fontWeight: over ? 700 : undefined }}>${realTok.toLocaleString()} / <input type="number" value=${budget} onInput=${e => saveBudget(e.target.value)} style=${{ width: 84, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--edge)", borderRadius: 3, fontSize: 11, padding: "0 3px" }} /> tok${over ? " · OVER" : ""}</span></div>
      <div className="steward-stat"><span className="steward-k">turns</span>
        <span className="steward-v">${r.turns}</span></div>
      <div className="steward-stat"><span className="steward-k">input / output</span>
        <span className="steward-v">${r.input.toLocaleString()} / ${r.output.toLocaleString()} tok</span></div>
      <div className="steward-stat"><span className="steward-k">cache write / read</span>
        <span className="steward-v">${r.cache_write.toLocaleString()} / ${r.cache_read.toLocaleString()} tok (${r.cached_pct}% cached)</span></div>
      <div className="steward-stat"><span className="steward-k">relayed context</span>
        <span className="steward-v">${r.relayed_input.toLocaleString()} tok · billed-equiv ${Math.round(r.billed_input_equiv).toLocaleString()} (saved ${r.input_cost_saved_by_cache_pct}%)</span></div>
      <div className="steward-stat"><span className="steward-k">cost</span>
        <span className="steward-v" style=${{ color: over ? "var(--bad)" : undefined, fontWeight: over ? 700 : undefined }}>$${r.cost_usd.toFixed(4)}${over ? " · over budget" : ""}</span></div>
      ${showCache && c && html`<div className="steward-stat"><span className="steward-k">prompt cache</span>
        <span className="steward-v"><span style=${{ color: ccol, fontWeight: 600 }}>${cstate}</span> · ${rem > 0 ? Math.floor(rem / 60) + ":" + String(rem % 60).padStart(2, "0") + " left" : "lapsed"} · cached prefix ${k(c.cached_tokens)} tok · last request ${Math.round(c.age_sec) < 60 ? Math.round(c.age_sec) + " s" : Math.floor(c.age_sec / 60) + " min"} ago · TTL ${c.ttl_sec >= 3600 ? Math.round(c.ttl_sec / 3600) + " h" : Math.round(c.ttl_sec / 60) + " min"}</span></div>`}
    </div>`}
  </div>`;
}

function StewardDrawer({ vm, hugpyKeys }) {
  const [data, setData] = useState(null);        // {state, config} | null while the first load is pending
  const [notEnabled, setNotEnabled] = useState(false); // 404 → route not installed on the host (degrade)
  const [err, setErr] = useState(null);          // {msg,status} — a terminal (non-404) failure; banner + retry
  const [busy, setBusy] = useState(false);       // a POST is in flight
  const [confirmArm, setConfirmArm] = useState(false); // the "arm live restarts?" gate is showing
  const [confirmReset, setConfirmReset] = useState(false); // the t89 "reset now?" gate is showing
  const [note, setNote] = useState("");          // bottom status line (write acks / errors)
  const [noteErr, setNoteErr] = useState(false);
  const [now, setNow] = useState(Math.floor(Date.now() / 1000)); // 1s tick for the countdown + relative times
  // session budget slider (t81 part 2): LOCAL preview (bytes) while a drag is in
  // progress; null → the display follows server truth (config → state → default).
  // Only a commit (release/keyup, not per drag tick) POSTs, and every settle —
  // success or failure — drops back to null so what's shown is what the host holds.
  const [thrPreview, setThrPreview] = useState(null);
  // grounding readout for the bar ("— grounded in <locus> as <user>"): moved up
  // here from the 🪑 seat sub-header, which repeated "seat — <locus>" under
  // every tab (operator 2026-09-10).
  const [seatHdr, setSeatHdr] = useState(null);
  /* top-level steward tabs (operator 2026-08-27): the old 🪑 SeatPanel sub-tabs
     promoted to the drawer's own level — no nested tab bars, no wasted space.
     session = the per-VM steward daemon readout this drawer was born as. */
  const [tab, setTab] = useState(() => { try {
    const t = localStorage.getItem("steward_tab") || "session";
    return t === "models" ? "session" : t;      // 🧠 models retired into session (2026-08-27)
  } catch (_) { return "session"; } });
  const pickTab = (t) => { setTab(t); try { localStorage.setItem("steward_tab", t); } catch (_) {} };
  const say = (msg, isErr) => { setNote(msg || ""); setNoteErr(!!isErr); };
  const stopped = React.useRef(false);           // a settled 4xx (e.g. 409 not running) — hold the poll
  const acRef = React.useRef(null);

  /* A 404 is the honest "route not installed yet" state — show the note but KEEP
     polling (cheap, and the drawer lights up the moment the operator installs it).
     Any other 4xx (e.g. 409 "<vm> is not running") is a settled answer → show it
     and STOP polling; a 5xx/network error may pass, so keep polling. Same shape as
     the 🐞 bugs drawer's load, plus the 404 degrade the 🔍 finder pioneered. */
  const load = useCallback(() => {
    api("/api/seat" + seatQ(vm), { timeout: 20000 }).then(setSeatHdr).catch(() => {});
    if (vm === "@keeper") { setNotEnabled(true); setErr(null); return; }   // host seat: no in-VM daemon
    api("/api/vm/" + vm + "/steward")
      .then(d => {
        setData({ state: (d && d.state) || null, config: (d && d.config) || null });
        setNotEnabled(false); setErr(null);
      })
      .catch(e => {
        if (e.aborted) return;
        if (e.status === 404) { setNotEnabled(true); setErr(null); return; }  // route not enabled — degrade
        if (e.status >= 400 && e.status < 500) stopped.current = true;
        setErr({ msg: e.message || String(e), status: e.status });
      });
  }, [vm]);
  const retry = () => { stopped.current = false; setErr(null); load(); };

  useEffect(() => {
    setData(null); setNotEnabled(false); setErr(null); setConfirmArm(false); setConfirmReset(false); say("");
    setThrPreview(null);
    stopped.current = false;
    load();
    const id = setInterval(() => {
      if (stopped.current || document.visibilityState === "hidden") return;
      load();
    }, STEWARD_POLL_MS);
    const onVis = () => { if (document.visibilityState === "visible" && !stopped.current) load(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis);
                   if (acRef.current) acRef.current.abort(); };
  }, [load]);

  // Separate 1s ticker so the warn-banner countdown + "next eligible" stay live
  // without re-hitting the backend; paused while the tab is hidden.
  useEffect(() => {
    const id = setInterval(() => {
      if (document.visibilityState !== "hidden") setNow(Math.floor(Date.now() / 1000));
    }, 1000);
    return () => clearInterval(id);
  }, []);

  const guard = (fn) => {
    const ac = new AbortController();
    acRef.current = ac;
    setBusy(true);
    return fn(ac.signal).finally(() => { acRef.current = null; setBusy(false); });
  };
  /* Verify-after-write honesty: reflect the SERVER's answer, never a fake success.
     A write that echoes {state,config} updates the drawer straight away; anything
     else falls back to a fresh GET so what's shown is what the host actually wrote. */
  const applyWrite = (d, ack) => {
    if (d && d.ok === false) { say(d.error || "write rejected", true); return; }
    if (d && (d.state || d.config)) {
      setData(cur => ({ state: (d.state || (cur && cur.state)) || null,
                        config: (d.config || (cur && cur.config)) || null }));
      setNotEnabled(false); setErr(null);
    } else { load(); }
    say(ack);
  };
  const writeFail = (prefix) => (e) => {
    if (e.aborted) return;
    if (e.status === 404) { setNotEnabled(true); return; }  // route vanished mid-session → degrade honestly
    say(prefix + ": " + (e.message || e), true);
  };
  /* EVERY config write leads with the full quartet {mode, timeout_min,
     threshold_bytes, max_age_min} — the NEWEST route (t89) accepts it, with both
     optional fields OPTIONAL-with-preserve (present ⇒ validated int, 400 out of
     range). An OLDER route fail-closes on any key it doesn't recognise, with a
     400 naming exactly the key(s) it walls — control-tested for the t81 trio:
     "unsupported key(s) for config: threshold_bytes" — and the write path
     diverges there by INTENT (the c75b4f2 two-generation discipline, extended
     for the t89 generation):
       · the walled field's OWN intent never retries — a slider commit against a
         threshold wall, or a max-age pick against a max_age_min wall, has
         nothing an older shape can express, so: honest not-yet-updated message,
         and the settle (preview-clear / re-render from server truth) snaps the
         control back. Nothing was saved, and nothing pretends otherwise.
       · every OTHER intent retries ONCE, dropping exactly the walled optional
         field(s): against the o18-era host (walls threshold_bytes — its 400
         names max_age_min too, unknown keys are listed together) that is the
         legacy {op, mode, timeout_min}; against the o22-era host (accepts the
         trio, walls only max_age_min) the trio still rides. The user's ask
         lands, acked with a note naming which field needs the host update.
     A 400 is a generation wall SPECIFICALLY when the backend's own text says so;
     any OTHER 400 (e.g. a range validator) still gets the backend's verbatim
     text via writeFail, never a mislabelled wall claim. The drawer stays fully
     interactive throughout — nothing here disables a control. */
  const O18_400 = (e) => e.status === 400 && /unsupported key|unknown (field|key)/i.test(e.message || "");
  // intent: undefined = mode/cadence/arm · "budget" = slider commit · "maxAge" = age pick
  const postConfig = (m, t, b, a, ack, intent, tokTh, fsMed, lean, zeroU, routerM) => {
    setConfirmArm(false);
    const ackText = ack || (m === "on" ? "armed — live restarts ON" : "mode → " + m);
    // threshold_tokens (newest-gen, like max_age_min) is the REAL reset bar; it
    // rides the primary write and, on an O18 generation wall, is simply dropped
    // from the retry below (never re-ridden) — same discipline as max_age_min.
    // fs_mediated / lean_context (Method E switches) ride the same way; omitting
    // them preserves the VM's configured value (host preserve-if-absent), so only
    // the toggle that changed sends its field.
    const cfgBody = { op: "config", mode: m, timeout_min: t, threshold_bytes: b, max_age_min: a };
    if (tokTh != null) cfgBody.threshold_tokens = tokTh;
    if (fsMed != null) cfgBody.fs_mediated = fsMed;
    if (lean != null) cfgBody.lean_context = lean;
    if (zeroU != null) cfgBody.zero_usage = zeroU;
    if (routerM != null) cfgBody.router_mode = routerM;
    guard(signal => api("/api/vm/" + vm + "/steward", { method: "POST", signal,
        body: JSON.stringify(cfgBody) })
      .then(d => applyWrite(d, ackText))
      .catch(e => {
        if (e.aborted) return;
        if (e.status === 404) { setNotEnabled(true); return; }
        if (O18_400(e)) {
          const wallsThr = /threshold_bytes/.test(e.message || "");
          if (intent === "maxAge") {
            say("host route not yet updated — max session age isn't accepted yet; nothing was saved", true);
            return;
          }
          if (intent === "budget" && wallsThr) {
            say("host route not yet updated (o18) — this write isn't accepted yet; nothing was saved", true);
            return;
          }
          // one-generation-back retry (ONCE, never chained): land the user's
          // actual ask minus exactly the walled optional field(s). max_age_min
          // is the newest field — ANY wall predates it, so it never re-rides.
          const retry = { op: "config", mode: m, timeout_min: t };
          if (!wallsThr) retry.threshold_bytes = b;
          const wallNote = wallsThr ? " — session budget needs the o18 host update"
                                    : " — max session age needs the t89 host update";
          return api("/api/vm/" + vm + "/steward", { method: "POST", signal,
              body: JSON.stringify(retry) })
            .then(d => applyWrite(d, ackText + wallNote))
            .catch(e2 => {
              if (e2.aborted) return;
              if (e2.status === 404) { setNotEnabled(true); return; }
              writeFail("config write failed")(e2);
            });
        }
        writeFail("config write failed")(e);
      })
      .finally(() => setThrPreview(null)));
  };
  const postExtend = () => {
    guard(signal => api("/api/vm/" + vm + "/steward", { method: "POST", signal,
        body: JSON.stringify({ op: "extend", minutes: 30 }) })
      .then(d => applyWrite(d, "extended +30 min"))
      .catch(writeFail("extend failed")));
  };
  /* t89 manual reset: POST {op:"reset"} — the host pushes the steward-request.v1
     file and the relay consumes it at-most-once, firing at the first LULL (never
     mid-stride), which is why the ack promises the lull rather than "restarted".
     An OLDER route doesn't know the op and answers 400 "op must be config|extend"
     — the same generation-wall honesty as postConfig: the honest not-yet-updated
     note, no retry (there is nothing older to express a reset with). Any other
     failure keeps the backend's verbatim text via writeFail. */
  const postReset = () => {
    setConfirmReset(false);
    /* Refuse the press outright when the relay looks dead. The host would accept
       the write and answer 200 — the request file would just sit there unconsumed
       until some future relay start picked it up (or the nonce gate discarded it).
       Saying so beats queueing into the void; the press is NOT sent. */
    if (stewardRelayDown((data && data.state) || {}, now)) {
      const age = stewardRelayAge((data && data.state) || {}, now);
      say("relay down — last heartbeat " + stewardDur(age) + " ago; nothing was queued", true);
      return;
    }
    guard(signal => api("/api/vm/" + vm + "/steward", { method: "POST", signal,
        body: JSON.stringify({ op: "reset" }) })
      .then(d => applyWrite(d, "reset requested — fires at the next lull"))
      .catch(e => {
        if (e.aborted) return;
        if (e.status === 404) { setNotEnabled(true); return; }
        if (e.status === 400 && /op must be|unsupported/i.test(e.message || "")) {
          say("host route not yet updated — manual reset isn't supported yet; nothing was queued", true);
          return;
        }
        writeFail("reset failed")(e);
      }));
  };
  const cfg = (data && data.config) || {};
  const mode = STEWARD_MODE_SET.has(cfg.mode) ? cfg.mode : "off";
  const timeout = STEWARD_TIMEOUT_SET.has(cfg.timeout_min) ? cfg.timeout_min : 60; // default 1h
  const st = (data && data.state) || {};
  // Relay liveness from the state file's own heartbeat — see STEWARD_STALE_SEC.
  // Only meaningful once state has actually loaded; before that `st` is {} and
  // stewardRelayDown() returns false (unknown ≠ down), so nothing false-alarms.
  const relayAge = stewardRelayAge(st, now);
  const relayDown = stewardRelayDown(st, now);
  const growth = stewardNum(st.growth_bytes), thr = stewardNum(st.threshold_bytes);
  const byteRatio = (growth !== null && thr !== null && thr > 0) ? Math.min(1, growth / thr) : null;
  // MEASURED context out of the 1M ceiling — the meter's primary basis when the
  // relay publishes it. Falls back to the bytes ratio when it doesn't, so an older
  // relay still gets a meter (drawn on the estimate, and labelled as such below).
  const ctxTokens = stewardContextTokens(st);
  const tokensStale = stewardTokensStale(st);
  const tokenRatio = ctxTokens !== null ? Math.min(1, ctxTokens / STEWARD_TOKEN_CAP) : null;
  const ratio = tokenRatio !== null ? tokenRatio : byteRatio;
  const tok = stewardTokUsage(st);                // keeper-11: null on an older relay → no section
  // session budget resolution: the WRITTEN config wins when it carries a valid
  // in-range value, else the steward's effective state, else the default — and the
  // resolved value rides EVERY config write below, so no write posts a partial config.
  const budget = stewardThrOk(cfg.threshold_bytes) ? Math.round(cfg.threshold_bytes)
               : stewardThrOk(st.threshold_bytes) ? Math.round(st.threshold_bytes)
               : STEWARD_THRESHOLD_DEFAULT;
  // the REAL bar: token budget from written config → effective state → default.
  // The slider drives THIS; `thrPreview` now holds TOKENS while dragging.
  const budgetTok = stewardTokOk(cfg.threshold_tokens) ? Math.round(cfg.threshold_tokens)
                  : stewardTokOk(st.threshold_tokens) ? Math.round(st.threshold_tokens)
                  : STEWARD_TOKENS_DEFAULT;
  const budgetTokShown = thrPreview !== null ? thrPreview : budgetTok;
  // Method E switches — written config wins, else effective state, else off.
  const fsMediated = !!(cfg.fs_mediated !== undefined ? cfg.fs_mediated : st.fs_mediated);
  const leanContext = !!(cfg.lean_context !== undefined ? cfg.lean_context : st.lean_context);
  const zeroUsage = !!(cfg.zero_usage !== undefined ? cfg.zero_usage : st.zero_usage);
  const routerMode = !!(cfg.router_mode !== undefined ? cfg.router_mode : st.router_mode);
  // t89 max session age resolution: the WRITTEN config wins, else the relay's
  // effective state, else 0 (off) — and like `budget` above, the resolved value
  // rides EVERY config write so no write posts a partial config.
  const maxAge = STEWARD_MAX_AGE_SET.has(cfg.max_age_min) ? cfg.max_age_min
               : STEWARD_MAX_AGE_SET.has(st.max_age_min) ? st.max_age_min : 0;
  // the readout's age cap: the relay's own effective value when it has one
  // (non-zero), else the resolved config value above (a just-written cap shows
  // immediately, before the relay's next state cycle catches up)
  const ageCap = stewardNum(st.max_age_min) || maxAge;
  const maxAgeLabel = (v) => (STEWARD_MAX_AGES.find(([x]) => x === v) || [0, v + "m"])[1];
  /* Commit = release (pointerup) or a keyboard nudge settling (keyup) — NEVER the
     per-tick change/input stream (React fires onChange every tick on a range).
     A release at the server's own value is a no-op: drop the preview, post nothing. */
  // Method E: filesystem-view switch. ON (finder-mediated) writes the flag on the
  // VM that the PreToolUse hook reads to DENY the keeper's raw Read/Grep/Glob, so
  // it must route through finder/keeper-ask. Independent of the reset mode.
  const commitFsMediated = (next) => {
    if (busy) return;
    postConfig(mode, timeout, budget, maxAge,
      "filesystem view → " + (next ? "finder-mediated (raw Read/Grep/Glob OFF)" : "open (raw reads on)"),
      "fsmed", undefined, next);
  };
  // Method E: cache / lean-context switch. ON refreshes the keeper's context when
  // it crosses the token budget above, capping cache_read. Observe-first (dry by
  // default): the relay warns + logs the refresh; it executes when steward_restart
  // is live. Independent of the reset mode.
  const commitLean = (next) => {
    if (busy) return;
    postConfig(mode, timeout, budget, maxAge,
      "cache mode → " + (next ? "lean-context (refresh at the token budget)" : "normal"),
      "lean", undefined, undefined, next);
  };
  // Reversible per-VM 'zero the token counters' switch. ON snapshots current
  // totals as a baseline so the usage panel reads from 0 and grows; OFF drops the
  // baseline and the true lifetime totals return. Non-destructive (no transcript
  // touched) — for measuring cache_read from a clean start.
  const commitZeroUsage = (next) => {
    if (busy) return;
    postConfig(mode, timeout, budget, maxAge,
      "token counters → " + (next ? "zeroed (baseline set; reads from 0)" : "true totals"),
      "zerousage", undefined, undefined, undefined, next);
  };
  // Method E: router-mode switch. ON launches the keeper lean — the per-turn
  // directive appends (~2.2k tokens) are dropped in favour of a one-time
  // finder/local-keeper primer. Effect piece: keeper-launch.sh on the VM; the
  // field rides the same config write, so it lands at the keeper's NEXT launch.
  const commitRouterMode = (next) => {
    if (busy) return;
    postConfig(mode, timeout, budget, maxAge,
      "router mode → " + (next ? "ON (lean launch — directive appends dropped)" : "off (full directives)"),
      "router", undefined, undefined, undefined, undefined, next);
  };
  const commitBudget = (e) => {
    const v = stewardClampTokens(parseInt(e.target.value, 10));
    if (busy || v === budgetTok) { setThrPreview(null); return; }
    // intent "budget": the token bar IS the whole intent — against a host that
    // walls threshold_tokens there is no older shape to express it, so no retry.
    // threshold_bytes rides unchanged (secondary growth gate) so no partial write.
    postConfig(mode, timeout, budget, maxAge,
      "session budget → " + stewardTokenCount(v) + " tokens", "budget", v);
  };
  // t89: the max-age select posts on change like the cadence select; the value
  // renders from server truth (config→state→0), so a walled/failed write snaps
  // the select back on the settle re-render — same honesty as the slider.
  const commitMaxAge = (e) => {
    const v = parseInt(e.target.value, 10);
    if (busy || !STEWARD_MAX_AGE_SET.has(v) || v === maxAge) return;
    postConfig(mode, timeout, budget, v,
      "max session age → " + maxAgeLabel(v), "maxAge");
  };

  // Arming `on` is safety-sensitive: it means a LIVE restart of the keeper, so it
  // routes through a confirm instead of firing on the first click; off/dry are inert
  // enough to write immediately (and either clears any open confirm).
  const onModeClick = (m) => {
    if (m === mode) return;
    if (m === "on") { setConfirmArm(true); return; }
    postConfig(m, timeout, budget, maxAge);
  };

  return html`
    <div className="design-panel steward-panel">
      <div className="steward-bar">
        <b>🛡 steward — ${locusLabel(vm)}</b>
        <span className="steward-spacer"></span>
        <button className="btn" title=${"refresh now (auto-refreshes every " + (STEWARD_POLL_MS / 1000) + "s)"}
                onClick=${load}>↻</button>
      </div>
      <div className="steward-body">
        <div style=${{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
          ${[["session", "🛡 session"], ["access", "🔓 access"], ["directive", "📜 directive"],
             ["settings", "⚙ settings"], ["feed", "📡 feed"], ["provenance", "🧭 provenance"]].map(([t, lbl]) =>
            html`<button key=${t} className=${"btn" + (tab === t ? " on" : "")} style=${{ fontSize: 11 }}
                         onClick=${() => pickTab(t)}>${lbl}</button>`)}
        </div>
        ${tab === "session" && html`
        ${/* Frontier is one model seat. MCT is its communication mode; the
              native terminal is the alternate mode for the selected model.
              Usage and controls belong to the selected native seat;
              the absorbed 📡 feed (bugs · live · 💬 B · 📜 log) rides at the bottom. */""}
        <${SeatPanel} vm=${vm} section="session" />
        ${data === null && !err && !notEnabled && html`<div className="steward-note">loading…</div>`}
        ${notEnabled && vm === "@keeper" && html`<div className="steward-note">
          ⌂ host — this machine's own console seat (the default, and the bottleneck every host-level request passes through)<br />
          <span style=${{ fontSize: 11 }}>no in-VM steward daemon here; everything below is the HOST seat's own control surface</span>
        </div>`}
        ${notEnabled && vm !== "@keeper" && html`<div className="steward-note">
          steward route not enabled on the host<br />
          <span style=${{ fontSize: 11 }}>the operator installs /api/vm/&lt;vm&gt;/steward later — this lights up when it lands</span>
        </div>`}
        ${err && html`<div className="steward-err">
          <div><b>${err.msg}</b></div>
          ${err.status === 409 && html`<div className="steward-err-hint">start ${vm} to reach its steward</div>`}
          <button className="btn" style=${{ marginTop: 8 }} onClick=${retry}>↻ retry</button>
        </div>`}
        ${!notEnabled && !err && data !== null && html`
          ${st.warning_active && html`
            <div className="steward-warn">
              <div className="steward-warn-head">⚠ keeper restart imminent</div>
              <div className="steward-warn-count">restart in <b>${stewardCountdown(st.warn_fire_ts, now)}</b></div>
              <button className="btn" disabled=${busy || !st.extend_available}
                      title=${st.extend_available
                        ? "push the restart out 30 minutes (the server caps the hold at +60m)"
                        : "an extension isn't available right now"}
                      onClick=${postExtend}>Extend 30 min</button>
            </div>`}
          ${/* armed-reset deprecated (P1): the mode selector, max-session-age
                slider, and Reset now were legacy VM-steward-daemon arming (t89) — the
                live token meter below owns this space now. Config/reset JS kept
                dormant for reference; nothing renders it. */ ""}
          <div className="steward-readout">
            <div className="steward-stat">
              <span className="steward-k">effective</span>
              <span className="steward-v">${STEWARD_MODE_SET.has(st.mode) ? st.mode : mode}${
                st.armed ? html` · <b className="steward-armed">armed</b>` : " · idle"}</span>
            </div>
            ${/* Heartbeat age, always shown once state has loaded: the drawer used
                  to look identical whether the relay was polling or dead. */
              relayAge !== null && html`
              <div className="steward-stat">
                <span className="steward-k">relay heartbeat</span>
                <span className=${"steward-v" + (relayDown ? " steward-armed" : "")}>${
                  relayDown ? stewardDur(relayAge) + " ago · down" : stewardDur(relayAge) + " ago"}</span>
              </div>`}
            ${/* MEASURED context leads the readout when the relay publishes it —
                  scraped from the VM's own ~/.claude transcripts (see
                  stewardContextTokens). Stale → the figure is still shown, but
                  marked, because a stale value describes a session that is no
                  longer being written to. */
              ctxTokens !== null && html`
              <div className="steward-stat">
                <span className="steward-k">context</span>
                <span className=${"steward-v" + (tokensStale ? " steward-armed" : "")}>${
                  stewardTokenCount(ctxTokens)} tok / ${stewardTokenCount(STEWARD_TOKEN_CAP)}${
                  tokensStale ? html` · ⚠ stale (${stewardDur(stewardTokensAge(st))})` : ""}</span>
              </div>`}
            ${ratio !== null && html`<div className="steward-meter">
              <span className=${"steward-meter-fill" + (ratio >= 1 ? " full" : "")}
                    style=${{ width: (ratio * 100).toFixed(0) + "%" }}></span></div>`}
            ${ctxTokens !== null && tokensStale && html`
              <div className="steward-thr-est">measured from the last-written transcript — that file has been idle
                ${" " + stewardDur(stewardTokensAge(st))}, so this is likely a finished session, not the live one</div>`}
            ${/* The bytes figure stays visible as the SECONDARY transcript-growth
                  readout — the steward no longer thresholds on it (tokens are the
                  bar), it is reported only so a token/byte divergence is never
                  silent. */""}
            <div className="steward-stat">
              <span className="steward-k">transcript growth</span>
              <span className="steward-v">${stewardBytes(st.growth_bytes)} / ${stewardBytes(st.threshold_bytes)}${
                byteRatio !== null && byteRatio >= 1 ? html` · <b className="steward-armed">over gate</b>` : ""}</span>
            </div>
            ${ctxTokens !== null && html`
              <div className="steward-thr-est">the restart fires on the MEASURED tokens above vs the budget below;
                the transcript-growth bytes are reported only (they trigger nothing)</div>`}
            ${/* session budget slider deprecated — the budget now lives in the token
                  tracker at the TOP of this tab (cost row turns red when over). */""}
            ${/* Method E — filesystem-view switch. ON forces the Claude keeper's file
                  access through finder/keeper-ask by hard-denying raw Read/Grep/Glob
                  (a PreToolUse hook on the VM reads the flag this writes). */""}
            <div className="steward-thr">
              <div className="steward-thr-row">
                <span className="steward-k">frontier filesystem</span>
                <button className=${"btn steward-fsmed" + (fsMediated ? " on" : "")} disabled=${busy}
                        title=${fsMediated
                          ? "Frontier filesystem requests only: the frontier keeper (A) has NO direct filesystem access — Read/Grep/Glob/Edit/Write and all file-touching Bash are denied; every file op is a request through the local-keeper (B), which returns pointers/spans. Click to allow direct access."
                          : "direct: the frontier keeper touches the filesystem itself. Click to force mediation — A's file access becomes requests through the local-keeper, never direct."}
                        onClick=${() => commitFsMediated(!fsMediated)}>
                  ${fsMediated ? "🛡 requests via local-keeper" : "📂 direct (unmediated)"}
                </button>
              </div>
              <div className="steward-thr-est">ON = "Allow Frontier filesystem requests" only: A has no direct filesystem access (Read/Grep/Glob/Edit/Write + file Bash denied);
                every file op is a brokered request to the local-keeper (<code>opencode run …</code>), which returns pointers/spans — never a host path. PreToolUse hook on the VM.</div>
            </div>
            ${/* Method E — reversible per-VM 'zero the token counters' switch. */""}
            <div className="steward-thr">
              <div className="steward-thr-row">
                <span className="steward-k">token counters</span>
                <button className=${"btn steward-zero" + (zeroUsage ? " on" : "")} disabled=${busy}
                        title=${zeroUsage
                          ? "counters zeroed: the usage panel reads from a baseline set when you flipped this on (0 + growth since). Click to restore the true lifetime totals."
                          : "showing true lifetime totals. Click to zero the counters (baseline snapshot) and measure cache_read from a clean start — reversible, non-destructive."}
                        onClick=${() => commitZeroUsage(!zeroUsage)}>
                  ${zeroUsage ? "⭯ zeroed (reads from baseline)" : "Σ true totals"}
                </button>
              </div>
              <div className="steward-thr-est">Reversible: ON snapshots a baseline so usage reads from 0 and grows; OFF restores the
                true totals. No transcript is moved or deleted${zeroUsage && tok ? "" : ""}.</div>
            </div>
            ${/* Method E — cache / lean-context switch. ON refreshes context at the
                  token budget above, capping cache_read (the ~86% cost driver).
                  Observe-first: dry by default (warns + logs), live via steward_restart. */""}
            <div className="steward-thr">
              <div className="steward-thr-row">
                <span className="steward-k">cache mode</span>
                <button className=${"btn steward-lean" + (leanContext ? " on" : "")} disabled=${busy}
                        title=${leanContext
                          ? "lean-context ON: context is refreshed once it crosses the token budget above, capping cache_read. Observe-first (dry) — it warns + logs the refresh; set steward_restart live to execute. Click to turn off."
                          : "cache normal: context accrues. Click for lean-context — refresh at the token budget to cap cache_read (dry/observe by default)."}
                        onClick=${() => commitLean(!leanContext)}>
                  ${leanContext ? "🧹 lean-context (cap cache_read)" : "💾 normal"}
                </button>
              </div>
              <div className="steward-thr-est">ON refreshes context at the token budget above to cap cache_read.
                Observe-first — warns + logs the refresh; executes when <code>steward_restart</code> is live.</div>
            </div>
            ${/* Method E — router-mode switch. ON drops the per-launch directive
                  appends (~2.2k tokens/turn) for a one-time finder/local-keeper
                  primer. Effect piece: keeper-launch.sh; lands at the NEXT launch. */""}
            <div className="steward-thr">
              <div className="steward-thr-row">
                <span className="steward-k">router mode</span>
                <button className=${"btn steward-router" + (routerMode ? " on" : "")} disabled=${busy}
                        title=${routerMode
                          ? "router mode ON: the keeper launches lean — per-turn directive appends (~2.2k tokens) are dropped; a one-time finder/local-keeper primer replaces them. Click to restore full directives."
                          : "router mode off: full directive appends ride every keeper turn. Click for a lean launch (primer once, appends dropped) — needs the keeper-launch.sh effect piece on this VM."}
                        onClick=${() => commitRouterMode(!routerMode)}>
                  ${routerMode ? "🛰 router (lean launch)" : "📜 full directives"}
                </button>
              </div>
              <div className="steward-thr-est">ON drops the per-launch directive appends (≈2.2k tokens per turn) for a one-time
                primer. Takes effect at the keeper's NEXT launch via <code>keeper-launch.sh</code>.</div>
            </div>
            <div className="steward-stat">
              <span className="steward-k">session age</span>
              <span className="steward-v">${stewardDur(st.session_age_sec)}${
                ageCap ? html` / ${stewardDur(ageCap * 60)} cap` : ""}</span>
            </div>
            <div className="steward-stat">
              <span className="steward-k">next eligible</span>
              <span className="steward-v">${stewardWhen(st.next_eligible_ts, now)}</span>
            </div>
            ${/* keeper-11: token usage by class, live session vs all-transcripts
                  total — the model's own usage records via the relay. The two
                  paid classes render bright, the cheap bulk dim; exact figures
                  ride in title=. Section absent entirely on an older relay. */
              tok && html`
              <div className="steward-tok" title="model-reported token usage scraped from the transcripts, refreshed each relay cycle">
                <span className="steward-tok-h">token usage</span>
                <span className="steward-tok-h num">live</span>
                <span className="steward-tok-h num">total${tok.sessions !== null ? " · " + tok.sessions + " sess" : ""}</span>
                ${STEWARD_TOK_ROWS.flatMap(r => [
                  html`<span key=${r.key + "-k"} className="steward-tok-k">${r.label}</span>`,
                  html`<span key=${r.key + "-l"} className=${"steward-tok-v" + (r.cheap ? " cheap" : "")}
                             title=${stewardTokenCount(tok.live[r.key])}>${stewardTokAbbr(tok.live[r.key])}</span>`,
                  html`<span key=${r.key + "-t"} className=${"steward-tok-v" + (r.cheap ? " cheap" : "")}
                             title=${stewardTokenCount(tok.total[r.key])}>${stewardTokAbbr(tok.total[r.key])}</span>`,
                ])}
              </div>
              <div className="steward-thr-est">output + cache write are the paid classes; cache read is the cheap bulk. hover any figure for the exact count</div>`}
          </div>
          <div className=${"steward-statusline" + (noteErr ? " err" : "")}>${note}</div>`}
        <${HostAssistPanel} />
        ${hugpyKeys && html`<${KeysPanel} vm=${vm} />`}
        `}
        ${/* 2026-09-18 (operator): 📡 feed promoted to its OWN steward tab (was
              embedded at the bottom of the 🛡 session tab). embed=true keeps the
              self-contained, reliably-sized section that renders inside the
              flex/scroll steward-body. */""}
        ${tab === "feed" && html`
          <${FeedGroupDrawer} vm=${vm === "@keeper" ? null : vm} embed=${true} />
        `}
        ${tab === "provenance" && html`<${ProvenancePanel} />`}
        ${/* 🔓 access — everything about what may touch this locus: sudo grant/
              revoke, the frontier fs switch, LAN browser access, and the Claude
              login (OAuth) + 🧹 seat wipe. */""}
        ${tab === "access" && html`
          <${SudoPanel} vm=${vm} />
          <${FrontierFsSwitch} />
          <${BrowserAccessPanel} />
          <${SeatPanel} vm=${vm} section="login" />
        `}
        ${/* 📜 directive — the exact text A is handed each turn (verbatim +
              composed/launch lines), the operator's standing 🧭 note to B, and
              the per-VM agent deploy directive off the board. */""}
        ${tab === "directive" && html`
          <${SeatPanel} vm=${vm} section="directive" />
          <${FrontierGuidance} />
          <${DeployDirectivePanel} vm=${vm} />
        `}
        ${/* ⚙ settings — Claude Code seat settings as a real form (claude-code
              IS the frontier backend), two-view over the same GET/POST
              /api/a/template document the old raw ⚙ Template editor wrote. */""}
        ${tab === "settings" && html`<${ClaudeSettingsPanel} />`}
      </div>
    </div>`;
}

/* ✍ Prompt Studio — a per-VM DOCUMENT composer for writing a prompt to the VM's
   keeper, instead of typing at the terminal command line. The editor is an enhanced
   monospace textarea (Tab inserts spaces, wraps, fills the drawer); the in-progress
   draft autosaves to localStorage keyed per VM, so switching tab/VM never loses it.
   "Refine" POSTs the draft to the host and shows the LLM's restructuring in a PREVIEW
   with Accept (replaces the draft) / Discard (keeps it) — never a silent overwrite.
   "Send to keeper" gates behind a small confirm because it reaches a LIVE keeper.

   Route contract (build against this exactly; a 404 => 'route not enabled'):
     POST {op:"refine",text} → {refined}      (host calls the LLM; may 5xx when the
                                               shared GPU is busy — degrade, keep draft)
     POST {op:"send",  text} → {ok,queued}    (host hands the text to the keeper-relay
                                               injection queue)
   There is NO GET — the composer is stateless server-side, drafts live client-side,
   so the 'not enabled' degrade surfaces on the first refine/send, not at load.

   NB: a CodeMirror/Monaco upgrade is a possible future step; the keeper chose an
   enhanced textarea first (no vendored editor dep, CSP-strict/self-contained). */
const psDraftKey = (vm) => "promptstudio_" + vm;
/* A VM this browser has NEVER composed for seeds a starter skeleton instead of
   a void; a draft the user deliberately cleared (stored "") STAYS cleared --
   only the null never-touched case seeds. */
const PS_TEMPLATE = "Goal:\n\nContext:\n\nConstraints:\n\nDeliverable:\n";
const psLoadDraft = (vm) => {
  try { const s = localStorage.getItem(psDraftKey(vm)); return s === null ? PS_TEMPLATE : s; }
  catch (_) { return ""; }
};
const psSaveDraft = (vm, text) => { try { localStorage.setItem(psDraftKey(vm), text); } catch (_) {} };

function PromptStudioDrawer({ vm }) {
  const [draft, setDraft] = useState(() => psLoadDraft(vm)); // the composed prompt (persisted per VM)
  const [preview, setPreview] = useState(null);   // the LLM's refined text, awaiting Accept/Discard | null
  const [refining, setRefining] = useState(false);// a refine POST is in flight
  const [sending, setSending] = useState(false);  // a send POST is in flight
  const [confirmSend, setConfirmSend] = useState(false); // the "send to <vm>'s keeper?" gate is showing
  const [target, setTarget] = useState("vm");     // receiver: "vm" keeper | host "local"/"frontier"/"shell" surface
  const [notEnabled, setNotEnabled] = useState(false);   // a POST 404'd → route not installed on the host (degrade)
  const [note, setNote] = useState("");           // bottom status line (acks / errors)
  const [noteErr, setNoteErr] = useState(false);
  const say = (msg, isErr) => { setNote(msg || ""); setNoteErr(!!isErr); };
  const acRef = React.useRef(null);               // in-flight POST, for abort on unmount / VM switch

  // A VM switch is a fresh document: drop any preview/confirm/status and load THIS
  // VM's saved draft. Aborts an in-flight POST so its late result can't land on the
  // new VM's editor. (Same localStorage-with-try/catch idiom the design drawer uses.)
  useEffect(() => {
    setDraft(psLoadDraft(vm));
    setPreview(null); setConfirmSend(false); setNotEnabled(false); say("");
    return () => { if (acRef.current) acRef.current.abort(); };
  }, [vm]);

  // Persist every keystroke so switching tab/VM (or a reload) never loses the draft.
  const onEdit = (text) => { setDraft(text); psSaveDraft(vm, text); };

  // Tab inserts two spaces at the caret rather than moving focus — the "document
  // editing, not a command line" nicety. Preserves any selection replacement and
  // leaves the caret just after the inserted spaces.
  const onKeyDown = (e) => {
    if (e.key !== "Tab") return;
    e.preventDefault();
    const el = e.target, s = el.selectionStart, en = el.selectionEnd, pad = "  ";
    const next = draft.slice(0, s) + pad + draft.slice(en);
    onEdit(next);
    requestAnimationFrame(() => { try { el.selectionStart = el.selectionEnd = s + pad.length; } catch (_) {} });
  };

  const busy = refining || sending;
  const empty = draft.trim().length === 0;

  // Fail gracefully and identically to the other drawers: a 404 is the honest "route
  // not installed" degrade (banner stays, editor still usable); anything else (5xx,
  // timeout on the shared GPU, network) keeps the draft and says so.
  const failRefine = (e) => {
    if (e.aborted && !e.timedOut) return;                 // VM switch / unmount cancel — silent
    if (e.status === 404) { setNotEnabled(true); say("refine needs the host route", true); return; }
    say("refine unavailable — your draft is kept", true); // 5xx / timeout / network
  };
  const doRefine = () => {
    if (empty || busy) return;
    const ac = new AbortController(); acRef.current = ac;
    setRefining(true); say("refining…");
    api("/api/vm/" + vm + "/compose", { method: "POST", signal: ac.signal,
        body: JSON.stringify({ op: "refine", text: draft }) })
      .then(d => {
        if (d && d.ok === false) { say(d.error || "refine rejected", true); return; }
        const refined = d && typeof d.refined === "string" ? d.refined : null;
        if (refined === null) { say("refine returned nothing usable — your draft is kept", true); return; }
        setNotEnabled(false); setPreview(refined); say("review the refined prompt below");
      })
      .catch(failRefine)
      .finally(() => { acRef.current = null; setRefining(false); });
  };
  // Accept REPLACES the editor text (persisted); Discard leaves the draft untouched.
  const acceptRefine = () => { if (preview !== null) { onEdit(preview); setPreview(null); say("refined prompt accepted"); } };
  const discardRefine = () => { setPreview(null); say("kept your draft"); };

  const doSend = () => {
    setConfirmSend(false);
    if (empty || busy) return;
    if (target !== "vm") {
      /* host surface: hand the draft to the ⌨ terminal bridge — the receiver
         is the chosen surface's live PTY (local = B, frontier = A/MCT, shell).
         Inner newlines become carriage returns so the PTY sees Enter. */
      const ok = !!(window.__fvSend
        && window.__fvSend(draft.replace(/\r?\n/g, "\r"), target));
      say(ok ? "sent to the host " + target + " surface"
             : "host terminal not ready — open the ⌨ terminal pane first", !ok);
      return;
    }
    const ac = new AbortController(); acRef.current = ac;
    setSending(true); say("sending…");
    api("/api/vm/" + vm + "/compose", { method: "POST", signal: ac.signal,
        body: JSON.stringify({ op: "send", text: draft }) })
      .then(d => {
        if (d && d.ok === false) { say(d.error || "send rejected", true); return; }
        setNotEnabled(false); say("sent to " + vm + "'s keeper");
      })
      .catch(e => {
        if (e.aborted && !e.timedOut) return;
        if (e.status === 404) { setNotEnabled(true); say("send needs the host route", true); return; }
        say("send failed — your draft is kept", true);
      })
      .finally(() => { acRef.current = null; setSending(false); });
  };

  return html`
    <div className="design-panel ps-panel">
      <div className="ps-bar">
        <b>✍ prompt studio — ${vm}</b>
        <select className="ps-target" value=${target} onChange=${(e) => setTarget(e.target.value)}
                title="receiver: this VM's keeper, or a host surface in the ⌨ terminal (local = B, frontier = A/MCT, shell)">
          <option value="vm">→ ${vm} keeper</option>
          <option value="local">→ host local (B)</option>
          <option value="frontier">→ host frontier (A)</option>
          <option value="shell">→ host shell</option>
        </select>
        <span className="ps-spacer"></span>
      </div>
      <div className="ps-body">
        ${notEnabled && html`<div className="ps-note">
          prompt studio route not enabled on the host<br />
          <span style=${{ fontSize: 11 }}>the operator installs /api/vm/&lt;vm&gt;/compose later — keep drafting; refine &amp; send light up when it lands</span>
        </div>`}
        <textarea className="ps-editor" value=${draft} disabled=${busy}
                  spellCheck=${false} placeholder=${"Write a prompt to " + vm + "'s keeper…\nTab indents · Refine restructures it · Send injects it into the keeper terminal"}
                  onInput=${e => onEdit(e.target.value)} onKeyDown=${onKeyDown}></textarea>
        ${preview !== null && html`
          <div className="ps-preview">
            <div className="ps-preview-head">refined prompt — review before it replaces your draft</div>
            <pre className="ps-preview-text">${preview}</pre>
            <div className="ps-preview-acts">
              <button className="btn" disabled=${busy} onClick=${acceptRefine}>Accept</button>
              <button className="btn" disabled=${busy} onClick=${discardRefine}>Discard</button>
            </div>
          </div>`}
        ${confirmSend && html`
          <div className="ps-confirm">
            <span>Send this to ${target === "vm"
              ? html`<b>${vm}</b>'s keeper? it drops straight into the live keeper terminal.`
              : html`the host <b>${target}</b> surface? it drops straight into that terminal's live PTY.`}</span>
            <button className="btn ps-send" disabled=${busy} onClick=${doSend}>Send</button>
            <button className="btn" disabled=${busy} onClick=${() => setConfirmSend(false)}>cancel</button>
          </div>`}
        <div className="ps-acts">
          <button className="btn" disabled=${empty || busy}
                  title="restructure this draft via the keeper's LLM — you review the result before it replaces your text"
                  onClick=${doRefine}>${refining ? "refining…" : "✨ Refine"}</button>
          <span className="ps-grow"></span>
          <button className="btn ps-send" disabled=${empty || busy}
                  title=${"inject this prompt into " + vm + "'s keeper terminal (asks to confirm first)"}
                  onClick=${() => setConfirmSend(true)}>${sending ? "sending…"
                    : target === "vm" ? "➤ Send to keeper" : "➤ Send to host " + target}</button>
        </div>
        <div className=${"ps-statusline" + (noteErr ? " err" : "")}>${note}</div>
      </div>
    </div>`;
}

/* ⚿ keeper keys — set/rotate a VM keeper's hugpy gateway API key (board p13).
   Lives INSIDE the 🛡 steward drawer (operator direction: the drawer already
   owns per-VM keeper control; a second inline form anchored to the power-tray
   strip would have fought the "the tablist clips overflow, so no absolute
   popup" constraint the tray's OWN comment documents, for no real gain). The
   tray keeps only a tiny ⚿ icon-only shortcut that activates this VM and
   opens the steward drawer — see vmGroup below. StewardDrawer renders this
   section only when `hugpyKeys` says the backend's /keeper poll advertised
   the "hugpy" agent (same capability signal the multi-agent chooser uses).

   Route contract (pinned; build against exactly this):
     GET  /api/vm/<vm>/keeper-env
       → {vm, env_present, fields:{
            KEEPER_API_KEY:{set:bool},
            HUGPY_BASE_URL:{value:str|null},
            HUGPY_KEEPER_MODEL:{value:str|null}}}
       The key's VALUE is never returned — set:true/false only.
     POST same path {op:"set", fields:{<subset of the 3>}}
       → {ok:true, updated:[...]}; 400 unknown/invalid field; 409 the VM has
         no hugpy-keeper env (not provisioned); 404 = route not installed yet
         (same 🔍-search-drawer degrade: keep showing the hint, don't error out).

   Honesty rules this component keeps:
   - save() only ever includes a field the operator actually edited (key: the
     password input is non-empty; central/model: differs from the last GET) —
     never resends what wasn't touched.
   - After a successful POST it re-GETs and renders THAT, not an optimistic
     echo — verify-after-write, same as the steward drawer's applyWrite().
   - The typed key is local state only, cleared the instant save() succeeds,
     never logged, never in a title, never left in the DOM.

   Seam (board t67a): modelField() is the ONE place HUGPY_KEEPER_MODEL renders,
   and it now delegates to <${ModelDropdown}> below — same value/onChange/busy
   contract the forward-compat comment promised, so save()/load() and the wire
   contract never had to change to pick this up. */
function modelField(value, onChange, busy) {
  return html`<${ModelDropdown} value=${value} onChange=${onChange} busy=${busy} />`;
}

/* ModelDropdown — the shared seam behind EVERY model field in this drawer (t67a's
   HUGPY_KEEPER_MODEL above, and t67b's HUGPY_ASSIST_MODEL in HostAssistPanel below).
   One component, one contract, so both call sites degrade identically.

   Route contract (pinned; build against exactly this):
     GET /api/models → {ok:true, models:[{id:str, ...}]}
       (console-api proxies the hugpy gateway's models list, host-side)
       404 = route not installed yet; ANY failure (404/5xx/timeout) degrades to
       the plain text input this seam replaces — never blocks save on the fetch.

   Fetches EXACTLY ONCE per mount (the useEffect below has an empty dep array),
   which in practice means once per panel-open: this component is rendered
   fresh each time the steward drawer opens (KeysPanel/HostAssistPanel remount
   with the drawer), and typing in the resulting field only ever calls the
   passed-in onChange — it never touches this component's own mount, so no
   keystroke ever re-fires the fetch.

   Rules kept:
   - a value the operator/backend already set that ISN'T in the fetched list is
     added as an extra option (never silently dropped from the UI);
   - a "custom…" option always exists once the list has loaded, and picking it
     flips to the SAME plain text input as the failure path — free text stays
     possible even when the dropdown is live;
   - any fetch failure (404 route-not-installed, 5xx, timeout/abort) degrades to
     the plain text input permanently for this mount — the documented seam
     degrade, identical in shape to every other 404-degrade in this file. */
function ModelDropdown({ value, onChange, busy }) {
  const [models, setModels] = useState(null);   // null = still loading; [] = loaded, empty list
  const [failed, setFailed] = useState(false);  // 404/5xx/timeout — degrade to text, permanently this mount
  const [custom, setCustom] = useState(false);  // operator picked "custom…" — degrade to text, by choice

  useEffect(() => {
    let dead = false;
    api("/api/models")
      .then(d => { if (!dead) setModels(Array.isArray(d.models) ? d.models : []); })
      .catch(e => { if (!dead && !e.aborted) setFailed(true); });
    return () => { dead = true; };
  }, []); // fetch once per mount — see comment above

  /* 1.0.65 (operator): "custom…" used to do nothing and snap back to the previous
     item. Now it opens a text field that KEEPS what the user types; validity is
     checked when the user leaves the field (blur / Enter) — a bad id shows an
     error and stays editable, a good one is committed via onChange (and the
     settings save carries it). "↺ list" returns to the dropdown. */
  const [draft, setDraft] = useState(null);       // text being typed in custom mode
  const [verr, setVerr] = useState(null);         // validation message
  const MODEL_ID = /^[a-z0-9][a-z0-9._:\/-]{2,120}$/i;
  const commitDraft = () => {
    const v = (draft === null ? (value || "") : draft).trim();
    if (!v) { setVerr(null); onChange(""); return true; }
    if (!MODEL_ID.test(v)) { setVerr("not a model id (letters, digits, . _ : / - ; 3–120 chars)"); return false; }
    setVerr(null); onChange(v); return true;
  };
  // Loading / failed / explicit custom: a plain text input — the field's wire
  // contract never moves; custom mode adds verify-on-leave + a way back.
  if (models === null || failed || custom) {
    const known = Array.isArray(models) ? models.map(m => m.id) : [];
    const shown = draft === null ? (value || "") : draft;
    return html`<span style=${{ display: "inline-flex", flexDirection: "column", gap: 2 }}>
      <span style=${{ display: "inline-flex", gap: 4 }}>
        <input type="text" disabled=${busy} value=${shown} placeholder="model id (e.g. claude-opus-4-8)"
               onInput=${(e) => { setDraft(e.target.value); setVerr(null); }}
               onBlur=${commitDraft}
               onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); commitDraft(); } }} />
        ${custom && html`<button className="btn" type="button" disabled=${busy} title="back to the list"
               onClick=${() => { if (commitDraft()) { setCustom(false); setDraft(null); } }}>↺ list</button>`}
      </span>
      ${verr && html`<span style=${{ color: "var(--bad)", fontSize: 11 }}>${verr}</span>`}
      ${!verr && shown && known.length > 0 && !known.includes(shown) && html`<span style=${{ color: "var(--dim)", fontSize: 11 }}>custom id — not in the fetched list; verified on save</span>`}
    </span>`;
  }

  const known = models.map(m => m.id);
  const extra = (value && !known.includes(value)) ? [{ id: value, extra: true }] : [];
  const onSelect = (e) => {
    if (e.target.value === "__custom__") { setDraft(value || ""); setVerr(null); setCustom(true); return; }
    onChange(e.target.value);
  };
  return html`<select disabled=${busy} value=${value || ""} onChange=${onSelect}>
    <option value="">(unset)</option>
    ${extra.map(m => html`<option key=${"extra-" + m.id} value=${m.id}>${m.id} (custom)</option>`)}
    ${models.map(m => html`<option key=${m.id} value=${m.id}>${m.id}</option>`)}
    <option value="__custom__">✎ custom…</option>
  </select>`;
}
/* ⚙ agent deploy directive — board t80. Lives INSIDE the 🛡 steward drawer, a sibling
   section to ⚿ keeper keys / ⚿ console assist, right above KeysPanel's mount (see
   StewardDrawer below). Same reserved-id doctrine as ⏱ push-cadence (RELAY_ID/relayKnob
   further up this file — read that comment first, this mirrors it exactly): the note
   of a RESERVED bookmark item, id "cfg-agent-deploy", carries the operator's standing
   instruction for HOW the keeper deploys agents. Unlike cfg-relay's JSON payload this
   note IS the directive, verbatim plain text — no envelope to parse, no envelope to
   corrupt. The console can only UPDATE the item, never CREATE it: console-api mints
   its own id on `add`, and only the keeper's own tooling trusts the literal id
   "cfg-agent-deploy" — so a board without the item shows a "set by keeper" hint
   instead of the console forging a bogus add.

   INDEPENDENT of the steward route's arm/monitor load state above it (own GET, same
   shape as KeysPanel/HostAssistPanel) — it renders whether or not that section is
   loaded/404/erred. It reads and writes through the SAME route the 📋 todo drawer's
   TodoDrawer uses (there is no separate config route for this note — it lives on the
   same per-VM board cfg-relay does):
     GET  /api/vm/<vm>/todo           → {ok, state:{items:[...]}}   (TodoDrawer's `load`)
     POST /api/vm/<vm>/todo {op:"update", id:"cfg-agent-deploy", fields:{note}}
       → {ok, state:{items:[...]}} echoing the WRITTEN board — verified below, never
         trusted on ok:true alone.

   Honest states, each its own render branch:
     (a) loading            — state===null, no err yet;
     (b) board unreachable  — err !== null; retry button, same shape as every other
                               load-failed banner in this file;
     (c) no cfg-agent-deploy item on the board — "set by keeper" hint, exact same
         doctrine text style as relayKnob's uninitialized state;
     (d) cfg-agent-deploy DUPLICATED — disabled, mirroring the relayDup / dupTitle
         guard (a duplicated id is an ambiguous write target — the backend matches
         the FIRST item with that id, so a write here could silently clobber it);
     (e) live — a textarea prefilled with the item's note, a save button disabled
         while the draft is unchanged or a write is in flight.

   Save VERIFIES-AFTER-WRITE, exactly like setRelay(): rather than trust ok:true, it
   re-finds cfg-agent-deploy in the ECHOED state and confirms its note equals what was
   just sent before reporting success — a backend that silently dropped the write (or
   truncated/mangled the note) can't leave this panel lying about it. */
function DeployDirectivePanel({ vm }) {
  const [state, setState] = useState(null);    // {items:[...]} | null while the first load is pending
  const [err, setErr] = useState(null);        // {msg,status} — board unreachable; retry offered
  const [draft, setDraft] = useState("");      // textarea contents (the in-progress edit)
  const [orig, setOrig] = useState("");        // last-loaded note — save is disabled while draft===orig
  const [busy, setBusy] = useState(false);     // a POST is in flight
  const [note, setNote] = useState("");        // bottom status line (write acks / errors)
  const [noteErr, setNoteErr] = useState(false);
  const acRef = React.useRef(null);
  const say = (msg, isErr) => { setNote(msg || ""); setNoteErr(!!isErr); };

  // Same GET the 📋 todo drawer's TodoDrawer uses, same {ok, state} shape handling —
  // this panel is a second, independent reader of that one board, not a new route.
  const load = useCallback(() => {
    api("/api/vm/" + vm + "/todo")
      .then(d => {
        if (!d.ok) { setErr({ msg: d.error || "load failed" }); return; }
        setState(d.state); setErr(null);
        const items = (d.state && d.state.items) || [];
        const dup = items.filter(i => i.id === DEPLOY_ID).length > 1;
        const item = items.find(i => i.id === DEPLOY_ID) || null;
        const n = (!dup && item) ? (item.note || "") : "";
        setOrig(n); setDraft(n);
      })
      .catch(e => { if (!e.aborted) setErr({ msg: e.message || String(e), status: e.status }); });
  }, [vm]);

  // vm switched (or first mount): wipe everything and reload — own data source, so
  // this never waits on (or shares) the arm/monitor section's load state above it.
  useEffect(() => {
    setState(null); setErr(null); setDraft(""); setOrig(""); say("");
    load();
    return () => { if (acRef.current) acRef.current.abort(); };
  }, [vm, load]);

  const items = (state && state.items) || [];
  const deployCount = items.filter(i => i.id === DEPLOY_ID).length;
  const deploy = deployCount === 1 ? items.find(i => i.id === DEPLOY_ID) : null;
  const deployDup = deployCount > 1;

  const guard = (fn) => {
    const ac = new AbortController();
    acRef.current = ac;
    setBusy(true);
    return fn(ac.signal).finally(() => { acRef.current = null; setBusy(false); });
  };

  const save = () => {
    if (!deploy || deployDup || busy || draft === orig) return;
    say("");
    guard(signal => api("/api/vm/" + vm + "/todo", { method: "POST", signal,
        body: JSON.stringify({ op: "update", id: DEPLOY_ID, fields: { note: draft } }) })
      .then(d => {
        if (!d.ok) { say(d.error || "failed", true); return; }
        const saved = (d.state.items || []).find(i => i.id === DEPLOY_ID);
        const landed = !!saved && saved.note === draft;
        setState(d.state);
        if (landed) { setOrig(draft); say("saved"); }
        else say("the directive write didn't land (cfg-agent-deploy note unchanged on the board) — try again", true);
      })
      .catch(e => { if (e.aborted) return; say(e.message || String(e), true); }));
  };

  const retry = () => { setErr(null); load(); };

  return html`
    <div className="vm-keys deploy-directive">
      <div className="vm-keys-head">
        <span>⚙ agent deploy directive</span>
        <span className="vm-keys-spacer"></span>
        <button className="btn" title="refresh" disabled=${busy} onClick=${() => load()}>↻</button>
      </div>
      ${state === null && !err && html`<div className="vm-keys-note">loading…</div>`}
      ${err && html`<div className="vm-keys-note err">
        <div><b>${err.msg}</b></div>
        <button className="btn" style=${{ marginTop: 6 }} onClick=${retry}>↻ retry</button>
      </div>`}
      ${!err && state !== null && !deploy && !deployDup && html`
        <div className="vm-keys-note"
             title=${DEPLOY_HELP + " — not initialized yet; the keeper creates the reserved cfg-agent-deploy item (the console API can't mint its id)"}>
          <em>set by keeper</em> — no directive item on this board yet</div>`}
      ${!err && state !== null && deployDup && html`
        <div className="vm-keys-note err"
             title=${"disabled: duplicate id " + DEPLOY_ID + " — a write would hit the wrong item (the backend matches the first with this id); make ids unique first"}>
          disabled: duplicate id ${DEPLOY_ID} — ambiguous write target; re-id to fix</div>`}
