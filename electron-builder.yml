# hugpy Station — electron-builder configuration (2026-08-21 packaging revamp).
#
# Replaces the hand-rolled "copy the previous build root, rsync files in, pack
# the asar, dpkg-deb -b" flow (station-app/README.md, now LEGACY). One command
# — ./build-release.sh — emits deb + rpm + pacman + AppImage from THIS source.
#
# Why this file exists at all, in three bullets from the incident log:
#   * the 1.0.39–1.0.41 debs shipped a STALE app.asar (1.0.38) because the asar
#     was copied from the previous build root instead of repacked. Here the asar
#     is repacked from `files:` on every single build — that bug class is dead.
#   * the 1.0.41 rpm was `alien`-converted from the deb and lost the postinst,
#     so /usr/bin/hugpy-station and the SUID chrome-sandbox were never wired.
#     rpm/pacman are now first-class fpm targets with the SAME after-install
#     script as the deb (build/linux-after-install.tpl).
#   * `.secret` / `.auth` / `__pycache__` must NEVER be packaged (2026-08-13
#     shipped-signing-key incident). Filtered here AND re-verified per artifact
#     by build-release.sh, which refuses to stage on a hit.
#
# NAMING, the one thing to know before you "fix" productName:
#   electron-builder installs to /opt/<sanitizedProductName> and sanitize-filename
#   KEEPS SPACES — productName "hugpy Station" would give "/opt/hugpy Station",
#   exactly the old "/opt/Fleet Console" path whose embedded space is why the raw
#   Electron binary crashes when launched from a shell (see SANITIZE.sh and the
#   launcher header). Every shipped path, the systemd unit, station-fix.sh and
#   the docs all say /opt/hugpy-station. So productName is the path-safe
#   "hugpy-station" and the HUMAN-VISIBLE name is set on the desktop entry below
#   (Name / StartupWMClass = "hugpy Station", byte-identical to what 1.0.41 shipped).

appId: ai.hugpy.station
productName: hugpy-station
copyright: © hugpy.ai — hugpy Source-Available License

# The Electron runtime that hugpy Station has shipped since 1.0.36; taken from
# the live install / build root with
#   strings -a /opt/hugpy-station/hugpy-station | grep -o 'Electron/[0-9.]*'
# build-release.sh will hand electron-builder a local electronDist assembled
# from the canonical build root when GitHub is unreachable (offline builds).
electronVersion: 30.5.1

# ON, always, deliberately: every build repacks main.js + package.json into
# resources/app.asar, so `hugpy-station --version` can never again disagree with
# what the package manager thinks is installed.
asar: true

directories:
  buildResources: build
  output: dist

# The app itself is two files. Everything else is a RESOURCE (below) precisely
# so it stays plain on disk — server.py is edited in place on dev machines and
# read by the station-fix.sh repair path; burying it in the asar would break both.
files:
  - main.js
  - package.json

# -> <install root>/resources/... ; main.js resolves these via process.resourcesPath.
extraResources:
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
      # SANITIZE (2026-08-13): server.py generates .secret at first run and the
      # console writes .auth; a backend ever run inside the source tree plants
      # both. Shipping .secret gave every install ONE forgeable cookie-signing
      # key. __pycache__ leaks absolute build paths and stale bytecode.
      - "!.secret"
      - "!.auth"
      - "!**/.secret"
      - "!**/.auth"
      - "!**/__pycache__"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: resources/bin
    to: bin
  # station-stack (2026-08-27): the VM-side keeper stack bin/station-stack-install
  # deploys via lxc exec. Shipped so a reinstall no longer erases the hand-added
  # drift copy (station-app-source-of-truth). Same hygiene filters as backend.
  - from: resources/station-stack
    to: station-stack
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.bak*"
      - "!**/.secret"
      - "!**/.auth"
  - from: resources/systemd
    to: systemd
  - from: resources/VERSION
    to: VERSION

# -> <install root>/... (siblings of the Electron binary, NOT inside resources/).
# The launcher must sit next to `hugpy-station` because it derives APP_ROOT from
# its own location; /opt/hugpy-station/hugpy-station-launch is the path baked
# into the desktop entry, the update-alternatives target and station-fix.sh.
#
# AppRun is the SAME script under the name the AppImage runtime executes.
# electron-builder generates its own AppRun into the AppImage stage dir and then
# copies the packed app dir OVER it (appImageUtil.buildStaticRuntimeAppImage:
# writeAppLauncherAndRelatedFiles -> copyDir(appDir, stageDir)), so shipping
# AppRun here is what puts the --version / no-display / python-probe preflights
# INSIDE the AppImage instead of exec'ing the raw Electron binary.
extraFiles:
  - from: resources/hugpy-station-launch
    to: hugpy-station-launch
  - from: resources/hugpy-station-launch
    to: AppRun

linux:
  executableName: hugpy-station
  category: System
  icon: build/icons
  maintainer: keeper <keeper@abstractendeavors>
  vendor: keeper <keeper@abstractendeavors>
  synopsis: hugpy Station — desktop shell over the self-contained console backend
  description: >-
    hugpy Station is a desktop shell over the self-contained console backend that
    manages the local machine's LXD. The install wires up the SUID chrome-sandbox,
    the /usr/bin/hugpy-station alternative, and (best-effort) adds the installing
    user to the lxd group so fleet VMs are visible on first launch.
  desktop:
    entry:
      # Exec is NOT settable here — computeDesktopEntry() throws on
      # linux.desktop.entry.Exec and would otherwise point at the raw Electron
      # binary. build/linux-after-install.tpl rewrites Exec to
      #   "/opt/hugpy-station/hugpy-station-launch" %U
      # which is also exactly the repair station-fix.sh already performs.
      Name: hugpy Station
      StartupWMClass: hugpy Station
      Categories: System;
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: pacman
      arch: [x64]
    - target: AppImage
      arch: [x64]

# electron-builder's static AppImage runtime (no libfuse2 on the host — the
# legacy default runtime needs FUSE2, which Ubuntu 24 / Fedora 40+ no longer
# ship, and the AppImage is our fallback for exactly those machines).
toolsets:
  appimage: "1.0.3"

deb:
  # Names are pinned, not left to the per-target defaults, because
  # build-release.sh and the console artifact resolver both match on them.
  # Spelled out rather than ${name}: that macro is package.json's name,
  # "@hugpy/station", whose slash becomes a directory in the output path.
  artifactName: hugpy-station_${version}_amd64.${ext}
  priority: optional
  # Same install/remove semantics on every format — the whole point of the
  # revamp. The 1.0.41 rpm was an alien conversion that lost the deb's postinst.
  afterInstall: build/linux-after-install.tpl
  afterRemove: build/linux-after-remove.tpl
  # Upgrade path from the pre-1.0.37 package name (fleet-console).
  fpm:
    - --provides
    - fleet-console
    - --conflicts
    - fleet-console
    - --replaces
    - fleet-console
  # From the shipping debian/control (kept working since 1.0.12), plus the t64
  # alternatives for Ubuntu 24.04's time_t transition. Since 1.0.47 the deb is
  # single-file offline-installable: python3-aiohttp dropped from Depends (the
  # backend falls back to resources/backend/vendor) and lxd moved to Recommends
  # so `dpkg -i` succeeds on a fresh machine (lxd-kind loci just stay
  # unavailable until the LXD snap is installed).
  depends:
    - python3
    # seat provisioning (frontier/local seats) needs these on a bare image:
    # curl for the installer/agent, venv+pip to build the seat CLI venv. Declared
    # so `apt install ./deb` pulls them in the same (already-sudo) transaction —
    # a fresh Ubuntu desktop ships none of them.
    - curl
    - python3-venv
    - python3-pip
    - libc6
    - libgcc-s1
    - libglib2.0-0t64 | libglib2.0-0
    - libgtk-3-0t64 | libgtk-3-0
    - libnss3
    - libnspr4
    - libatk1.0-0t64 | libatk1.0-0
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libatspi2.0-0t64 | libatspi2.0-0
    - libcups2t64 | libcups2
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libasound2t64 | libasound2
    - libcairo2
    - libpango-1.0-0
    - libexpat1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  recommends:
    - lxd | lxd-installer
    - python3-aiohttp
    - libappindicator3-1 | libayatana-appindicator3-1
    - libnotify4

rpm:
  artifactName: hugpy-station-${version}.x86_64.${ext}
  # Same install/remove semantics on every format — the whole point of the
  # revamp. The 1.0.41 rpm was an alien conversion that lost the deb's postinst.
  afterInstall: build/linux-after-install.tpl
  afterRemove: build/linux-after-remove.tpl
  # Upgrade path from the pre-1.0.37 package name (fleet-console).
  fpm:
    - --provides
    - fleet-console
    - --conflicts
    - fleet-console
    - --replaces
    - fleet-console
  # Fedora/RHEL names. python3-aiohttp is THE dependency the 1.0.41 Fedora
  # install was missing (STATION-FIX-README.md: backend died at `import aiohttp`).
  # No lxd here: it is not in Fedora's repos, so requiring it would make the
  # package uninstallable; the console degrades to the 'self' VM without it.
  depends:
    - python3
    - python3-aiohttp
    # seat provisioning on Fedora (venv is bundled in python3; pip + curl are not)
    - python3-pip
    - curl
    - gtk3
    - nss
    - libnotify
    - at-spi2-core
    - libXScrnSaver
    - (libXtst or libXtst6)
    - (libuuid or libuuid1)
    - xdg-utils

pacman:
  artifactName: hugpy-station-${version}-x86_64.${ext}
  # Same install/remove semantics on every format — the whole point of the
  # revamp. The 1.0.41 rpm was an alien conversion that lost the deb's postinst.
  afterInstall: build/linux-after-install.tpl
  afterRemove: build/linux-after-remove.tpl
  # Upgrade path from the pre-1.0.37 package name (fleet-console).
  fpm:
    - --provides
    - fleet-console
    - --conflicts
    - fleet-console
    - --replaces
    - fleet-console
  # Arch names; all of these are in core/extra (the electron-builder default
  # list includes libappindicator-gtk3, which is AUR-only and would make
  # `pacman -U` fail on a stock Arch box).
  depends:
    - python
    - python-aiohttp
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify

appImage:
  # No after-install script exists for an AppImage — all of the launcher's
  # preflight logic has to live inside, which is what extraFiles/AppRun does.
  artifactName: hugpy-station-${version}-x86_64.${ext}
